function nextStep() {
  const ev = EVENTS.find(e => daysTo(e.d) >= 0 && !/^Zkouška/.test(e.what));
  if (ev && !store.get('wDone', false) && daysTo(ev.d) <= 14) {
    const kind = kindOf(ev), dn = daysTo(ev.d), done = doneCount(kind), first = firstOpenTest(kind);
    if (done < 3) return { t: `Napiš cvičnou ${({ p2: '2. zápočtovou písemku', p3: '3. zápočtovou písemku' })[kind] || 'písemku'} č. ${first}`, d: `Do písemky ${dn === 0 ? 'zbývá dnešek' : dn === 1 ? 'zbývá den' : `zbývá ${dn} ${dayWord(dn)}`} a na čas máš napsané ${done}. Tři cvičné na čas jsou minimum.`, go: `${kind}-${pad(first)}`, b: 'Napsat písemku' };
  }
  const kk = kdKnown('pojmy'), k1 = KEYS.find(it => !kk[it.id]);
  if (k1) return { t: `Klíčový pojem: ${k1.t}`, d: `Bez klíčových pojmů je ústní automaticky F. Umíš ${Object.keys(kk).length} z ${KEYS.length}.`, go: 'ustni-pojmy-' + k1.id, b: 'Naučit se' };
  if (doneCount('zk') < 3) { const f = firstOpenTest('zk'); return { t: `Napiš zkouškovou písemku č. ${f}`, d: 'Čtyři příklady za 120 minut. Na úspěch potřebuješ víc než 25 z 50 bodů.', go: `zk-${pad(f)}`, b: 'Napsat písemku' }; }
  const known = knownSet();
  const p = PROOFS.find(x => REQ.L.includes(x.id) && !known[x.id]) || PROOFS.find(x => REQ.T.includes(x.id) && !known[x.id]);
  if (p) return { t: `Důkaz: ${p.no} ${p.name}`, d: `${REQ.T.includes(p.id) ? 'Věta s obtížnějším důkazem' : 'Věta s lehčím důkazem'} z požadavků k ústní. Umíš ${knownCount()} z ${PROOF_TOTAL}.`, go: 'dukaz-' + p.id, b: 'Projít důkaz' };
  const dk = kdKnown('definice'), d1 = DEFS.find(it => !dk[it.id]);
  if (d1) return { t: `Definice: ${d1.t}`, d: `Umíš ${Object.keys(dk).length} z ${DEFS.length} definic.`, go: 'ustni-definice-' + d1.id, b: 'Naučit se' };
  const f = firstOpenTest('zk');
  return { t: 'Napiš další zkouškovou písemku', d: 'Důkazy, pojmy i definice máš odškrtané. Teď hlavně počítat na čas.', go: `zk-${pad(f)}`, b: 'Napsat písemku' };
}

/* ---------- FX: přechody mezi stránkami, odhalování při scrollu, světlo pod kurzorem, počítání čísel ----------
   Jen opacity a transform (běží na GPU, neblokují scroll). Při prefers-reduced-motion se nic nehýbe. */
const FX_ON = () => !reduceMotion();
document.documentElement.classList.toggle('fx', FX_ON());

/* co se při příchodu do obrazovky jemně vynoří (vnořené prvky se neanimují dvakrát) */
const RV_SEL = [
  '#view > section.band:first-of-type .inner > *',
  '.tile', '.step3', '.stat', '.tcard', '.list > .card', '.prow', '.pch > .row-h', '.plearn li',
  '.thm', '.topic > h2', '.note', '.rcard', '.tbl', '.hardsub', '.pp-nb', '.endpanel', '.score',
  '.pp-h', '.stmt', '.kostra', '.pv-idea', '.tl-i', '.tl-g', '.say', '.pp-done', 'figure', '.hp', '.otile', '.kc', '.ptopic'
].join(', ');
let heroObs = null;

function fxCount(el) {
  /* čísla v textu naběhnou od nuly (jen celá čísla do 9999) */
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) if (/\d/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const src = n.nodeValue, nums = src.match(/\d+/g) || [];
    if (!nums.length || nums.some(x => +x > 9999)) continue;
    const t0 = performance.now(), dur = 900;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      let i = 0; n.nodeValue = src.replace(/\d+/g, m => String(Math.round(+nums[i++] * e)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
}

function fxDone(el) { el.classList.remove('rv', 'in'); el.style.removeProperty('--d'); }

/* čekající prvky: odhalí je kontrola při scrollu (bez IntersectionObserveru a rAF, aby obsah nikdy nezůstal schovaný) */
let rvPending = [], rvT = 0;
function rvCheck() {
  rvT = 0; if (!rvPending.length) return;
  const lim = window.innerHeight * 0.97, show = [], keep = [];
  for (const el of rvPending) {
    if (!el.isConnected) continue;
    const r = el.getBoundingClientRect();
    (r.top < lim ? show : keep).push([el, r.top, r.left]);
  }
  rvPending = keep.map(x => x[0]);
  show.sort((a, b) => a[1] - b[1] || a[2] - b[2]).forEach(([el], k) => {
    el.style.setProperty('--d', Math.min(k, 7));
    el.classList.add('in');
    if (el.matches('.tile')) fxCount(el.querySelector('.big') || el);
    else if (el.matches('.stat')) fxCount(el.querySelector('b') || el);
    else if (el.matches('.display')) fxCount(el.querySelector('.grad') || el);
    const end = ev => { if (ev.target === el && !ev.pseudoElement && ev.propertyName === 'opacity') { fxDone(el); el.removeEventListener('transitionend', end); } };
    el.addEventListener('transitionend', end);
    setTimeout(() => fxDone(el), 1700); /* pojistka, kdyby transitionend nepřišel */
  });
}
const rvSoon = () => { if (!rvT) rvT = setTimeout(rvCheck, 40); };
window.addEventListener('scroll', rvSoon, { passive: true });
window.addEventListener('resize', rvSoon, { passive: true });

function fxReveal(root) {
  if (!FX_ON() || !root) return;
  const els = [...root.querySelectorAll(RV_SEL)];
  const set = new Set(els);
  rvPending = [];
  for (const el of els) {
    let p = el.parentElement, nested = false;
    while (p && p !== root) { if (set.has(p)) { nested = true; break; } p = p.parentElement; }
    if (nested || el.offsetParent === null) continue;
    el.classList.add('rv'); rvPending.push(el);
  }
  /* první várka až po vykreslení výchozího stavu, aby přechod opravdu proběhl */
  setTimeout(rvCheck, 60);
  /* úvodní pás: animace pozadí běží, jen když je vidět */
  const hero = root.querySelector(':scope > section.band');
  heroObs?.disconnect();
  if (hero && 'IntersectionObserver' in window) {
    heroObs = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('fx-off', !e.isIntersecting)));
    heroObs.observe(hero);
  }
}

/* přechod mezi stránkami (View Transitions API, kde je k dispozici) */
const routeIndex = v => { const m = v.match(PROOF_RE); if (m) return PROOFS.findIndex(p => p.id === m[1]); const t = v.match(TEST_RE); return t ? +t[2] : null; };

  if (!FX_ON() || !document.startViewTransition || from === to) { doIt(); return; }
  const a = routeIndex(from), b = routeIndex(to), same = (PROOF_RE.test(from) && PROOF_RE.test(to)) || (TEST_RE.test(from) && TEST_RE.test(to) && from.slice(0, 2) === to.slice(0, 2));
  document.documentElement.dataset.vt = same && a != null && b != null ? (b > a ? 'next' : 'prev') : restore ? 'back' : 'fwd';
  /* pojistka: když prohlížeč snímek nepořídí (skrytá karta, rám), přepni stránku i tak, jen bez animace */
  let ran = false; const once = () => { if (ran) return; ran = true; doIt(); };
  let vt = null;
  try { vt = document.startViewTransition(once); } catch { once(); return; }
  /* přeskočený přechod (rychlé klikání, pojistka níž) není chyba, jen ho neohlašuj do konzole */
  for (const pr of [vt.ready, vt.finished, vt.updateCallbackDone]) pr && pr.catch(() => { });
  setTimeout(() => { if (!ran) { try { vt && vt.skipTransition(); } catch { } once(); } }, 350);
}

/* světlo pod kurzorem na dlaždicích */
if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) {
  let raf = 0, last = null;
  document.addEventListener('pointermove', e => {
    last = e; if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0; const ev = last;
      const el = ev.target.closest && ev.target.closest('.tile, .tcard, .step3, .pp-nb, .prow, .rcard');
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (ev.clientX - r.left) + 'px');
      el.style.setProperty('--my', (ev.clientY - r.top) + 'px');
    });
  }, { passive: true });
}

/* ---------- kontrola šablon (pro autora) ---------- */
window.selfTest = function (seeds = 60) {
  const bad = [];
  for (const id of Object.keys(FAM)) for (let s = 0; s < seeds; s++) {
    const p = makeProblem(id, s);
    let got;
    if (p.ok) { if (!p.ok() || !p.sol) bad.push({ id, s, ok: false }); continue; }
    if (p.f0) { const h = p.h || 1e-6, X = p.at === Infinity ? (p.big || 1e6) : p.at === -Infinity ? -(p.big || 1e6) : null;
      const vals = X != null ? [p.f0(X)] : [p.f0(p.at + h), p.f0(p.at - h)];
      if (!vals.every(g => Math.abs(g - p.val) <= 2e-3 * Math.max(1, Math.abs(p.val))) || !p.sol) bad.push({ id, s, exp: p.val, got: vals }); continue; }
    if (p.f) got = p.f(1e4);
    else if (p.lf) got = Math.exp(p.lf(1e6) / 1e6);
    else if (p.lr) { const v = p.lr(20000); got = v > 50 ? Infinity : Math.exp(v); }
    else if (p.lv) got = p.lv(20000) < -20 ? 0 : NaN;
    const exp = p.val;
    let ok;
    if (exp === Infinity) ok = got > 1e3; else if (exp === -Infinity) ok = got < -1e3;
    else ok = Math.abs(got - exp) <= 2e-2 * Math.max(1, Math.abs(exp));
    if (!ok || !p.sol) bad.push({ id, s, exp, got, sol: !!p.sol });
  }
  return { checked: Object.keys(FAM).length * seeds, bad: bad.slice(0, 20), nBad: bad.length };
};
