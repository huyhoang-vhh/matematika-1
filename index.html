    { g: 'Podíl', h: 'Převedu na společný jmenovatel a přičtu a odečtu f(a)g(a)', m: R`\frac1h\Big(\frac{f(a+h)}{g(a+h)}-\frac{f(a)}{g(a)}\Big)=\frac{g(a)\,\frac{f(a+h)-f(a)}h-f(a)\,\frac{g(a+h)-g(a)}h}{g(a+h)\,g(a)}`, why: 'Zlomky převedu na společného jmenovatele g(a + h)g(a). V čitateli f(a + h)g(a) − f(a)g(a + h) přičtu a odečtu f(a)g(a), aby vznikly rozdíly f(a + h) − f(a) a g(a + h) − g(a).' },
    { g: 'Podíl', h: 'Limitní přechod', m: R`\to\frac{f'(a)\,g(a)-f(a)\,g'(a)}{g(a)^2}`, why: 'Rozdílové podíly jdou k f′(a) a g′(a). g je v a spojitá (Věta 36), takže jmenovatel jde k g(a)² ≠ 0. Aritmetika limit.' }
  ],
  end: 'Všechny čtyři vzorce platí.',
  say: 'Součet a násobek přímo z aritmetiky limit. U součinu přičtu a odečtu f(a)g(a + h): rozdílový podíl je (f(a + h) − f(a))/h · g(a + h) + f(a) · (g(a + h) − g(a))/h. g je spojitá díky Větě 36, takže limita je f′g + fg′. U podílu převedu na společného jmenovatele g(a + h)g(a), který je pro malá h nenulový, přičtu a odečtu f(a)g(a) a v limitě vyjde (f′g − fg′)/g².' },

{ id: 'v38', no: 'Věta 38', name: 'Derivace složené funkce', ch: 'der',
  stmt: R`Má-li \(g\) vlastní derivaci v \(x_0\) a \(f\) vlastní derivaci v \(y_0=g(x_0)\), pak \((f\circ g)'(x_0)=f'(y_0)\,g'(x_0)\).`,
  plain: 'Řetízkové pravidlo: derivace vnější krát derivace vnitřní.',
  method: ['Pomocná funkce', 'Limita složené funkce'],
  idea: 'Naivní rozšíření zlomkem g(x₀ + h) − g(x₀) selže, když je ten rozdíl 0. Proto zavedu pomocnou funkci φ = rozdílový podíl f, v bodě y₀ „dodefinovaný“ hodnotou f′(y₀). Ta je spojitá a rovnost f(y) − f(y₀) = φ(y)(y − y₀) platí bez dělení.',
  need: [{ t: 'Věta 25 (limita složené funkce)', ref: 'v25' }, { t: 'Věta 36', ref: 'v36' }],
  steps: [
    { h: 'Proč nejde jen rozšířit zlomek', m: R`\frac{f(g(x_0+h))-f(g(x_0))}h\overset{?}{=}\frac{f(g(x_0+h))-f(g(x_0))}{g(x_0+h)-g(x_0)}\cdot\frac{g(x_0+h)-g(x_0)}h`, why: 'Jmenovatel g(x₀ + h) − g(x₀) může být 0 pro h libovolně blízko 0 (např. g(x) = x² sin(1/x)).' },
    { h: 'Zavedu pomocnou funkci φ', m: R`\varphi(y)=\begin{cases}\dfrac{f(y)-f(y_0)}{y-y_0},&y\neq y_0,\\[2mm] f'(y_0),&y=y_0.\end{cases}`, why: 'Z definice derivace je lim<sub>y→y₀</sub> φ(y) = f′(y₀) = φ(y₀), tedy φ je spojitá v y₀.' },
    { h: 'Rovnost bez dělení, platí pro všechna y', m: R`f(y)-f(y_0)=\varphi(y)\,(y-y_0)`, why: 'Pro y ≠ y₀ z definice φ, pro y = y₀ jsou obě strany nulové.' },
    { h: 'Dosadím y = g(x₀ + h) a vydělím h', m: R`\frac{f(g(x_0+h))-f(g(x_0))}h=\varphi\big(g(x_0+h)\big)\cdot\frac{g(x_0+h)-g(x_0)}h`, why: 'Rovnost z kroku 3 pro y = g(x₀ + h), kde y₀ = g(x₀). Dělím jen číslem h ≠ 0, nikdy rozdílem g(x₀ + h) − g(x₀), takže problém z kroku 1 zmizel.' },
    { h: 'Limita prvního činitele', m: R`\varphi\big(g(x_0+h)\big)\to\varphi(y_0)=f'(y_0)`, why: 'g je spojitá v x₀ (Věta 36), takže g(x₀ + h) → y₀. φ je spojitá v y₀, takže smím použít limitu složené funkce s podmínkou (S).', use: ['v36', 'v25'] },
    { h: 'Limita druhého činitele a součin', m: R`\frac{g(x_0+h)-g(x_0)}h\to g'(x_0)\ \Longrightarrow\ (f\circ g)'(x_0)=f'(y_0)\,g'(x_0)`, why: 'Druhý činitel jde k g′(x₀) z definice derivace, první k f′(y₀) podle kroku 5. Obě limity jsou konečné, takže limita součinu je součin limit.' }
  ],
  end: '(f∘g)′(x₀) = f′(y₀) · g′(x₀).',
  say: 'Rozšířit zlomek nejde, protože g(x₀ + h) − g(x₀) může být nula. Proto zavedu φ(y) = (f(y) − f(y₀))/(y − y₀) a φ(y₀) = f′(y₀); φ je spojitá v y₀ a pro všechna y platí f(y) − f(y₀) = φ(y)(y − y₀). Dosadím y = g(x₀ + h) a vydělím h: rozdílový podíl složené funkce je φ(g(x₀ + h)) krát rozdílový podíl g. První činitel jde k f′(y₀) podle věty o limitě složené funkce se spojitou vnější funkcí, druhý ke g′(x₀).',
  ask: [['Proč nestačí rozšířit zlomek?', 'g(x₀ + h) − g(x₀) může být nula pro h libovolně blízko 0, a pak by se dělilo nulou.'], ['Kde se použila spojitost g?', 'Aby g(x₀ + h) → y₀ (Věta 36). Bez toho bych nemohl použít limitu složené funkce.']] },

{ id: 'v39', no: 'Věta 39', name: 'Derivace inverzní funkce', ch: 'der',
  stmt: R`Nechť \(f\) je spojitá a ryze monotónní na \((a,b)\) a \(f'(x_0)\neq0\) vlastní. Pak \((f^{-1})'(y_0)=\frac1{f'(x_0)}\), kde \(y_0=f(x_0)\).`,
  plain: 'Derivace inverze je převrácená hodnota derivace.',
  method: ['Substituce', 'Limita složené funkce (P)'],
  idea: 'Rozdílový podíl inverze je převrácený rozdílový podíl f, jen v proměnné x = f⁻¹(y). Spojitost inverze zajistí x → x₀ a prostota x ≠ x₀, takže smím použít limitu složené funkce s podmínkou (P).',
  need: [{ t: 'Věta 33 (spojitost inverze)', ref: 'v33' }, { t: 'Věta 25 (podmínka P)', ref: 'v25' }],
  steps: [
    { h: 'Přepíšu rozdílový podíl inverze přes x = f⁻¹(y)', m: R`\frac{f^{-1}(y)-f^{-1}(y_0)}{y-y_0}=\frac{x-x_0}{f(x)-f(x_0)},\qquad x=f^{-1}(y),\ x_0=f^{-1}(y_0)`, why: 'y = f(x) a y₀ = f(x₀).' },
    { h: 'Je to převrácený rozdílový podíl f', m: R`=\left(\frac{f(x)-f(x_0)}{x-x_0}\right)^{-1}`, why: 'Smím dělit: pro y ≠ y₀ je x ≠ x₀, protože f⁻¹ je prostá.' },
    { h: 'Vnitřní funkce: x = f⁻¹(y) → x₀ a x ≠ x₀', p: R`\(f^{-1}\) je spojitá v \(y_0\) (Věta 33), takže \(f^{-1}(y)\to x_0\). Podmínka (P): \(f^{-1}(y)\neq x_0\) pro \(y\neq y_0\).`, use: ['v33'] },
    { h: 'Vnější funkce má limitu 1/f′(x₀)', m: R`\lim_{x\to x_0}\left(\frac{f(x)-f(x_0)}{x-x_0}\right)^{-1}=\frac1{f'(x_0)}`, why: 'f′(x₀) je konečné a nenulové, takže smím dělit (aritmetika limit).' },
    { h: 'Limita složené funkce', m: R`\lim_{y\to y_0}\frac{f^{-1}(y)-f^{-1}(y_0)}{y-y_0}=\frac1{f'(x_0)}`, use: ['v25'], why: 'Kroky 3 a 4 jsou předpoklady limity složené funkce s podmínkou (P): vnitřní f⁻¹(y) → x₀ a ≠ x₀, vnější má v x₀ limitu 1/f′(x₀). Vlevo je podle kroků 1 a 2 přesně rozdílový podíl f⁻¹, tedy (f⁻¹)′(y₀) = 1/f′(x₀).' }
  ],
  end: '(f⁻¹)′(y₀) = 1/f′(x₀).',
  say: 'Označím x = f⁻¹(y). Rozdílový podíl inverze je (x − x₀)/(f(x) − f(x₀)), tedy převrácený rozdílový podíl f. Inverze je spojitá podle Věty 33, takže x → x₀, a je prostá, takže x ≠ x₀: to je podmínka (P). Vnější výraz jde k 1/f′(x₀), protože f′(x₀) je konečná a nenulová. Podle věty o limitě složené funkce je (f⁻¹)′(y₀) = 1/f′(x₀).',
  pit: ['Použití: (arcsin x)′ = 1/cos(arcsin x) = 1/√(1 − x²).', 'Je-li f′(x₀) = 0, má inverze v y₀ nevlastní derivaci (např. ∛x v nule).'] },

{ id: 'v40', no: 'Věta 40', name: 'Nutná podmínka lokálního extrému', ch: 'der',
  stmt: R`Má-li \(f\) lokální extrém ve vnitřním bodě \(x_0\) a existuje-li \(f'(x_0)\), pak \(f'(x_0)=0\).`,
  plain: 'Na vrcholu kopce je tečna vodorovná.',
  method: ['Jednostranné limity', 'Limita a nerovnost'],
  idea: 'U maxima je rozdílový podíl zprava ≤ 0 a zleva ≥ 0. Neostré nerovnosti se přenesou na limity, a derivace je obě jednostranné limity zároveň. Musí tedy být 0.',
  need: [{ t: 'Věta 24 (limita a nerovnost)', ref: 'v24' }],
  steps: [
    { h: 'Lokální maximum ve vnitřním bodě', m: R`\exists\delta>0:\quad f(x_0+h)\le f(x_0)\quad\forall h\in(-\delta,\delta)`, why: 'x₀ je vnitřní bod, takže celé okolí leží v D_f.' },
    { h: 'Zprava je rozdílový podíl ≤ 0', m: R`h\in(0,\delta):\quad\frac{f(x_0+h)-f(x_0)}h\le0`, why: 'Čitatel ≤ 0, jmenovatel > 0.' },
    { h: 'Zleva je rozdílový podíl ≥ 0', m: R`h\in(-\delta,0):\quad\frac{f(x_0+h)-f(x_0)}h\ge0`, why: 'Čitatel ≤ 0, jmenovatel < 0.' },
    { h: 'Neostré nerovnosti se přenesou na limity', m: R`f'(x_0)=f'_+(x_0)\le0,\qquad f'(x_0)=f'_-(x_0)\ge0`, why: 'Derivace existuje, takže se rovná oběma jednostranným limitám. Věta 24 (ii) pro jednostranné limity.', use: ['v24'] },
    { h: 'Zbývá nula', m: R`f'(x_0)=0`, why: 'Z kroku 4 je f′(x₀) ≤ 0 a zároveň f′(x₀) ≥ 0. Pro lokální minimum stejně, jen s obrácenými nerovnostmi (nebo pro −f).' }
  ],
  end: 'f′(x₀) = 0. Minimum stejně, nebo přes −f.',
  say: 'Ať je v x₀ lokální maximum. Pro malá h je f(x₀ + h) − f(x₀) ≤ 0. Pro h > 0 je rozdílový podíl ≤ 0, pro h < 0 je ≥ 0. Neostré nerovnosti se zachovají v limitě, takže f′(x₀) ≤ 0 a zároveň f′(x₀) ≥ 0, tedy f′(x₀) = 0.',
  pit: ['Obrácení neplatí: x³ má f′(0) = 0, ale extrém nemá.', 'Bod musí být vnitřní: x na ⟨0, 1⟩ má maximum v 1 s derivací 1.', 'Příklad z přednášky: f = x³ − 2x² + x + 1 na ⟨−3, 2⟩. Kandidáti jsou 1, 1/3, −3, 2. Hodnoty f(1) = 1, f(1/3) = 31/27, f(−3) = −47 (min), f(2) = 3 (max).'] },

{ id: 'v41', no: 'Věta 41', name: 'Rolleova věta', ch: 'der', fig: 'rolle',
  stmt: R`Nechť \(f\) je (i) spojitá na \(\langle a,b\rangle\), (ii) má derivaci v každém bodě \((a,b)\), (iii) \(f(a)=f(b)\). Pak existuje \(\xi\in(a,b)\) s \(f'(\xi)=0\).`,
  plain: 'Když funkce začne a skončí ve stejné výšce, někde mezi tím má vodorovnou tečnu.',
  method: ['Rozbor případů', 'Věta o extrémech'],
  idea: 'Spojitá funkce na uzavřeném intervalu má maximum i minimum (Věta 31). Když f není konstantní, aspoň jeden z nich je uvnitř intervalu, a tam je derivace nulová (Věta 40).',
  need: [{ t: 'Věta 31 (extrémy)', ref: 'v31' }, { t: 'Věta 40', ref: 'v40' }],
  steps: [
    { g: 'f je konstantní', h: 'Derivace je nulová všude', m: R`f'(\xi)=0\quad\forall\xi\in(a,b)`, why: 'Derivace konstantní funkce je 0, protože rozdílový podíl je všude nula. Za ξ tedy vyhovuje libovolný bod.' },
    { g: 'f není konstantní', h: 'f má maximum i minimum', p: R`Podle (i) a Věty 31 nabývá \(f\) na \(\langle a,b\rangle\) maxima \(M\) i minima \(m\).`, use: ['v31'] },
    { g: 'f není konstantní', h: 'Aspoň jeden extrém je uvnitř', p: R`Existuje \(x\) s \(f(x)\neq f(a)\). Je-li \(f(x)>f(a)\), je \(M>f(a)=f(b)\), takže maximum se nabývá v nějakém \(\xi\in(a,b)\). Je-li \(f(x)\lt f(a)\), stejně s minimem.`, why: 'Tady se používá (iii) f(a) = f(b): krajní body nemůžou být extrémem, který se liší od f(a).' },
    { g: 'f není konstantní', h: 'Nutná podmínka extrému', m: R`f'(\xi)=0`, why: 'ξ je vnitřní bod a f′(ξ) existuje podle (ii). Věta 40.', use: ['v40'] }
  ],
  end: 'Existuje ξ ∈ (a, b) s f′(ξ) = 0.',
  say: 'Je-li f konstantní, je derivace všude nulová. Jinak má f podle Věty 31 maximum i minimum. Protože f(a) = f(b) a f není konstantní, aspoň jeden z extrémů se liší od f(a), a tedy leží uvnitř intervalu v bodě ξ. Tam existuje derivace a podle nutné podmínky extrému je f′(ξ) = 0.',
  pit: ['Bez (iii): přímka, derivace nikde nulová.', 'Bez (ii): |x| na ⟨−1, 1⟩, derivace ±1.', 'Bez (i): f(x) = x na ⟨0, 1), f(1) = 0, tedy skok v krajním bodě.'] },

{ id: 'v42', no: 'Věta 42', name: 'Lagrangeova věta o střední hodnotě', ch: 'der', fig: 'lagrange',
  stmt: R`Nechť \(f\) je spojitá na \(\langle a,b\rangle\) a má derivaci v \((a,b)\). Pak existuje \(\xi\in(a,b)\) s \(f'(\xi)=\frac{f(b)-f(a)}{b-a}\).`,
  plain: 'Někde je tečna rovnoběžná se sečnou spojující konce grafu.',
  method: ['Pomocná funkce', 'Rolleova věta'],
  idea: 'Od f odečtu sečnu. Nová funkce g má v krajních bodech stejné hodnoty, takže na ni smím použít Rolleovu větu. Nulová derivace g znamená, že derivace f je rovna směrnici sečny.',
  need: [{ t: 'Věta 41 (Rolle)', ref: 'v41' }],
  steps: [
    { h: 'Odečtu od f sečnu', m: R`g(x)=f(x)-\frac{f(b)-f(a)}{b-a}\,(x-a)`, why: 'Od f odečtu přímku se směrnicí sečny (f(b) − f(a))/(b − a). Nová funkce g bude mít stejné hodnoty v a i b, takže na ni půjde Rolleova věta.' },
    { h: 'g splňuje předpoklady Rolleovy věty', m: R`g(a)=f(a),\qquad g(b)=f(b)-\big(f(b)-f(a)\big)=f(a)`, why: 'g je rozdíl f a lineární funkce, takže je spojitá na ⟨a, b⟩ a má derivaci v (a, b).' },
    { h: 'Rolleova věta', m: R`\exists\xi\in(a,b):\ g'(\xi)=0`, use: ['v41'], why: 'Předpoklady jsou ověřené v kroku 2: g je spojitá na ⟨a, b⟩, má derivaci v (a, b) a g(a) = g(b).' },
    { h: 'Spočítám g′', m: R`0=g'(\xi)=f'(\xi)-\frac{f(b)-f(a)}{b-a}`, why: 'Derivace přímky (f(b) − f(a))/(b − a) · (x − a) je její směrnice. Z 0 = g′(ξ) vyjde f′(ξ) = (f(b) − f(a))/(b − a).' }
  ],
  end: 'f′(ξ) = (f(b) − f(a))/(b − a).',
  say: 'Vezmu pomocnou funkci g(x) = f(x) − (f(b) − f(a))/(b − a) · (x − a), tedy f minus sečna. Je spojitá, má derivaci uvnitř a g(a) = g(b) = f(a). Podle Rolleovy věty existuje ξ s g′(ξ) = 0, a g′(ξ) = f′(ξ) − (f(b) − f(a))/(b − a).',
  pit: ['Důsledek: |sin x − sin y| ≤ |x − y|, protože |cos ξ| ≤ 1.', 'Lagrange se používá v Větách 43, 44, 47, 48, 49. Často je to první krok.'] },

{ id: 'v43', no: 'Věta 43', name: 'Znaménko derivace a monotonie', ch: 'der',
  stmt: R`Nechť \(J\) je interval, \(f\) spojitá na \(J\) s derivací uvnitř. \(f'>0\Rightarrow\) rostoucí, \(f'\lt0\Rightarrow\) klesající, \(f'\ge0\Rightarrow\) neklesající, \(f'\le0\Rightarrow\) nerostoucí.`,
  plain: 'Kladná derivace znamená, že funkce roste.',
  method: ['Lagrangeova věta'],
  idea: 'Pro libovolné x < y dá Lagrange f(y) − f(x) = f′(ξ)(y − x). Protože y − x > 0, rozhodne o znaménku rozdílu jen f′(ξ).',
  need: [{ t: 'Věta 42 (Lagrange)', ref: 'v42' }],
  steps: [
    { h: 'Vezmu dva body x < y z J', p: R`Protože \(J\) je interval, je \(\langle x,y\rangle\subset J\). Na něm je \(f\) spojitá a uvnitř má derivaci.` },
    { h: 'Lagrangeova věta na ⟨x, y⟩', m: R`f(y)-f(x)=f'(\xi)\,(y-x),\qquad\xi\in(x,y)`, use: ['v42'], why: 'Předpoklady Lagrangeovy věty jsou ověřené v kroku 1. Rovnost z věty jen vynásobím číslem y − x.' },
    { h: 'O znaménku rozhodne f′(ξ)', m: R`y-x>0:\quad f'>0\Rightarrow f(y)>f(x),\qquad f'\ge0\Rightarrow f(y)\ge f(x)`, why: 'Pro f′ < 0 a f′ ≤ 0 obráceně.' }
  ],
  end: 'Odtud všechny čtyři závěry.',
  say: 'Vezmu x < y z J. Protože J je interval, je ⟨x, y⟩ ⊂ J, a podle Lagrangeovy věty je f(y) − f(x) = f′(ξ)(y − x) pro nějaké ξ mezi nimi. y − x je kladné, takže znaménko f(y) − f(x) je stejné jako znaménko f′(ξ).',
  pit: ['J musí být interval: −1/x má f′ = 1/x² > 0, ale f(−1) = 1 > f(1) = −1.'] },

{ id: 'v44', no: 'Věta 44', name: 'Výpočet jednostranné derivace', ch: 'der',
  stmt: R`Je-li \(f\) spojitá zprava v \(a\), má vlastní derivaci na \((a,a+\eta)\) a existuje \(A=\lim_{x\to a+}f'(x)\), pak \(f'_+(a)=A\).`,
  plain: 'Jednostrannou derivaci v bodě „lepení“ spočítám jako limitu derivace.',
  method: ['Lagrangeova věta', 'Řetízek okolí'],
  idea: 'Lagrange na ⟨a, a + h⟩: rozdílový podíl je f′(ξₕ) pro nějaké ξₕ ∈ (a, a + h). Když h → 0+, je ξₕ ještě blíž k a, takže f′(ξₕ) → A.',
  need: [{ t: 'Věta 42 (Lagrange)', ref: 'v42' }],
  steps: [
    { h: 'Lagrange na ⟨a, a + h⟩', m: R`0\lt h\lt\eta:\quad\frac{f(a+h)-f(a)}h=f'(\xi_h),\qquad\xi_h\in(a,a+h)`, why: 'f je spojitá zprava v a (předpoklad) a v (a, a + h⟩ díky derivaci (Věta 36). Derivaci má v (a, a + h).', use: ['v42'] },
    { h: 'Z limity derivace: k ε najdu δ', m: R`x\in(a,a+\delta)\ \Longrightarrow\ f'(x)\in B(A,\varepsilon)`, why: 'Definice limity zprava lim<sub>x→a+</sub> f′(x) = A pro zvolené ε.' },
    { h: 'ξₕ je k a ještě blíž než h', m: R`0\lt h\lt\min\{\delta,\eta\}\ \Longrightarrow\ \xi_h\in(a,a+\delta)\ \Longrightarrow\ \frac{f(a+h)-f(a)}h=f'(\xi_h)\in B(A,\varepsilon)`, why: 'ξₕ leží v (a, a + h) a h < δ, takže ξₕ ∈ (a, a + δ) a krok 2 pro ξₕ platí. Rozdílový podíl je tedy pro všechna malá h v B(A, ε), a to znamená f′₊(a) = A.' }
  ],
  end: 'f′₊(a) = A (i pro A = ±∞).',
  say: 'Pro malé h > 0 použiju Lagrangeovu větu na ⟨a, a + h⟩; to jde, protože f je spojitá zprava v a. Rozdílový podíl je f′(ξₕ) s ξₕ ∈ (a, a + h). K ε najdu δ z limity derivace. Pro h < δ je ξₕ v (a, a + δ), takže rozdílový podíl je v B(A, ε).',
  pit: ['Spojitost v a je nutná: sgn má lim f′(x) = 0 zprava, ale f′₊(0) = +∞.'] },

{ id: 'v45', no: 'Věta 45', name: 'L’Hospitalovo pravidlo', ch: 'der', nop: true,
  stmt: R`Mají-li \(f,g\) vlastní derivace na \(P(a,\eta)\), \(g'\neq0\), existuje \(L=\lim\frac{f'}{g'}\) a platí (i) \(f,g\to0\), nebo (ii) \(|g|\to\infty\), pak \(\lim\frac fg=L\).`,
  plain: 'Limitu podílu typu 0/0 nebo ∞/∞ smím počítat přes podíl derivací.',
  idea: 'Bez důkazu (ani v jednom zdroji není). Znát přesné předpoklady a umět je u příkladu ověřit.',
  steps: [],
  pit: ['Může se stát, že lim f/g existuje a lim f′/g′ ne: (x + sin x)/x → 1, ale 1 + cos x limitu nemá. Pravidlo pak nic neříká.', 'Ve (ii) stačí |g| → ∞, f může být cokoli.'] },

{ id: 'l46', no: 'Lemma 46', name: 'Charakteristika konvexní funkce', ch: 'der', fig: 'convex',
  stmt: R`\(f\) je konvexní na \(I\) právě tehdy, když pro \(x_1\lt x_2\lt x_3\) z \(I\) platí \(\frac{f(x_2)-f(x_1)}{x_2-x_1}\le\frac{f(x_3)-f(x_2)}{x_3-x_2}\).`,
  plain: 'Konvexní = směrnice sečen rostou zleva doprava.',
  method: ['Ekvivalence (dva směry)', 'Konvexní kombinace'],
  idea: 'Prostřední bod x₂ je konvexní kombinace x₁ a x₃. Graf v x₂ leží pod sečnou, v bodě z. Levá část grafu je proto „pod sečnou ze strany“ a pravá „nad ní“, takže směrnice rostou. Opačný směr je stejný výpočet pozpátku.',
  need: [{ t: 'definice konvexity: f(λx + (1 − λ)y) ≤ λf(x) + (1 − λ)f(y) pro λ ∈ ⟨0, 1⟩' }],
  steps: [
    { g: '⇒', h: 'Napíšu x₂ jako konvexní kombinaci x₁ a x₃', m: R`x_2=\lambda x_1+(1-\lambda)x_3,\qquad\lambda=\frac{x_3-x_2}{x_3-x_1}\in(0,1)`, why: 'Ověření: λx₁ + (1 − λ)x₃ = x₃ − λ(x₃ − x₁) = x₃ − (x₃ − x₂) = x₂.' },
    { g: '⇒', h: 'Graf je v x₂ pod sečnou', m: R`f(x_2)\le\lambda f(x_1)+(1-\lambda)f(x_3)=:z`, why: 'Definice konvexity. Bod [x₂, z] leží na sečně z [x₁, f(x₁)] do [x₃, f(x₃)].' },
    { g: '⇒', h: 'Porovnám směrnice přes bod sečny', m: R`\frac{f(x_2)-f(x_1)}{x_2-x_1}\le\frac{z-f(x_1)}{x_2-x_1}=\frac{f(x_3)-z}{x_3-x_2}\le\frac{f(x_3)-f(x_2)}{x_3-x_2}`, why: 'Prostřední rovnost: obě části sečny mají stejnou směrnici. Krajní nerovnosti plynou z f(x₂) ≤ z.' },
    { g: '⇐', h: 'Vezmu body x < y a λ ∈ (0, 1)', m: R`z=\lambda x+(1-\lambda)y,\qquad z-x=(1-\lambda)(y-x),\qquad y-z=\lambda(y-x)`, why: 'Pro λ ∈ {0, 1} je konvexní nerovnost triviální.' },
    { g: '⇐', h: 'Použiju předpoklad pro trojici x < z < y', m: R`\frac{f(z)-f(x)}{(1-\lambda)(y-x)}\le\frac{f(y)-f(z)}{\lambda(y-x)}`, why: 'Předpoklad lemmatu pro trojici x < z < y. Do jmenovatelů dosadím z − x = (1 − λ)(y − x) a y − z = λ(y − x) z kroku 4.' },
    { g: '⇐', h: 'Vynásobím kladným λ(1 − λ)(y − x)', m: R`\lambda\big(f(z)-f(x)\big)\le(1-\lambda)\big(f(y)-f(z)\big)\ \Longrightarrow\ f(z)\le\lambda f(x)+(1-\lambda)f(y)`, why: 'Členy s f(z) převedu doleva: λf(z) + (1 − λ)f(z) = f(z). To je přesně konvexní nerovnost.' }
  ],
  end: 'Obě podmínky jsou ekvivalentní.',
  say: '⇒: x₂ zapíšu jako λx₁ + (1 − λ)x₃ s λ = (x₃ − x₂)/(x₃ − x₁). Z konvexity je f(x₂) ≤ z, kde [x₂, z] je bod sečny. Směrnice od x₁ k x₂ je proto nejvýš směrnice sečny, a ta je nejvýš směrnice od x₂ k x₃. ⇐: pro z = λx + (1 − λ)y dosadím do předpokladu trojici x < z < y, vynásobím jmenovateli a vyjde f(z) ≤ λf(x) + (1 − λ)f(y).' },

{ id: 'v47', no: 'Věta 47', name: 'Druhá derivace a konvexita', ch: 'der',
  stmt: R`Má-li \(f\) vlastní \(f''\) na \((a,b)\): \(f''>0\Rightarrow\) ryze konvexní; \(f''\lt0\Rightarrow\) ryze konkávní; \(f''\ge0\Rightarrow\) konvexní; \(f''\le0\Rightarrow\) konkávní.`,
  plain: 'Kladná druhá derivace znamená, že graf je „miska“.',
  method: ['Lagrangeova věta (dvakrát)', 'Charakteristika konvexity'],
  idea: 'f″ > 0 znamená, že f′ roste. Lagrangeova věta na dvou sousedních úsecích dá směrnice sečen f′(ξ) a f′(η) s ξ < η. Protože f′ roste, je f′(ξ) < f′(η), a to je podmínka z Lemmatu 46.',
  need: [{ t: 'Věta 43', ref: 'v43' }, { t: 'Věta 42 (Lagrange)', ref: 'v42' }, { t: 'Lemma 46', ref: 'l46' }],
  steps: [
    { h: 'f′ je rostoucí', p: R`\(f'\) má na \((a,b)\) vlastní derivaci \(f''>0\), takže je tam spojitá a podle Věty 43 rostoucí.`, use: ['v43'] },
    { h: 'Vezmu x₁ < x₂ < x₃ a Lagrange na obou úsecích', m: R`\frac{f(x_2)-f(x_1)}{x_2-x_1}=f'(\xi),\qquad\frac{f(x_3)-f(x_2)}{x_3-x_2}=f'(\eta),\qquad x_1\lt\xi\lt x_2\lt\eta\lt x_3`, use: ['v42'], why: 'f má na (a, b) vlastní derivaci, je tedy spojitá (Věta 36) a Lagrangeovu větu smím použít na ⟨x₁, x₂⟩ i na ⟨x₂, x₃⟩. ξ leží v prvním úseku, η ve druhém, proto ξ < η.' },
    { h: 'Porovnám směrnice', m: R`\xi\lt\eta\ \Longrightarrow\ f'(\xi)\lt f'(\eta)`, why: 'f′ roste. Podle Lemmatu 46 (s ostrou nerovností) je f ryze konvexní.', use: ['l46'] },
    { h: 'Ostatní případy', p: R`Pro \(f''\ge0\) je \(f'\) neklesající a vyjde neostrá nerovnost, tedy konvexita. Konkávní případy přes \(-f\).` }
  ],
  end: 'Všechny čtyři závěry platí.',
  say: 'f″ > 0, takže podle Věty 43 použité na f′ je f′ rostoucí. Vezmu x₁ < x₂ < x₃ a na oba úseky použiju Lagrangeovu větu: směrnice sečen jsou f′(ξ) a f′(η), kde ξ < x₂ < η. Protože f′ roste, je f′(ξ) < f′(η), a to je podle Lemmatu 46 konvexita.' },

{ id: 'v48', no: 'Věta 48', name: 'Nutná podmínka inflexe', ch: 'der',
  stmt: R`Je-li \(a\) inflexní bod \(f\), pak \(f''(a)\) neexistuje, nebo \(f''(a)=0\).`,
  plain: 'V inflexi je druhá derivace nulová (pokud existuje).',
  method: ['Sporem', 'Lagrangeova věta'],
  idea: 'Kdyby f″(a) > 0, byla by f′ blízko a vlevo menší a vpravo větší než f′(a). Lagrange pak ukáže, že graf je z obou stran nad tečnou, a to není inflexe.',
  need: [{ t: 'Věta 42 (Lagrange)', ref: 'v42' }, { t: 'Věta 24 (i)', ref: 'v24' }],
  steps: [
    { h: 'Sporem: f″(a) existuje a je nenulová', p: R`Bez újmy na obecnosti \(f''(a)>0\) (jinak vezmu \(-f\)). Pak \(f'\) existuje na nějakém okolí \(a\).` },
    { h: 'Znaménko f′(x) − f′(a) kolem a', m: R`f''(a)=\lim_{x\to a}\frac{f'(x)-f'(a)}{x-a}>0\ \Longrightarrow\ \frac{f'(x)-f'(a)}{x-a}>0\ \text{ na }P(a,\delta)`, why: 'Věta 24 (i): limita je větší než 0, takže i funkce je kladná blízko a. Vpravo je tedy f′(x) > f′(a), vlevo f′(x) < f′(a).', use: ['v24'] },
    { h: 'Lagrange mezi a a y', m: R`f(y)-\big[f(a)+f'(a)(y-a)\big]=\big(f'(\xi)-f'(a)\big)(y-a),\qquad\xi\ \text{mezi }a,y`, why: 'Vlevo je vzdálenost grafu od tečny v bodě y.', use: ['v42'] },
    { h: 'Graf je z obou stran nad tečnou', p: R`Pro \(y>a\) je \(\xi>a\), takže oba činitelé jsou kladní. Pro \(y\lt a\) jsou oba záporní. V obou případech je rozdíl kladný.` },
    { h: 'Spor s inflexí', p: 'V inflexním bodě má graf na jedné straně ležet nad tečnou a na druhé pod ní.' }
  ],
  end: 'Zbývá f″(a) = 0, nebo f″(a) neexistuje.',
  say: 'Sporem: ať f″(a) > 0. Pak je podle limity (f′(x) − f′(a))/(x − a) > 0 blízko a, tedy f′ je vpravo větší a vlevo menší než f′(a). Lagrange dá f(y) − tečna(y) = (f′(ξ) − f′(a))(y − a), a to je kladné na obou stranách. Graf je tedy z obou stran nad tečnou, a to inflexe není.' },

{ id: 'v49', no: 'Věta 49', name: 'Postačující podmínka inflexe', ch: 'der', fig: 'inflex',
  stmt: R`Nechť \(f'\) je spojitá na \((a,b)\), \(z\in(a,b)\), \(f''>0\) na \((a,z)\) a \(f''\lt0\) na \((z,b)\). Pak \(z\) je inflexní bod.`,
  plain: 'Když druhá derivace mění znaménko, je tam inflexe.',
  method: ['Lagrangeova věta', 'Monotonie derivace'],
  idea: 'f′ roste až do z a pak klesá, takže f′(x) < f′(z) pro všechna x ≠ z. Lagrange dá: vlevo od z je graf nad tečnou, vpravo pod tečnou. To je přesně inflexe.',
  need: [{ t: 'Věta 43', ref: 'v43' }, { t: 'Věta 42 (Lagrange)', ref: 'v42' }],
  steps: [
    { h: 'f′ roste vlevo od z a klesá vpravo', p: R`\(f'\) je spojitá a uvnitř \((a,z)\) má derivaci \(f''>0\), takže je podle Věty 43 rostoucí na \((a,z\rangle\). Stejně je klesající na \(\langle z,b)\).`, use: ['v43'] },
    { h: 'f′ má v z ostré maximum', m: R`f'(x)\lt f'(z)\qquad\forall x\in(a,b),\ x\neq z`, why: 'Podle kroku 1: pro x < z je f′(x) < f′(z), protože f′ roste na (a, z⟩. Pro x > z je f′(x) < f′(z), protože f′ klesá na ⟨z, b).' },
    { h: 'Vlevo od z je graf nad tečnou', m: R`x\lt z:\quad\frac{f(z)-f(x)}{z-x}=f'(\xi)\lt f'(z)\ \Longrightarrow\ f(x)>f(z)+f'(z)(x-z)`, why: 'Lagrange na ⟨x, z⟩. Nerovnost vynásobím kladným z − x a přeuspořádám.', use: ['v42'] },
    { h: 'Vpravo od z je graf pod tečnou', m: R`y>z:\quad\frac{f(y)-f(z)}{y-z}=f'(\eta)\lt f'(z)\ \Longrightarrow\ f(y)\lt f(z)+f'(z)(y-z)`, why: 'Lagrange na ⟨z, y⟩ a vynásobím kladným y − z.' }
  ],
  end: 'Tečna v z existuje a graf ji v z protíná z nadhledu do podhledu. z je inflexní bod.',
  say: 'Podle Věty 43 f′ roste na (a, z⟩ a klesá na ⟨z, b), takže f′(x) < f′(z) pro x ≠ z. Pro x < z dá Lagrange směrnici sečny f′(ξ) < f′(z), tedy f(x) je nad tečnou v z. Pro y > z stejně vyjde, že f(y) je pod tečnou. Graf tedy v z přechází z jedné strany tečny na druhou, a to je inflexe.',
  pit: ['x²: f″(0) = 2 > 0 ⇒ minimum. x³: f″(0) = 0 a mění znaménko ⇒ inflexe.', 'Samotné f″(z) = 0 nestačí: x⁴ má f″(0) = 0, ale inflexi nemá.'] },

{ id: 't50', no: 'Tvrzení 50', name: 'O asymptotě', ch: 'der',
  stmt: R`\(y=kx+q\) je asymptotou \(f\) v \(+\infty\) právě tehdy, když \(\lim\frac{f(x)}x=k\in\mathbb R\) a \(\lim(f(x)-kx)=q\in\mathbb R\).`,
  plain: 'Asymptotu najdu dvěma limitami: nejdřív sklon k, pak posun q.',
  method: ['Ekvivalence (dva směry)', 'Aritmetika limit'],
  idea: 'Asymptota znamená, že rozdíl f(x) − kx − q jde k nule. Vydělením x dostanu k, odečtením kx dostanu q. Opačný směr je jedno odečtení.',
  need: [{ t: 'definice asymptoty: lim<sub>x→+∞</sub> (f(x) − kx − q) = 0' }, { t: 'aritmetika limit', ref: 'v22' }],
  steps: [
    { g: '⇒', h: 'Označím zbytek', m: R`r(x)=f(x)-kx-q\to0`, why: 'Asymptota y = kx + q v +∞ znamená, že rozdíl mezi grafem a přímkou jde k nule. Ten rozdíl si označím r(x).' },
    { g: '⇒', h: 'Sklon: vydělím x', m: R`\frac{f(x)}x=k+\frac qx+\frac{r(x)}x\to k+0+0=k`, why: 'q/x → 0 a r(x)/x → 0 · 0 = 0.' },
    { g: '⇒', h: 'Posun: odečtu kx', m: R`f(x)-kx=q+r(x)\to q`, why: 'Z definice r je f(x) − kx = q + r(x). Konstanta q se nemění a r(x) → 0 (krok 1).' },
    { g: '⇐', h: 'Zbytek jde k nule', m: R`f(x)-kx-q=\big(f(x)-kx\big)-q\to q-q=0`, why: 'Předpoklad lim(f(x) − kx) = q a aritmetika limit. Zbytek jde k nule, a to je přesně definice asymptoty.' }
  ],
  end: 'Obě podmínky jsou ekvivalentní.',
  say: 'Asymptota znamená r(x) = f(x) − kx − q → 0. Pak f(x)/x = k + q/x + r(x)/x → k a f(x) − kx = q + r(x) → q. Naopak, jsou-li obě limity k a q konečné, je f(x) − kx − q → q − q = 0.',
  pit: ['Při průběhu funkce: nejdřív k = lim f(x)/x, pak q = lim (f(x) − kx). Obě musí být konečné.'] }
);

/* ---------- obrázky a animace k důkazům ---------- */
const figScale = () => (window.innerWidth || 1000) < 560 ? .62 : 1;
function mkFig(w, h, xr, yr, pad = { l: 34, r: 14, t: 14, b: 26 }) {
  if (w >= 400) w = Math.round(w * figScale());
  const X = x => pad.l + (x - xr[0]) / (xr[1] - xr[0]) * (w - pad.l - pad.r);
  const Y = y => h - pad.b - (y - yr[0]) / (yr[1] - yr[0]) * (h - pad.t - pad.b);
  const n = v => (+v).toFixed(1);
  const o = { X, Y, w, h, s: '', defs: '' };
  o.axes = (xl = '', yl = '', opt = {}) => {
    const y0 = opt.y0 ?? (yr[0] <= 0 && yr[1] >= 0 ? 0 : yr[0]), x0 = opt.x0 ?? (xr[0] <= 0 && xr[1] >= 0 ? 0 : xr[0]);
    o.s += `<line class="ax" x1="${pad.l - 6}" y1="${n(Y(y0))}" x2="${w - 4}" y2="${n(Y(y0))}" marker-end="url(#arr)"/>`;
    o.s += `<line class="ax" x1="${n(X(x0))}" y1="${h - pad.b + 6}" x2="${n(X(x0))}" y2="4" marker-end="url(#arr)"/>`;
    if (xl) o.s += `<text class="axl" x="${w - 6}" y="${n(Y(y0) + 18)}" text-anchor="end">${xl}</text>`;
    if (yl) o.s += `<text class="axl" x="${n(X(x0) + 8)}" y="14">${yl}</text>`;
    return o;
  };
  o.hline = (y, cls, label, anchor = 'end') => { o.s += `<line class="${cls}" x1="${pad.l}" y1="${n(Y(y))}" x2="${w - pad.r}" y2="${n(Y(y))}"/>`; if (label) o.s += `<text class="lab ${cls}-t" x="${anchor === 'end' ? w - pad.r - 2 : pad.l - 4}" y="${n(Y(y) - 5)}" text-anchor="${anchor}">${label}</text>`; return o; };
  o.vline = (x, cls, label) => { o.s += `<line class="${cls}" x1="${n(X(x))}" y1="${pad.t}" x2="${n(X(x))}" y2="${h - pad.b}"/>`; if (label) o.s += `<text class="lab" x="${n(X(x))}" y="${h - pad.b + 18}" text-anchor="middle">${label}</text>`; return o; };
  o.path = (f, x0, x1, cls = 'cv', N = 360) => { let d = '', pen = false; for (let i = 0; i <= N; i++) { const x = x0 + (x1 - x0) * i / N, y = f(x); if (!isFinite(y) || y < yr[0] - (yr[1] - yr[0]) || y > yr[1] + (yr[1] - yr[0])) { pen = false; continue; } d += (pen ? 'L' : 'M') + n(X(x)) + ' ' + n(Y(y)); pen = true; } o.s += `<path class="${cls}" d="${d}"/>`; return o; };
  o.line = (x1, y1, x2, y2, cls = 'dash') => { o.s += `<line class="${cls}" x1="${n(X(x1))}" y1="${n(Y(y1))}" x2="${n(X(x2))}" y2="${n(Y(y2))}"/>`; return o; };
  o.dot = (x, y, cls = 'pt', r = 4) => { o.s += `<circle class="${cls}" cx="${n(X(x))}" cy="${n(Y(y))}" r="${r}"/>`; return o; };
  o.text = (x, y, t, anchor = 'start', cls = 'lab', dy = 0, dx = 0) => { o.s += `<text class="${cls}" x="${n(X(x) + dx)}" y="${n(Y(y) + dy)}" text-anchor="${anchor}">${t}</text>`; return o; };

const vUrl = c => `https://www.youtube.com/watch?v=${LECT[c.l][0]}${c.s && vSec(c.s) > 0 ? `&t=${vSec(c.s)}s` : ''}`;
const vLink = (c, cls, txt) => `<a class="${cls}" href="${vUrl(c)}" target="_blank" rel="noopener">${txt}</a>`;
function vidBtn(p, cls = 'pill sm ghost vid-open') {
  const c = (VID[p.id] || [])[0]; if (!c) return '';
  return vLink(c, cls, `<span aria-hidden="true">▶</span> Na přednášce${c.s ? ` · ${c.ap ? 'asi ' : ''}od ${vFmt(c.s)}` : ''}`);
}
function vidSec(p) {
  const cs = VID[p.id]; if (!cs) return '';
  const rows = cs.map(c => `<li>${vLink(c, 'vid-row', `<span class="vid-play" aria-hidden="true">▶</span><span><b>Přednáška ${LECT[c.l][1]}</b><span class="muted small">${c.s ? `${c.ap ? 'přibližně ' : ''}${vFmt(c.s)}${c.e ? `–${vFmt(c.e)}` : ''}` : 'celá přednáška, přesný čas zatím nemáme'}${c.n ? ` · ${c.n}` : ''}</span></span>`)}</li>`).join('');
  return `<section class="pv-sec pv-vid"><span class="lbl">Výklad na přednášce</span><ul class="vidlist">${rows}</ul><p class="muted small">Záznamy přednášek ze zimního semestru 2020/21, otevřou se na YouTube rovnou ve správném čase. Číslování vět se tam místy liší.</p></section>`;
}

/* ---------- Důkazy: osnova + samostatná stránka každého důkazu ----------
   Data (dk1–dk4.js): stmt, plain, method [..], idea, need [{t, ref}], goal,
   steps [{ g (část důkazu), h (co dělám), p (text), m (display TeX), why (proč to platí), use [id] }],
   end, say (jak to říct u zkoušky), pit [..], ask [[otázka, odpověď]] */
const PROOF_RE = /^dukaz-([a-z0-9-]+)$/;
const proofById = id => PROOFS.find(p => p.id === id);
const plural = (n, a, b, c) => n === 1 ? a : n > 1 && n < 5 ? b : c;
const pKind = p => { const m = p.no.match(/^(\S+)\s*(.*)$/); return [m[1], m[2]]; };
const pShort = p => p.no.replace(/^Věta /, 'V ').replace(/^Tvrzení /, 'T ').replace(/^Lemma /, 'L ').replace(/^Důsledek /, 'D ').replace(/^Příklad$/, 'Př.').replace(/^Věta$/, 'Věta');

/* dlouhý vzorec zalomím v přirozených místech do více řádků. Na úzké obrazovce lámu i před šipkami ⟹, ⟺. */
const NARROW = () => window.innerWidth < 640;
/* druhý průchod na telefonu: dlouhý řetěz rovností/nerovností zalomím před relací */
function brkRel(tex) {
  const rels = ['=', '\\le', '\\ge', '\\lt', '\\gt', '<', '>', '\\to'];
  const out = []; let depth = 0, cur = '';
  for (let i = 0; i < tex.length; i++) {
    const ch = tex[i];
    if (ch === '{' || tex.startsWith('\\left', i) || tex.startsWith('\\begin', i)) depth++;
    else if (ch === '}' || tex.startsWith('\\right', i) || tex.startsWith('\\end', i)) depth--;
    if (depth === 0 && cur.replace(/\\[a-zA-Z]+|[{}\s]/g, 'x').length > 16 && tex[i - 1] !== '\\') {
      const r = rels.find(o => tex.startsWith(o, i) && (o.length === 1 || !/[a-zA-Z]/.test(tex[i + o.length] || '')));
      if (r) { out.push(cur.trimEnd()); cur = ''; }
    }
    cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(Boolean);
}
function brk(tex) {
  const narrow = NARROW();
  if (tex.length < (narrow ? 34 : 70)) return tex;
  const ops = narrow ? ['\\Longrightarrow', '\\Rightarrow', '\\iff', '\\longrightarrow'] : [];
  const parts = []; let depth = 0, cur = '';
  for (let i = 0; i < tex.length; i++) {
    const ch = tex[i];
    if (ch === '{' || tex.startsWith('\\left', i) || tex.startsWith('\\begin', i)) depth++;
    else if (ch === '}' || tex.startsWith('\\right', i) || tex.startsWith('\\end', i)) depth--;
    if (depth === 0) {
      if (tex.startsWith('\\qquad', i)) { parts.push(cur); cur = ''; i += 5; continue; }
      if (tex.startsWith(':\\quad', i)) { parts.push(cur + ':'); cur = ''; i += 5; continue; }
      const op = cur.trim() && ops.find(o => tex.startsWith(o, i) && !/[a-zA-Z]/.test(tex[i + o.length] || ''));
      if (op) { parts.push(cur.replace(/(\\quad|\\ |\s)+$/, '')); cur = op; i += op.length - 1; continue; }
    }
    cur += ch;
  }
  parts.push(cur);
  const ok = parts.map(x => x.replace(/^(\\quad|\\ |\s)+/, '').trim()).filter(Boolean).flatMap(x => narrow && x.length > 40 ? brkRel(x) : [x]);
  return ok.length > 1 ? R`\begin{gathered}` + ok.join(R`\\[3pt]`) + R`\end{gathered}` : tex;
}

function proofRow(p, known) {
  const isK = !!known[p.id];
  return `<li><button type="button" class="prow ${isK ? 'is-known' : ''}" data-ref="${p.id}">
<span class="prow-no">${(([k, n]) => `<small>${k}</small>${n ? `<b>${n}</b>` : ''}`)(pKind(p))}</span>
<span class="prow-main"><b>${p.name}</b><span>${p.plain || ''}</span></span>
<span class="prow-meta">${(p.method || []).slice(0, 1).map(m => `<span class="mchip">${m}</span>`).join('')}${VID[p.id] ? '<span class="prow-ic" title="Záznam z přednášky" aria-label="má záznam z přednášky">▶</span>' : ''}${p.nop ? '<span class="mchip hot">bez důkazu</span>' : ''}</span>
<span class="prow-st" aria-label="${isK ? 'umím' : 'zatím neumím'}">${isK ? '✓' : ''}</span></button></li>`;
}

function viewProofs() {
  const known = knownSet();
  const q = state.pq.trim().toLowerCase();
  const list = PROOFS.filter(p => (state.pch === 'all' || (state.pch === 'todo' ? !p.nop && !known[p.id] : p.ch === state.pch)) && (!q || (p.no + ' ' + p.name + ' ' + (p.plain || '') + ' ' + (p.method || []).join(' ')).toLowerCase().includes(q)));
  const kc = knownCount(), lp = proofById(store.get('lastProof', '') || '');
  const groups = Object.keys(PROOF_CH).map(ch => [ch, list.filter(p => p.ch === ch)]).filter(([, l]) => l.length);
  return band('dark', R`<span class="eyebrow">Ústní zkouška</span><h1 class="display"><span class="grad">Důkazy.</span></h1>
<p class="sub">Všech ${PROOFS.length} vět z přednášky. Každá má stejnou stavbu, takže se v nich neztratíš.</p>
<div class="progress" style="max-width:520px;width:100%"><div class="meter"><i style="width:${100 * kc / PROOF_TOTAL}%"></i></div><span class="muted small">Umíš ${kc} z ${PROOF_TOTAL} důkazů</span></div>
<div class="ctas"><button class="pill" data-act="randproof">Zkoušej mě z náhodné věty</button>${lp ? `<button class="pill ghost" data-ref="${lp.id}">Pokračovat: ${lp.no} ${lp.name}</button>` : ''}</div>`, 'center')
    + band('alt', R`
<ol class="plearn" aria-label="Jak se učit důkaz">
 <li><b>Znění</b><span>Co přesně věta tvrdí a za jakých předpokladů.</span></li>
 <li><b>Kostra</b><span>Hlavní myšlenka a 3–5 kroků, které si zapamatuješ.</span></li>
 <li><b>Kroky</b><span>Každý krok: co dělám, výpočet a proč to platí.</span></li>

</ol>
<div class="filters"><div class="chips"><button class="chip" data-pch="all" aria-pressed="${state.pch === 'all'}">Vše</button><button class="chip" data-pch="todo" aria-pressed="${state.pch === 'todo'}">Ještě neumím</button>${Object.entries(PROOF_CH).map(([k, l]) => `<button class="chip" data-pch="${k}" aria-pressed="${state.pch === k}">${l}</button>`).join('')}</div>
<input class="search" id="pq" type="search" placeholder="Hledat: Rolle, supremum, sporem, 19…" value="${esc(state.pq)}" aria-label="Hledat větu"></div>
${groups.map(([ch, l]) => { const k = l.filter(p => known[p.id]).length; return `<section class="pch"><header><h2 class="h3">${PROOF_CH[ch]}</h2><span class="muted small">${k} / ${l.length} umím</span></header><ol class="prows">${l.map(p => proofRow(p, known)).join('')}</ol></section>`; }).join('') || '<p class="muted">Nic nenalezeno. Zkus jiné slovo nebo filtr „Vše“.</p>'}
<p class="muted small">Sepsáno vlastními slovy podle důkazů z přednášky (zápisky 2022 a 2014/15) a poznámek ZS 2026/27. Oficiální seznam požadavků k ústní zkoušce zatím není dostupný.</p>`, 'narrow');
}

/* rozdělí kroky do částí podle pole g */
function proofParts(p) {
  const parts = []; let cur = null;
  p.steps.forEach((s, i) => { if (!cur || (s.g && s.g !== cur.g)) { cur = { g: s.g || '', steps: [] }; parts.push(cur); } cur.steps.push([s, i]); });
  return parts;
}

function viewProof(p) {
  const known = knownSet(), isK = !!known[p.id];
  const idx = PROOFS.indexOf(p), prev = PROOFS[idx - 1], next = PROOFS[idx + 1];
  const quiz = state.quiz && p.steps.length > 1;
  const parts = proofParts(p);
  const n = p.steps.length;
  const refChip = id => { const r = proofById(id); return r ? `<button class="needref" data-ref="${id}">${r.no} ${r.name} ›</button>` : ''; };

  const kostra = `<ol class="kostra">${parts.map(pt => `${pt.g ? `<li class="k-g">${pt.g}</li>` : ''}${pt.steps.map(([s, i]) => `<li><a href="#k${i + 1}" data-step="${i + 1}"><span class="k-n">${i + 1}</span>${s.h}</a></li>`).join('')}`).join('')}</ol>`;

  const steps = `<ol class="tl ${quiz ? 'is-quiz' : ''}">${parts.map(pt => `${pt.g ? `<li class="tl-g"><span>${pt.g}</span></li>` : ''}${pt.steps.map(([s, i]) => `<li class="tl-i ${quiz ? 'hide' : ''}" id="k${i + 1}"><span class="tl-n" aria-hidden="true">${i + 1}</span><div class="tl-b">
<h4>${s.h}</h4><div class="tl-body">${s.p ? `<p>${s.p}</p>` : ''}${s.m ? `<div class="tl-m">${D(brk(s.m))}</div>` : ''}${s.why ? `<p class="why"><span class="why-l">Proč</span>${s.why}</p>` : ''}${s.use ? `<div class="tl-use"><span class="muted small">Používám:</span>${s.use.map(refChip).join('')}</div>` : ''}</div>
${quiz ? '<button class="pill sm ghost reveal" data-act="reveal">Odkrýt krok</button>' : ''}</div></li>`).join('')}`).join('')}</ol>`;

  const rail = `<nav class="pp-rail" aria-label="Obsah důkazu"><span class="lbl">Obsah</span><ol>
<li><a href="#s-veta" data-sec="s-veta">Věta</a></li><li><a href="#s-kostra" data-sec="s-kostra">Kostra</a></li>
${n ? `<li><a href="#s-dukaz" data-sec="s-dukaz">Důkaz · ${n} ${plural(n, 'krok', 'kroky', 'kroků')}</a></li>` : ''}
${p.say ? '<li><a href="#s-say" data-sec="s-say">Nahlas u zkoušky</a></li>' : ''}${p.pit && p.pit.length ? '<li><a href="#s-pit" data-sec="s-pit">Pozor</a></li>' : ''}${p.ask && p.ask.length ? '<li><a href="#s-ask" data-sec="s-ask">Otázky</a></li>' : ''}${VID[p.id] ? '<li><a href="#s-vid" data-sec="s-vid">Přednáška</a></li>' : ''}</ol>
${n > 1 ? `<div class="seg" role="group" aria-label="Režim"><button data-act="pmode" data-q="0" aria-pressed="${!quiz}">Čtení</button><button data-act="pmode" data-q="1" aria-pressed="${quiz}">Zkoušení</button></div>` : ''}</nav>`;

  const sec = (id, lbl, body, cls = '') => `<section class="pp-sec ${cls}" id="${id}"><h2 class="pp-h">${lbl}</h2>${body}</section>`;
  let main = sec('s-veta', 'Věta', `<div class="stmt">${p.stmt}</div>${p.plain ? `<p class="plain"><b>Lidsky řečeno:</b> ${p.plain}</p>` : ''}`);
  main += sec('s-kostra', 'Kostra důkazu', `${p.method && p.method.length ? `<div class="mchips">${p.method.map(m => `<span class="mchip">${m}</span>`).join('')}</div>` : ''}
<div class="pv-idea"><span class="lbl">Klíčová myšlenka</span><p>${p.idea}</p></div>
${n ? kostra : ''}
${p.need && p.need.length ? `<div class="pp-need"><span class="lbl">Budeme potřebovat</span><ul class="need">${p.need.map(x => x.ref && proofById(x.ref) ? `<li><button class="needref" data-ref="${x.ref}">${x.t} ›</button></li>` : `<li>${x.t}</li>`).join('')}</ul></div>` : ''}`);
  if (p.fig) main += figHTML(p.fig);
  if (n) main += sec('s-dukaz', quiz ? 'Důkaz · zkus každý krok nejdřív sám' : 'Důkaz', `${p.goal ? `<div class="pp-goal"><span class="lbl">Co chceme ukázat</span><div class="goal">${D(brk(p.goal))}</div></div>` : ''}
${quiz ? `<div class="actions"><button class="pill sm" data-act="nextstep">Odkrýt další krok</button><button class="more" data-act="allsteps">Ukázat celý důkaz</button></div>` : ''}
${steps}${p.end ? `<p class="qed"><span aria-hidden="true">∎</span> ${p.end}</p>` : ''}`);
  if (p.say) main += sec('s-say', 'Jak to říct u zkoušky', quiz
    ? `<details class="qa"><summary>Nejdřív to zkus říct sám, pak odkryj</summary><blockquote class="say">${p.say}</blockquote></details>`
    : `<blockquote class="say">${p.say}</blockquote><p class="muted small">Tohle je důkaz v kostce. Řekni ho nahlas vlastními slovy a pak si ho napiš.</p>`, 'pp-say');
  if (p.pit && p.pit.length) main += sec('s-pit', 'Pozor u zkoušky', `<ul class="pit">${p.pit.map(t => `<li>${t}</li>`).join('')}</ul>`, 'pv-pit');
  if (p.ask && p.ask.length) main += sec('s-ask', 'Na co se může zkoušející zeptat', p.ask.map(([q, a]) => `<details class="qa"><summary>${q}</summary><p>${a}</p></details>`).join(''));
  if (VID[p.id] || RUK[p.id]) main += `<div id="s-vid" class="pp-sec">${vidSec(p)}${RUK[p.id] ? `<div>${rukBtn(p, 'pill sm ghost')}</div>` : ''}</div>`;
  main += `<div class="pp-done">${p.nop ? '' : `<button class="known big" data-known="${p.id}" aria-pressed="${isK}">${isK ? '✓ Umím' : 'Umím tuhle větu'}</button>`}</div>`;

  return `<div class="pbar"><div class="in"><button class="more back" data-go="dukazy">‹ Důkazy</button>
<span class="pbar-t"><b>${p.no}</b> ${p.name}</span>
<span class="pbar-nav"><button class="pbar-a" ${prev ? `data-ref="${prev.id}"` : 'disabled'} aria-label="Předchozí věta">‹</button><span class="muted small">${idx + 1} / ${PROOFS.length}</span><button class="pbar-a" ${next ? `data-ref="${next.id}"` : 'disabled'} aria-label="Další věta">›</button></span>
${p.nop ? '' : `<button class="known" data-known="${p.id}" aria-pressed="${isK}">${isK ? '✓ Umím' : 'Umím'}</button>`}</div></div>`
    + band('pp-head', R`<span class="eyebrow">${PROOF_CH[p.ch]}${p.skip22 ? ' · 2022 se nedokazovalo' : ''}${p.nop ? ' · bez důkazu' : ''}</span>
<h1 class="h1"><span class="pno">${p.no}</span> ${p.name}</h1>
<div class="pf-alt">${vidBtn(p, 'pill sm ghost vid-open')}${rukBtn(p)}</div>
<nav class="pp-next" aria-label="Předchozí a další důkaz">${prev ? `<button class="pp-nb" data-ref="${prev.id}"><span class="pp-dir">‹ Předchozí</span><span class="pp-no">${prev.no}</span><b>${prev.name}</b></button>` : '<span></span>'}${next ? `<button class="pp-nb nx" data-ref="${next.id}"><span class="pp-dir">Další ›</span><span class="pp-no">${next.no}</span><b>${next.name}</b></button>` : ''}</nav>`, 'narrow')
    + `<section class="band alt pp-band"><div class="pp">${rail}<div class="pp-main">${main}</div></div></section>`;
}

function openProof(id) {
  const p = proofById(id); if (!p) return;
  go('dukaz-' + id);
}

/* po vykreslení stránky důkazu: obrázky, titulek, zvýraznění obsahu */
let ppObs = null;
function initProofPage(p) {
  store.set('lastProof', p.id);
  document.title = `${p.no} ${p.name} · Důkazy · MATEMATIKA I`;
  initFigs($view);
  if (ppObs) ppObs.disconnect();
  const links = [...document.querySelectorAll('.pp-rail [data-sec]')];
  if (!links.length || !('IntersectionObserver' in window)) return;
  ppObs = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.sec === e.target.id)); });
  }, { rootMargin: '-35% 0px -60% 0px' });
  links.forEach(a => { const s = document.getElementById(a.dataset.sec); if (s) ppObs.observe(s); });
}
function revealStep(li) { if (!li) return false; li.classList.remove('hide'); li.querySelector('.reveal')?.remove(); return true; }

/* ---------- FX: přechody mezi stránkami, odhalování při scrollu, světlo pod kurzorem, počítání čísel ----------
   Jen opacity a transform (běží na GPU, neblokují scroll). Při prefers-reduced-motion se nic nehýbe. */
const FX_ON = () => !reduceMotion();
document.documentElement.classList.toggle('fx', FX_ON());

/* co se při příchodu do obrazovky jemně vynoří (vnořené prvky se neanimují dvakrát) */
const RV_SEL = [
  '#view > section.band:first-of-type .inner > *',
  '.tile', '.step3', '.stat', '.tcard', '.list > .card', '.prow', '.pch > .row-h', '.plearn li',
  '.thm', '.topic > h2', '.note', '.rcard', '.tbl', '.hardsub', '.pp-nb', '.endpanel', '.score',
  '.pp-h', '.stmt', '.kostra', '.pv-idea', '.tl-i', '.tl-g', '.say', '.pp-done', 'figure'
].join(', ');
let heroObs = null;

function fxCount(el) {
  /* čísla v textu naběhnou od nuly (jen celá čísla do 9999) */
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) if (/\d/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const src = n.nodeValue, nums = src.match(/\d+/g) || [];
    if (!nums.length || nums.some(x => +x > 9999)) continue;
    const t0 = performance.now(), dur = 900;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      let i = 0; n.nodeValue = src.replace(/\d+/g, m => String(Math.round(+nums[i++] * e)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
}

function fxDone(el) { el.classList.remove('rv', 'in'); el.style.removeProperty('--d'); }

/* čekající prvky: odhalí je kontrola při scrollu (bez IntersectionObserveru a rAF, aby obsah nikdy nezůstal schovaný) */
let rvPending = [], rvT = 0;
function rvCheck() {
  rvT = 0; if (!rvPending.length) return;
  const lim = window.innerHeight * 0.97, show = [], keep = [];
  for (const el of rvPending) {
    if (!el.isConnected) continue;
    const r = el.getBoundingClientRect();
    (r.top < lim ? show : keep).push([el, r.top, r.left]);
  }
  rvPending = keep.map(x => x[0]);
  show.sort((a, b) => a[1] - b[1] || a[2] - b[2]).forEach(([el], k) => {
    el.style.setProperty('--d', Math.min(k, 7));
    el.classList.add('in');
    if (el.matches('.tile')) fxCount(el.querySelector('.big') || el);
    else if (el.matches('.stat')) fxCount(el.querySelector('b') || el);
    else if (el.matches('.display')) fxCount(el.querySelector('.grad') || el);
    const end = ev => { if (ev.target === el && !ev.pseudoElement && ev.propertyName === 'opacity') { fxDone(el); el.removeEventListener('transitionend', end); } };
    el.addEventListener('transitionend', end);
    setTimeout(() => fxDone(el), 1700); /* pojistka, kdyby transitionend nepřišel */
  });
}
const rvSoon = () => { if (!rvT) rvT = setTimeout(rvCheck, 40); };
window.addEventListener('scroll', rvSoon, { passive: true });
window.addEventListener('resize', rvSoon, { passive: true });

function fxReveal(root) {
  if (!FX_ON() || !root) return;
  const els = [...root.querySelectorAll(RV_SEL)];
  const set = new Set(els);
  rvPending = [];
  for (const el of els) {
    let p = el.parentElement, nested = false;
    while (p && p !== root) { if (set.has(p)) { nested = true; break; } p = p.parentElement; }
    if (nested || el.offsetParent === null) continue;
    el.classList.add('rv'); rvPending.push(el);
  }
  /* první várka až po vykreslení výchozího stavu, aby přechod opravdu proběhl */
  setTimeout(rvCheck, 60);
  /* úvodní pás: animace pozadí běží, jen když je vidět */
  const hero = root.querySelector(':scope > section.band');
  heroObs?.disconnect();
  if (hero && 'IntersectionObserver' in window) {
    heroObs = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('fx-off', !e.isIntersecting)));
    heroObs.observe(hero);
  }
}

/* přechod mezi stránkami (View Transitions API, kde je k dispozici) */
const routeIndex = v => { const m = v.match(PROOF_RE); if (m) return PROOFS.findIndex(p => p.id === m[1]); const t = v.match(TEST_RE); return t ? +t[2] : null; };
function fxGo(from, to, restore, doIt) {
  if (!FX_ON() || !document.startViewTransition || from === to) { doIt(); return; }
  const a = routeIndex(from), b = routeIndex(to), same = (PROOF_RE.test(from) && PROOF_RE.test(to)) || (TEST_RE.test(from) && TEST_RE.test(to) && from.slice(0, 2) === to.slice(0, 2));
  document.documentElement.dataset.vt = same && a != null && b != null ? (b > a ? 'next' : 'prev') : restore ? 'back' : 'fwd';
  /* pojistka: když prohlížeč snímek nepořídí (skrytá karta, rám), přepni stránku i tak, jen bez animace */
  let ran = false; const once = () => { if (ran) return; ran = true; doIt(); };
  let vt = null;
  try { vt = document.startViewTransition(once); } catch { once(); return; }
  /* přeskočený přechod (rychlé klikání, pojistka níž) není chyba, jen ho neohlašuj do konzole */
  for (const pr of [vt.ready, vt.finished, vt.updateCallbackDone]) pr && pr.catch(() => { });
  setTimeout(() => { if (!ran) { try { vt && vt.skipTransition(); } catch { } once(); } }, 350);
}

 <div class="step3"><span class="n">4</span><h3 class="h3">Věta s důkazem</h3><p class="muted">Zformulovat a dokázat větu, např. o omezenosti spojité funkce na intervalu.</p><button class="more" data-go="dukazy">Důkazy</button></div>

  const card = sols[0].closest('.card') || sols[0];
  revealEl(card);
  sols.forEach(d => { d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash'); });
  setTimeout(() => sols.forEach(d => d.classList.remove('flash')), 2200);
  if (btn) btn.textContent = 'Přejít na řešení';
  toast(`Řešení rozbalena u ${sols.length === 1 ? 'příkladu' : `všech ${sols.length} příkladů`}`);
}

/* ---------- události ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); if (g.dataset.topic) { state.topic = g.dataset.topic; store.set('topic', state.topic); } go(g.dataset.go); return; }
  const j = e.target.closest('[data-jump]');
  if (j) { e.preventDefault(); const el = document.getElementById(j.dataset.jump); if (el) revealEl(el); return; }
  const tp = e.target.closest('[data-topic]');
  if (tp) { state.topic = tp.dataset.topic; store.set('topic', state.topic); render(); return; }
  const pc = e.target.closest('[data-pch]');
  if (pc) { state.pch = pc.dataset.pch; rerenderProofList(); return; }
  const rf = e.target.closest('[data-ref]');
  if (rf) { e.preventDefault(); openProof(rf.dataset.ref); return; }
  const st = e.target.closest('[data-step]');
  if (st) { e.preventDefault(); const li = document.getElementById('k' + st.dataset.step); if (li) { revealEl(li); li.classList.remove('flash'); void li.offsetWidth; li.classList.add('flash'); } return; }
  const ps = e.target.closest('.pp-rail [data-sec]');
  if (ps) { e.preventDefault(); const el = document.getElementById(ps.dataset.sec); if (el) revealEl(el); return; }
  const kn = e.target.closest('[data-known]');
  if (kn) {
    const id = kn.dataset.known, k = knownSet(), val = kn.dataset.close ? true : !k[id]; k[id] = val; store.set('known', k);
    document.querySelectorAll(`.known[data-known="${id}"]`).forEach(b => { b.setAttribute('aria-pressed', val); b.textContent = val ? '✓ Umím' : b.classList.contains('big') ? 'Umím tuhle větu' : 'Umím'; });
    const pm = document.querySelector('.progress .meter i'), pl = document.querySelector('.progress span'); const kc = knownCount();
    if (pm) pm.style.width = (100 * kc / PROOF_TOTAL) + '%'; if (pl) pl.textContent = `Umíš ${kc} z ${PROOF_TOTAL} důkazů`;
    toast(val ? `✓ ${proofById(id).no} označena jako umím (${kc}/${PROOF_TOTAL})` : `${proofById(id).no} vrácena mezi neumím`);
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'random') { state.randomKind = a.dataset.kind || 'p2'; state.randomSeed = Math.floor(Math.random() * 1e9); go('nahodna'); }
  else if (act === 'batch+') { state.batch++; store.set('batch', state.batch); render(); toast(`Nová sada č. ${state.batch + 1}`); }
  else if (act === 'batch0') { state.batch = 0; store.set('batch', 0); render(); }
  else if (act === 'timer') toggleTimer(a);
  else if (act === 'timer0') { stopTimer(false); timer.started = false; const b = document.querySelector('[data-act="timer"]'); if (b) { b.textContent = '▶ Spustit'; b.disabled = false; } resetTimerDisplay(); const sl = document.getElementById('endslot'); if (sl) sl.innerHTML = ''; }
  else if (act === 'showres') document.querySelectorAll('details.res').forEach(d => d.open = true);
  else if (act === 'savescore') { clearTimeout(scoreTimer); const inp = a.parentElement.querySelector('[data-score]'); saveScore(inp ? inp.value : ''); }
  else if (act === 'reveal') revealStep(a.closest('.tl-i'));
  else if (act === 'nextstep') { const li = document.querySelector('.tl-i.hide'); if (revealStep(li)) revealEl(li); if (!document.querySelector('.tl-i.hide')) { a.closest('.actions')?.remove(); toast('Celý důkaz je odkrytý.'); } }
  else if (act === 'allsteps') { document.querySelectorAll('.tl-i.hide').forEach(revealStep); a.closest('.actions')?.remove(); }
  else if (act === 'pmode') { state.quiz = a.dataset.q === '1'; store.set('quiz', state.quiz); const y = window.scrollY; render(); window.scrollTo({ top: y }); }
  else if (act === 'endtest') endTest(false);
  else if (act === 'toscore') { const inp = document.querySelector('.score [data-score]'); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); } }
  else if (act === 'showsol') showSolutions(a);
  else if (act === 'randproof') {
    const known = knownSet();
    const pool = PROOFS.filter(p => !p.nop && !known[p.id]);
    const p = (pool.length ? pool : PROOFS.filter(p => !p.nop))[Math.floor(Math.random() * (pool.length || PROOF_TOTAL))];
    state.quiz = true; store.set('quiz', true);
    openProof(p.id); toast(`Náhodně: ${p.no} · ${p.name}. Řekni si důkaz nahlas, pak odkrývej kroky.`);
  }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.open) return;
  const box = d.querySelector(':scope > div');
  if (!box || box.dataset.filled) return;
  if (d.classList.contains('sol')) box.innerHTML = SOLS[+d.dataset.k] || '';
  else return;
  box.dataset.filled = '1';
  initFigs(box);
  typeset(box);
}, true);
let searchT;
document.addEventListener('input', e => {
  if (e.target.id === 'pq') { state.pq = e.target.value; clearTimeout(searchT); searchT = setTimeout(rerenderProofList, 250); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.oral) { const st = store.get('oral', {}); st[t.dataset.oral] = t.checked; store.set('oral', st); return; }
  if (t.matches && t.matches('[data-score]')) { clearTimeout(scoreTimer); saveScore(t.value); return; }
  if (t.id === 'tdone') {
    const mt = state.view.match(TEST_RE); if (!mt) return;
    const T = TESTDEF[mt[1]], key = T.key(+mt[2]), rec = store.get(key, {});
    rec.done = t.checked; store.set(key, rec);
  }
});

/* ---------- kontrola šablon (pro autora) ---------- */
window.selfTest = function (seeds = 60) {
  const bad = [];
  for (const id of Object.keys(FAM)) for (let s = 0; s < seeds; s++) {
    const p = makeProblem(id, s);
    let got;
    if (p.ok) { if (!p.ok() || !p.sol) bad.push({ id, s, ok: false }); continue; }
    if (p.f0) { const h = p.h || 1e-6, X = p.at === Infinity ? (p.big || 1e6) : p.at === -Infinity ? -(p.big || 1e6) : null;
      const vals = X != null ? [p.f0(X)] : [p.f0(p.at + h), p.f0(p.at - h)];
      if (!vals.every(g => Math.abs(g - p.val) <= 2e-3 * Math.max(1, Math.abs(p.val))) || !p.sol) bad.push({ id, s, exp: p.val, got: vals }); continue; }
    if (p.f) got = p.f(1e4);
    else if (p.lf) got = Math.exp(p.lf(1e6) / 1e6);
    else if (p.lr) { const v = p.lr(20000); got = v > 50 ? Infinity : Math.exp(v); }
    else if (p.lv) got = p.lv(20000) < -20 ? 0 : NaN;
    const exp = p.val;
    let ok;
    if (exp === Infinity) ok = got > 1e3; else if (exp === -Infinity) ok = got < -1e3;
    else ok = Math.abs(got - exp) <= 2e-2 * Math.max(1, Math.abs(exp));
    if (!ok || !p.sol) bad.push({ id, s, exp, got, sol: !!p.sol });
  }
  return { checked: Object.keys(FAM).length * seeds, bad: bad.slice(0, 20), nBad: bad.length };
};
