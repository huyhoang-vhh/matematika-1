const TESTDEF = {
  p2: { title: '2. zápočtová písemka', short: '2. test · posloupnosti', n: 20, lists: [['R1', 'R3', 'R4', 'R5', 'R2', 'R7', 'R8', 'R6', 'R10', 'R9'], ['N1', 'N3', 'N2', 'N4', 'N6', 'N5', 'N8', 'N7', 'N9'], ['S4', 'S1', 'S5', 'S2', 'S7', 'S6', 'S3', 'S10', 'S8', 'S9']], pts: [10, 10, 10], max: 30, pass: 20, min: 30, base: 1000, key: i => 't' + i },
  p3: { title: '3. zápočtová písemka', short: '3. test · limity funkcí', n: 15, lists: [['L14', 'L1', 'L2', 'L6'], ['L3', 'L15', 'L4', 'L5', 'L10'], ['L7', 'L11', 'L8', 'L15', 'L4']], pts: [10, 10, 10], max: 30, pass: 20, min: 30, base: 3000, key: i => 't3-' + i },
  zk: { title: 'Písemná zkouška', short: 'zkouška · 4 příklady', n: 15, lists: [['E1', 'E3', 'E2'], ['L7', 'L10', 'L4', 'L11', 'L6'], ['G1', 'G3', 'G5', 'G2', 'G4'], ['P1', 'P3', 'P2', 'P4', 'P6', 'P5']], pts: [10, 15, 10, 15], max: 50, pass: 26, min: 120, base: 5000, key: i => 'tz-' + i }
};
const TESTS2 = TESTDEF.p2.n;
function makeTest(kind, i, seed) {
  const T = TESTDEF[kind], s = seed ?? (T.base + i);
  const pr = mkRng(s);
  /* u extra těžkých se po projetí celého seznamu mění i kombinace příkladů */
  const idx = (list, j) => T.hard ? (i - 1 + j * (1 + Math.floor((i - 1) / list.length))) % list.length : (i - 1 + (kind === 'p2' ? 0 : j)) % list.length;
  /* novější písemky (a náhodné) berou i nové typy; starší zůstávají stejné kvůli uloženým bodům */
  const lists = T.lists2 && (seed != null || i > T.n1) ? T.lists2 : T.lists;
  return lists.map((list, j) => makeProblem(seed == null ? list[idx(list, j)] : pick(pr, list), s + j));
}

/* ---------- extra těžké písemky ke 2. a 3. zápočtu (každý příklad má jeden chyták, ale stihne se za ~10 minut) ---------- */
function famH(id, topic, gen) { fam(id, topic, gen); FAM[id].hard = true; }
const eP = d => d === 1 ? 'e' : R`e^{${d}}`;

/* --- Rozdíl odmocnin --- */
famH('HR1', 'odm', r => {
  const a = ri(r, 1, 4), C = R`\sqrt[3]{n^3+${3 * a}n^2}`, S = R`\sqrt{n^2+${2 * a}n}`;
  return {
    task: D(R`\lim_{n\to\infty} n\left(${C}-${S}\right)`), ans: fr(-a * a, 2),
    sol: R`<p>Chyták: obě odmocniny se chovají jako ${I(`n+${a}`)} (zkus ${I(R`(n+${a})^3=n^3+${3 * a}n^2+\dots`)} a ${I(R`(n+${a})^2=n^2+${2 * a}n+\dots`)}). Jejich rozdíl jde k 0 a teprve s ${I('n')} vyjde vlastní limita. Proto neodečítáme ${I('n')}, ale ${I(`n+${a}`)}. Označíme ${I(R`C_n=${C}`)}, ${I(R`S_n=${S}`)}:</p>
${D(R`n(C_n-S_n)=n\big(C_n-(n+${a})\big)-n\big(S_n-(n+${a})\big)`)}
<p><b>První část</b> (vzorec ${I(R`a-b=\frac{a^3-b^3}{a^2+ab+b^2}`)}, ${I(R`\frac{C_n}{n}=\sqrt[3]{1+\frac{${3 * a}}{n}}\to1`)} podle ZOAL):</p>
${D(R`n\big(C_n-(n+${a})\big)=n\cdot\frac{n^3+${3 * a}n^2-(n+${a})^3}{C_n^2+C_n(n+${a})+(n+${a})^2}=\frac{-${3 * a * a}n^2-${a ** 3}n}{n^2\left[\left(\frac{C_n}{n}\right)^2+\frac{C_n}{n}\left(1+\frac{${a}}{n}\right)+\left(1+\frac{${a}}{n}\right)^2\right]}\to\frac{-${3 * a * a}}{3}=-${a * a}`)}
<p><b>Druhá část:</b></p>
${D(R`n\big(S_n-(n+${a})\big)=n\cdot\frac{n^2+${2 * a}n-(n+${a})^2}{S_n+n+${a}}=\frac{-${a * a}}{\sqrt{1+\frac{${2 * a}}{n}}+1+\frac{${a}}{n}}\to-\frac{${a * a}}{2}`)}
<p>Obě limity jsou vlastní, podle AL: ${I(R`-${a * a}-\left(-\frac{${a * a}}{2}\right)=${fr(-a * a, 2)}`)}.</p>`,
    f: n => { const c = Math.cbrt(n ** 3 + 3 * a * n * n), s = Math.sqrt(n * n + 2 * a * n), m = n + a; return n * (-3 * a * a * n - a ** 3) / (c * c + c * m + m * m) + n * a * a / (s + m); }, val: -a * a / 2
  };
});
famH('HR2', 'odm', r => {
  const a = ri(r, 1, 8), b = ri(r, 1, 5);
  return {
    task: D(R`\lim_{n\to\infty}\left(\sqrt[4]{n^4+${a}n^3}-\sqrt{n^2+${b}n}\right)`), ans: fr(a - 2 * b, 4),
    sol: R`<p>Obě odmocniny se chovají jako ${I('n')}, typ ${I(R`\infty-\infty`)}. Přičteme a odečteme ${I('n')} a každou závorku spočítáme zvlášť. Označíme ${I(R`A_n=\sqrt[4]{n^4+${a}n^3}`)}, ${I(R`\frac{A_n}{n}=\sqrt[4]{1+\frac{${a}}{n}}\to1`)} (ZOAL).</p>
<p><b>Čtvrtá odmocnina:</b> vzorec ${I(R`a^4-b^4=(a-b)(a+b)(a^2+b^2)`)}, tedy ${I(R`a-b=\frac{a^4-b^4}{(a+b)(a^2+b^2)}`)}:</p>
${D(R`A_n-n=\frac{${a}n^3}{(A_n+n)(A_n^2+n^2)}=\frac{${a}}{\left(\frac{A_n}{n}+1\right)\left(\left(\frac{A_n}{n}\right)^2+1\right)}\to\frac{${a}}{2\cdot2}=\frac{${a}}{4}`)}
<p><b>Druhá odmocnina:</b></p>
${D(R`\sqrt{n^2+${b}n}-n=\frac{${b}n}{\sqrt{n^2+${b}n}+n}=\frac{${b}}{\sqrt{1+\frac{${b}}{n}}+1}\to\frac{${b}}{2}`)}
<p>Podle AL: ${I(R`\frac{${a}}{4}-\frac{${b}}{2}=${fr(a - 2 * b, 4)}`)}.</p>`,
    f: n => { const A = Math.pow(n ** 4 + a * n ** 3, .25); return a * n ** 3 / ((A + n) * (A * A + n * n)) - b * n / (Math.sqrt(n * n + b * n) + n); }, val: (a - 2 * b) / 4
  };
});
famH('HR3', 'odm', r => {
  const a = ri(r, 1, 6);
  return {
    task: D(R`\lim_{n\to\infty} n^3\left(\sqrt{n^2+${a}}+\sqrt{n^2-${a}}-2n\right)`), ans: fr(-a * a, 4),
    sol: R`<p>Závorka jde k 0 a ${I('n^3')} k nekonečnu. Chyták: jedno rozšíření nestačí, závorka je „řádu ${I(R`\frac1{n^3}`)}“. Označíme ${I(R`A=\sqrt{n^2+${a}}`)}, ${I(R`B=\sqrt{n^2-${a}}`)} a rozdělíme ${I('2n=n+n')}:</p>
${D(R`A+B-2n=(A-n)+(B-n)=\frac{${a}}{A+n}-\frac{${a}}{B+n}=\frac{${a}\,(B-A)}{(A+n)(B+n)}`)}
<p>A ještě jednou rozšíříme rozdíl ${I('B-A')}:</p>
${D(R`B-A=\frac{B^2-A^2}{B+A}=\frac{-${2 * a}}{A+B}\quad\Longrightarrow\quad A+B-2n=\frac{-${2 * a * a}}{(A+B)(A+n)(B+n)}`)}
${D(R`n^3(A+B-2n)=\frac{-${2 * a * a}}{\left(\frac An+\frac Bn\right)\left(\frac An+1\right)\left(\frac Bn+1\right)}\xrightarrow{\text{AL, ZOAL}}\frac{-${2 * a * a}}{2\cdot2\cdot2}=${fr(-a * a, 4)}`)}
<p>(${I(R`\frac An=\sqrt{1+\frac{${a}}{n^2}}\to1`)}, stejně ${I(R`\frac Bn\to1`)}.)</p>`,
    f: n => { const A = Math.sqrt(n * n + a), B = Math.sqrt(n * n - a); return -2 * a * a * n ** 3 / ((A + B) * (A + n) * (B + n)); }, val: -a * a / 4
  };
});
famH('HR4', 'odm', r => {
  const q = ri(r, 2, 3), a = ri(r, 1, 9), b = ri(r, 1, 6), Q3 = q ** 3, Q2 = q * q;
  return {
    task: D(R`\lim_{n\to\infty}\left(\sqrt[3]{${Q3}^n+${a}\cdot ${Q2}^n}-\sqrt{${Q2}^n+${b}\cdot ${q}^n}\right)`), ans: fr(2 * a - 3 * b, 6),
    sol: R`<p>Klíč: ${I(R`${Q3}^n=(${q}^n)^3`)} a ${I(R`${Q2}^n=(${q}^n)^2`)}. Obě odmocniny se tedy chovají jako ${I(`${q}^n`)}. Přičteme a odečteme ${I(`${q}^n`)}:</p>
${D(R`\Big(\sqrt[3]{${Q3}^n+${a}\cdot ${Q2}^n}-${q}^n\Big)-\Big(\sqrt{${Q2}^n+${b}\cdot ${q}^n}-${q}^n\Big)`)}
<p><b>Třetí odmocnina</b> s ${I(R`C_n=\sqrt[3]{${Q3}^n+${a}\cdot ${Q2}^n}`)}, kde ${I(R`\frac{C_n}{${q}^n}=\sqrt[3]{1+\frac{${a}}{${q}^n}}\to1`)}:</p>
${D(R`C_n-${q}^n=\frac{${a}\cdot ${Q2}^n}{C_n^2+C_n\,${q}^n+${Q2}^n}=\frac{${a}}{\left(\frac{C_n}{${q}^n}\right)^2+\frac{C_n}{${q}^n}+1}\to\frac{${a}}{3}`)}
<p><b>Druhá odmocnina:</b></p>
${D(R`\sqrt{${Q2}^n+${b}\cdot ${q}^n}-${q}^n=\frac{${b}\cdot ${q}^n}{\sqrt{${Q2}^n+${b}\cdot ${q}^n}+${q}^n}=\frac{${b}}{\sqrt{1+\frac{${b}}{${q}^n}}+1}\to\frac{${b}}{2}`)}
<p>Podle AL: ${I(R`\frac{${a}}{3}-\frac{${b}}{2}=${fr(2 * a - 3 * b, 6)}`)}.</p>`,
    f: n => { const x = q ** -Math.min(n, 30), c = Math.cbrt(1 + a * x); return a / (c * c + c + 1) - b / (Math.sqrt(1 + b * x) + 1); }, val: (2 * a - 3 * b) / 6
  };
});
famH('HR5', 'odm', r => {
  const a = ri(r, 1, 6), b = ri(r, 1, 9), A = a === 1 ? '' : a;
  return {
    task: D(R`\lim_{n\to\infty}\left(\sqrt{n+${A}\sqrt{n+${b}\sqrt{n}}}-\sqrt{n}\right)`), ans: fr(a, 2),
    sol: R`<p>Vnořené odmocniny. Typ ${I(R`\infty-\infty`)}, rozšíříme vnější rozdíl:</p>
${D(R`\sqrt{n+${A}\sqrt{n+${b}\sqrt{n}}}-\sqrt{n}=\frac{${A}\sqrt{n+${b}\sqrt{n}}}{\sqrt{n+${A}\sqrt{n+${b}\sqrt{n}}}+\sqrt{n}}`)}
<p>Čitatel i jmenovatel vydělíme ${I(R`\sqrt n`)}. Uvnitř použijeme ${I(R`\frac{\sqrt{n+${b}\sqrt n}}{\sqrt n}=\sqrt{1+\frac{${b}}{\sqrt n}}\to1`)} a ${I(R`\frac{\sqrt{n+${b}\sqrt n}}{n}=\sqrt{\frac1n+\frac{${b}}{n\sqrt n}}\to0`)}:</p>
${D(R`=\frac{${A}\sqrt{1+\frac{${b}}{\sqrt n}}}{\sqrt{1+${A}\sqrt{\frac1n+\frac{${b}}{n\sqrt n}}}+1}\xrightarrow{\text{AL, ZOAL}}\frac{${a}\cdot1}{\sqrt{1+0}+1}=${fr(a, 2)}`)}
<p>Nejvnitřnější odmocnina ${I(R`${b}\sqrt n`)} výsledek neovlivní.</p>`,
    f: n => { n = n ** 3; const s = Math.sqrt(n + b * Math.sqrt(n)); return a * s / (Math.sqrt(n + a * s) + Math.sqrt(n)); }, val: a / 2 /* konverguje pomalu, kontrola na n³ */
  };
});

/* --- n-tá odmocnina --- */
famH('HN1', 'nte', r => {
  const p = ri(r, 2, 3), P = p * p, q = ri(r, 2, P - 1), k = ri(r, 1, 4), rr = ri(r, 2, 5), s = ri(r, 1, 9);
  return {
    task: D(R`\lim_{n\to\infty}\sqrt[n]{\frac{${p}^{2n}+${np(k)}\cdot ${q}^n}{\left(${rr}+\frac1n\right)^n+${s}}}`), ans: fr(P, rr),
    sol: R`<p>Odmocnina podílu je podíl odmocnin, spočítáme je zvlášť.</p>
<p><b>Čitatel.</b> ${I(R`${p}^{2n}=${P}^n`)} a ${I(R`${q}\lt ${P}`)}, takže ${I(R`${np(k)}\cdot ${q}^n\le ${np(k)}\cdot ${P}^n`)}:</p>
${D(R`${P}^n\le ${P}^n+${np(k)}\cdot ${q}^n\le(1+${np(k)})\,${P}^n\le 2${np(k)}\cdot ${P}^n\quad\Longrightarrow\quad ${P}\le\sqrt[n]{\ldots}\le ${P}\sqrt[n]{2}\left(\sqrt[n]{n}\right)^{${k}}\to ${P}`)}
<p><b>Jmenovatel.</b> Chyták: základ ${I(R`${rr}+\frac1n`)} závisí na ${I('n')}. Protože ${I(R`\left(${rr}+\frac1n\right)^n\ge1`)}, platí</p>
${D(R`\left(${rr}+\tfrac1n\right)^n\le\left(${rr}+\tfrac1n\right)^n+${s}\le ${s + 1}\left(${rr}+\tfrac1n\right)^n\quad\Longrightarrow\quad ${rr}+\tfrac1n\le\sqrt[n]{\ldots}\le\sqrt[n]{${s + 1}}\left(${rr}+\tfrac1n\right)`)}
<p>Obě strany jdou k ${I(rr)}. ${twoCops} jde čitatel k ${I(P)}, jmenovatel k ${I(rr)} a podle AL je limita ${I(fr(P, rr))}.</p>`,
    lf: n => lse(2 * n * L(p), k * L(n) + n * L(q)) - lse(n * L(rr + 1 / n), L(s)), val: P / rr
  };
});
famH('HN2', 'nte', r => {
  const a = ri(r, 2, 5); let b = ri(r, 2, 5); if (b === a) b = a === 5 ? 2 : a + 1;
  const M = Math.max(a, b), big = a > b ? 'a_n' : 'b_n';
  return {
    task: D(R`\lim_{n\to\infty}\sqrt[n]{\left(\frac{${a}n+1}{n+2}\right)^n+\left(\frac{${b}n^2}{n^2+1}\right)^n}`), ans: '' + M,
    sol: R`<p>Označíme ${I(R`a_n=\frac{${a}n+1}{n+2}`)} a ${I(R`b_n=\frac{${b}n^2}{n^2+1}`)}. Podle AL ${I(R`a_n\to ${a}`)}, ${I(R`b_n\to ${b}`)}, a navíc ${I(R`a_n\lt ${a}`)} (protože ${I(R`${a}n+1\lt ${a}n+${2 * a}`)}) a ${I(R`b_n\lt ${b}`)}.</p>
<p>Chyták: základy závisí na ${I('n')}, takže je nejde jen „porovnat“. Rozhoduje, ke které hodnotě jdou: větší je ${I(M)}.</p>
<p><b>Dolní odhad:</b> ${I(R`\sqrt[n]{a_n^n+b_n^n}\ge\sqrt[n]{${big}^n}=${big}\to ${M}`)}.</p>
<p><b>Horní odhad:</b> ${I(R`a_n^n+b_n^n\le ${a}^n+${b}^n\le 2\cdot ${M}^n`)}, tedy ${I(R`\sqrt[n]{\ldots}\le ${M}\sqrt[n]{2}\to ${M}`)}.</p>
<p>${twoCops} je limita ${I(M)}.</p>`,
    lf: n => lse(n * L((a * n + 1) / (n + 2)), n * L(b * n * n / (n * n + 1))), val: M
  };
});
famH('HN3', 'nte', r => {
  const p = ri(r, 3, 6), q = ri(r, 2, p - 1), k = ri(r, 1, 4);
  return {
    task: D(R`\lim_{n\to\infty}\sqrt[n]{${p}^n-${np(k)}\cdot ${q}^n}`) + R`<p>(Výraz pod odmocninou je kladný pro všechna dost velká ${I('n')}.)</p>`, ans: '' + p,
    sol: R`<p><b>Horní odhad:</b> ${I(R`${p}^n-${np(k)}\cdot ${q}^n\le ${p}^n`)}, tedy ${I(R`\sqrt[n]{\ldots}\le ${p}`)}.</p>
<p><b>Dolní odhad</b> (chyták: odečítá se a ještě s ${I(np(k))}). Označíme ${I(R`c_n=${np(k)}\left(\frac{${q}}{${p}}\right)^n`)}. ${PK}: ${I(R`\frac{c_{n+1}}{c_n}=\left(1+\frac1n\right)^{${k}}\frac{${q}}{${p}}\to\frac{${q}}{${p}}\lt 1`)}, takže ${I(R`c_n\to0`)}. Proto existuje ${I('n_0')} tak, že ${I(R`c_n\le\frac12`)} pro ${I(R`n\ge n_0`)}, a tam</p>
${D(R`${p}^n-${np(k)}\cdot ${q}^n=${p}^n(1-c_n)\ge\tfrac12\cdot ${p}^n\quad\Longrightarrow\quad ${p}\sqrt[n]{\tfrac12}\le\sqrt[n]{\ldots}\le ${p}`)}
<p>${I(R`\sqrt[n]{\frac12}\to1`)}. Konečně mnoho členů limitu neovlivní, takže ${twoCops.toLowerCase()} je limita ${I(p)}.</p>`,
    lf: n => n * L(p) + Math.log1p(-Math.exp(k * L(n) + n * (L(q) - L(p)))), val: p
  };
});
famH('HN4', 'nte', r => {
  const a = pick(r, [2, 3, 5, 6, 7]), M = Math.max(4, a);
  return {
    task: D(R`\lim_{n\to\infty}\sqrt[n]{\binom{2n}{n}+${a}^n}`) + R`<p>(Nápověda: binomická věta pro ${I(R`(1+1)^{2n}`)}.)</p>`, ans: '' + M,
    sol: R`<p>Nejdřív odhad kombinačního čísla. Podle binomické věty je ${I(R`4^n=(1+1)^{2n}=\sum_{j=0}^{2n}\binom{2n}{j}`)}. Všechny sčítance jsou kladné a ${I(R`\binom{2n}{n}`)} je z těch ${I('2n+1')} sčítanců největší. Proto</p>
${D(R`\frac{4^n}{2n+1}\le\binom{2n}{n}\le 4^n`)}
${a < 4 ? R`<p>Tady dominuje ${I('4^n')} (${I(R`${a}\lt 4`)}):</p>
${D(R`\frac{4}{\sqrt[n]{2n+1}}=\sqrt[n]{\frac{4^n}{2n+1}}\le\sqrt[n]{\binom{2n}{n}+${a}^n}\le\sqrt[n]{4^n+4^n}=4\sqrt[n]{2}`)}
<p>${I(R`1\le\sqrt[n]{2n+1}\le\sqrt[n]{3}\sqrt[n]{n}\to1`)}, takže obě strany jdou k ${I(4)}. ${twoCops} je limita ${I(4)}.</p>` : R`<p>Tady dominuje ${I(`${a}^n`)} (${I(R`${a}\gt 4`)}):</p>
${D(R`${a}=\sqrt[n]{${a}^n}\le\sqrt[n]{\binom{2n}{n}+${a}^n}\le\sqrt[n]{4^n+${a}^n}\le\sqrt[n]{2\cdot ${a}^n}=${a}\sqrt[n]{2}`)}
<p>${twoCops} je limita ${I(a)}.</p>`}`,
    lf: n => lse(lnf(2 * n) - 2 * lnf(n), n * L(a)), val: M
  };
});
famH('HN5', 'nte', r => {
  const a = ri(r, 2, 9), b = ri(r, 2, 5), k = ri(r, 2, 6);
  return {
    task: D(R`\lim_{n\to\infty}\sqrt[n]{\frac{n!+${a}^n}{${b}^n+n^{${k}}}}`) + R`<p>(Nápověda: ${I(R`n!\ge\left(\frac n2\right)^{n/2}`)}.)</p>`, ans: R`+\infty`,
    sol: R`<p><b>Proč platí nápověda:</b> v součinu ${I(R`n!=1\cdot2\cdots n`)} je aspoň ${I(R`\frac n2`)} činitelů ${I(R`\ge\frac n2`)} (ty z horní poloviny) a ostatní jsou ${I(R`\ge1`)}.</p>
<p><b>Jmenovatel:</b> ${I(R`\frac{n^{${k}}}{${b}^n}\to0`)} ${PK} (${I(R`\left(1+\frac1n\right)^{${k}}\frac1{${b}}\to\frac1{${b}}\lt 1`)}), takže pro dost velká ${I('n')} je ${I(R`n^{${k}}\le ${b}^n`)} a jmenovatel je ${I(R`\le 2\cdot ${b}^n`)}.</p>
<p><b>Dolní odhad</b> (čitatel zmenšíme, jmenovatel zvětšíme):</p>
${D(R`\sqrt[n]{\frac{n!+${a}^n}{${b}^n+n^{${k}}}}\ge\sqrt[n]{\frac{n!}{2\cdot ${b}^n}}\ge\frac{\sqrt[n]{(n/2)^{n/2}}}{${b}\sqrt[n]{2}}=\frac{\sqrt{n/2}}{${b}\sqrt[n]{2}}\to+\infty`)}
<p>(${I(R`\sqrt{n/2}\to\infty`)}, ${I(R`${b}\sqrt[n]{2}\to ${b}`)}.) Podle věty o srovnání (jeden „policajt“ zdola stačí) je limita ${I(R`+\infty`)}.</p>`,
    lf: n => lse(lnf(n), n * L(a)) - lse(n * L(b), k * L(n)), val: Infinity
  };
});

/* --- Růstová škála --- */
const eHint = R`<p>(Nápověda: ${I(R`\left(1+\frac1n\right)^n\to e\approx2{,}718`)}.)</p>`;
famH('HS1', 'skala', r => {
  const c = pick(r, [1, 2]), cn = c === 1 ? '' : R`${c}^n\,`, big = c === 1;
  return {
    task: D(R`\lim_{n\to\infty}\frac{(2n)!}{${cn}n^n\,n!}`) + eHint, ans: big ? R`+\infty` : '0',
    sol: R`<p>Podílové kritérium pro ${I(R`a_n=\frac{(2n)!}{${cn}n^n\,n!}>0`)}. Pomůcky: ${I(R`(2n+2)!=(2n+2)(2n+1)\,(2n)!`)} a ${I(R`(n+1)^{n+1}=(n+1)(n+1)^n`)}.</p>
${D(R`\frac{a_{n+1}}{a_n}=\frac{(2n+2)(2n+1)}{${c === 1 ? '' : c}(n+1)\cdot(n+1)}\cdot\frac{n^n}{(n+1)^n}=\frac{2(2n+1)}{${c === 1 ? '' : c}(n+1)}\cdot\frac{1}{\left(1+\frac1n\right)^n}\to\frac{4}{${c === 1 ? '' : c}e}`)}

<p>Obě limity jsou vlastní, podle AL: ${I(R`1+\frac{${k * k}}{2}=${fr(2 + k * k, 2)}`)}.</p>`,
    f0: x => (Math.expm1(x * x) + (1 - Math.cos(k * x))) / (x * x), at: 0, val: 1 + k * k / 2, h: 1e-3
  };
  if (v === 1) return {
    task: D(R`\lim_{x\to0}\frac{\sqrt{1+x^2}-\cos(${u})}{x^2}`), ans: fr(1 + k * k, 2),
    sol: R`<p>Chyták: rozdělit přes ${I(1)}: ${I(R`\left(\sqrt{1+x^2}-1\right)+\left(1-\cos(${u})\right)`)}.</p>
${D(R`\frac{\sqrt{1+x^2}-1}{x^2}=\frac{x^2}{x^2\left(\sqrt{1+x^2}+1\right)}\to\frac12,\qquad ${cosP}`)}
<p>Podle AL: ${I(R`\frac12+\frac{${k * k}}{2}=${fr(1 + k * k, 2)}`)}.</p>`,
    f0: x => (x * x / (Math.sqrt(1 + x * x) + 1) + (1 - Math.cos(k * x))) / (x * x), at: 0, val: (1 + k * k) / 2, h: 1e-3
  };
  return {
    task: D(R`\lim_{x\to0}\frac{\ln(1+x^2)-\sin^2(${u})}{x^2}`), ans: '' + (1 - k * k),
    sol: R`<p>Rozdělíme na dva zlomky:</p>
${D(R`\frac{\ln(1+x^2)}{x^2}\to1\quad(\text{${VLSF}},\ x^2\neq0),\qquad\frac{\sin^2(${u})}{x^2}=${kk}\left(\frac{\sin(${u})}{${u}}\right)^2\to ${k * k}`)}
<p>Obě limity jsou vlastní, podle AL: ${I(R`1-${k * k}=${1 - k * k}`)}. Chyták: kdo dosadí „${I(R`\ln(1+x^2)\approx x^2`)} a ${I(R`\sin^2 \approx x^2`)}“ bez ${I(k)}, dostane chybně ${I(0)}.</p>`,
    f0: x => (Math.log1p(x * x) - Math.sin(k * x) ** 2) / (x * x), at: 0, val: 1 - k * k, h: 1e-3

});
famH('HL7', 'fl', r => {
  if (r() < .5) {
    const a = pick(r, [2, 3, 5, 7, 10]);
    return {
      task: D(R`\lim_{n\to\infty}n^2\left(\sqrt[n]{${a}}-\sqrt[n+1]{${a}}\right)`), ans: R`\ln ${a}`,
      sol: R`<p>Vytkneme ${I(R`\sqrt[n+1]{${a}}`)} a použijeme ${I(R`\frac1n-\frac1{n+1}=\frac{1}{n(n+1)}`)}:</p>
${D(R`\sqrt[n]{${a}}-\sqrt[n+1]{${a}}=\sqrt[n+1]{${a}}\left(${a}^{\frac{1}{n(n+1)}}-1\right)=\sqrt[n+1]{${a}}\left(e^{t_n}-1\right),\qquad t_n=\frac{\ln ${a}}{n(n+1)}`)}
${D(R`n^2\left(\sqrt[n]{${a}}-\sqrt[n+1]{${a}}\right)=\sqrt[n+1]{${a}}\cdot\frac{n^2}{n(n+1)}\cdot\ln ${a}\cdot\frac{e^{t_n}-1}{t_n}`)}
<p><b>Heineho věta:</b> ${I(R`\lim_{t\to0}\frac{e^t-1}{t}=1`)} a ${I(R`t_n\to0`)}, ${I(R`t_n\neq0`)}, takže ${I(R`\frac{e^{t_n}-1}{t_n}\to1`)}. Dále ${I(R`\sqrt[n+1]{${a}}\to1`)} a ${I(R`\frac{n}{n+1}\to1`)}. Podle AL je limita ${I(R`\ln ${a}`)}.</p>`,
      f0: x => x * x * (Math.pow(a, 1 / x) - Math.pow(a, 1 / (x + 1))), at: Infinity, val: Math.log(a), big: 1e4
    };
  }
  const [a, b] = pick(r, [[2, 8], [4, 9], [2, 3], [3, 5], [2, 5], [3, 12], [2, 18]]), sq = Math.sqrt(a * b);

  return {
    task: D(R`\lim_{n\to\infty}\left(\frac{\sqrt[n]{${a}}+\sqrt[n]{${b}}}{2}\right)^{n}`), ans,

${D(R`(1+w_n)^n=\exp\left(\frac{\ln(1+w_n)}{w_n}\cdot n\,w_n\right)`)}

${D(R`n\,w_n\to\frac{\ln ${a}+\ln ${b}}{2}=\ln\sqrt{${a * b}}`)}
<p>Ze spojitosti exponenciály je limita ${I(R`e^{\ln\sqrt{${a * b}}}=${ans}`)}.</p>`,
    f0: x => Math.pow((Math.pow(a, 1 / x) + Math.pow(b, 1 / x)) / 2, x), at: Infinity, val: sq, big: 1e5

famH('HL8', 'fl', r => {

    ansHtml: `a = ${2 * k}, limita je ${frT(-k * k, 2)}`,
    sol: R`<p>Rozšíříme součtem ${I(R`\sqrt{1+ax}+(1+${kx})`)}:</p>

<p>Tedy ${I(R`a=${2 * k}`)} a limita je ${I(fr(-k * k, 2))}.</p>`,
    ok: () => { const g = (A, x) => (Math.sqrt(1 + A * x) - 1 - k * x) / (x * x); return near(g(2 * k, 1e-4), -k * k / 2, 2e-3) && Math.abs(g(2 * k + 1, 1e-4)) > 1e3; }

  return {
    task: R`<p>Určete ${I(R`a\in\mathbb R`)} tak, aby byla následující limita vlastní, a spočtěte ji:</p>${D(R`\lim_{x\to0}\frac{\sqrt[3]{1+ax}-1-${kx}}{x^2}`)}`,
    ansHtml: `a = ${3 * k}, limita je ${frT(-k * k, 1)}`,
    sol: R`<p>Označíme ${I(R`C=\sqrt[3]{1+ax}`)}, ${I(R`B=1+${kx}`)}; obě jdou k 1. Vzorec ${I(R`C-B=\frac{C^3-B^3}{C^2+CB+B^2}`)}:</p>
${D(R`\frac{C-B}{x^2}=\frac{(1+ax)-(1+${kx})^3}{x^2(C^2+CB+B^2)}=\frac{(a-${3 * k})x-${3 * k * k}x^2-${k ** 3 === 1 ? '' : k ** 3}x^3}{x^2(C^2+CB+B^2)}`)}
<p><b>Když ${I(R`a\neq ${3 * k}`)}:</b> zbude ${I(R`\frac{a-${3 * k}}{x}`)}, které jde zprava a zleva k nekonečnům opačných znamének. Vlastní limita neexistuje.</p>
<p><b>Když ${I(R`a=${3 * k}`)}:</b> ${I(R`\frac{-${3 * k * k}-${k ** 3 === 1 ? '' : k ** 3}x}{C^2+CB+B^2}\to\frac{-${3 * k * k}}{1+1+1}=${-k * k}`)}.</p>
<p>Tedy ${I(R`a=${3 * k}`)} a limita je ${I(-k * k)}.</p>`,

famH('HL9', 'fl', r => {

<p>${I(R`\left|\sin\frac1x\right|\le1`)} je omezená a ${I(R`x\to0`)}, takže ${I(R`x\sin\frac1x\to0`)} (omezená krát nulová). Druhý činitel jde k ${I(R`\frac1{${k}}`)}. Podle AL je limita ${I(R`0\cdot\frac1{${k}}=0`)}.</p>`,

<p>${I(R`x_n=\frac{${k}}{2\pi n}`)}: ${I(R`\cos\frac{${k}}{x_n}=\cos(2\pi n)=1`)}, tedy ${I(R`f(x_n)=\frac{\sin x_n}{x_n}\to1`)} (Heine pro ${I(R`\frac{\sin x}{x}\to1`)}).</p>

/* --- E: zkouškové limity posloupností --- */
fam('E4', 'zk', r => {
  const a = ri(r, 1, 4), b = ri(r, 1, 5), c = ri(r, 1, 3);
  return {
    task: D(R`\lim_{n\to\infty}\left(1+\frac{${a}}{n}+\frac{${b}}{n^2}\right)^{${mn(c)}}`), ans: R`e^{${a * c}}`,
    sol: R`<p>Základ jde k 1 a exponent k ${I(R`+\infty`)}: typ ${I(R`1^\infty`)}. Aritmetika limit tu nic neříká, ${I(R`1^\infty`)} <b>není</b> 1. Označíme ${I(R`u_n=\frac{${a}}{n}+\frac{${b}}{n^2}`)}; platí ${I(R`u_n\to0`)} a ${I(R`u_n>0`)}.</p>
${D(R`\left(1+u_n\right)^{${mn(c)}}=\exp\big(${mn(c)}\ln(1+u_n)\big)=\exp\Big(${c === 1 ? '' : c}\,n\,u_n\cdot\frac{\ln(1+u_n)}{u_n}\Big)`)}
<p>${I(R`n\,u_n=${a}+\frac{${b}}{n}\to ${a}`)} a ${I(R`\frac{\ln(1+u_n)}{u_n}\to1`)} (Heineho věta pro známou limitu ${I(R`\frac{\ln(1+y)}{y}\to1`)} v nule, protože ${I(R`u_n\to0`)}, ${I(R`u_n\neq0`)}). Exponent jde podle AL k ${I(a * c)} a ze spojitosti exponenciály je limita ${I(R`e^{${a * c}}`)}.</p>`,
    f: n => Math.exp(c * n * Math.log1p(a / n + b / (n * n))), val: Math.exp(a * c)
  };
});
fam('E5', 'zk', r => {
  const a = ri(r, 1, 6), q = pick(r, [2, 3, 4]), p = ri(r, 1, q - 1), k = ri(r, 1, 3);
  return {
    task: D(R`\lim_{n\to\infty}\left(\sqrt{n^2+${mn(a)}+1}-n\right)\cdot\frac{${p}^n+${q}^{n+1}}{${q}^n+${np(k)}}`), ans: fr(a * q, 2),
    sol: R`<p>Dva činitele spočítáme zvlášť a spojíme podle AL.</p>
<p><b>První činitel</b> je typ ${I(R`\infty-\infty`)}. Rozšíříme součtem a vytkneme ${I('n')}:</p>
${D(R`\sqrt{n^2+${mn(a)}+1}-n=\frac{${mn(a)}+1}{\sqrt{n^2+${mn(a)}+1}+n}=\frac{${a}+\frac1n}{\sqrt{1+\frac{${a}}{n}+\frac1{n^2}}+1}\to\frac{${a}}{2}`)}
<p><b>Druhý činitel.</b> Vydělíme čitatel i jmenovatel ${I(`${q}^n`)}:</p>
${D(R`\frac{\left(\frac{${p}}{${q}}\right)^n+${q}}{1+\frac{${np(k)}}{${q}^n}}\to\frac{0+${q}}{1+0}=${q}`)}
<p>${I(R`\left(\frac{${p}}{${q}}\right)^n\to0`)} (geometrická posloupnost s kvocientem v ${I('(0,1)')}) a ${I(R`\frac{${np(k)}}{${q}^n}\to0`)} (růstová škála, nebo podílové kritérium: ${I(R`\left(\frac{n+1}{n}\right)^{${k}}\cdot\frac1{${q}}\to\frac1{${q}}\lt1`)}).</p>
<p>Podle AL je limita ${I(R`\frac{${a}}{2}\cdot ${q}=${fr(a * q, 2)}`)}.</p>`,
    f: n => (Math.sqrt(n * n + a * n + 1) - n) * ((p / q) ** n + q) / (1 + n ** k * q ** -n), val: a * q / 2
  };
});
fam('E6', 'zk', r => {
  const a = pick(r, [2, 3, 5, 7, 10]), k = ri(r, 1, 6);
  return {
    task: D(R`\lim_{n\to\infty}\left(n+${k}\right)\left(\sqrt[n]{${a}}-1\right)`), ans: R`\ln ${a}`,
    sol: R`<p>Typ ${I(R`\infty\cdot0`)}. Přepíšeme ${I(R`\sqrt[n]{${a}}=${a}^{1/n}=e^{\frac{\ln ${a}}{n}}`)} a označíme ${I(R`y_n=\frac{\ln ${a}}{n}`)}; platí ${I(R`y_n\to0`)}, ${I(R`y_n\neq0`)}.</p>
${D(R`\left(n+${k}\right)\left(e^{y_n}-1\right)=\frac{n+${k}}{n}\cdot\ln ${a}\cdot\frac{e^{y_n}-1}{y_n}`)}
<p>${I(R`\frac{n+${k}}{n}\to1`)} a ${I(R`\frac{e^{y_n}-1}{y_n}\to1`)} (Heineho věta pro známou limitu ${I(R`\frac{e^y-1}{y}\to1`)} v nule). Podle AL je limita ${I(R`\ln ${a}`)}.</p>`,
    f: n => (n + k) * (a ** (1 / n) - 1), val: Math.log(a)
  };
});
fam('E7', 'zk', r => {
  const a = ri(r, 2, 5), b = ri(r, 1, a - 1), k = ri(r, 1, 3), m = ri(r, 1, 3);
  return {
    task: D(R`\lim_{n\to\infty}\frac{n+${m}}{n}\,\sqrt[n]{${a}^n+${np(k)}\cdot ${b}^n}`), ans: '' + a,
    sol: R`<p>Odmocninu odhadneme a použijeme <b>dva policajty</b>. Protože ${I(R`${b}\lt ${a}`)}, je ${I(R`${b}^n\le ${a}^n`)}:</p>
${D(R`${a}^n\le ${a}^n+${np(k)}\cdot ${b}^n\le ${a}^n\big(1+${np(k)}\big)\ \Longrightarrow\ ${a}\le\sqrt[n]{${a}^n+${np(k)}\cdot ${b}^n}\le ${a}\sqrt[n]{1+${np(k)}}`)}
<p>A ${I(R`1\le\sqrt[n]{1+${np(k)}}\le\sqrt[n]{2${np(k)}}=\sqrt[n]2\,\big(\sqrt[n]n\big)^{${k}}\to1\cdot1=1`)} (známé limity ${I(R`\sqrt[n]2\to1`)}, ${I(R`\sqrt[n]n\to1`)}). Podle dvou policajtů jde odmocnina k ${I(a)}.</p>
<p>${I(R`\frac{n+${m}}{n}\to1`)}, podle AL je limita ${I(a)}.</p>`,
    f: n => (n + m) / n * a * Math.exp(Math.log1p(n ** k * (b / a) ** n) / n), val: a
  };
});

/* --- X: zkouškové limity funkcí (2. příklad, 15 b.) --- */
const ex1 = (k, v = 'x') => k === 1 ? v : `${k}${v}`;
fam('X1', 'zfl', r => {
  const a = ri(r, 1, 5); let b = ri(r, 1, 5); if (b === a) b = a === 5 ? 1 : a + 1;
  const c = ri(r, 1, 4), A = ex1(a), B = ex1(b), C = ex1(c);
  return {
    task: D(R`\lim_{x\to0}\frac{e^{${A}}-e^{${B}}}{\sin(${C})}`), ans: fr(a - b, c),
    sol: R`<p>Typ ${I(R`\frac00`)}. V čitateli přičteme a odečteme 1, abychom dostali dvě známé limity:</p>
${D(R`\frac{e^{${A}}-e^{${B}}}{\sin(${C})}=\left(${a === 1 ? '' : a + R`\cdot`}\frac{e^{${A}}-1}{${A}}-${b === 1 ? '' : b + R`\cdot`}\frac{e^{${B}}-1}{${B}}\right)\cdot\frac{${C}}{\sin(${C})}\cdot\frac1{${c}}`)}
<p>Každý zlomek jde k 1: ${I(R`\frac{e^y-1}{y}\to1`)} a ${I(R`\frac{\sin y}{y}\to1`)}, dosazujeme ${I(R`y=${A}`)}, ${I(R`y=${B}`)}, ${I(R`y=${C}`)}. Vnitřní funkce jdou k 0 a na ${I(R`P(0,\delta)`)} jsou nenulové (${VLSF}, podmínka P). Podle AL:</p>
${D(R`\left(${a}\cdot1-${b}\cdot1\right)\cdot1\cdot\frac1{${c}}=${fr(a - b, c)}`)}`,
    f0: x => (Math.exp(a * x) - Math.exp(b * x)) / Math.sin(c * x), at: 0, val: (a - b) / c, h: 1e-5
  };
});
fam('X2', 'zfl', r => {
  const a = ri(r, 1, 4); let b = ri(r, 1, 4); if (b === a) b = a === 4 ? 1 : a + 1;
  const A = ex1(a), B = ex1(b);
  return {
    task: D(R`\lim_{x\to0}\frac{\ln\big(\cos(${A})\big)}{\ln\big(\cos(${B})\big)}`), ans: fr(a * a, b * b),
    sol: R`<p>Typ ${I(R`\frac00`)}. Každý logaritmus zapíšeme jako ${I(R`\ln(1+w)`)} s ${I(R`w=\cos(\cdot)-1\to0`)}. Na ${I(R`P(0,\delta)`)} je ${I(R`\cos(${A})\neq1`)}, tedy ${I(R`w\neq0`)}, a platí podmínka P:</p>
${D(R`\frac{\ln(\cos ${A})}{x^2}=\frac{\ln\big(1+(\cos ${A}-1)\big)}{\cos ${A}-1}\cdot\frac{\cos ${A}-1}{(${A})^2}\cdot ${a * a}\ \longrightarrow\ 1\cdot\left(-\frac12\right)\cdot ${a * a}`)}
<p>Stejně ${I(R`\frac{\ln(\cos ${B})}{x^2}\to-\frac{${b * b}}{2}`)}. Čitatel i jmenovatel vydělíme ${I('x^2')} a podle AL:</p>
${D(R`\lim_{x\to0}\frac{\ln(\cos ${A})/x^2}{\ln(\cos ${B})/x^2}=\frac{-${a * a}/2}{-${b * b}/2}=${fr(a * a, b * b)}`)}`,
    f0: x => Math.log(Math.cos(a * x)) / Math.log(Math.cos(b * x)), at: 0, val: a * a / (b * b), h: 1e-3
  };
});
fam('X3', 'zfl', r => {
  const a = ri(r, 1, 6), b = ri(r, 1, 6), A = ex1(a), B = ex1(b);

/* ---------- Zkouškové limity funkcí ve stylu Bárty (2. příklad za 15 b., podle typů z písemek 2022/23) ----------

   Zadání jsou vlastní (parametrizovaná), jen styl odpovídá skutečným písemkám. */
fam('Y1', 'zfl', r => {
  const k = ri(r, 1, 5), m = ri(r, 1, 4), M = ex1(m);
  const g = x => (1 / x + k) ** Math.sin(m * x);
  return {
    task: D(R`\lim_{x\to0^+}\left(\frac1x+${k}\right)^{\sin(${M})}`), ans: '1',
    sol: R`<p>Základ jde k ${I(R`+\infty`)}, exponent k ${I(0)}: typ ${I(R`\infty^0`)}, o kterém AL nic neříká. Přepíšeme přes exponenciálu (základ je kladný):</p>
${D(R`\left(\frac1x+${k}\right)^{\sin(${M})}=\exp\Big(\sin(${M})\,\ln\Big(\frac1x+${k}\Big)\Big)`)}
<p>Logaritmus rozdělíme: ${I(R`\ln\left(\frac1x+${k}\right)=\ln\frac{1+${ex1(k)}}{x}=-\ln x+\ln(1+${ex1(k)})`)}. Exponent je tedy</p>
${D(R`-\frac{\sin(${M})}{${M}}\cdot ${m}\cdot x\ln x\;+\;\sin(${M})\,\ln(1+${ex1(k)})`)}
<p>${I(R`\frac{\sin(${M})}{${M}}\to1`)} (${VLSF}, podmínka P). Klíčová limita ${I(R`\lim_{x\to0^+}x\ln x=0`)}: substitucí ${I(R`y=\frac1x\to+\infty`)} je ${I(R`x\ln x=-\frac{\ln y}{y}\to0`)}, protože logaritmus roste pomaleji než ${I('y')} (věta o limitě složené funkce, ${I(R`\frac1x\neq+\infty`)}). Druhý sčítanec je ${I(R`0\cdot0`)}. Exponent jde k ${I(0)}.</p>
<p>Ze spojitosti exponenciály (podmínka S) je limita ${I(R`e^0=1`)}.</p>
<p><b>Pozor:</b> limitu nestačí „dosadit do exponentu“. Napiš výslovně, že ${I(R`\exp`)} je spojitá a používáš větu o limitě složené funkce. U zkoušky se za chybějící zdůvodnění strhávají body.</p>`,
    ok: () => near(g(1e-7), 1, 1e-3) && near(g(1e-9), 1, 1e-3)
  };
});
fam('Y2', 'zfl', r => {
  const a = ri(r, 1, 3), p = ri(r, 1, 3), P = p === 1 ? '' : p;
  const t = Math.tan(a), val = Math.exp(-p * t);
  return {
    task: D(R`\lim_{x\to+\infty}\left(\frac{\cos\left(${a}+\frac{${p}}{x}\right)}{\cos\left(${a}+\frac{1}{x^2}\right)}\right)^{x}`), ans: R`e^{-${P}\,\mathrm{tg}\,${a}}`,
    sol: R`<p>Podíl jde k ${I(R`\frac{\cos ${a}}{\cos ${a}}=1`)} (${I(R`\cos ${a}\neq0`)}), exponent k ${I(R`+\infty`)}: typ ${I(R`1^\infty`)}. Zapíšeme základ jako ${I('1+w')}:</p>
${D(R`w=\frac{\cos\left(${a}+\frac{${p}}{x}\right)-\cos\left(${a}+\frac{1}{x^2}\right)}{\cos\left(${a}+\frac1{x^2}\right)}\to0,\qquad \left(1+w\right)^{x}=\exp\Big(x\,w\cdot\frac{\ln(1+w)}{w}\Big)`)}
<p>${I(R`\frac{\ln(1+w)}{w}\to1`)} (${VLSF}, ${I(R`w\neq0`)} pro velká ${I('x')}). Zbývá ${I(R`x\,w`)}. Rozdíl kosinů převedeme vzorcem ${I(R`\cos u-\cos v=-2\sin\frac{u+v}{2}\sin\frac{u-v}{2}`)}:</p>
${D(R`x\Big(\cos\Big(${a}+\tfrac{${p}}{x}\Big)-\cos\Big(${a}+\tfrac1{x^2}\Big)\Big)=-2\sin\Big(${a}+\tfrac{${p}}{2x}+\tfrac1{2x^2}\Big)\cdot\frac{\sin y}{y}\cdot x\,y,\qquad y=\frac{${p}}{2x}-\frac{1}{2x^2}\to0`)}
<p>${I(R`x\,y=\frac{${p}}2-\frac1{2x}\to\frac{${p}}{2}`)}, ${I(R`\frac{\sin y}{y}\to1`)} (podmínka P) a ${I(R`\sin(\ldots)\to\sin ${a}`)} (spojitost). Čitatel ${I(R`x\,w`)} jde k ${I(R`-2\sin ${a}\cdot\frac{${p}}{2}=-${P}\sin ${a}`)}, jmenovatel k ${I(R`\cos ${a}`)}, tedy ${I(R`x\,w\to-${P}\,\mathrm{tg}\,${a}`)}.</p>
<p>Exponent jde k ${I(R`-${P}\,\mathrm{tg}\,${a}`)} a ze spojitosti exponenciály je limita ${I(R`e^{-${P}\,\mathrm{tg}\,${a}}`)}.</p>`,

fam('Y3', 'zfl', r => {
  const b = pick(r, [2, 3, 5]), m = ri(r, 1, 3), k = ri(r, 1, 2), M = m === 1 ? 'x' : `${m}x`, xk = k === 1 ? 'x' : 'x^2';
  const f = x => (Math.log(x) + x * Math.log(b) + Math.log1p(x ** (k - 1) * Math.sin(Math.sqrt(x)) * Math.exp(-x * Math.log(b)))) * Math.tan(m * x / (x * x + 1));
  return {
    task: D(R`\lim_{x\to+\infty}\ln\left(x\cdot ${b}^x+${xk}\sin\sqrt{x}\right)\cdot\mathrm{tg}\,\frac{${M}}{x^2+1}`), ans: R`${m === 1 ? '' : m}\ln ${b}`,
    sol: R`<p>Typ ${I(R`\infty\cdot0`)}. Každý činitel upravíme zvlášť.</p>
<p><b>Logaritmus.</b> Vytkneme nejrychleji rostoucí člen ${I(R`x\cdot ${b}^x`)}:</p>
${D(R`\ln\left(x\cdot ${b}^x+${xk}\sin\sqrt x\right)=x\ln ${b}+\ln x+\ln\Big(1+\frac{${k === 1 ? '' : 'x'}\sin\sqrt x}{${b}^x}\Big)`)}

<p><b>Tangens.</b> ${I(R`u=\frac{${M}}{x^2+1}\to0`)}, ${I(R`u\neq0`)}, takže ${I(R`\mathrm{tg}\,u=\frac{\mathrm{tg}\,u}{u}\cdot u`)} s ${I(R`\frac{\mathrm{tg}\,u}{u}\to1`)} (${VLSF}, podmínka P).</p>
<p><b>Dohromady:</b></p>
${D(R`\Big(x\ln ${b}+\ln x+o(1)\Big)\cdot\frac{${M}}{x^2+1}\cdot\frac{\mathrm{tg}\,u}{u}=\Big(\ln ${b}+\frac{\ln x}{x}+\frac{o(1)}x\Big)\cdot\frac{${m}x^2}{x^2+1}\cdot\frac{\mathrm{tg}\,u}{u}\ \longrightarrow\ \ln ${b}\cdot ${m}\cdot1`)}
<p>(${I(R`\frac{\ln x}{x}\to0`)}, ${I(R`\frac{x^2}{x^2+1}\to1`)}, symbol ${I('o(1)')} značí výraz jdoucí k nule.) Limita je ${I(R`${m === 1 ? '' : m}\ln ${b}`)}.</p>`,

fam('Y4', 'zfl', r => {
  const c = ri(r, 1, 3), k = ri(r, 1, 3), K = k === 1 ? '' : k, num = 4 * k * c * c;
  const A = c === 1 ? R`\frac{\pi}{2x}` : R`\frac{${c}\pi}{2x}`, xc = R`x-${c}`;
  const f = x => Math.tan(Math.PI * c / (2 * x)) - Math.tan(Math.PI * c / (2 * x) + k * (x - c) ** 2);
  return {
    task: D(R`\lim_{x\to ${c}^+}\left(\mathrm{tg}\,${A}-\mathrm{tg}\Big(${A}+${K}(${xc})^2\Big)\right)`), ans: R`-\frac{${num}}{\pi^2}`,
    sol: R`<p>Pro ${I(R`x\to ${c}`)} jdou oba argumenty k ${I(R`\frac\pi2`)} a oba tangenty k nekonečnu: typ ${I(R`\infty-\infty`)}. Použijeme ${I(R`\mathrm{tg}\,u-\mathrm{tg}\,v=\frac{\sin(u-v)}{\cos u\cos v}`)}:</p>
${D(R`\mathrm{tg}\,${A}-\mathrm{tg}\Big(${A}+${K}(${xc})^2\Big)=\frac{\sin\big(-${K}(${xc})^2\big)}{\cos ${A}\;\cos\big(${A}+${K}(${xc})^2\big)}`)}
<p>Kosiny převedeme na siny: ${I(R`\cos u=\sin\left(\frac\pi2-u\right)`)}, a ${I(R`\frac\pi2-${A}=\frac{\pi(${xc})}{2x}`)}. Označíme ${I(R`t=x-${c}\to0^+`)}:</p>
${D(R`\frac{-\frac{\sin(${K}t^2)}{${K}t^2}\cdot ${K}t^2}{\frac{\sin\frac{\pi t}{2x}}{\frac{\pi t}{2x}}\cdot\frac{\pi t}{2x}\;\cdot\;\frac{\sin\left(\frac{\pi t}{2x}-${K}t^2\right)}{\frac{\pi t}{2x}-${K}t^2}\cdot\left(\frac{\pi t}{2x}-${K}t^2\right)}`)}
<p>Všechny zlomky typu ${I(R`\frac{\sin y}{y}`)} jdou k 1 (${VLSF}, vnitřní funkce jsou na ${I(R`P^+(${c},\delta)`)} nenulové). Zbude</p>
${D(R`\frac{-${K}t^2}{\frac{\pi t}{2x}\left(\frac{\pi t}{2x}-${K}t^2\right)}=\frac{-${K}}{\frac{\pi}{2x}\left(\frac{\pi}{2x}-${K}t\right)}\ \longrightarrow\ \frac{-${K}}{\frac{\pi}{${2 * c}}\cdot\frac{\pi}{${2 * c}}}=-\frac{${num}}{\pi^2}`)}`,
    f0: f, at: c, val: -num / (Math.PI ** 2), h: 1e-4
  };
});
fam('Y5', 'zfl', r => {
  const a = ri(r, 1, 5), b = ri(r, 1, 4), c = ri(r, 1, 4), A = ex1(a), B = ex1(b), C = ex1(c);
  return {
    task: D(R`\lim_{x\to0}\frac{e^{${A}}-\cos(${B})}{\ln(1+${C})}`), ans: fr(a, c),
    sol: R`<p>Typ ${I(R`\frac00`)}. V čitateli přičteme a odečteme 1 a celý zlomek vydělíme ${I('x')} nahoře i dole:</p>
${D(R`\frac{e^{${A}}-\cos(${B})}{\ln(1+${C})}=\frac{${a === 1 ? '' : a + R`\cdot`}\frac{e^{${A}}-1}{${A}}+${b * b}\,x\cdot\frac{1-\cos(${B})}{(${B})^2}}{${c === 1 ? '' : c + R`\cdot`}\frac{\ln(1+${C})}{${C}}}`)}
<p>Známé limity: ${I(R`\frac{e^y-1}{y}\to1`)}, ${I(R`\frac{1-\cos y}{y^2}\to\frac12`)}, ${I(R`\frac{\ln(1+y)}{y}\to1`)} (${VLSF}, vnitřní funkce jsou na ${I(R`P(0,\delta)`)} nenulové). Druhý sčítanec v čitateli je ${I(R`${b * b}x\cdot\frac12\to0`)}. Podle AL:</p>
${D(R`\frac{${a}\cdot1+0}{${c}\cdot1}=${fr(a, c)}`)}
<p>Kosinus tu přispívá nulou, protože ${I(R`1-\cos`)} je „malé řádu ${I('x^2')}“, kdežto ${I(R`e^{${A}}-1`)} je řádu ${I('x')}. Bez vydělení ${I('x')} se to ale ukázat nedá.</p>`,
    f0: x => (Math.exp(a * x) - Math.cos(b * x)) / Math.log1p(c * x), at: 0, val: a / c, h: 1e-5
  };
});
fam('Y6', 'zfl', r => {
  const k = ri(r, 1, 4), m = ri(r, 1, 3), K = ex1(k), Mx = m === 1 ? 'x' : `${m}x`;
  return {
    task: D(R`\lim_{x\to+\infty}\left(\frac{2}{\pi}\,\mathrm{arctg}(${K})\right)^{${Mx}}`), ans: R`e^{-\frac{${2 * m / gcd(2 * m, k)}}{${k / gcd(2 * m, k) === 1 ? '' : k / gcd(2 * m, k)}\pi}}`,
    sol: R`<p>${I(R`\mathrm{arctg}(${K})\to\frac\pi2`)}, základ jde k 1 a exponent k ${I(R`+\infty`)}: typ ${I(R`1^\infty`)}. Pro ${I(R`y>0`)} platí ${I(R`\mathrm{arctg}\,y=\frac\pi2-\mathrm{arctg}\,\frac1y`)}, takže</p>

${D(R`(1+w)^{${Mx}}=\exp\Big(${Mx}\,w\cdot\frac{\ln(1+w)}{w}\Big),\qquad ${Mx}\,w=-\frac{${2 * m}}{${k === 1 ? '' : k}\pi}\cdot\frac{\mathrm{arctg}\,z}{z},\quad z=\frac1{${K}}\to0`)}
<p>${I(R`\frac{\mathrm{arctg}\,z}{z}\to1`)} (známá limita, podmínka P) a ${I(R`\frac{\ln(1+w)}{w}\to1`)}. Exponent jde k ${I(R`-\frac{${2 * m}}{${k === 1 ? '' : k}\pi}`)}, ze spojitosti exponenciály je limita ${I(R`e^{-\frac{${2 * m}}{${k === 1 ? '' : k}\pi}}`)}.</p>
<p>Známou limitu ${I(R`\frac{\mathrm{arctg}\,z}{z}\to1`)} dostaneš substitucí ${I(R`z=\mathrm{tg}\,s`)} z ${I(R`\frac{\mathrm{tg}\,s}{s}\to1`)}.</p>`,

<p class="lead">Látka 10.–13. přednášky a supersemináře 5.–7. týdne: definice limity, spojitost, jednostranné a nevlastní limity, aritmetika limit funkcí, dělení nulou, limita složené funkce, Heineho věta, limita monotónní funkce, známé limity a limity typu ${I(R`f(x)^{g(x)}`)}. Na tohle téma je <b>3. písemka</b> (10. týden) a druhý příklad zkoušky (15 bodů). Spojité funkce na intervalu (mezihodnoty, extrémy, inverzní funkce) a logaritmus najdeš v sekci Spojitost a derivace.</p>
<div class="thm"><span class="lbl">Okolí a prstencové okolí</span>
<p>Pro ${I(R`a\in\mathbb R`)} a ${I(R`\delta>0`)}: ${I(R`U(a,\delta)=(a-\delta,a+\delta)`)} a ${I(R`P(a,\delta)=U(a,\delta)\setminus\{a\}`)}. Pro nekonečno: ${I(R`U(+\infty,\delta)=P(+\infty,\delta)=(\tfrac1\delta,+\infty)`)} a ${I(R`U(-\infty,\delta)=(-\infty,-\tfrac1\delta)`)}.</p>
<p>Jednostranná prstencová okolí: ${I(R`P^+(a,\delta)=(a,a+\delta)`)}, ${I(R`P^-(a,\delta)=(a-\delta,a)`)}.</p></div>
<div class="thm"><span class="lbl">Definice limity funkce</span>
<p>Nechť ${I(R`a,A\in\mathbb R^*`)} a ${I('f')} je definovaná na nějakém ${I(R`P(a,\delta_0)`)}. Pak</p>
${D(R`\lim_{x\to a}f(x)=A\iff\forall\varepsilon>0\ \exists\delta>0\ \forall x\in P(a,\delta):\ f(x)\in U(A,\varepsilon)`)}
<p>Pro vlastní ${I('a')} i ${I('A')} to znamená: ${I(R`0<|x-a|<\delta\Rightarrow|f(x)-A|<\varepsilon`)}. Limita je nejvýš jedna.</p>
<p>Důležité: v definici je <b>prstencové</b> okolí, takže limita v bodě ${I('a')} vůbec nezávisí na hodnotě ${I(R`f(a)`)} (funkce tam ani nemusí být definovaná).</p></div>
<div class="thm"><span class="lbl">Spojitost v bodě</span>
<p>${I('f')} je spojitá v ${I(R`a\in\mathbb R`)}, jestliže ${I(R`\lim_{x\to a}f(x)=f(a)`)}, tj. ${I(R`\forall\varepsilon>0\ \exists\delta>0\ \forall x\in U(a,\delta):\ |f(x)-f(a)|<\varepsilon`)}. Spojitost zprava / zleva: totéž s jednostrannou limitou.</p>
<p>Polynomy, ${I(R`\sqrt x`)} (pro ${I(R`x>0`)}), racionální funkce v bodech, kde je jmenovatel nenulový, jsou spojité. U spojité funkce se limita počítá <b>dosazením</b>.</p></div>
<div class="thm"><span class="lbl">Jednostranné limity</span>
<p>${I(R`\lim_{x\to a^+}f(x)=A`)}: stejná definice, jen s ${I(R`P^+(a,\delta)`)} místo ${I(R`P(a,\delta)`)}. Analogicky zleva.</p>
${D(R`\lim_{x\to a}f(x)=A\iff\lim_{x\to a^+}f(x)=A\ \text{ a }\ \lim_{x\to a^-}f(x)=A`)}
<p>Když se jednostranné limity liší (nebo jedna neexistuje), limita v bodě ${I('a')} <b>neexistuje</b>. Příklad: ${I(R`\mathrm{sgn}\,x`)} má v 0 zprava limitu 1, zleva −1.</p></div>
<div class="thm"><span class="lbl">Nevlastní limity</span>
<p>${I(R`\lim_{x\to a}f(x)=+\infty\iff\forall K\in\mathbb R\ \exists\delta>0\ \forall x\in P(a,\delta):\ f(x)>K`)}. Limita v nevlastním bodě: ${I(R`\lim_{x\to+\infty}f(x)=A`)}, když ${I(R`f(x)\in U(A,\varepsilon)`)} pro všechna ${I(R`x>\tfrac1\delta`)}.</p>
<p>Příklady: ${I(R`\lim_{x\to0^+}\frac1x=+\infty`)}, ${I(R`\lim_{x\to0^-}\frac1x=-\infty`)}, takže ${I(R`\lim_{x\to0}\frac1x`)} neexistuje. Naproti tomu ${I(R`\lim_{x\to0}\frac1{x^2}=+\infty`)} (obě strany dávají ${I(R`+\infty`)}).</p></div>
<h3>Věty o počítání limit (11.–12. přednáška)</h3>
<div class="thm"><span class="lbl">Aritmetika limit funkcí</span>
<p>Nechť ${I(R`\lim_{x\to a}f(x)=A`)} a ${I(R`\lim_{x\to a}g(x)=B`)}, kde ${I(R`a,A,B\in\mathbb R^*`)}. Pak</p>
${D(R`\lim_{x\to a}(f\pm g)=A\pm B,\qquad \lim_{x\to a}fg=AB,\qquad \lim_{x\to a}\frac fg=\frac AB,`)}
<p>pokud je výraz na pravé straně <b>definovaný</b>. Nedefinované jsou ${I(R`\infty-\infty`)}, ${I(R`0\cdot(\pm\infty)`)}, ${I(R`\frac{\pm\infty}{\pm\infty}`)} a ${I(R`\frac{A}{0}`)}. V těchto případech věta neříká nic a výraz je potřeba nejdřív upravit.</p>
<p>Je to stejná věta jako u posloupností a dokazuje se podobně. Platí i jednostranně a pro ${I(R`x\to\pm\infty`)}.</p></div>
<div class="thm"><span class="lbl">Limita a uspořádání, dva strážníci</span>
<p>Jako u posloupností: je-li ${I(R`f\le g\le h`)} na nějakém ${I(R`P(a,\delta)`)} a ${I(R`\lim f=\lim h=A`)}, pak ${I(R`\lim g=A`)}. Důsledek: <b>omezená krát nulová</b> funkce má limitu 0, např. ${I(R`\lim_{x\to0}x\sin\frac1x=0`)}.</p></div>
<div class="thm"><span class="lbl">Dělení nulou</span>
<p>Nechť ${I(R`\lim_{x\to a}f(x)=A>0`)} (může být i ${I(R`+\infty`)}), ${I(R`\lim_{x\to a}g(x)=0`)} a ${I(R`g>0`)} na nějakém ${I(R`P(a,\delta)`)} (říkáme, že ${I('g')} jde ke <b>kladné nule</b>, ${I(R`g\to0^+`)}). Pak</p>
${D(R`\lim_{x\to a}\frac{f(x)}{g(x)}=+\infty.`)}
<p>Ostatní znaménka se dopočítají: ${I(R`\frac{A}{0^-}=-\infty`)} pro ${I(R`A>0`)}, ${I(R`\frac{A}{0^+}=-\infty`)} pro ${I(R`A\lt0`)} atd. Mění-li ${I('g')} znaménko na obou stranách bodu ${I('a')}, je potřeba počítat jednostranné limity zvlášť.</p></div>
<div class="thm"><span class="lbl">Limita složené funkce</span>
<p>Nechť ${I(R`\lim_{x\to a}g(x)=A`)} a ${I(R`\lim_{y\to A}f(y)=B`)}. Je-li splněna aspoň jedna z podmínek</p>
<ul class="plain"><li><b>(P)</b> ${I(R`g(x)\neq A`)} pro všechna ${I('x')} z nějakého ${I(R`P(a,\eta)`)},</li><li><b>(S)</b> ${I('f')} je spojitá v bodě ${I('A')},</li></ul>
<p>pak ${I(R`\lim_{x\to a}f(g(x))=B`)}.</p>
<p>Proč podmínka: limita ${I('f')} v bodě ${I('A')} nevidí hodnotu ${I(R`f(A)`)}. Kdyby vnitřní funkce bodu ${I('A')} pořád nabývala a ${I('f')} tam měla „špatnou“ hodnotu, vyšlo by něco jiného. Příklad: ${I(R`g(x)=0`)} pro všechna ${I('x')}, ${I(R`f(y)=0`)} pro ${I(R`y\neq0`)} a ${I(R`f(0)=1`)}. Pak ${I(R`\lim_{y\to0}f(y)=0`)}, ale ${I(R`f(g(x))=1`)} pořád.</p></div>
<div class="thm"><span class="lbl">Známé limity (superseminář)</span>
${D(R`\lim_{x\to0}\frac{\sin x}{x}=1,\quad \lim_{x\to0}\frac{1-\cos x}{x^2}=\frac12,\quad \lim_{x\to0}\frac{\mathrm{tg}\,x}{x}=1,\quad \lim_{x\to0}\frac{e^x-1}{x}=1,\quad \lim_{x\to0}\frac{\ln(1+x)}{x}=1`)}
<p>Zatím je bereme jako známé, odvodí se u elementárních funkcí (14.–15. přednáška). Spolu s limitou složené funkce z nich dostaneš třeba ${I(R`\lim_{x\to0}\frac{\sin 3x}{3x}=1`)}: vnitřní funkce ${I(R`3x\to0`)} a je nenulová pro ${I(R`x\neq0`)}, tedy platí (P).</p></div>
<h3>Heineho věta a monotónní funkce (13. přednáška)</h3>
<div class="thm"><span class="lbl">Heineho věta</span>
<p>Nechť ${I(R`c,A\in\mathbb R^*`)} a ${I('f')} je definovaná na nějakém ${I(R`P(c,\delta)`)}. Pak</p>
${D(R`\lim_{x\to c}f(x)=A\iff\text{pro každou posloupnost } x_n\to c,\ x_n\neq c,\ x_n\in D_f:\ f(x_n)\to A.`)}
<p>Na přednášce se dokazuje směr ${I(R`\Rightarrow`)} (Věta 27). Pro spojitost platí obdoba bez podmínky ${I(R`x_n\neq c`)}: ${I('f')} je spojitá v ${I('c')}, právě když ${I(R`x_n\to c\Rightarrow f(x_n)\to f(c)`)}.</p>
<p><b>K čemu je:</b> (1) limitu posloupnosti spočítáš jako limitu funkce, např. ${I(R`n\sin\frac1n=f(\tfrac1n)`)} pro ${I(R`f(x)=\frac{\sin x}{x}`)}, a proto ${I(R`n\sin\frac1n\to1`)}. (2) Ukážeš, že limita funkce <b>neexistuje</b>: stačí dvě posloupnosti ${I(R`x_n,y_n\to c`)} (různé od ${I('c')}) s ${I(R`\lim f(x_n)\neq\lim f(y_n)`)}.</p></div>
<div class="thm"><span class="lbl">Limita monotónní funkce</span>
<p>Je-li ${I('f')} monotónní na ${I(R`(a,b)`)} (${I(R`a,b\in\mathbb R^*`)}), pak existují ${I(R`\lim_{x\to a^+}f(x)`)} a ${I(R`\lim_{x\to b^-}f(x)`)}. Pro neklesající ${I('f')} je</p>
${D(R`\lim_{x\to b^-}f(x)=\sup f\big((a,b)\big),\qquad \lim_{x\to a^+}f(x)=\inf f\big((a,b)\big).`)}
<p>Je to obdoba věty o limitě monotónní posloupnosti. Odtud třeba plyne, že rostoucí funkce má v každém vnitřním bodě obě jednostranné limity (mohou se ale lišit, funkce může „skočit“).</p></div>
<h3>Postupy (triky z posloupností)</h3>
<div class="thm"><span class="lbl">1. Limita v ±∞: vytkni nejrychlejší člen</span><ol class="steps">
<li>Jako u posloupností: v čitateli i jmenovateli vytkni nejvyšší mocninu ${I('x')}, resp. dominantní člen.</li>
<li>Zbylé zlomky typu ${I(R`\frac{c}{x^k}`)} jdou k 0.</li>
<li><b>Pozor u ${I(R`x\to-\infty`)}:</b> ${I(R`\sqrt{x^2}=|x|=-x`)}, takže ${I(R`\sqrt{x^2+1}=-x\sqrt{1+\frac1{x^2}}`)}.</li></ol></div>
<div class="thm"><span class="lbl">2. Typ 0/0 ve vlastním bodě</span><ol class="steps">
<li>Nejdřív zkus dosadit. Vyjde-li číslo a funkce je v bodě spojitá, je hotovo.</li>
<li>Vyjde-li ${I(R`\frac00`)} u racionální funkce, má čitatel i jmenovatel kořen ${I('a')}: vytkni ${I('(x-a)')} a zkrať (smíš, protože limita nezávisí na hodnotě v ${I('a')}).</li>
<li>U odmocnin rozšiř jako u posloupností: ${I(R`\sqrt u-\sqrt v=\frac{u-v}{\sqrt u+\sqrt v}`)}.</li></ol></div>
<div class="thm"><span class="lbl">3. Jmenovatel jde k nule, čitatel ne</span><ol class="steps">
<li>Spočítej limitu zprava a zleva zvlášť a urči znaménko jmenovatele na každé straně.</li>
<li>Vyjde ${I(R`\pm\infty`)} (věta o dělení nulou). Liší-li se strany znaménkem, limita neexistuje.</li>
<li>Je-li jmenovatel tvaru ${I(R`(x-a)^2`)}, je kladný z obou stran a strany počítat zvlášť nemusíš.</li></ol></div>
<div class="thm"><span class="lbl">4. Goniometrické a jiné „známé“ limity</span><ol class="steps">
<li>Najdi v příkladu výraz, který jde k 0, např. ${I(R`u=5x`)} uvnitř ${I(R`\sin(5x)`)}.</li>
<li>Rozšiř zlomek tak, aby se objevilo ${I(R`\frac{\sin u}{u}`)}, ${I(R`\frac{e^u-1}{u}`)} apod.: ${I(R`\frac{\sin 5x}{2x}=\frac{\sin 5x}{5x}\cdot\frac52`)}.</li>
<li>Ověř (P): ${I(R`u\neq0`)} na prstencovém okolí. Pak podle limity složené funkce ${I(R`\frac{\sin u}{u}\to1`)}.</li>
<li>Zbytek dopočítej podle AL. Funkce ${I(R`\mathrm{tg}`)} rozepiš jako ${I(R`\frac{\sin}{\cos}`)} a ${I(R`\cos u\to1`)} použij ze spojitosti.</li></ol></div>
<div class="thm"><span class="lbl">5. Posunutý bod: substituce</span><ol class="steps">
<li>Limitu v bodě ${I(R`a\neq0`)} převeď substitucí ${I(R`t=x-a`)} na limitu v 0 (to je limita složené funkce, ${I(R`t\neq0`)} pro ${I(R`x\neq a`)}).</li>
<li>Pak použij součtové vzorce, např. ${I(R`\sin(\pi+t)=-\sin t`)}, a známé limity.</li></ol></div>
<div class="thm"><span class="lbl">6. Limita typu f(x)<sup>g(x)</sup> (superseminář 7. týdne)</span><ol class="steps">
<li>Přepiš ${I(R`f^g=e^{g\ln f}`)} (pro ${I(R`f>0`)}). Exponenciála je spojitá, takže stačí spočítat ${I(R`L=\lim g\ln f`)}: výsledek je ${I(R`e^L`)}, s ${I(R`e^{+\infty}=+\infty`)} a ${I(R`e^{-\infty}=0`)}.</li>
<li>Typ ${I(R`1^\infty`)} (základ ${I(R`\to1`)}, exponent ${I(R`\to\pm\infty`)}): zapiš základ jako ${I('1+w')} s ${I(R`w\to0`)}, ${I(R`w\neq0`)} a rozšiř ${I(R`g\ln(1+w)=g\,w\cdot\frac{\ln(1+w)}{w}`)}. Zlomek jde k 1, zbývá spočítat ${I(R`\lim g\,w`)}.</li>
<li>Příklad: ${I(R`\left(1+\frac3x\right)^{2x}=\exp\left(6\cdot\frac{\ln(1+3/x)}{3/x}\right)\to e^6`)} pro ${I(R`x\to+\infty`)}.</li>
<li>Nejde-li o neurčitý typ (např. ${I(R`2^{+\infty}`)} nebo ${I(R`\left(\tfrac12\right)^{+\infty}`)}), výsledek je vidět hned: ${I(R`+\infty`)}, resp. ${I(0)}.</li></ol></div>
<div class="thm"><span class="lbl">7. Heineho věta v příkladech</span><ol class="steps">
<li><b>Limita posloupnosti přes funkci:</b> najdi funkci ${I('f')} a posloupnost ${I(R`x_n\to c`)}, ${I(R`x_n\neq c`)}, aby ${I(R`a_n=f(x_n)`)} (typicky ${I(R`x_n=\frac1n`)}). Spočítej ${I(R`\lim_{x\to c}f(x)=A`)}; pak ${I(R`a_n\to A`)}.</li>
<li><b>Neexistence:</b> u kmitajících funkcí (${I(R`\sin x`)} a ${I(R`\cos x`)} v ${I(R`\pm\infty`)}, ${I(R`\sin\frac1x`)} v 0) vyber dvě posloupnosti, po kterých vyjdou různé hodnoty. Pro ${I(R`\lim_{x\to+\infty}\sin x`)}: ${I(R`x_n=2\pi n`)} dává 0, ${I(R`y_n=\frac\pi2+2\pi n`)} dává 1, limita neexistuje.</li>
<li>Do řešení napiš, že ${I(R`x_n\to c`)} a ${I(R`x_n\neq c`)}: jsou to předpoklady věty.</li></ol></div>
<div class="note warn"><b>Nejčastější chyby</b><ul class="plain">
<li>Tvrdit, že limita v ${I('a')} je ${I(R`f(a)`)}, u funkce, která tam spojitá není (nebo tam není definovaná).</li>
<li>Zapomenout, že ${I(R`\frac1x`)} má v 0 dvě různé jednostranné limity, a napsat „${I(R`=\infty`)}“.</li>
<li>${I(R`\sqrt{x^2}=x`)} pro ${I(R`x\to-\infty`)} (správně ${I('-x')}).</li>
<li>Psát ${I(R`\frac{c}{0}=\infty`)} bez určení znaménka jmenovatele.</li>
<li>Použít AL na ${I(R`\infty-\infty`)} nebo ${I(R`0\cdot\infty`)} a „vypočítat“ výsledek.</li>
<li>Použít limitu složené funkce bez ověření podmínky (P) nebo (S).</li>
<li>Napsat ${I(R`\lim_{x\to\infty}\frac{\sin x}{x}=1`)}. Známá limita platí jen pro ${I(R`x\to0`)}; v nekonečnu je to omezená krát nulová, tedy 0.</li>
<li>Počítat ${I(R`1^\infty=1`)}, např. ${I(R`\left(1+\frac1x\right)^x\to1`)}. Správně je to ${I('e')}; typ ${I(R`1^\infty`)} je neurčitý.</li>
<li>„Dokázat“ existenci limity Heineho větou pomocí <b>jedné</b> posloupnosti. Jedna posloupnost stačí jen k důkazu <b>neexistence</b> (dvě různé hodnoty), ne existence.</li>
<li>U Heineho věty vybrat posloupnost, která bodu ${I('c')} nabývá (${I(R`x_n=c`)}), nebo v něm vůbec nekonverguje.</li></ul></div>` },

<p class="lead">Ve zkoušce je za to třetí příklad (10 bodů). Zatím jsou tu věty o spojitých funkcích, elementární funkce (13.–15. přednáška) a derivace: definice, vztah ke spojitosti, aritmetika a derivace složené funkce (16. přednáška), derivace inverzní a elementárních funkcí a nutná podmínka lokálního extrému (17. přednáška). Věty o střední hodnotě, monotonii a l’Hospitalovo pravidlo (18. přednáška) doplníme, až budou probrané.</p>
<h3>Spojité funkce na intervalu</h3>
<div class="thm"><span class="lbl">Nabývání mezihodnot (Bolzano, Věta 29)</span>
<p>Je-li ${I('f')} spojitá na ${I(R`\langle a,b\rangle`)} a ${I(R`f(a)\lt f(b)`)}, pak pro každé ${I(R`y\in\big(f(a),f(b)\big)`)} existuje ${I(R`\xi\in(a,b)`)} s ${I(R`f(\xi)=y`)}. (Totéž pro ${I(R`f(a)>f(b)`)}.)</p>
<p>Spojitá funkce tedy nemůže přeskočit žádnou hodnotu. Spojitost na <b>celém</b> uzavřeném intervalu je nutná: ${I(R`\mathrm{sgn}\,x`)} na ${I(R`\langle-1,1\rangle`)} hodnotu ${I(R`\frac12`)} nenabývá.</p></div>
<div class="thm"><span class="lbl">Obraz intervalu (Věta 30)</span>
<p>Je-li ${I('f')} spojitá na intervalu ${I('J')} (libovolného typu), je ${I(R`f(J)`)} také interval. Typ se ale měnit může: ${I(R`f(x)=x^2`)} zobrazí otevřený ${I(R`(-1,1)`)} na ${I(R`\langle0,1)`)}.</p></div>
<div class="thm"><span class="lbl">Nabývání extrémů (Věta 31) a omezenost</span>
<p>Funkce spojitá na <b>uzavřeném omezeném</b> intervalu ${I(R`\langle a,b\rangle`)} nabývá na něm svého maxima i minima; je tam proto omezená (Důsledek 32).</p>
<p>Bez předpokladů to neplatí: ${I(R`\frac1x`)} na ${I(R`(0,1\rangle`)} není omezená, ${I('x')} na ${I(R`(0,1)`)} nemá maximum ani minimum, ${I('x')} na ${I(R`\langle0,+\infty)`)} nemá maximum.</p></div>
<div class="thm"><span class="lbl">Spojitost inverzní funkce (Věta 33)</span>
<p>Je-li ${I('f')} spojitá a rostoucí (klesající) na intervalu ${I('J')}, pak existuje ${I(R`f^{-1}:f(J)\to J`)} a je spojitá a rostoucí (klesající). Takhle se dostanou ${I(R`\sqrt[n]{x}`)}, exponenciála jako inverze k logaritmu a cyklometrické funkce jako inverze ke goniometrickým.</p></div>
<h3>Elementární funkce: logaritmus (14. přednáška)</h3>
<div class="thm"><span class="lbl">Zavedení logaritmu (Věta 34)</span>
<p>Existuje právě jedna funkce ${I(R`\log`)} s vlastnostmi: (L1) ${I(R`D_{\log}=(0,+\infty)`)}; (L2) je rostoucí; (L3) ${I(R`\log(xy)=\log x+\log y`)}; (L4) ${I(R`\lim_{x\to1}\frac{\log x}{x-1}=1`)}.</p>
<p>Z axiomů plyne: ${I(R`\log1=0`)}, ${I(R`\log\frac xy=\log x-\log y`)}, ${I(R`\log x^n=n\log x`)}, logaritmus je spojitý, ${I(R`\lim_{x\to0^+}\log x=-\infty`)}, ${I(R`\lim_{x\to+\infty}\log x=+\infty`)} a obor hodnot je ${I(R`\mathbb R`)}. Z (L4) substitucí ${I(R`x=1+t`)} dostaneš známou limitu ${I(R`\frac{\ln(1+t)}{t}\to1`)}.</p>
</div>
<h3>Exponenciála a obecná mocnina (15. přednáška)</h3>
<div class="thm"><span class="lbl">Exponenciála</span>
<p>${I(R`\exp`)} je <b>inverzní funkce k logaritmu</b>: ${I(R`y=\exp x\iff x=\log y`)}. Protože ${I(R`\log`)} je spojitý, rostoucí a jeho obor hodnot je ${I(R`\mathbb R`)}, dává Věta 33:</p>
<ul class="plain"><li>${I(R`D_{\exp}=\mathbb R`)}, ${I(R`H_{\exp}=(0,+\infty)`)}, ${I(R`\exp`)} je spojitá a rostoucí. Je tedy <b>vždy kladná</b>.</li>
<li>${I(R`\exp0=1`)}, ${I(R`\exp1=e`)}, ${I(R`\exp(x+y)=\exp x\cdot\exp y`)}, ${I(R`\exp(-x)=\frac1{\exp x}`)}.</li>
<li>${I(R`\lim_{x\to+\infty}e^x=+\infty`)}, ${I(R`\lim_{x\to-\infty}e^x=0`)}.</li>
<li>Známá limita ${I(R`\lim_{x\to0}\frac{e^x-1}{x}=1`)}: je to (L4) „naruby“, substitucí ${I(R`y=e^x-1`)}.</li></ul>
<p>Důkaz těchto vlastností je u zkoušky mezi větami s lehčím důkazem. Najdeš ho v záložce Důkazy (karta „K Větě 34: Exponenciální funkce“).</p></div>
<div class="thm"><span class="lbl">Obecná mocnina a logaritmus o základu a</span>
<p>Pro ${I(R`a>0`)} a ${I(R`b\in\mathbb R`)} je ${I(R`a^b:=\exp(b\log a)=e^{b\ln a}`)}. Pro ${I(R`a,b>0`)}, ${I(R`a\neq1`)} je ${I(R`\log_a b:=\frac{\log b}{\log a}`)}.</p>
<ul class="plain"><li>Platí ${I(R`a^{b+c}=a^ba^c`)}, ${I(R`(a^b)^c=a^{bc}`)}, ${I(R`(ab)^c=a^cb^c`)} a ${I(R`\log a^b=b\log a`)}. Všechno plyne z vlastností ${I(R`\exp`)} a ${I(R`\log`)}.</li>
<li>Pro racionální ${I(R`b=\frac mn`)} vyjde totéž co odmocnina: ${I(R`a^{m/n}=\sqrt[n]{a^m}`)}.</li>
<li>Proto se každá limita typu ${I(R`f(x)^{g(x)}`)} počítá přes ${I(R`f^g=e^{\,g\ln f}`)}: spočítáš limitu exponentu ${I(R`g\ln f`)} a pak použiješ spojitost ${I(R`\exp`)} (limita složené funkce s podmínkou S).</li></ul></div>
<h3>Goniometrické funkce (15. přednáška)</h3>
<div class="thm"><span class="lbl">Zavedení sinu (Věta 35, bez důkazu)</span>
<p>Existuje jediné číslo ${I(R`\pi>0`)} a jediná funkce ${I(R`\sin`)} s vlastnostmi (S1) ${I(R`D_{\sin}=\mathbb R`)}; (S2) ${I(R`\sin`)} je rostoucí na ${I(R`\langle-\frac\pi2,\frac\pi2\rangle`)}; (S3) ${I(R`\sin0=0`)}; (S4) součtový vzorec ${I(R`\sin(x+y)=\sin x\,\sin(\frac\pi2-y)+\sin(\frac\pi2-x)\sin y`)}; (S5) ${I(R`\lim_{x\to0}\frac{\sin x}{x}=1`)}.</p>
<p>Dál ${I(R`\cos x:=\sin(\frac\pi2-x)`)}, ${I(R`\mathrm{tg}\,x=\frac{\sin x}{\cos x}`)} (pro ${I(R`\cos x\neq0`)}) a ${I(R`\mathrm{cotg}\,x=\frac{\cos x}{\sin x}`)} (pro ${I(R`\sin x\neq0`)}). U ústní stačí přesné znění (S1)–(S5).</p></div>
<div class="thm"><span class="lbl">Co z toho plyne a co se hodí do příkladů</span>
<ul class="plain"><li>${I(R`\sin`)} je lichý, ${I(R`\cos`)} sudý, oba jsou spojité na ${I(R`\mathbb R`)} s periodou ${I(R`2\pi`)} a hodnotami v ${I(R`\langle-1,1\rangle`)}; ${I(R`\sin^2x+\cos^2x=1`)}.</li>
<li>${I(R`\sin x=0`)} právě pro ${I(R`x=k\pi`)}, ${I(R`\cos x=0`)} právě pro ${I(R`x=\frac\pi2+k\pi`)} (${I(R`k\in\mathbb Z`)}). Tam ${I(R`\mathrm{tg}`)} resp. ${I(R`\mathrm{cotg}`)} není definovaný.</li>
<li>${I(R`\sin(x+\pi)=-\sin x`)}, ${I(R`\cos(x+\pi)=-\cos x`)}. To se hodí při substituci ${I(R`t=x-\pi`)} nebo ${I(R`t=x-\frac\pi2`)}.</li>
<li>Známé limity v nule: ${I(R`\frac{\sin x}{x}\to1`)}, ${I(R`\frac{\mathrm{tg}\,x}{x}\to1`)}, ${I(R`\frac{1-\cos x}{x^2}\to\frac12`)}. Spolu s ${I(R`\frac{e^x-1}{x}\to1`)} a ${I(R`\frac{\ln(1+x)}{x}\to1`)} je to základní výbava na 2. a 3. příklad 3. písemky.</li></ul></div>
<div class="thm"><span class="lbl">Cyklometrické funkce (definice, probírají se na 16. přednášce)</span>
<p>Inverze k zúženým goniometrickým funkcím: ${I(R`\arcsin:\langle-1,1\rangle\to\langle-\frac\pi2,\frac\pi2\rangle`)}, ${I(R`\arccos:\langle-1,1\rangle\to\langle0,\pi\rangle`)}, ${I(R`\mathrm{arctg}:\mathbb R\to(-\frac\pi2,\frac\pi2)`)}, ${I(R`\mathrm{arccotg}:\mathbb R\to(0,\pi)`)}. Všechny jsou spojité (Věta 33); arcsin a arctg rostou, arccos a arccotg klesají. Jejich definice jsou v seznamu požadavků k ústní zkoušce.</p></div>
<h3>Derivace (16. přednáška)</h3>
<div class="thm"><span class="lbl">Definice derivace</span>
<p>Derivace funkce ${I('f')} v bodě ${I('a')} je ${I(R`f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}=\lim_{x\to a}\frac{f(x)-f(a)}{x-a}`)}, pokud limita existuje. Může vyjít i ${I(R`\pm\infty`)} (nevlastní derivace). „Má vlastní derivaci“ znamená, že limita je reálné číslo.</p>
<p>Zlomek ${I(R`\frac{f(x)-f(a)}{x-a}`)} je směrnice sečny bodů ${I(R`(a,f(a))`)} a ${I(R`(x,f(x))`)}; derivace je limita směrnic sečen. Aby limita dávala smysl, musí být ${I('f')} definovaná na celém okolí bodu ${I('a')}.</p></div>
<div class="thm"><span class="lbl">Jednostranné derivace a tečna</span>
<p><b>Derivace zprava</b> ${I(R`f'_+(a)`)} je táž limita pro ${I(R`h\to0^+`)}, <b>zleva</b> ${I(R`f'_-(a)`)} pro ${I(R`h\to0^-`)}. Derivace ${I(R`f'(a)`)} existuje, právě když existují obě jednostranné a rovnají se.</p>
<p>Příklad: ${I(R`f(x)=|x|`)} má v 0 ${I(R`f'_+(0)=1`)} a ${I(R`f'_-(0)=-1`)}, derivace v 0 neexistuje (graf má „zlom“).</p>
<p>Má-li ${I('f')} v ${I('a')} vlastní derivaci, je <b>tečna</b> ke grafu v bodě ${I(R`(a,f(a))`)} přímka ${I(R`y=f(a)+f'(a)(x-a)`)}.</p></div>
<div class="thm"><span class="lbl">Derivace a spojitost (Věta 36)</span>
<p>Má-li ${I('f')} v ${I('a')} <b>vlastní</b> derivaci, je v ${I('a')} spojitá. Důkaz je jeden řádek: ${I(R`f(x)-f(a)=\frac{f(x)-f(a)}{x-a}\cdot(x-a)\to f'(a)\cdot0=0`)}.</p>
<p>Opačně to neplatí: ${I(R`|x|`)} je v 0 spojitá, ale derivaci nemá. Nevlastní derivace spojitost nezaručuje: ${I(R`\mathrm{sgn}\,x`)} má v 0 derivaci ${I(R`+\infty`)}, a spojitá tam není.</p>
<p>V příkladech se to používá obráceně: <b>není-li funkce v bodě spojitá, nemá tam vlastní derivaci</b>, a nemusíš nic počítat.</p></div>
<div class="thm"><span class="lbl">Aritmetika derivací (Věta 37)</span>
<p>Mají-li ${I('f')} a ${I('g')} v ${I('a')} vlastní derivace, pak</p>
<p>${D(R`(f\pm g)'=f'\pm g',\qquad (cf)'=c\,f',\qquad (fg)'=f'g+fg',\qquad \Big(\frac fg\Big)'=\frac{f'g-fg'}{g^2}\ \ (g(a)\neq0).`)}</p>
<p>Příklad: ${I(R`\Big(\frac{x^2}{x+1}\Big)'=\frac{2x(x+1)-x^2}{(x+1)^2}=\frac{x^2+2x}{(x+1)^2}`)} pro ${I(R`x\neq-1`)}.</p></div>
<div class="thm"><span class="lbl">Derivace složené funkce (Věta 38)</span>
<p>Má-li ${I('g')} vlastní derivaci v ${I('a')} a ${I('f')} vlastní derivaci v ${I(R`g(a)`)}, pak ${I(R`(f\circ g)'(a)=f'\big(g(a)\big)\cdot g'(a)`)}: derivace vnější funkce (v hodnotě vnitřní) krát derivace vnitřní.</p>
<p>Příklad: ${I(R`\big((x^2+1)^5\big)'=5(x^2+1)^4\cdot2x`)}. U víc vnořených funkcí se pravidlo opakuje zvenku dovnitř: ${I(R`\big(f(g(h(x)))\big)'=f'(g(h(x)))\cdot g'(h(x))\cdot h'(x)`)}.</p></div>
<div class="thm"><span class="lbl">Jak vyšetřit derivaci v „podezřelém“ bodě</span><ol class="steps">
<li>Bod, kde se mění předpis (nebo kde je ${I(R`|\,\cdot\,|`)}, odmocnina z nuly apod.), vzorce neřeší. Nejdřív ověř <b>spojitost</b> v bodě; když chybí, vlastní derivace neexistuje (Věta 36).</li>
<li>Je-li funkce spojitá, spočítej z <b>definice</b> obě jednostranné derivace: ${I(R`f'_\pm(a)=\lim_{x\to a^\pm}\frac{f(x)-f(a)}{x-a}`)}, vždy s předpisem platným na dané straně.</li>
<li>Rovnají-li se, je to ${I(R`f'(a)`)}; jinak derivace v ${I('a')} neexistuje.</li>
<li>Příklad: ${I(R`f(x)=x^2`)} pro ${I(R`x\le1`)}, ${I(R`f(x)=2x-1`)} pro ${I(R`x>1`)}. Spojitá v 1 (obě strany dají 1); ${I(R`f'_-(1)=\lim_{x\to1^-}\frac{x^2-1}{x-1}=2`)}, ${I(R`f'_+(1)=\lim_{x\to1^+}\frac{2x-2}{x-1}=2`)}, tedy ${I(R`f'(1)=2`)}.</li>
<li>Mimo podezřelé body stačí pravidla (Věty 37, 38). Rychlejší cestu přes limitu derivace (Věta 44) přidáme, až bude probraná.</li></ol></div>
<h3>Derivace inverzní a elementárních funkcí, lokální extrémy (17. přednáška)</h3>
<div class="thm"><span class="lbl">Derivace inverzní funkce (Věta 39)</span>
<p>Nechť ${I('f')} je na otevřeném intervalu ${I('J')} spojitá a ryze monotónní, ${I(R`a\in J`)} a ${I(R`f'(a)`)} je vlastní a <b>nenulová</b>. Pak inverzní funkce ${I(R`f^{-1}`)} má v bodě ${I(R`b=f(a)`)} derivaci</p>
<p>${D(R`(f^{-1})'(b)=\frac{1}{f'(a)}=\frac{1}{f'\big(f^{-1}(b)\big)}.`)}</p>
<p>Názorně: graf ${I(R`f^{-1}`)} je graf ${I('f')} překlopený přes přímku ${I(R`y=x`)}, takže se směrnice tečny převrátí. Je-li ${I(R`f'(a)=0`)}, tečna inverzní funkce je svislá a vlastní derivace ${I(R`(f^{-1})'(b)`)} neexistuje (příklad: ${I(R`f(x)=x^3`)}, ${I(R`f^{-1}(y)=\sqrt[3]{y}`)} v nule).</p>
<p>Příklad: ${I(R`f(x)=x^3+x`)} je rostoucí a ${I(R`f(1)=2`)}, ${I(R`f'(1)=4`)}, takže ${I(R`(f^{-1})'(2)=\frac14`)}, i když vzorec pro ${I(R`f^{-1}`)} vůbec neznáme.</p></div>
<div class="thm"><span class="lbl">Derivace elementárních funkcí</span>
<div class="tbl"><table><thead><tr><th>Funkce</th><th>Derivace</th><th>Kde platí</th></tr></thead><tbody>
<tr><td>${I(R`x^n`)}, ${I(R`n\in\mathbb N`)}</td><td>${I(R`n\,x^{n-1}`)}</td><td>${I(R`\mathbb R`)}</td></tr>
<tr><td>${I(R`x^a`)}, ${I(R`a\in\mathbb R`)}</td><td>${I(R`a\,x^{a-1}`)}</td><td>${I(R`(0,+\infty)`)}</td></tr>
<tr><td>${I(R`e^x`)}</td><td>${I(R`e^x`)}</td><td>${I(R`\mathbb R`)}</td></tr>
<tr><td>${I(R`a^x`)}, ${I(R`a>0`)}</td><td>${I(R`a^x\ln a`)}</td><td>${I(R`\mathbb R`)}</td></tr>
<tr><td>${I(R`\ln x`)}</td><td>${I(R`\frac1x`)}</td><td>${I(R`(0,+\infty)`)}</td></tr>
<tr><td>${I(R`\sin x`)}, ${I(R`\cos x`)}</td><td>${I(R`\cos x`)}, ${I(R`-\sin x`)}</td><td>${I(R`\mathbb R`)}</td></tr>
<tr><td>${I(R`\mathrm{tg}\,x`)}</td><td>${I(R`\frac{1}{\cos^2x}`)}</td><td>${I(R`\cos x\neq0`)}</td></tr>
<tr><td>${I(R`\mathrm{cotg}\,x`)}</td><td>${I(R`-\frac{1}{\sin^2x}`)}</td><td>${I(R`\sin x\neq0`)}</td></tr>
<tr><td>${I(R`\arcsin x`)}, ${I(R`\arccos x`)}</td><td>${I(R`\frac{1}{\sqrt{1-x^2}}`)}, ${I(R`-\frac{1}{\sqrt{1-x^2}}`)}</td><td>${I(R`(-1,1)`)}</td></tr>
<tr><td>${I(R`\mathrm{arctg}\,x`)}, ${I(R`\mathrm{arccotg}\,x`)}</td><td>${I(R`\frac{1}{1+x^2}`)}, ${I(R`-\frac{1}{1+x^2}`)}</td><td>${I(R`\mathbb R`)}</td></tr>
</tbody></table></div>
<p>Odkud to je: ${I(R`(e^x)'=\lim_{h\to0}e^x\frac{e^h-1}{h}=e^x`)} ze známé limity, ${I(R`(\sin x)'`)} podobně z ${I(R`\frac{\sin h}{h}\to1`)} a ${I(R`\frac{1-\cos h}{h}\to0`)}. Logaritmus a cyklometrické funkce jsou inverzní, takže jdou z Věty 39: ${I(R`(\ln x)'=\frac{1}{e^{\ln x}}=\frac1x`)}, ${I(R`(\arcsin x)'=\frac{1}{\cos(\arcsin x)}=\frac{1}{\sqrt{1-x^2}}`)} (na ${I(R`(-\frac\pi2,\frac\pi2)`)} je kosinus kladný). Obecná mocnina: ${I(R`x^a=e^{a\ln x}`)}, a derivace složené funkce dá ${I(R`e^{a\ln x}\cdot\frac ax=a\,x^{a-1}`)}.</p>
<p>V bodech ${I(R`\pm1`)} nemají ${I(R`\arcsin`)} ani ${I(R`\arccos`)} vlastní derivaci (tečna je svislá). Stejně ${I(R`\sqrt x`)} v nule: ${I(R`(\sqrt x)'=\frac{1}{2\sqrt x}`)} platí jen pro ${I(R`x>0`)}.</p></div>
<div class="thm"><span class="lbl">Funkce typu f(x)^g(x)</span>
<p>Vždy přepiš ${I(R`f(x)^{g(x)}=e^{g(x)\ln f(x)}`)} (pro ${I(R`f(x)>0`)}) a derivuj jako složenou funkci:</p>
<p>${D(R`\big(f^g\big)'=e^{g\ln f}\Big(g'\ln f+g\,\frac{f'}{f}\Big)=f^g\Big(g'\ln f+\frac{g\,f'}{f}\Big).`)}</p>
<p>Příklad: ${I(R`(x^x)'=x^x(\ln x+1)`)} pro ${I(R`x>0`)}. Pozor: ani vzorec pro mocninu (${I(R`x\cdot x^{x-1}`)}), ani vzorec pro exponenciálu (${I(R`x^x\ln x`)}) samotný nestačí, protože proměnná je v základu i v exponentu.</p></div>
<div class="thm"><span class="lbl">Limita jako derivace</span>
<p>Limita tvaru ${I(R`\lim_{x\to a}\frac{f(x)-f(a)}{x-a}`)} je podle definice ${I(R`f'(a)`)}. Když ${I('f')} umíme derivovat podle vzorců, máme limitu zadarmo.</p>
<p>Příklad: ${I(R`\lim_{x\to1}\frac{\mathrm{arctg}\,x-\frac\pi4}{x-1}`)} je derivace ${I(R`\mathrm{arctg}`)} v bodě 1, tedy ${I(R`\frac{1}{1+1^2}=\frac12`)}. Stejně ${I(R`\lim_{x\to2}\frac{x^5-32}{x-2}=5\cdot2^4=80`)}.</p>
<p>V čitateli musí být přesně ${I(R`f(x)-f(a)`)} a ve jmenovateli ${I(R`x-a`)}; jinak výraz nejdřív uprav (vytkni konstantu, rozšiř zlomek).</p></div>
<div class="thm"><span class="lbl">Lokální extrém a nutná podmínka (Věta 40)</span>
<p>${I('f')} má v bodě ${I('a')} <b>lokální maximum</b>, existuje-li ${I(R`\delta>0`)} tak, že ${I(R`f(x)\le f(a)`)} pro všechna ${I(R`x\in U(a,\delta)`)} (minimum: ${I(R`f(x)\ge f(a)`)}). <b>Ostré</b> lokální maximum: ${I(R`f(x)\lt f(a)`)} pro ${I(R`x\in P(a,\delta)`)}.</p>
<p><b>Věta 40.</b> Má-li ${I('f')} v bodě ${I('a')} lokální extrém a existuje-li ${I(R`f'(a)`)}, pak ${I(R`f'(a)=0`)}.</p>
<p>Idea důkazu (maximum): pro ${I(R`x>a`)} je ${I(R`\frac{f(x)-f(a)}{x-a}\le0`)}, tedy ${I(R`f'(a)=f'_+(a)\le0`)}; pro ${I(R`x\lt a`)} je zlomek ${I(R`\ge0`)}, tedy ${I(R`f'(a)=f'_-(a)\ge0`)}. Dohromady ${I(R`f'(a)=0`)}.</p>
<p>Obrácení <b>neplatí</b>: ${I(R`x^3`)} má ${I(R`f'(0)=0`)}, ale extrém v 0 nemá. A extrém může být i tam, kde derivace neexistuje: ${I(R`|x|`)} má v 0 minimum.</p></div>
<div class="thm"><span class="lbl">Jak najít největší a nejmenší hodnotu na uzavřeném intervalu</span><ol class="steps">
<li>Ověř, že ${I('f')} je spojitá na ${I(R`\langle a,b\rangle`)}; podle Věty 31 maximum i minimum existují.</li>
<li>Sepiš <b>kandidáty</b>: krajní body ${I('a')}, ${I('b')}; body z ${I(R`(a,b)`)}, kde ${I(R`f'(x)=0`)} (stacionární body); body z ${I(R`(a,b)`)}, kde ${I(R`f'`)} neexistuje.</li>
<li>Spočítej ve všech kandidátech funkční hodnotu. Největší je maximum, nejmenší minimum. Jinde extrém být nemůže (Věta 40).</li>
<li>Příklad: ${I(R`f(x)=x^3-3x`)} na ${I(R`\langle0,2\rangle`)}: ${I(R`f'(x)=3x^2-3=0`)} dává ${I(R`x=1`)}. Hodnoty ${I(R`f(0)=0`)}, ${I(R`f(1)=-2`)}, ${I(R`f(2)=2`)}: minimum ${I(R`-2`)} v bodě 1, maximum ${I('2')} v bodě 2.</li></ol></div>
<h3>Postup</h3>
<div class="thm"><span class="lbl">Jak dokázat, že rovnice má řešení</span><ol class="steps">
<li>Převeď rovnici na tvar ${I(R`h(x)=0`)} a ověř, že ${I('h')} je spojitá na zvoleném ${I(R`\langle a,b\rangle`)}.</li>

/* ---------- důkazy: číslování podle přednášky (Bárta); zdroje: zápisky 2022 a 2014/15 ----------
   Formát: stmt (znění), plain (lidsky řečeno), method [metody], idea (klíčová myšlenka), need [{t, ref}],

   end (závěr), say (jak to říct u zkoušky), pit [..], ask [[otázka, odpověď]] */
const PROOF_CH = {
  uvod: 'Úvod a reálná čísla',
  posl: 'Limita posloupnosti',
  fce: 'Limita a spojitost funkce',
  der: 'Derivace a průběh funkce'
};
const PROOFS = [];
PROOFS.push(
{ id: 't1', no: 'Tvrzení 1', name: 'De Morganova pravidla', ch: 'uvod', fig: 'demorgan',
  stmt: R`Nechť \(S,I\) jsou neprázdné množiny, \(A_\alpha\subset S\) pro \(\alpha\in I\) a \(B\subset S\). Pak
  \[B\setminus\bigcup_{\alpha\in I}A_\alpha=\bigcap_{\alpha\in I}(B\setminus A_\alpha)\qquad\text{a}\qquad B\setminus\bigcap_{\alpha\in I}A_\alpha=\bigcup_{\alpha\in I}(B\setminus A_\alpha).\]`,
  plain: 'Odečíst od B sjednocení je totéž jako odečíst každou množinu zvlášť a výsledky zprůnikovat. A naopak.',
  method: ['Přímý důkaz', 'Řetězec ekvivalencí'],
  idea: 'Dvě množiny se rovnají, když mají stejné prvky. Vezmu libovolné x a podmínku „x je vlevo“ přepisuju ekvivalencemi, dokud nedostanu „x je vpravo“. Celý důkaz je jen přepis definic a negace kvantifikátoru.',
  need: [{ t: 'definice sjednocení, průniku a rozdílu množin' }, { t: 'negace kvantifikátorů: ¬∃ ⟺ ∀¬ a ¬∀ ⟺ ∃¬' }],
  goal: R`x\in B\setminus\bigcup_{\alpha}A_\alpha\iff x\in\bigcap_{\alpha}(B\setminus A_\alpha)\qquad\text{pro každé }x`,
  steps: [
    { g: 'První rovnost', h: 'Rozepíšu levou stranu podle definice rozdílu', m: R`x\in B\setminus\bigcup_\alpha A_\alpha\iff x\in B\ \wedge\ x\notin\bigcup_\alpha A_\alpha`, why: 'Rozdíl B ∖ C obsahuje prvky, které jsou v B a nejsou v C.' },
    { g: 'První rovnost', h: '„Není ve sjednocení“ přepíšu na „není v žádné Aα“', m: R`\iff x\in B\ \wedge\ \forall\alpha\in I:\ x\notin A_\alpha`, why: 'x ∈ ⋃A_α znamená ∃α: x ∈ A_α. Negace ∃ je ∀ s negací.' },
    { g: 'První rovnost', h: 'Přesunu „x ∈ B“ pod kvantifikátor', m: R`\iff\forall\alpha\in I:\ \big(x\in B\ \wedge\ x\notin A_\alpha\big)`, why: 'Výrok x ∈ B nezávisí na α. Tady potřebuju I ≠ ∅: pro prázdné I by pravá strana platila vždy, i pro x ∉ B.' },
    { g: 'První rovnost', h: 'Poznám definici rozdílu a průniku', m: R`\iff\forall\alpha\in I:\ x\in B\setminus A_\alpha\iff x\in\bigcap_{\alpha\in I}(B\setminus A_\alpha)`, why: 'B ∖ A_α jsou prvky z B, které nejsou v A_α, takže závorka je přesně x ∈ B ∖ A_α. A „pro všechna α“ je definice průniku.' },
    { g: 'Druhá rovnost', h: 'Stejný postup, jen negace ∀ dá ∃', m: R`x\in B\setminus\bigcap_\alpha A_\alpha\iff x\in B\wedge\exists\alpha: x\notin A_\alpha\iff\exists\alpha:\ x\in B\setminus A_\alpha\iff x\in\bigcup_\alpha(B\setminus A_\alpha)`, why: '„Není v průniku“ znamená ¬(∀α: x ∈ A_α), tedy existuje aspoň jedna A_α, kde x chybí.' }
  ],
  end: 'Všechny kroky byly ekvivalence, takže obě strany mají stejné prvky a rovnají se.',
  say: 'Dvě množiny se rovnají, když mají stejné prvky. Vezmu x a podmínku x ∈ B ∖ ⋃A_α přepisuju ekvivalencemi: x je v B a není v žádné A_α. Neprázdnost I mi dovolí přesunout „x ∈ B“ pod kvantifikátor, takže pro každé α je x v B ∖ A_α, a to je průnik. Druhá rovnost stejně, jen negace „pro všechna“ dá „existuje“, a vyjde sjednocení.',
  ask: [['Kde se použil předpoklad I ≠ ∅?', 'Při přesunu „x ∈ B“ pod kvantifikátor ∀ (krok 3). Pro I = ∅ je výrok „∀α: …“ vždy pravdivý, takže by se ztratila podmínka x ∈ B.'], ['Jak ověříš rovnost dvou množin?', 'Buď řetězcem ekvivalencí pro libovolné x (jako tady), nebo dvěma inkluzemi ⊂ a ⊃.']] },

{ id: 'cauchy', no: 'Věta', name: 'Cauchyova nerovnost', ch: 'uvod',
  stmt: R`Pro \(a_1,\dots,a_n,b_1,\dots,b_n\in\mathbb R\) platí \[\Big(\sum_{i=1}^n a_ib_i\Big)^2\le\Big(\sum_{i=1}^n a_i^2\Big)\Big(\sum_{i=1}^n b_i^2\Big).\]`,
  plain: 'Druhá mocnina „skalárního součinu“ je nejvýš součin „délek na druhou“.',
  method: ['Přímý důkaz', 'Rozbor případů'],
  idea: 'Součet čtverců je vždy ≥ 0. Z něj poskládám kvadratickou funkci v proměnné t, která nikdy neklesne pod nulu. Když do ní dosadím její vrchol, vypadne přesně dokazovaná nerovnost.',
  need: [{ t: 'čtverec reálného čísla je ≥ 0' }, { t: 'roznásobení (u + v)²' }],
  goal: R`B^2\le AC,\qquad A=\sum a_i^2,\ B=\sum a_ib_i,\ C=\sum b_i^2`,
  steps: [
    { h: 'Označím si tři součty', m: R`A=\sum_{i=1}^n a_i^2\ \ge0,\qquad B=\sum_{i=1}^n a_ib_i,\qquad C=\sum_{i=1}^n b_i^2\ \ge0`, why: 'Chci dokázat B² ≤ AC. Zápis se tím hodně zkrátí.' },
    { g: 'Případ A = 0', h: 'Všechna aᵢ jsou nulová', m: R`A=0\ \Longrightarrow\ a_1=\dots=a_n=0\ \Longrightarrow\ B=0,\qquad 0^2\le0\cdot C`, why: 'Součet nezáporných čtverců je nula jen tehdy, když je nula každý z nich.' },
    { g: 'Případ A > 0', h: 'Sestavím kvadratickou funkci, která je všude ≥ 0', m: R`0\le\sum_{i=1}^n(a_it+b_i)^2=\sum_{i=1}^n\big(a_i^2t^2+2a_ib_it+b_i^2\big)=At^2+2Bt+C\qquad\forall t\in\mathbb R`, why: 'Vlevo je součet čtverců. Napravo jsem jen roznásobil a posčítal stejné mocniny t.' },
    { g: 'Případ A > 0', h: 'Dosadím vrchol paraboly t = −B/A', m: R`0\le A\frac{B^2}{A^2}-2B\frac{B}{A}+C=C-\frac{B^2}{A}`, why: 'Nerovnost platí pro každé t, tedy i pro to, kde je parabola nejníž. Dělit A smím, protože A > 0.' },
    { g: 'Případ A > 0', h: 'Vynásobím kladným A', m: R`B^2\le AC`, why: 'Násobení kladným číslem nemění směr nerovnosti.' }
  ],
  end: 'Nerovnost platí v obou případech.',
  say: 'Označím A = Σaᵢ², B = Σaᵢbᵢ, C = Σbᵢ². Když je A nula, jsou všechna aᵢ nulová a nerovnost je 0 ≤ 0. Jinak vezmu součet čtverců Σ(aᵢt + bᵢ)². Ten je pro každé t nezáporný a po roznásobení je to At² + 2Bt + C. Dosadím t = −B/A, vyjde C − B²/A ≥ 0, a po vynásobení A dostanu B² ≤ AC.',
  pit: ['Nezapomeň na případ A = 0. Jinak dělíš nulou.', 'Jiné zakončení: parabola At² + 2Bt + C je všude ≥ 0, takže její diskriminant 4B² − 4AC je ≤ 0.'] },

{ id: 'sqrt2', no: 'Příklad', name: 'Iracionalita √2', ch: 'uvod',
  stmt: R`Jestliže \(x\in\mathbb R\) splňuje \(x^2=2\), pak \(x\notin\mathbb Q\).`,
  plain: '√2 nejde napsat jako zlomek.',
  method: ['Sporem'],
  idea: 'Předpokládám, že x je zlomek v základním tvaru p/q. Z rovnice p² = 2q² vyjde, že p i q jsou sudá. To je spor se základním tvarem.',
  need: [{ t: 'každý zlomek jde zkrátit na základní (nesoudělný) tvar' }, { t: 'liché číslo na druhou je liché' }],
  steps: [
    { h: 'Předpokládám opak', m: R`x\in\mathbb Q\ \Longrightarrow\ |x|=\frac pq,\qquad p,q\in\mathbb N\ \text{nesoudělná}`, why: 'x ≠ 0, protože 0² ≠ 2. Kladný zlomek jde vždy zkrátit na základní tvar.' },
    { h: 'Umocním a vynásobím q²', m: R`\frac{p^2}{q^2}=2\ \Longrightarrow\ p^2=2q^2`, why: 'Pravá strana je sudá, tedy p² je sudé.' },
    { h: 'Odvodím, že i p je sudé', m: R`p=2r,\quad r\in\mathbb N`, why: 'Kdyby bylo p liché, p = 2k + 1, bylo by p² = 4k² + 4k + 1 liché.' },
    { h: 'Dosadím a vyjde, že i q je sudé', m: R`4r^2=2q^2\ \Longrightarrow\ q^2=2r^2`, why: 'Stejný argument jako v kroku 3: q² je sudé, takže q je sudé.' },
    { h: 'Spor', p: 'p i q jsou sudá, takže je obě dělí 2. Měla ale být nesoudělná.' }
  ],
  end: 'Předpoklad x ∈ ℚ vede ke sporu, tedy x ∉ ℚ.',
  say: 'Sporem: kdyby x bylo racionální, je |x| = p/q v základním tvaru. Umocněním dostanu p² = 2q², takže p² je sudé, a proto je sudé i p, protože liché na druhou je liché. Dosadím p = 2r a vyjde q² = 2r², takže je sudé i q. Pak p a q nejsou nesoudělná, a to je spor.' },

{ id: 'binom', no: 'Příklad', name: 'Binomická věta', ch: 'uvod',
  stmt: R`Pro \(a,b\in\mathbb R\) a \(n\in\mathbb N\) platí \((a+b)^n=\sum_{k=0}^n\binom nk a^{n-k}b^k\).`,
  plain: 'Vzorec na roznásobení (a + b)ⁿ.',
  method: ['Matematická indukce'],
  idea: 'Indukcí podle n. V indukčním kroku vynásobím vzorec pro n jednou závorkou (a + b), ve druhém součtu posunu index a koeficienty u stejných mocnin sečtu Pascalovou rovností.',
  need: [{ t: 'matematická indukce' }, { t: 'Pascalova rovnost (dokážu si ji v kroku 5)' }],
  goal: R`(a+b)^n=\sum_{k=0}^n\binom nk a^{n-k}b^k\ \Longrightarrow\ (a+b)^{n+1}=\sum_{k=0}^{n+1}\binom{n+1}k a^{n+1-k}b^k`,
  steps: [
    { g: 'Základ indukce', h: 'Ověřím n = 1', m: R`\sum_{k=0}^1\binom1k a^{1-k}b^k=\binom10a+\binom11b=a+b`, why: 'Indukce začíná nejmenším n. Pro n = 1 je (a + b)¹ = a + b a součet má jen dva členy s koeficienty (1 nad 0) = (1 nad 1) = 1.' },
    { g: 'Indukční krok', h: 'Vynásobím vzorec pro n závorkou (a + b)', m: R`(a+b)^{n+1}=(a+b)\sum_{k=0}^n\binom nk a^{n-k}b^k=\sum_{k=0}^n\binom nk a^{n+1-k}b^k+\sum_{k=0}^n\binom nk a^{n-k}b^{k+1}`, why: 'Indukční předpoklad: vzorec platí pro n. Pak roznásobím a, a zvlášť b.' },
    { g: 'Indukční krok', h: 'Ve druhém součtu posunu index k → k − 1', m: R`\sum_{k=0}^n\binom nk a^{n-k}b^{k+1}=\sum_{k=1}^{n+1}\binom n{k-1}a^{n+1-k}b^k`, why: 'Chci, aby oba součty měly stejné mocniny aⁿ⁺¹⁻ᵏbᵏ.' },
    { g: 'Indukční krok', h: 'Krajní členy vytknu, zbytek sečtu', m: R`(a+b)^{n+1}=a^{n+1}+\sum_{k=1}^{n}\left[\binom nk+\binom n{k-1}\right]a^{n+1-k}b^k+b^{n+1}`, why: 'Člen k = 0 je jen v prvním součtu, člen k = n + 1 jen ve druhém.' },
    { g: 'Indukční krok', h: 'Pascalova rovnost', m: R`\binom nk+\binom n{k-1}=\frac{n!}{k!(n-k)!}+\frac{n!}{(k-1)!(n-k+1)!}=\frac{n!\,\big((n-k+1)+k\big)}{k!\,(n-k+1)!}=\binom{n+1}k`, why: 'Převedu na společného jmenovatele k!(n − k + 1)!.' },
    { g: 'Indukční krok', h: 'Krajní členy zapadnou do vzorce', m: R`a^{n+1}=\binom{n+1}0a^{n+1}b^0,\qquad b^{n+1}=\binom{n+1}{n+1}a^0b^{n+1}`, why: 'Tím mám celý součet od k = 0 do n + 1.' }
  ],
  end: 'Vzorec platí pro n + 1, takže podle principu indukce platí pro všechna n ∈ ℕ.',
  say: 'Indukcí. Pro n = 1 je to a + b. V indukčním kroku vynásobím vzorec pro n závorkou (a + b), dostanu dva součty a ve druhém posunu index o jedna. Krajní členy aⁿ⁺¹ a bⁿ⁺¹ vytknu a u ostatních sečtu koeficienty Pascalovou rovností: (n nad k) + (n nad k − 1) = (n + 1 nad k). Vyjde přesně vzorec pro n + 1.' },

{ id: 't2', no: 'Tvrzení 2', name: 'Počítání v ℝ z axiomů', ch: 'uvod',
  stmt: R`(i) \(x\cdot0=0\); (ii) \((-1)x=-x\); (iii) \(xy=0\Rightarrow x=0\vee y=0\); (iv) \(x^{-n}=(1/x)^n=1/x^n\); (v) \(x,y>0\Rightarrow xy>0\); (vi) pro \(x,y\ge0\): \(x\lt y\iff x^n\lt y^n\).`,
  plain: 'Obvyklá pravidla pro počítání se dají odvodit jen z axiomů.',
  method: ['Z axiomů', 'Rozbor případů'],
  idea: 'Každý bod je krátký trik s axiomy tělesa a uspořádání: přičíst nulu, vynásobit inverzí, vytknout. Nejdůležitější je bod (vi), na něm stojí odmocniny (Věta 7).',
  need: [{ t: 'axiomy tělesa (sčítání, násobení, distributivita)' }, { t: 'axiomy uspořádání' }],
  steps: [
    { g: 'Těleso: body (i)–(iv)', h: '(i) x · 0 = 0: rozepíšu nulu jako 0 + 0', m: R`x\cdot0=x\cdot(0+0)=x\cdot0+x\cdot0`, why: '0 + 0 = 0 a distributivita. Přičtu k oběma stranám −(x · 0) a dostanu 0 = x · 0.' },
    { g: 'Těleso: body (i)–(iv)', h: '(ii) (−1)x je opačný prvek k x', m: R`x+(-1)x=1\cdot x+(-1)\cdot x=\big(1+(-1)\big)x=0\cdot x=0`, why: 'Poslední rovnost je (i). Opačný prvek je jediný: z x + u = 0 = x + v plyne u = u + (x + v) = (u + x) + v = v.' },
    { g: 'Těleso: body (i)–(iv)', h: '(iii) Je-li x ≠ 0, vynásobím inverzí', m: R`y=1\cdot y=(x^{-1}x)\,y=x^{-1}(xy)=x^{-1}\cdot0=0`, why: 'K x ≠ 0 existuje x⁻¹ (axiom tělesa). Poslední rovnost je (i).' },
    { g: 'Těleso: body (i)–(iv)', h: '(iv) (1/x)ⁿ je převrácená hodnota xⁿ', m: R`x^n\cdot\Big(\frac1x\Big)^n=\Big(x\cdot\frac1x\Big)^n=1^n=1`, why: 'Komutativita a asociativita dovolí přeskládat součin. Převrácená hodnota je jediná, takže (1/x)ⁿ = 1/xⁿ.' },
    { g: 'Uspořádání: body (v)–(vi)', h: '(v) Součin kladných je kladný', p: R`Z axiomu uspořádání je \(xy\ge0\). Kdyby \(xy=0\), dalo by (iii) \(x=0\) nebo \(y=0\), a to je spor s \(x,y>0\).` },
    { g: 'Uspořádání: body (v)–(vi)', h: '(vi) ⇒: rozložím rozdíl mocnin', m: R`y^n-x^n=(y-x)\big(y^{n-1}+y^{n-2}x+\dots+x^{n-1}\big)>0`, why: 'y − x > 0. Ve druhé závorce jsou všechny členy ≥ 0 a yⁿ⁻¹ > 0, protože y > x ≥ 0 (opakovaně (v)). Součin kladných je kladný (v).' },
    { g: 'Uspořádání: body (v)–(vi)', h: '(vi) ⇐: vyloučím ostatní možnosti', p: R`Nechť \(x^n\lt y^n\). Kdyby \(x=y\), bylo by \(x^n=y^n\). Kdyby \(x>y\), dal by směr ⇒ (s prohozenými rolemi) \(x^n>y^n\). Zbývá \(x\lt y\).`, why: 'Trichotomie: nastane právě jedna z možností x < y, x = y, x > y.' }
  ],
  end: 'Všechna pravidla plynou jen z axiomů.',
  say: 'x · 0 = x(0 + 0) = x · 0 + x · 0, takže x · 0 = 0. (−1)x + x = (−1 + 1)x = 0, takže (−1)x je opačný prvek. Je-li xy = 0 a x ≠ 0, vynásobím x⁻¹ a vyjde y = 0. U (vi) rozložím yⁿ − xⁿ = (y − x)(yⁿ⁻¹ + … + xⁿ⁻¹). Oba činitelé jsou kladní, takže yⁿ > xⁿ. Opačný směr plyne z trichotomie.',
  pit: ['Bod (vi) platí jen pro nezáporná x, y: (−2)² > 1², ale −2 < 1.'] },

{ id: 't3', no: 'Tvrzení 3', name: 'O supremu', ch: 'uvod', fig: 'sup',
  stmt: R`Každá neprázdná shora omezená množina \(M\subset\mathbb R\) má právě jedno supremum.`,
  plain: 'Když množina nikam „neutíká“ nahoru, má nejmenší horní závoru.',
  method: ['Přímý důkaz', 'Překlopení množiny'],
  idea: 'Axiom dává jen infimum. Množinu proto překlopím (P = −M), vezmu α = inf P a překlopím zpátky: G = −α. Pak ověřím obě vlastnosti suprema a jednoznačnost.',
  need: [{ t: 'axiom infima: neprázdná zdola omezená množina má infimum' }, { t: 'definice suprema: (i) horní závora, (ii) nic menšího není horní závora' }],
  goal: R`G=-\inf(-M)\ \text{ je supremum } M\ \text{ a je jediné}`,
  steps: [
    { g: 'Existence', h: 'Překlopím množinu', m: R`P=-M=\{-x;\ x\in M\}`, why: 'M ≠ ∅, takže P ≠ ∅. Je-li a horní závora M (x ≤ a), je −x ≥ −a, takže −a je dolní závora P.' },
    { g: 'Existence', h: 'Použiju axiom infima', m: R`\alpha=\inf P\ \text{ existuje},\qquad G:=-\alpha`, why: 'P je neprázdná a zdola omezená.' },
    { g: 'Existence', h: '(i) G je horní závora M', m: R`x\in M\ \Rightarrow\ -x\in P\ \Rightarrow\ -x\ge\alpha\ \Rightarrow\ x\le-\alpha=G`, why: 'α je dolní závora P.' },
    { g: 'Existence', h: '(ii) Nic menšího než G není horní závora', p: R`Vezmu \(G'\lt G\). Pak \(-G'>\alpha\), a protože \(\alpha\) je největší dolní závora, \(-G'\) dolní závora \(P\) není:`, m: R`\exists y\in P:\ y\lt-G'\quad\Longrightarrow\quad x:=-y\in M,\ \ x>G'`, why: 'Tedy G′ není horní závora M.' },
    { g: 'Jednoznačnost', h: 'Dvě různá suprema A < B vedou ke sporu', p: R`\(B\) je supremum, takže podle (ii) žádné číslo menší než \(B\) není horní závora. Speciálně \(A\lt B\) není horní závora, a tak nemůže být ani supremem. Spor.` },
    { g: 'Jednoznačnost', h: 'Jinak: přímo z vlastnosti (ii)', p: R`Nechť \(B=\sup M\) a \(A\lt B\). Dosadím \(G'=A\) do (ii) pro \(B\): existuje \(x\in M\), \(x>A\). Tedy \(A\) není horní závora, a proto ani supremum.` }
  ],
  end: 'G = −inf(−M) je supremum a žádné jiné není.',
  say: 'Axiom dává jen infimum, tak množinu překlopím: P = −M. Ta je neprázdná a zdola omezená, takže má infimum α, a položím G = −α. G je horní závora, protože x ∈ M dává −x ≥ α, tedy x ≤ G. A je nejmenší: pro G′ < G je −G′ > α, takže −G′ není dolní závora P a existuje y ∈ P menší, tedy −y ∈ M je větší než G′. Jednoznačnost: z dvou suprem A < B by A podle druhé vlastnosti B nebylo horní závorou.',
  pit: ['Na přednášce se vychází z axiomu infima, ne suprema. Odtud trik s −M.', 'Jednoznačnost umět oběma způsoby (v zápiscích výslovně „umět oba způsoby“).'],
  ask: [['Proč je −M zdola omezená?', 'Je-li a ≥ x pro všechna x ∈ M, pak −a ≤ −x, takže −a je dolní závora −M.'], ['Proč nestačí říct „supremum je nejmenší horní závora, takže je jediné“?', 'Právě to je potřeba dokázat: že dvě různá čísla nemohou obě splňovat (i) a (ii). Ukáže se to sporem s vlastností (ii).']] },

{ id: 'l4', no: 'Lemma 4', name: 'Charakterizace intervalu', ch: 'uvod',
  stmt: R`Nechť \(M\subset\mathbb R\) a pro všechna \(x,y\in M\) a \(z\in\mathbb R\) platí \(x\lt z\lt y\Rightarrow z\in M\). Pak \(M\) je interval.`,
  plain: 'Množina „bez děr“ je interval.',
  method: ['Přímý důkaz', 'Dvě inkluze'],
  idea: 'Krajní body budou a = inf M a b = sup M (nebo ±∞). Ukážu dvě inkluze (a, b) ⊂ M ⊂ ⟨a, b⟩. Pak už je M jeden ze čtyř intervalů s konci a, b, podle toho, jestli krajní body obsahuje.',
  need: [{ t: 'Tvrzení 3 (supremum, infimum)', ref: 't3' }],
  goal: R`(a,b)\subset M\subset\langle a,b\rangle`,
  steps: [
    { h: 'Odbudu triviální případy', p: R`Prázdná a jednoprvková množina jsou intervaly podle konvence (\(\emptyset=(0,0)\), \(\{c\}=\langle c,c\rangle\)). Dál má \(M\) aspoň dva prvky.` },
    { h: 'Zvolím krajní body', m: R`a=\begin{cases}\inf M,&M\text{ zdola omezená}\\-\infty&\text{jinak}\end{cases}\qquad b=\begin{cases}\sup M,&M\text{ shora omezená}\\+\infty&\text{jinak}\end{cases}`, why: 'Supremum a infimum existují podle Tvrzení 3.', use: ['t3'] },
    { g: 'Inkluze (a, b) ⊂ M', h: 'Vezmu libovolný bod uvnitř', m: R`x\in(a,b)`, why: 'Chci ukázat (a, b) ⊂ M, tedy že každý bod mezi a a b patří do M. Proto začnu s libovolným takovým x.' },
