  say: 'x · 0 = x(0 + 0) = x · 0 + x · 0, takže x · 0 = 0. (−1)x + x = (−1 + 1)x = 0, takže (−1)x je opačný prvek. Je-li xy = 0 a x ≠ 0, vynásobím x⁻¹ a vyjde y = 0. U (vi) rozložím yⁿ − xⁿ = (y − x)(yⁿ⁻¹ + … + xⁿ⁻¹). Oba činitelé jsou kladní, takže yⁿ > xⁿ. Opačný směr plyne z trichotomie.',
  pit: ['Bod (vi) platí jen pro nezáporná x, y: (−2)² > 1², ale −2 < 1.'] },

{ id: 't3', no: 'Tvrzení 3', name: 'O supremu', ch: 'uvod', fig: 'sup',
  stmt: R`Každá neprázdná shora omezená množina \(M\subset\mathbb R\) má právě jedno supremum.`,
  plain: 'Když množina nikam „neutíká“ nahoru, má nejmenší horní závoru.',
  method: ['Přímý důkaz', 'Překlopení množiny'],
  idea: 'Axiom dává jen infimum. Množinu proto překlopím (P = −M), vezmu α = inf P a překlopím zpátky: G = −α. Pak ověřím obě vlastnosti suprema a jednoznačnost.',
  need: [{ t: 'axiom infima: neprázdná zdola omezená množina má infimum' }, { t: 'definice suprema: (i) horní závora, (ii) nic menšího není horní závora' }],
  goal: R`G=-\inf(-M)\ \text{ je supremum } M\ \text{ a je jediné}`,
  steps: [
    { g: 'Existence', h: 'Překlopím množinu', m: R`P=-M=\{-x;\ x\in M\}`, why: 'M ≠ ∅, takže P ≠ ∅. Je-li a horní závora M (x ≤ a), je −x ≥ −a, takže −a je dolní závora P.' },
    { g: 'Existence', h: 'Použiju axiom infima', m: R`\alpha=\inf P\ \text{ existuje},\qquad G:=-\alpha`, why: 'P je neprázdná a zdola omezená.' },
    { g: 'Existence', h: '(i) G je horní závora M', m: R`x\in M\ \Rightarrow\ -x\in P\ \Rightarrow\ -x\ge\alpha\ \Rightarrow\ x\le-\alpha=G`, why: 'α je dolní závora P.' },
    { g: 'Existence', h: '(ii) Nic menšího než G není horní závora', p: R`Vezmu \(G'\lt G\). Pak \(-G'>\alpha\), a protože \(\alpha\) je největší dolní závora, \(-G'\) dolní závora \(P\) není:`, m: R`\exists y\in P:\ y\lt-G'\quad\Longrightarrow\quad x:=-y\in M,\ \ x>G'`, why: 'Tedy G′ není horní závora M.' },
    { g: 'Jednoznačnost', h: 'Dvě různá suprema A < B vedou ke sporu', p: R`\(B\) je supremum, takže podle (ii) žádné číslo menší než \(B\) není horní závora. Speciálně \(A\lt B\) není horní závora, a tak nemůže být ani supremem. Spor.` },
    { g: 'Jednoznačnost', h: 'Jinak: přímo z vlastnosti (ii)', p: R`Nechť \(B=\sup M\) a \(A\lt B\). Dosadím \(G'=A\) do (ii) pro \(B\): existuje \(x\in M\), \(x>A\). Tedy \(A\) není horní závora, a proto ani supremum.` }
  ],
  end: 'G = −inf(−M) je supremum a žádné jiné není.',
  say: 'Axiom dává jen infimum, tak množinu překlopím: P = −M. Ta je neprázdná a zdola omezená, takže má infimum α, a položím G = −α. G je horní závora, protože x ∈ M dává −x ≥ α, tedy x ≤ G. A je nejmenší: pro G′ < G je −G′ > α, takže −G′ není dolní závora P a existuje y ∈ P menší, tedy −y ∈ M je větší než G′. Jednoznačnost: z dvou suprem A < B by A podle druhé vlastnosti B nebylo horní závorou.',
  pit: ['Na přednášce se vychází z axiomu infima, ne suprema. Odtud trik s −M.', 'Jednoznačnost umět oběma způsoby (v zápiscích výslovně „umět oba způsoby“).'],
  ask: [['Proč je −M zdola omezená?', 'Je-li a ≥ x pro všechna x ∈ M, pak −a ≤ −x, takže −a je dolní závora −M.'], ['Proč nestačí říct „supremum je nejmenší horní závora, takže je jediné“?', 'Právě to je potřeba dokázat: že dvě různá čísla nemohou obě splňovat (i) a (ii). Ukáže se to sporem s vlastností (ii).']] },

{ id: 'l4', no: 'Lemma 4', name: 'Charakterizace intervalu', ch: 'uvod',
  stmt: R`Nechť \(M\subset\mathbb R\) a pro všechna \(x,y\in M\) a \(z\in\mathbb R\) platí \(x\lt z\lt y\Rightarrow z\in M\). Pak \(M\) je interval.`,
  plain: 'Množina „bez děr“ je interval.',
  method: ['Přímý důkaz', 'Dvě inkluze'],
  idea: 'Krajní body budou a = inf M a b = sup M (nebo ±∞). Ukážu dvě inkluze (a, b) ⊂ M ⊂ ⟨a, b⟩. Pak už je M jeden ze čtyř intervalů s konci a, b, podle toho, jestli krajní body obsahuje.',
  need: [{ t: 'Tvrzení 3 (supremum, infimum)', ref: 't3' }],
  goal: R`(a,b)\subset M\subset\langle a,b\rangle`,
  steps: [
    { h: 'Odbudu triviální případy', p: R`Prázdná a jednoprvková množina jsou intervaly podle konvence (\(\emptyset=(0,0)\), \(\{c\}=\langle c,c\rangle\)). Dál má \(M\) aspoň dva prvky.` },
    { h: 'Zvolím krajní body', m: R`a=\begin{cases}\inf M,&M\text{ zdola omezená}\\-\infty&\text{jinak}\end{cases}\qquad b=\begin{cases}\sup M,&M\text{ shora omezená}\\+\infty&\text{jinak}\end{cases}`, why: 'Supremum a infimum existují podle Tvrzení 3.', use: ['t3'] },
    { g: 'Inkluze (a, b) ⊂ M', h: 'Vezmu libovolný bod uvnitř', m: R`x\in(a,b)`, why: 'Chci ukázat (a, b) ⊂ M, tedy že každý bod mezi a a b patří do M. Proto začnu s libovolným takovým x.' },
    { g: 'Inkluze (a, b) ⊂ M', h: 'Najdu prvky M vlevo i vpravo od x', m: R`x>a\ \Rightarrow\ \exists x_1\in M:\ x_1\lt x,\qquad x\lt b\ \Rightarrow\ \exists x_2\in M:\ x_2>x`, why: 'x > inf M, takže x není dolní závora M. Pro a = −∞ je M zdola neomezená a takový prvek existuje taky. Vpravo stejně se supremem.' },
    { g: 'Inkluze (a, b) ⊂ M', h: 'Použiju předpoklad lemmatu', m: R`x_1,x_2\in M,\quad x_1\lt x\lt x_2\ \Longrightarrow\ x\in M`, why: 'Předpoklad lemmatu říká: leží-li číslo mezi dvěma prvky M, je samo v M. Z kroku 4 mám x₁ < x < x₂ s x₁, x₂ ∈ M.' },
    { g: 'Inkluze M ⊂ ⟨a, b⟩', h: 'Nic nepřečnívá', p: R`\(a\) je dolní a \(b\) horní závora \(M\), takže každé \(y\in M\) splňuje \(a\le y\le b\).` }
  ],
  end: 'M je (a, b), ⟨a, b), (a, b⟩ nebo ⟨a, b⟩ podle toho, které krajní body obsahuje.',
  say: 'Vezmu a = inf M a b = sup M, případně ±∞. Pro x z otevřeného intervalu (a, b) není x dolní závorou, takže existuje prvek M menší než x. Stejně existuje prvek M větší než x. Podle předpokladu je pak x v M. Takže (a, b) ⊂ M, a protože a, b jsou závory, je M ⊂ ⟨a, b⟩. M je tedy interval s konci a, b.',
  pit: ['Neplatí v ℚ: M = {x ∈ ℚ; x² > 2, x > 0} nemá v ℚ levý krajní bod, protože √2 ∉ ℚ.'] },

{ id: 'v5', no: 'Věta 5', name: 'Existence celé části', ch: 'uvod', skip22: true,
  stmt: R`Pro každé \(r\in\mathbb R\) existuje jediné \(k\in\mathbb Z\) s \(k\le r\lt k+1\). Značíme \(k=[r]\).`,
  plain: 'Každé číslo leží mezi dvěma sousedními celými čísly.',
  method: ['Supremum', 'Sporem (dílčí krok)'],
  idea: 'Vezmu supremum G všech celých čísel ≤ r. Celé číslo k „těsně pod supremem“ (k > G − 1) je hledaná celá část: k ≤ r, a k + 1 už je nad G, takže k + 1 > r.',
  need: [{ t: 'Tvrzení 3 (supremum)', ref: 't3' }],
  goal: R`\exists!\,k\in\mathbb Z:\ k\le r\lt k+1`,
  steps: [
    { g: 'Existence', h: 'Množina celých čísel pod r', m: R`M=\{m\in\mathbb Z;\ m\le r\}`, why: 'Je shora omezená číslem r. Abych mohl vzít supremum, potřebuju ještě M ≠ ∅.' },
    { g: 'Existence', h: 'M ≠ ∅ (sporem)', p: R`Kdyby \(M=\emptyset\), bylo by \(m>r\) pro každé \(m\in\mathbb Z\), takže \(\mathbb Z\) je zdola omezená a má infimum \(g\). Pro každé \(m\in\mathbb Z\) je i \(m-1\in\mathbb Z\), tedy \(m-1\ge g\):`, m: R`m\ge g+1\quad\forall m\in\mathbb Z`, why: 'Pak g + 1 > g je dolní závora ℤ, a to je spor s tím, že g je největší dolní závora.' },
    { g: 'Existence', h: 'Vezmu supremum a celé číslo těsně pod ním', m: R`G=\sup M,\qquad \exists k\in M:\ k>G-1`, why: 'G − 1 < G není horní závora M.', use: ['t3'] },
    { g: 'Existence', h: 'Ověřím k ≤ r < k + 1', m: R`k\in M\ \Rightarrow\ k\le r;\qquad k+1>G\ \Rightarrow\ k+1\notin M\ \Rightarrow\ k+1>r`, why: 'Kdyby k + 1 ∈ M, bylo by k + 1 ≤ G. A k + 1 je celé číslo, takže mimo M znamená k + 1 > r.' },
    { g: 'Jednoznačnost', h: 'Jiné celé číslo podmínku nesplní', p: R`Je-li \(k'\neq k\) celé, je buď \(k'\le k-1\), a pak \(k'+1\le k\le r\), nebo \(k'\ge k+1>r\). V obou případech \(k'\) podmínku \(k'\le r\lt k'+1\) nesplní.` }
  ],
  end: 'Celá část existuje a je jediná.',
  say: 'Vezmu M = celá čísla ≤ r. Je neprázdná, jinak by ℤ bylo zdola omezené s infimem g, a protože m − 1 ≥ g pro všechna m, byla by g + 1 větší dolní závora, spor. M je shora omezená r, takže má supremum G. G − 1 není horní závora, proto existuje k ∈ M s k > G − 1. Pak k ≤ r a k + 1 > G, takže k + 1 ∉ M, tedy k + 1 > r. Jiné celé číslo je o 1 menší nebo větší a nevyhoví.',
  pit: ['V roce 2022 se tento důkaz na přednášce vynechal. Postup je podle důkazů z let 2014/15.', 'Archimédovu vlastnost tu použít nesmíš. Dokazuje se až z celé části.'] },

{ id: 'v6', no: 'Věta 6', name: 'Archimédova vlastnost', ch: 'uvod',
  stmt: R`Ke každému \(x\in\mathbb R\) existuje \(n\in\mathbb N\) s \(x\lt n\).`,
  plain: 'Přirozená čísla přerostou každé reálné číslo.',
  method: ['Přímý důkaz', 'Rozbor případů'],
  idea: 'Okamžitě z celé části: [x] + 1 je celé číslo větší než x. Pro kladné x je navíc přirozené.',
  need: [{ t: 'Věta 5 (celá část)', ref: 'v5' }],
  steps: [
    { g: 'Případ x < 1', h: 'Stačí n = 1', m: R`x\lt1=n`, why: 'x < 1 a 1 je přirozené číslo, takže hledané n je prostě 1.' },
    { g: 'Případ x ≥ 1', h: 'Vezmu n = [x] + 1', m: R`[x]\ge1\ \Rightarrow\ n=[x]+1\in\mathbb N,\qquad x\lt[x]+1=n`, why: 'Z definice celé části r < [r] + 1. A [x] ≥ 1, protože 1 je celé číslo ≤ x.', use: ['v5'] }
  ],
  end: 'Souhrnně stačí n = max{1, [x] + 1}.',
  say: 'Podle Věty 5 má x celou část a platí x < [x] + 1. Je-li x ≥ 1, je [x] + 1 přirozené číslo větší než x. Je-li x < 1, stačí n = 1.' },

{ id: 'v7', no: 'Věta 7', name: 'O n-té odmocnině', ch: 'uvod', skip22: true,
  stmt: R`Pro každé \(x\ge0\) a \(n\in\mathbb N\) existuje jediné \(y\ge0\) s \(y^n=x\).`,
  plain: 'Každé nezáporné číslo má právě jednu nezápornou n-tou odmocninu.',
  method: ['Supremum', 'Sporem (dvakrát)'],
  idea: 'Kandidát je y = sup{z ≥ 0; zⁿ ≤ x}. Ukážu, že yⁿ < x nastat nemůže (šlo by posunout y kousek doprava) a yⁿ > x taky ne (šlo by ho posunout doleva). Zbývá yⁿ = x.',
  need: [{ t: 'Tvrzení 3 (supremum)', ref: 't3' }, { t: 'Tvrzení 2 (vi)', ref: 't2' }],
  goal: R`y=\sup\{z\ge0;\ z^n\le x\}\ \text{ splňuje } y^n=x`,
  steps: [
    { g: 'Existence', h: 'Množina kandidátů a její supremum', m: R`M=\{z\ge0;\ z^n\le x\},\qquad y=\sup M`, why: '0 ∈ M. M je omezená číslem max{1, x}: pro z > max{1, x} je zⁿ ≥ z > x.' },
    { g: 'Existence', h: 'Pomocný odhad pro rozdíl mocnin', m: R`0\le u\lt v:\qquad v^n-u^n=(v-u)\big(v^{n-1}+v^{n-2}u+\dots+u^{n-1}\big)\le(v-u)\,n\,v^{n-1}`, why: 'Každý z n členů v závorce je ≤ vⁿ⁻¹.' },
    { g: 'Existence', h: 'yⁿ < x nejde: posunu y kousek doprava', p: R`Zvolím \(0\lt h\lt1\) tak malé, aby \(h\,n\,(y+1)^{n-1}\lt x-y^n\). Pak podle odhadu:`, m: R`(y+h)^n-y^n\le h\,n\,(y+h)^{n-1}\le h\,n\,(y+1)^{n-1}\lt x-y^n\ \Longrightarrow\ (y+h)^n\lt x`, why: 'Tedy y + h ∈ M, ale y + h > y = sup M. Spor.' },
    { g: 'Existence', h: 'yⁿ > x nejde: posunu y kousek doleva', p: R`Pak \(y>0\). Zvolím \(0\lt h\lt y\) tak, aby \(h\,n\,y^{n-1}\lt y^n-x\). Podle odhadu:`, m: R`y^n-(y-h)^n\le h\,n\,y^{n-1}\lt y^n-x\ \Longrightarrow\ (y-h)^n>x`, why: 'Každé z ∈ M má zⁿ ≤ x < (y − h)ⁿ, tedy z < y − h podle Tvrzení 2 (vi). Takže y − h je menší horní závora než y. Spor.', use: ['t2'] },
    { g: 'Existence', h: 'Zbývá jediná možnost', m: R`y^n=x`, why: 'Kroky 3 a 4 vyloučily yⁿ < x i yⁿ > x. Pro dvě reálná čísla nastane vždy právě jedna z možností <, =, >, takže zbývá rovnost.' },
    { g: 'Jednoznačnost', h: 'Různá nezáporná čísla mají různé mocniny', p: R`Je-li \(0\le y_1\lt y_2\), je podle Tvrzení 2 (vi) \(y_1^n\lt y_2^n\). Obě tedy nemohou být rovny \(x\).`, use: ['t2'] }
  ],
  end: 'yⁿ = x a takové y je jediné.',
  say: 'Vezmu M = {z ≥ 0; zⁿ ≤ x}. Je neprázdná a omezená, takže má supremum y. Kdyby yⁿ < x, odhadem (y + h)ⁿ − yⁿ ≤ hn(y + 1)ⁿ⁻¹ najdu malé h, pro které je y + h pořád v M, a to je spor se supremem. Kdyby yⁿ > x, stejně najdu h, pro které je y − h ještě horní závora, a to je spor s tím, že supremum je nejmenší horní závora. Takže yⁿ = x. Jednoznačnost plyne z toho, že xⁿ je na ⟨0, ∞) rostoucí.',
  pit: ['V zápiscích 2022 tento důkaz chybí. Stačí umět myšlenku a odhad (y + h)ⁿ − yⁿ ≤ hn(y + 1)ⁿ⁻¹.'] },

{ id: 'v8', no: 'Věta 8', name: 'Hustota ℚ a ℝ∖ℚ', ch: 'uvod', fig: 'dense',
  stmt: R`Pro \(a\lt b\) existují \(r\in\mathbb Q\) a \(s\in\mathbb R\setminus\mathbb Q\) s \(a\lt r\lt b\) a \(a\lt s\lt b\).`,
  plain: 'V každém intervalu je racionální i iracionální číslo.',
  method: ['Přímý důkaz', 'Konstrukce'],
  idea: 'Zvolím krok 1/n kratší než délka intervalu. Pak do intervalu musí padnout nějaký násobek m/n, a to je hledané racionální číslo. Iracionální dostanu tak, že k němu přičtu malé √2/l.',
  need: [{ t: 'Věta 6 (Archimédova vlastnost)', ref: 'v6' }, { t: 'Věta 5 (celá část)', ref: 'v5' }, { t: '√2 ∉ ℚ', ref: 'sqrt2' }],
  steps: [
    { g: 'Racionální číslo', h: 'Zvolím krok kratší než interval', m: R`n\in\mathbb N:\ n>\frac1{b-a}\iff\frac1n\lt b-a`, why: 'Takové n existuje podle Archimédovy vlastnosti.', use: ['v6'] },
    { g: 'Racionální číslo', h: 'Vezmu první násobek 1/n napravo od a', m: R`m=[na]+1\in\mathbb Z\ \Longrightarrow\ na\lt m\le na+1`, why: 'Z definice celé části: [na] ≤ na < [na] + 1.', use: ['v5'] },
    { g: 'Racionální číslo', h: 'Vydělím n a dostanu r', m: R`a\lt\frac mn\le a+\frac1n\lt a+(b-a)=b`, why: 'Tedy r = m/n ∈ (a, b) ∩ ℚ.' },
    { g: 'Iracionální číslo', h: 'Posunu r o malé √2/l', m: R`s=r+\frac{\sqrt2}{l},\qquad l\in\mathbb N,\ \ l>\frac{\sqrt2}{b-r}`, why: 'Takové l existuje (Archimédes). Pak 0 < √2/l < b − r, takže a < r < s < b.' },
    { g: 'Iracionální číslo', h: 'Ukážu s ∉ ℚ (sporem)', m: R`s\in\mathbb Q\ \Longrightarrow\ \sqrt2=l\,(s-r)\in\mathbb Q`, why: 'Rozdíl a součin racionálních čísel je racionální. To je spor s iracionalitou √2.', use: ['sqrt2'] }
  ],
  end: 'r ∈ ℚ i s ∉ ℚ leží v (a, b).',
  say: 'Podle Archimédovy vlastnosti zvolím n s 1/n < b − a. Vezmu m = [na] + 1, takže na < m ≤ na + 1, a po vydělení n je a < m/n ≤ a + 1/n < b. To je racionální r. Iracionální s = r + √2/l, kde l je tak velké, že √2/l < b − r. Kdyby s bylo racionální, bylo by i √2 = l(s − r) racionální, spor.' }
);

PROOFS.push(
{ id: 'nn', no: 'Příklad', name: 'Limita ⁿ√n = 1', ch: 'posl',
  stmt: R`\(\displaystyle\lim_{n\to\infty}\sqrt[n]n=1\).`,
  plain: 'n-tá odmocnina z n se blíží jedničce.',
  method: ['Odhad', 'Dva policajti'],
  idea: 'Označím uₙ = ⁿ√n − 1 ≥ 0, takže n = (1 + uₙ)ⁿ. Z binomické věty si nechám jediný člen a dostanu odhad 0 ≤ uₙ ≤ √(2/(n − 1)). Pravá strana jde k nule.',
  need: [{ t: 'Binomická věta', ref: 'binom' }, { t: 'Věta 15 (dva policajti)', ref: 'v15' }],
  goal: R`u_n:=\sqrt[n]n-1\to0`,
  steps: [
    { h: 'Označím odchylku od jedničky', m: R`u_n=\sqrt[n]n-1\ge0,\qquad n=(1+u_n)^n`, why: 'Pro n ≥ 1 je ⁿ√n ≥ 1, protože kdyby ⁿ√n < 1, bylo by i n < 1.' },
    { h: 'Z binomické věty nechám jen člen k = 2', m: R`n=(1+u_n)^n=\sum_{k=0}^n\binom nk u_n^k\ \ge\ \binom n2u_n^2=\frac{n(n-1)}2\,u_n^2\qquad(n\ge2)`, why: 'Všechny členy součtu jsou nezáporné, takže když je vynechám, součet se nezvětší.', use: ['binom'] },
    { h: 'Vyjádřím uₙ', m: R`u_n^2\le\frac2{n-1}\ \Longrightarrow\ 0\le u_n\le\sqrt{\frac2{n-1}}`, why: 'Nerovnost n ≥ n(n − 1)/2 · uₙ² z kroku 2 vydělím kladným číslem n(n − 1)/2 (n ≥ 2). Pak odmocním: obě strany jsou nezáporné a odmocnina nerovnost zachová.' },
    { h: 'Horní odhad jde k nule', p: R`Pro dané \(\varepsilon>0\) je \(\sqrt{\frac2{n-1}}\lt\varepsilon\) právě když \(n>1+\frac2{\varepsilon^2}\).` },
    { h: 'Dva policajti', m: R`0\le u_n\le\sqrt{\frac2{n-1}},\qquad 0\to0,\ \ \sqrt{\frac2{n-1}}\to0\ \Longrightarrow\ u_n\to0`, use: ['v15'], why: 'Věta 15 o dvou policajtech: uₙ je sevřená mezi 0 a √(2/(n − 1)) a obě meze jdou k 0 (krok 4). Tedy uₙ → 0, a proto ⁿ√n = 1 + uₙ → 1.' }
  ],
  end: 'uₙ → 0, tedy ⁿ√n = 1 + uₙ → 1.',
  say: 'Napíšu ⁿ√n = 1 + uₙ s uₙ ≥ 0, takže n = (1 + uₙ)ⁿ. Z binomické věty si nechám jen člen s k = 2: n ≥ n(n − 1)/2 · uₙ². Odtud uₙ ≤ √(2/(n − 1)), a to jde k nule. Podle dvou policajtů uₙ → 0, tedy ⁿ√n → 1.' },

{ id: 'v9', no: 'Věta 9', name: 'Jednoznačnost limity', ch: 'posl', fig: 'unique',
  stmt: R`Každá posloupnost má nejvýše jednu limitu.`,
  plain: 'Posloupnost se nemůže blížit dvěma různým číslům zároveň.',
  method: ['Sporem'],
  idea: 'Sporem. Kolem dvou limit A < B nakreslím pásy šířky ε = (B − A)/2. Ty se nepřekrývají, ale od jistého indexu by členy musely ležet v obou najednou.',
  need: [{ t: 'definice limity: ∀ε > 0 ∃n₀ ∀n ≥ n₀: |aₙ − A| < ε' }],
  steps: [
    { h: 'Předpokládám dvě různé limity', m: R`a_n\to A,\qquad a_n\to B,\qquad A\lt B`, why: 'Bez újmy na obecnosti A < B, jinak je prohodím.' },
    { h: 'Zvolím ε tak, aby se pásy nepřekrývaly', m: R`\varepsilon=\frac{B-A}2\quad\Longrightarrow\quad A+\varepsilon=B-\varepsilon`, why: 'Intervaly (A − ε, A + ε) a (B − ε, B + ε) se pak jen dotýkají v bodě (A + B)/2, který do žádného nepatří.' },
    { h: 'Použiju definici limity pro obě limity', m: R`\exists n_1\ \forall n\ge n_1:\ a_n\lt A+\varepsilon,\qquad\exists n_2\ \forall n\ge n_2:\ a_n>B-\varepsilon`, why: 'Definice limity říká |aₙ − A| < ε, tj. A − ε < aₙ < A + ε, a pro B stejně: B − ε < aₙ < B + ε. Z každé dvojice nerovností si vezmu jen tu polovinu, kterou potřebuju: od A horní odhad aₙ < A + ε, od B dolní odhad aₙ > B − ε. Obrázkově: aₙ musí být v pásu kolem B, tedy nad jeho dolním okrajem B − ε.' },
    { h: 'Člen s indexem m = max{n₁, n₂} je v obou pásech', m: R`a_m\lt A+\varepsilon=B-\varepsilon\lt a_m`, why: 'To je spor: a_m < a_m.' }
  ],
  end: 'Dvě různé limity mít nelze.',
  say: 'Sporem: ať aₙ → A i aₙ → B, A < B. Zvolím ε = (B − A)/2, takže A + ε = B − ε. Od jistého n₁ je aₙ < A + ε, od jistého n₂ je aₙ > B − ε. Pro n = max{n₁, n₂} platí obojí, tedy aₙ < A + ε = B − ε < aₙ, a to je spor.',
  pit: ['Pomůcka: lim aₙ = A ⟺ lim (aₙ − A) = 0 ⟺ lim |aₙ − A| = 0.', 'Pro nevlastní limity totéž s okolími: okolí +∞ a okolí reálného čísla se dají zvolit disjunktní.'] },

{ id: 'v10', no: 'Věta 10', name: 'Omezenost konvergentní posloupnosti', ch: 'posl', fig: 'bounded',
  stmt: R`Každá konvergentní posloupnost je omezená.`,
  plain: 'Když se posloupnost někam blíží, nemůže utíkat do nekonečna.',
  method: ['Přímý důkaz'],
  idea: 'Od jistého indexu jsou členy v pásu (a − 1, a + 1). Před ním je jich jen konečně mnoho, a konečně mnoho čísel má vždy maximum a minimum.',
  need: [{ t: 'definice limity (s ε = 1)' }],
  steps: [
    { h: 'Definice limity pro ε = 1', m: R`a_n\to a\ \Longrightarrow\ \exists n_0\ \forall n\ge n_0:\ a-1\lt a_n\lt a+1`, why: 'ε v definici smím zvolit libovolně. 1 je nejpohodlnější.' },
    { h: 'Zbylé členy jsou jen konečně mnoho', m: R`M=\max\{a_1,\dots,a_{n_0-1}\},\qquad m=\min\{a_1,\dots,a_{n_0-1}\}`, why: 'Maximum a minimum konečné množiny existuje vždy. Pro n₀ = 1 tento krok odpadá.' },
    { h: 'Spojím obě části', m: R`\min\{m,\ a-1\}\ \le\ a_n\ \le\ \max\{M,\ a+1\}\qquad\forall n\in\mathbb N`, why: 'Pro n ≥ n₀ platí odhad z kroku 1, pro n < n₀ odhad z kroku 2. Menší z dolních mezí a větší z horních mezí platí pro všechna n najednou, takže posloupnost je omezená.' }
  ],
  end: 'Posloupnost je omezená zdola i shora.',
  say: 'Z definice limity s ε = 1 jsou všechny členy od indexu n₀ v intervalu (a − 1, a + 1). Před n₀ je jen konečně mnoho členů, ty mají maximum M a minimum m. Celá posloupnost je tedy mezi min{m, a − 1} a max{M, a + 1}.',
  pit: ['Obrácení neplatí: (−1)ⁿ je omezená, ale limitu nemá.'] },

{ id: 'v11', no: 'Věta 11', name: 'Limita vybrané posloupnosti', ch: 'posl',
  stmt: R`Je-li \(a_n\to A\in\mathbb R\) a \(b_k=a_{n_k}\) je vybraná posloupnost (\(n_k\) rostoucí), pak \(b_k\to A\).`,
  plain: 'Každá podposloupnost má stejnou limitu jako celá posloupnost.',
  method: ['Přímý důkaz', 'Indukce (pomocné tvrzení)'],
  idea: 'Indexy nₖ rostou aspoň tak rychle jako k. Kdo je dost daleko v podposloupnosti, je dost daleko i v původní posloupnosti, takže stačí stejné n₀.',
  need: [{ t: 'definice vybrané posloupnosti (n₁ < n₂ < …)' }],
  steps: [
    { h: 'Indexy rostou aspoň jako k', m: R`n_k\ge k\qquad\forall k\in\mathbb N`, why: 'Indukcí: n₁ ≥ 1, a z nₖ ≥ k plyne n_{k+1} > nₖ ≥ k, tedy n_{k+1} ≥ k + 1 (indexy jsou celá čísla).' },
    { h: 'Vezmu ε a n₀ z limity aₙ → A', m: R`\forall\varepsilon>0\ \exists n_0\ \forall n\ge n_0:\ |a_n-A|\lt\varepsilon`, why: 'Chci ověřit definici limity pro bₖ. Zvolím tedy libovolné ε > 0 a k němu použiju definici aₙ → A: dostanu index n₀.' },
    { h: 'Pro k ≥ n₀ je i nₖ ≥ n₀', m: R`k\ge n_0\ \Longrightarrow\ n_k\ge k\ge n_0\ \Longrightarrow\ |b_k-A|=|a_{n_k}-A|\lt\varepsilon`, why: 'Podle kroku 1 je nₖ ≥ k ≥ n₀, takže pro člen a_{nₖ} platí odhad z kroku 2. Jako hledaný index pro bₖ tedy stačí vzít n₀.' }
  ],
  end: 'bₖ → A. Pro A = ±∞ stejně s podmínkou aₙ > K.',
  say: 'Nejdřív indukcí nₖ ≥ k. Ke každému ε najdu n₀ z limity aₙ. Pro k ≥ n₀ je nₖ ≥ k ≥ n₀, takže |bₖ − A| = |a_{nₖ} − A| < ε. Podposloupnost má tedy stejnou limitu.',
  pit: ['Použití: když má posloupnost dvě podposloupnosti s různými limitami, limitu nemá. Například (−1)ⁿ: sudé členy → 1, liché → −1.'] },

{ id: 'v12', no: 'Věta 12', name: 'Aritmetika limit', ch: 'posl',
  stmt: R`Nechť \(a_n\to A\in\mathbb R\), \(b_n\to B\in\mathbb R\). Pak (i) \(a_n+b_n\to A+B\); (ii) \(a_nb_n\to AB\); (iii) je-li \(B\neq0\) a \(b_n\neq0\), pak \(\frac{a_n}{b_n}\to\frac AB\).`,
  plain: 'Limita součtu, součinu a podílu je součet, součin a podíl limit.',
  method: ['ε odhad', 'Trojúhelníková nerovnost'],
  idea: 'Každý bod je jeden odhad trojúhelníkovou nerovností. Trik: stačí ukázat |…| < K·ε s pevným číslem K, protože ε je libovolné. U součinu přičtu a odečtu A·bₙ. U podílu nejdřív ukážu 1/bₙ → 1/B a k tomu potřebuju, aby bₙ bylo „odražené od nuly“.',
  need: [{ t: 'trojúhelníková nerovnost |x + y| ≤ |x| + |y|' }, { t: 'Věta 10 (omezenost)', ref: 'v10' }],
  steps: [
    { g: '(i) Součet', h: 'Rozdělím ε napůl', m: R`\exists n_1\ \forall n\ge n_1:\ |a_n-A|\lt\tfrac\varepsilon2,\qquad\exists n_2\ \forall n\ge n_2:\ |b_n-B|\lt\tfrac\varepsilon2`, why: 'Definici limity smím použít s libovolným kladným číslem, tedy i s ε/2.' },
    { g: '(i) Součet', h: 'Trojúhelníková nerovnost', m: R`n\ge\max\{n_1,n_2\}:\quad|(a_n+b_n)-(A+B)|\le|a_n-A|+|b_n-B|\lt\tfrac\varepsilon2+\tfrac\varepsilon2=\varepsilon`, why: 'Trojúhelníková nerovnost |u + v| ≤ |u| + |v| pro u = aₙ − A a v = bₙ − B. Pro n ≥ max{n₁, n₂} platí oba odhady z kroku 1 zároveň.' },
    { g: '(ii) Součin', h: 'Přičtu a odečtu A·bₙ', m: R`|a_nb_n-AB|=|(a_n-A)\,b_n+A\,(b_n-B)|\le|a_n-A|\,|b_n|+|A|\,|b_n-B|`, why: 'Tak dostanu rozdíly |aₙ − A| a |bₙ − B|, které umím zmenšit.' },
    { g: '(ii) Součin', h: 'Omezím |bₙ| pevnou konstantou', m: R`|b_n|\le M\ \ \forall n\ \Longrightarrow\ |a_nb_n-AB|\lt M\varepsilon+|A|\varepsilon=(M+|A|)\,\varepsilon`, why: 'Konvergentní posloupnost je omezená (Věta 10). Pro n, kde |aₙ − A| < ε i |bₙ − B| < ε. K = M + |A| je pevné, takže to stačí.', use: ['v10'] },
    { g: '(iii) Podíl', h: 'Jmenovatel je od jistého indexu odražený od nuly', m: R`\exists n_4\ \forall n\ge n_4:\ |b_n-B|\lt\frac{|B|}2\ \Longrightarrow\ |b_n|\ge|B|-|b_n-B|>\frac{|B|}2`, why: 'Definice limity pro ε = |B|/2 > 0. Tady potřebuju B ≠ 0.' },
    { g: '(iii) Podíl', h: 'Odhadnu 1/bₙ − 1/B', m: R`n\ge n_4:\quad\Big|\frac1{b_n}-\frac1B\Big|=\frac{|B-b_n|}{|b_n|\,|B|}\lt\frac2{|B|^2}\,|b_n-B|`, why: 'Jmenovatel |bₙ||B| > |B|²/2. Konstanta 2/|B|² je pevná, takže 1/bₙ → 1/B.' },
    { g: '(iii) Podíl', h: 'Podíl napíšu jako součin', m: R`\frac{a_n}{b_n}=a_n\cdot\frac1{b_n}\ \longrightarrow\ A\cdot\frac1B=\frac AB`, why: 'Podle bodu (ii) pro posloupnosti aₙ a 1/bₙ.' }
  ],
  end: 'Všechny tři vzorce platí.',
  say: 'U součtu rozdělím ε napůl a použiju trojúhelníkovou nerovnost. U součinu přičtu a odečtu A·bₙ: |aₙbₙ − AB| ≤ |aₙ − A||bₙ| + |A||bₙ − B|, a protože je bₙ omezená číslem M, je to menší než (M + |A|)ε. U podílu nejdřív z definice limity s ε = |B|/2 dostanu |bₙ| > |B|/2, takže |1/bₙ − 1/B| < 2|bₙ − B|/|B|² → 0. Podíl je pak součin aₙ · 1/bₙ.',
  pit: ['Bez předpokladů věta neplatí: aₙ = (−1)ⁿ, bₙ = −(−1)ⁿ mají aₙ + bₙ → 0, ale samy limitu nemají.', 'Stačí dostat |…| < K·ε s pevným K. Zkoušející to někdy chce „dotáhnout“: pak na začátku použij ε/K místo ε.'],
  ask: [['Proč v (ii) potřebuju omezenost?', 'Abych |bₙ| nahradil pevným číslem M a dostal K·ε. Kdyby |bₙ| mohlo růst, odhad by nefungoval.'], ['Proč v (iii) potřebuju B ≠ 0?', 'Aby bylo možné dělit B a aby šlo bₙ „odrazit od nuly“: |bₙ| > |B|/2 > 0.']] },

{ id: 'v13', no: 'Věta 13', name: 'Omezená krát nulová', ch: 'posl',
  stmt: R`Je-li \(a_n\to0\) a \(\{b_n\}\) je omezená, pak \(a_nb_n\to0\).`,
  plain: 'Něco omezeného krát něco, co jde k nule, jde k nule.',
  method: ['ε odhad'],
  idea: '|aₙbₙ| ≤ M·|aₙ| a |aₙ| umím dostat pod ε/M. Aritmetiku limit tu použít nejde, protože bₙ limitu mít nemusí.',
  steps: [
    { h: 'Omezenost bₙ', m: R`\exists M>0:\ |b_n|\le M\quad\forall n`, why: 'Předpoklad věty: omezená posloupnost. Beru M > 0 (ne jen M ≥ 0), protože v dalším kroku budu dělit M.' },
    { h: 'Definice aₙ → 0 s číslem ε/M', m: R`\exists n_0\ \forall n\ge n_0:\ |a_n|\lt\frac\varepsilon M`, why: 'ε/M > 0 je přípustné „epsilon“ v definici limity.' },
    { h: 'Odhadnu součin', m: R`n\ge n_0:\quad|a_nb_n-0|=|a_n|\,|b_n|\lt\frac\varepsilon M\cdot M=\varepsilon`, why: 'Pro n ≥ n₀ je |aₙ| < ε/M (krok 2) a |bₙ| ≤ M vždy, takže |aₙ||bₙ| ≤ |aₙ| · M < ε. ε bylo libovolné, tedy aₙbₙ → 0.' }
  ],
  end: 'aₙbₙ → 0.',
  say: 'bₙ je omezená, tedy |bₙ| ≤ M. Z definice limity aₙ → 0 s číslem ε/M najdu n₀, od kterého je |aₙ| < ε/M. Pak |aₙbₙ| < ε/M · M = ε.',
  pit: ['Typické použití: sin n / n → 0. Aritmetika limit tu nejde, protože sin n nemá limitu.'] },

{ id: 'v14', no: 'Věta 14', name: 'Limita a uspořádání', ch: 'posl', fig: 'order',
  stmt: R`Nechť \(a_n\to A\), \(b_n\to B\). (i) Je-li od jistého indexu \(a_n\ge b_n\), pak \(A\ge B\). (ii) Je-li \(A\lt B\), pak od jistého indexu \(a_n\lt b_n\).`,
  plain: 'Nerovnost mezi členy se přenese na limity (ale jen neostrá).',
  method: ['ε odhad', 'Sporem (bod i)'],
  idea: 'Nejdřív dokážu (ii): pásy kolem A a B šířky ε = (B − A)/2 se nepřekrývají, takže aₙ je v dolním pásu a bₙ v horním. Bod (i) pak plyne z (ii) sporem.',
  need: [{ t: 'Věta 9 (stejný trik s pásy)', ref: 'v9' }],
  steps: [
    { g: '(ii) A < B ⇒ aₙ < bₙ', h: 'Zvolím pásy, které se nepřekrývají', m: R`\varepsilon=\frac{B-A}2\quad\Longrightarrow\quad A+\varepsilon=B-\varepsilon`, why: 'Stejný trik jako u Věty 9: pás kolem A a pás kolem B o poloměru ε = (B − A)/2 se jen dotknou v bodě (A + B)/2, takže se nepřekrývají.' },
    { g: '(ii) A < B ⇒ aₙ < bₙ', h: 'Definice limity pro obě posloupnosti', m: R`\exists n_1\ \forall n\ge n_1:\ a_n\lt A+\varepsilon,\qquad\exists n_2\ \forall n\ge n_2:\ b_n>B-\varepsilon`, why: 'Z definice limity |aₙ − A| < ε, tj. A − ε < aₙ < A + ε, si vezmu jen horní odhad. Z |bₙ − B| < ε, tj. B − ε < bₙ < B + ε, jen dolní odhad.' },
    { g: '(ii) A < B ⇒ aₙ < bₙ', h: 'Od n₀ = max{n₁, n₂} jsou členy v pásech', m: R`n\ge n_0:\quad a_n\lt A+\varepsilon=B-\varepsilon\lt b_n`, why: 'Od n₀ platí oba odhady z kroku 2 zároveň a podle kroku 1 je A + ε = B − ε. Tedy aₙ < bₙ, a to je tvrzení (ii).' },
    { g: '(i) aₙ ≥ bₙ ⇒ A ≥ B', h: 'Sporem pomocí (ii)', p: R`Nechť \(a_n\ge b_n\) pro \(n\ge n_3\) a přitom \(A\lt B\). Podle (ii) je \(a_n\lt b_n\) pro \(n\ge n_0\). Pro \(n\ge\max\{n_0,n_3\}\) by platilo obojí, a to je spor.` }
  ],
  end: 'Obě části platí.',
  say: 'Nejdřív (ii): je-li A < B, zvolím ε = (B − A)/2, takže A + ε = B − ε. Od jistého indexu je aₙ < A + ε a bₙ > B − ε, tedy aₙ < bₙ. Bod (i) sporem: kdyby aₙ ≥ bₙ a přitom A < B, dalo by (ii) od jistého indexu aₙ < bₙ, a to je spor.',
  pit: ['aₙ ≥ bₙ ⇒ A ≥ B: ano.', 'aₙ > bₙ ⇒ A > B: NE (2/n > 1/n, obě limity jsou 0).', 'A ≥ B ⇒ aₙ ≥ bₙ: ne.', 'A > B ⇒ aₙ > bₙ od jistého indexu: ano.'] },

{ id: 'v15', no: 'Věta 15', name: 'O dvou policajtech', ch: 'posl', fig: 'police',
  stmt: R`Nechť \(a_n\to A\), \(b_n\to A\) a od jistého indexu \(a_n\le c_n\le b_n\). Pak \(c_n\to A\).`,
  plain: 'Co je sevřené mezi dvěma posloupnostmi se stejnou limitou, má tu limitu taky.',
  method: ['ε odhad'],
  idea: 'Oba policajti jsou od jistého indexu v pásu (A − ε, A + ε). Posloupnost cₙ je mezi nimi, takže je v tom pásu taky.',
  steps: [
    { h: 'Co chci ukázat', m: R`\forall\varepsilon>0\ \exists n_3\ \forall n\ge n_3:\ A-\varepsilon\lt c_n\lt A+\varepsilon`, why: 'To je definice cₙ → A rozepsaná na dvě nerovnosti: |cₙ − A| < ε ⟺ A − ε < cₙ < A + ε. Dolní dostanu od aₙ, horní od bₙ.' },
    { h: 'Dolní policajt je nad A − ε', m: R`a_n\to A\ \Longrightarrow\ \exists n_1\ \forall n\ge n_1:\ a_n>A-\varepsilon`, why: 'Definice aₙ → A dává A − ε < aₙ < A + ε. Potřebuju jen levou polovinu.' },
    { h: 'Horní policajt je pod A + ε', m: R`b_n\to A\ \Longrightarrow\ \exists n_2\ \forall n\ge n_2:\ b_n\lt A+\varepsilon`, why: 'Definice bₙ → A dává A − ε < bₙ < A + ε. Potřebuju jen pravou polovinu.' },
    { h: 'Sevřu cₙ mezi ně', m: R`n\ge n_3=\max\{n_0,n_1,n_2\}:\quad A-\varepsilon\lt a_n\le c_n\le b_n\lt A+\varepsilon`, why: 'n₀ je index, od kterého platí aₙ ≤ cₙ ≤ bₙ.' }
  ],
  end: '|cₙ − A| < ε od indexu n₃, tedy cₙ → A.',
  say: 'Vezmu ε > 0. Od jistého indexu je aₙ > A − ε, od jiného je bₙ < A + ε a od jiného platí aₙ ≤ cₙ ≤ bₙ. Od maxima těch tří indexů je A − ε < aₙ ≤ cₙ ≤ bₙ < A + ε, tedy |cₙ − A| < ε.',
  pit: ['Pro A = +∞ stačí jen dolní policajt (Věta 15′).'] },

{ id: 'v12p', no: 'Věta 12′', name: 'Aritmetika limit v ℝ*', ch: 'posl',
  stmt: R`Nechť \(a_n\to A\in\mathbb R^*\), \(b_n\to B\in\mathbb R^*\). Pak \(a_n\pm b_n\to A\pm B\), \(a_nb_n\to AB\), \(\frac{a_n}{b_n}\to\frac AB\), je-li pravá strana definována.`,
  plain: 'Aritmetika limit funguje i s nekonečny, kromě neurčitých výrazů.',
  method: ['Rozbor případů', 'Definice nevlastní limity'],
  idea: 'Konečné případy už jsou ve Větě 12. Pro nekonečno pracuju s definicí „aₙ > K od jistého indexu“. Vždy stačí, aby druhá posloupnost byla od jistého indexu „rozumně omezená“ (zdola, nebo odražená od nuly).',
  need: [{ t: 'Věta 12', ref: 'v12' }, { t: 'aₙ → +∞ ⟺ ∀K ∃n₀ ∀n ≥ n₀: aₙ > K' }],
  steps: [
    { h: 'Konečné případy jsou hotové', p: R`Jsou-li \(A,B\in\mathbb R\), je to Věta 12. Dál je aspoň jedna z limit nekonečná.`, use: ['v12'] },
    { g: '(i) Součet', h: '+∞ plus posloupnost zdola omezená', m: R`A=+\infty,\ B>-\infty:\qquad b_n>L\ \text{ od jist. indexu}`, why: 'Pro B ∈ ℝ stačí L = B − 1, pro B = +∞ třeba L = 0.' },
    { g: '(i) Součet', h: 'Ke K zvolím mez pro aₙ o L níž', m: R`a_n>K-L\ \Longrightarrow\ a_n+b_n>K-L+L=K`, why: 'K je libovolné, takže aₙ + bₙ → +∞.' },
    { g: '(ii) Součin', h: '+∞ krát kladné B: bₙ je odražené od nuly', m: R`A=+\infty,\ B>0:\qquad b_n>c>0\ \text{ od jist. indexu}`, why: 'Pro B ∈ ℝ stačí c = B/2 (definice limity s ε = B/2), pro B = +∞ třeba c = 1.' },
    { g: '(ii) Součin', h: 'Ke K zvolím mez pro aₙ', m: R`a_n>\frac Kc\ \Longrightarrow\ a_nb_n>\frac Kc\cdot c=K`, why: 'Násobím kladnými čísly, takže nerovnosti se zachovají.' },
    { g: '(iii) Podíl', h: 'Je-li B = ±∞, jde 1/bₙ k nule', m: R`|b_n|>\frac1\varepsilon\ \text{ od jist. indexu}\ \Longrightarrow\ \Big|\frac1{b_n}\Big|\lt\varepsilon`, why: 'Pro B = +∞ dá definice limity s mezí 1/ε odhad bₙ > 1/ε, pro B = −∞ odhad bₙ < −1/ε. V obou případech |bₙ| > 1/ε a po převrácení |1/bₙ| < ε. Tedy 1/bₙ → 0.' },
    { g: '(iii) Podíl', h: 'Podíl převedu na součin', m: R`\frac{a_n}{b_n}=a_n\cdot\frac1{b_n}`, why: 'Pro B = ±∞ a A ∈ ℝ vyjde A · 0 = 0 podle Věty 12. Pro B ∈ ℝ ∖ {0} jde 1/bₙ → 1/B a použiju (ii).' },
    { h: 'Ostatní znaménka', p: R`Případy s \(-\infty\) nebo se záporným \(B\) převedu na předchozí přes \(-a_n\), \(-b_n\).` }
  ],
  end: 'Vzorce platí ve všech případech, kdy je pravá strana definována.',
  say: 'Konečné případy jsou Věta 12. Pro A = +∞ a B > −∞ je bₙ od jistého indexu zdola omezená číslem L, takže pro aₙ > K − L je aₙ + bₙ > K. U součinu s B > 0 je bₙ > c > 0, takže pro aₙ > K/c je aₙbₙ > K. U podílu s B = ±∞ jde 1/bₙ k nule a podíl je součin aₙ · 1/bₙ. Zbytek přes změnu znaménka.',
  pit: ['Neurčité výrazy: ∞ − ∞, 0 · (±∞), ±∞/±∞ a dělení nulou. Může vyjít cokoli: (n + 2) − n → 2, (2n + 1) − n → ∞.'] },

{ id: 'v16', no: 'Věta 16', name: 'Dělení kladnou nulou', ch: 'posl',
  stmt: R`Nechť \(a_n\to A\in\mathbb R^*\), \(A>0\), \(b_n\to0\) a od jistého indexu \(b_n>0\). Pak \(\frac{a_n}{b_n}\to+\infty\).`,
  plain: 'Kladné číslo děleno „kladnou nulou“ je +∞.',
  method: ['Definice nevlastní limity', 'Odhad'],
  idea: 'Čitatel je od jistého indexu větší než nějaké kladné c, jmenovatel je kladný a menší než libovolně malé číslo. Intuice: 1/0,001 = 1000.',
  steps: [
    { h: 'Co chci ukázat', m: R`\forall K>0\ \exists n_3\ \forall n\ge n_3:\ \frac{a_n}{b_n}>K`, why: 'Definice limity +∞: podíl přeroste každou mez K. Stačí to ověřit pro K > 0, pro menší K to platí tím spíš.' },
    { h: 'Čitatel je odražený od nuly', m: R`\exists n_1\ \forall n\ge n_1:\ a_n>c,\qquad c=\begin{cases}A/2,&A\in\mathbb R\\1,&A=+\infty\end{cases}`, why: 'Pro A ∈ ℝ definice limity s ε = A/2, pro A = +∞ definice s mezí 1.' },
    { h: 'Jmenovatel je kladný a malý', m: R`\exists n_2\ \forall n\ge n_2:\ |b_n|\lt\frac cK\qquad\Longrightarrow\qquad 0\lt b_n\lt\frac cK\ \Rightarrow\ \frac1{b_n}>\frac Kc`, why: 'Definice bₙ → 0 s ε = c/K. Kladnost platí od indexu n₀ z předpokladu.' },
    { h: 'Vynásobím', m: R`n\ge n_3=\max\{n_0,n_1,n_2\}:\quad\frac{a_n}{b_n}=a_n\cdot\frac1{b_n}>c\cdot\frac Kc=K`, why: 'Od n₃ platí všechny odhady najednou: aₙ > c (krok 2) a 1/bₙ > K/c (krok 3). Násobím kladná čísla, takže nerovnosti se zachovají.' }
  ],
  end: 'Podíl jde k +∞.',
  say: 'Ke K > 0 hledám index, od kterého je aₙ/bₙ > K. Čitatel je od jistého indexu větší než c = A/2 (pro A = ∞ třeba c = 1). Jmenovatel je od jistého indexu kladný a menší než c/K, takže 1/bₙ > K/c. Součin je pak větší než c · K/c = K.',
  pit: ['Bez podmínky bₙ > 0 neplatí: 1 / ((−1)ⁿ/n) = (−1)ⁿn limitu nemá.'] },

{ id: 'v15p', no: 'Věta 15′', name: 'O jednom policajtovi', ch: 'posl',
  stmt: R`Je-li \(a_n\to+\infty\) a od jistého indexu \(b_n\ge a_n\), pak \(b_n\to+\infty\). (Analogicky pro \(-\infty\).)`,
  plain: 'Co je nad něčím, co jde do nekonečna, jde do nekonečna taky.',
  method: ['Definice nevlastní limity'],
  idea: 'Pro nekonečnou limitu stačí jen dolní policajt: když aₙ přeroste každou mez K, bₙ je ještě výš.',
  steps: [
    { h: 'Vezmu libovolnou mez K', m: R`a_n\to+\infty\ \Longrightarrow\ \exists n_1\ \forall n\ge n_1:\ a_n>K`, why: 'Chci ukázat definici bₙ → +∞: ke každé mezi K najít index, od kterého je bₙ > K. Stejné K nejdřív použiju pro aₙ.' },
    { h: 'Horní posloupnost je ještě výš', m: R`n\ge\max\{n_0,n_1\}:\quad b_n\ge a_n>K`, why: 'n₀ je index, od kterého platí bₙ ≥ aₙ.' }
  ],
  end: 'bₙ → +∞. Pro −∞ stejně s horním policajtem bₙ ≤ aₙ.',
  say: 'Ke každému K je od jistého indexu aₙ > K a od jiného bₙ ≥ aₙ. Od maxima obou indexů je bₙ > K, tedy bₙ → +∞.' },

{ id: 'l17', no: 'Lemma 17', name: 'Charakterizace suprema', ch: 'posl',
  stmt: R`Nechť \(\emptyset\neq M\subset\mathbb R\), \(G\in\mathbb R^*\). Ekvivalentní: (i) \(G=\sup M\); (ii) \(G\) je horní závora \(M\) a existují \(x_n\in M\) s \(x_n\to G\).`,
  plain: 'Supremum je horní závora, ke které se dá „doběhnout“ prvky množiny.',
  method: ['Ekvivalence (dva směry)', 'Rozbor případů'],
  idea: 'Prvky M se dají k supremu přiblížit libovolně blízko. Z přiblížení na 1/n poskládám posloupnost. Opačně: když se k G blíží prvky M, nic menšího než G nemůže být horní závora.',
  need: [{ t: 'definice suprema' }, { t: 'Věta 15 (dva policajti)', ref: 'v15' }, { t: 'Věta 14 (limita a uspořádání)', ref: 'v14' }],
  steps: [
    { g: '(i) ⇒ (ii)', h: 'G konečné: ke každému n najdu prvek nad G − 1/n', m: R`\exists x_n\in M:\ G-\frac1n\lt x_n\le G`, why: 'G − 1/n < G už horní závora není (vlastnost (ii) suprema). Horní nerovnost platí, protože G je horní závora.' },
    { g: '(i) ⇒ (ii)', h: 'Dva policajti dají xₙ → G', m: R`G-\frac1n\to G,\quad G\to G\ \Longrightarrow\ x_n\to G`, use: ['v15'], why: 'Věta 15 o dvou policajtech: G − 1/n < xₙ ≤ G a obě meze jdou k G, protože 1/n → 0.' },
    { g: '(i) ⇒ (ii)', h: 'G = +∞: M není shora omezená', m: R`\exists x_n\in M:\ x_n>n\ \Longrightarrow\ x_n\to+\infty`, why: 'Žádné n není horní závora. Poslední implikace je jeden policajt.' },
    { g: '(ii) ⇒ (i)', h: 'G je horní závora: to dává předpoklad', p: R`Zbývá ukázat, že žádné \(G'\lt G\) není horní závora.` },
    { g: '(ii) ⇒ (i)', h: 'G konečné: členy xₙ přeskočí každé G′ < G', m: R`x_n\to G>G'\ \Longrightarrow\ \exists n:\ x_n>G'`, why: 'Věta 14 (ii) pro posloupnost xₙ a konstantní posloupnost G′. Takže G′ není horní závora.', use: ['v14'] },
    { g: '(ii) ⇒ (i)', h: 'G = +∞: M přeroste každou mez', p: R`Z \(x_n\to+\infty\) je pro každé \(K\) nějaké \(x_n>K\). M tedy není shora omezená a \(\sup M=+\infty\).` }
  ],
  end: 'Obě podmínky jsou ekvivalentní.',
  say: '(i) ⇒ (ii): je-li G konečné supremum, G − 1/n není horní závora, takže existuje xₙ ∈ M mezi G − 1/n a G. Podle policajtů xₙ → G. Pro G = +∞ volím xₙ > n. (ii) ⇒ (i): G je horní závora a pro G′ < G je od jistého indexu xₙ > G′, takže G′ horní závora není. Proto je G nejmenší horní závora.' },

{ id: 'v18', no: 'Věta 18', name: 'Limita monotónní posloupnosti', ch: 'posl', fig: 'mono',
  stmt: R`Každá monotónní posloupnost má limitu v \(\mathbb R^*\). Pro neklesající \(\lim a_n=\sup\{a_n\}\), pro nerostoucí \(\lim a_n=\inf\{a_n\}\).`,
  plain: 'Posloupnost, která pořád roste, se zastaví u svého suprema (nebo jde do nekonečna).',
  method: ['Supremum', 'ε odhad', 'Rozbor případů'],
  idea: 'Neklesající posloupnost: jakmile jeden člen přeskočí G − ε, všechny další jsou ještě výš (monotonie), ale nad supremum G nevyskočí. Takže od toho indexu jsou všechny v pásu.',
  need: [{ t: 'Tvrzení 3 (supremum)', ref: 't3' }],
  steps: [
    { g: 'Neklesající a shora neomezená', h: 'Každou mez někdy přeskočí', m: R`\forall K\ \exists n_0:\ a_{n_0}>K`, why: 'Jinak by K bylo horní závora.' },
    { g: 'Neklesající a shora neomezená', h: 'Monotonie udrží další členy nad K', m: R`n\ge n_0:\quad a_n\ge a_{n_0}>K\ \Longrightarrow\ a_n\to+\infty=\sup\{a_n\}`, why: 'Pro n ≥ n₀ je aₙ ≥ a_{n₀}, protože posloupnost neklesá. K bylo libovolné, takže to je přesně definice aₙ → +∞. A shora neomezená množina má supremum +∞.' },
    { g: 'Neklesající a shora omezená', h: 'Vezmu supremum G a ε > 0', m: R`G=\sup\{a_n\}\in\mathbb R,\qquad\exists n_0:\ a_{n_0}>G-\varepsilon`, why: 'Supremum existuje (Tvrzení 3) a G − ε už horní závora není.', use: ['t3'] },
    { g: 'Neklesající a shora omezená', h: 'Monotonie podrží všechny další členy v pásu', m: R`n\ge n_0:\quad G-\varepsilon\lt a_{n_0}\le a_n\le G\lt G+\varepsilon`, why: 'Levá nerovnost: posloupnost neklesá. Pravá: G je horní závora. Tedy |aₙ − G| < ε.' },
    { g: 'Nerostoucí', h: 'Převedu na neklesající přes −aₙ', m: R`\lim a_n=-\lim(-a_n)=-\sup\{-a_n\}=\inf\{a_n\}`, why: 'Je-li aₙ nerostoucí, je −aₙ neklesající a podle předchozích částí má limitu sup{−aₙ}. Přitom sup{−aₙ} = −inf{aₙ}: změna znaménka prohodí horní a dolní závory.' }
  ],
  end: 'Monotónní posloupnost má limitu a je rovna supremu, resp. infimu.',
  say: 'Ať aₙ neklesá. Je-li shora neomezená, každou mez K nějaký člen přeskočí a díky monotonii i všechny další, takže aₙ → ∞. Je-li omezená, má supremum G. G − ε není horní závora, proto nějaké a_{n₀} > G − ε. Pro n ≥ n₀ je G − ε < a_{n₀} ≤ aₙ ≤ G, tedy |aₙ − G| < ε. Nerostoucí převedu na −aₙ.',
  pit: ['Tady se poprvé naplno používá úplnost ℝ (existence suprema). V ℚ by věta neplatila.'] },

{ id: 'v19', no: 'Věta 19', name: 'Bolzano–Weierstrass', ch: 'posl', fig: 'bw',
  stmt: R`Z každé omezené posloupnosti lze vybrat konvergentní podposloupnost.`,
  plain: 'Když jsou členy uvězněné v intervalu, někde se musí „nahromadit“.',
  method: ['Půlení intervalů', 'Konstrukce'],
  idea: 'Půlím interval a vždy si nechám polovinu, ve které je nekonečně mnoho členů. Z každého intervalu vyberu jeden člen s větším indexem než minule. Intervaly se smrští do jednoho bodu a vybrané členy jsou v nich sevřené.',
  need: [{ t: 'Věta 18 (monotónní posloupnosti)', ref: 'v18' }, { t: 'Věta 15 (dva policajti)', ref: 'v15' }],
  steps: [
    { g: 'Konstrukce', h: 'Začnu celým rozsahem posloupnosti', m: R`a_0=\inf\{x_n\},\qquad b_0=\sup\{x_n\},\qquad x_n\in\langle a_0,b_0\rangle\ \ \forall n`, why: 'Posloupnost je omezená, takže a₀, b₀ jsou konečná.' },
    { g: 'Konstrukce', h: 'Rozpůlím a nechám si polovinu s nekonečně mnoha členy', m: R`\alpha=\frac{a_{k-1}+b_{k-1}}2:\qquad\langle a_k,b_k\rangle=\langle a_{k-1},\alpha\rangle\ \text{nebo}\ \langle\alpha,b_{k-1}\rangle`, why: 'Kdyby v obou polovinách bylo jen konečně mnoho členů, bylo by jich konečně mnoho i v ⟨a_{k−1}, b_{k−1}⟩.' },
    { g: 'Konstrukce', h: 'Vyberu z ní člen s větším indexem než minule', m: R`n_k>n_{k-1},\qquad x_{n_k}\in\langle a_k,b_k\rangle`, why: 'Jde to, protože v intervalu je nekonečně mnoho členů, tedy i s libovolně velkým indexem.' },
    { g: 'Konstrukce', h: 'Intervaly do sebe zapadají a půlí se', m: R`a_{k-1}\le a_k\le b_k\le b_{k-1},\qquad b_k-a_k=\frac{b_0-a_0}{2^k}`, why: 'Každý nový interval je jedna z polovin předchozího, takže leží uvnitř něj a má poloviční délku. Po k půleních je délka (b₀ − a₀)/2ᵏ.' },
    { g: 'Konvergence', h: 'Krajní body mají limity', m: R`a_k\nearrow A,\qquad b_k\searrow B`, why: 'aₖ neklesá a je omezená b₀, bₖ neroste a je omezená a₀. Věta 18.', use: ['v18'] },
    { g: 'Konvergence', h: 'Obě limity splývají', m: R`B-A=\lim_{k\to\infty}(b_k-a_k)=\lim_{k\to\infty}\frac{b_0-a_0}{2^k}=0`, why: 'Aritmetika limit a 2ᵏ ≥ k, takže (b₀ − a₀)/2ᵏ → 0.' },
    { g: 'Konvergence', h: 'Dva policajti', m: R`a_k\le x_{n_k}\le b_k\ \Longrightarrow\ x_{n_k}\to A=B`, use: ['v15'], why: 'Z kroku 3 je x_{nₖ} ∈ ⟨aₖ, bₖ⟩ a obě meze jdou ke stejné limitě (kroky 5 a 6). Věta 15 o dvou policajtech dá x_{nₖ} → A, takže vybraná posloupnost konverguje.' }
  ],
  end: 'Vybraná podposloupnost {x_{nₖ}} konverguje.',
  say: 'Všechny členy leží v ⟨inf, sup⟩. Interval rozpůlím a nechám si polovinu, kde je nekonečně mnoho členů, a z ní vyberu člen s indexem větším než minule. Tak dostanu do sebe zapadající intervaly ⟨aₖ, bₖ⟩ délky (b₀ − a₀)/2ᵏ. aₖ neklesá a bₖ neroste, takže mají limity, a protože rozdíl jde k nule, jsou limity stejné. Vybrané členy jsou mezi aₖ a bₖ, takže podle policajtů konvergují.',
  ask: [['Proč lze vždy zvolit nₖ > nₖ₋₁?', 'V intervalu je nekonečně mnoho členů, takže i s libovolně velkým indexem.'], ['Kde se použila omezenost?', 'Na začátku: a₀ = inf a b₀ = sup musí být konečná, jinak by se nedalo půlit.']] }
);

PROOFS.push(
{ id: 'v20', no: 'Věta 20', name: 'Jednoznačnost limity funkce', ch: 'fce',
  stmt: R`Funkce má v daném bodě nejvýše jednu limitu.`,
  plain: 'Funkce se v bodě nemůže blížit dvěma různým hodnotám.',
  method: ['Sporem'],
  idea: 'Stejně jako u posloupností (Věta 9): dvě různé limity mají okolí, která se nepřekrývají. Na společném prstencovém okolí bodu c by hodnoty f(x) musely ležet v obou.',
  need: [{ t: 'Věta 9 (posloupnosti)', ref: 'v9' }, { t: 'definice limity: ∀ε ∃δ ∀x ∈ P(c, δ) ∩ D_f: f(x) ∈ B(A, ε)' }],
  steps: [
    { h: 'Předpokládám dvě různé limity', m: R`\lim_{x\to c}f(x)=A,\qquad\lim_{x\to c}f(x)=B,\qquad A\neq B,\quad A,B\in\mathbb R^*`, why: 'Důkaz sporem. Limity můžou být i nevlastní, proto A, B ∈ ℝ*.' },
    { h: 'Zvolím ε tak, aby se okolí nepřekrývala', m: R`B(A,\varepsilon)\cap B(B,\varepsilon)=\emptyset`, why: 'Pro A, B ∈ ℝ stačí ε = |B − A|/2. Pro nekonečno je B(+∞, ε) = (1/ε, +∞), takže stačí malé ε.' },
    { h: 'Obě definice platí na společném okolí', m: R`\delta=\min\{\delta_1,\delta_2\}:\quad x\in P(c,\delta)\cap D_f\ \Longrightarrow\ f(x)\in B(A,\varepsilon)\ \text{ i }\ f(x)\in B(B,\varepsilon)`, why: 'Definice lim f = A dá k ε nějaké δ₁, definice lim f = B nějaké δ₂. Na menším z obou okolí platí obě podmínky zároveň.' },
    { h: 'Takový bod x existuje: spor', p: R`Limita se definuje jen v hromadném bodě \(D_f\), takže v \(P(c,\delta)\cap D_f\) nějaké \(x\) leží. Jeho hodnota \(f(x)\) by byla ve dvou disjunktních množinách.` }
  ],
  end: 'Limita je nejvýše jedna.',
  say: 'Sporem: ať má f v c limity A ≠ B. Zvolím ε tak, aby B(A, ε) a B(B, ε) byly disjunktní. K nim najdu δ₁ a δ₂ z definice limity a vezmu menší z nich. Na P(c, δ) je pak f(x) v obou okolích zároveň, a to nejde. Bod x tam existuje, protože c je hromadný bod definičního oboru.',
  pit: ['Pro nevlastní limity totéž: B(+∞, ε) = (1/ε, +∞) je disjunktní s malým okolím reálného čísla.'] },

{ id: 'v21', no: 'Věta 21', name: 'Omezenost na okolí', ch: 'fce',
  stmt: R`Má-li \(f\) vlastní limitu v \(c\in\mathbb R^*\), je omezená na nějakém \(P(c,\delta)\).`,
  plain: 'Kde má funkce konečnou limitu, tam „neutíká“.',
  method: ['Přímý důkaz'],
  idea: 'Stejný trik jako u posloupností (Věta 10): v definici limity zvolím ε = 1.',
  need: [{ t: 'Věta 10 (posloupnosti)', ref: 'v10' }],
  steps: [
    { h: 'Definice limity s ε = 1', m: R`\lim_{x\to c}f=A\in\mathbb R\ \Longrightarrow\ \exists\delta>0\ \forall x\in P(c,\delta)\cap D_f:\ A-1\lt f(x)\lt A+1`, why: 'ε v definici limity smím zvolit libovolně, jako u Věty 10 beru ε = 1. Na P(c, δ) je tedy f zdola omezená číslem A − 1 a shora A + 1, a to je tvrzení věty.' }
  ],
  end: 'f je na P(c, δ) omezená čísly A − 1 a A + 1.',
  say: 'Z definice limity s ε = 1 existuje δ, že pro x ∈ P(c, δ) je |f(x) − A| < 1. Tam je tedy f mezi A − 1 a A + 1.',
  pit: ['Pro nevlastní limitu neplatí: 1/x² v nule.', 'Na rozdíl od posloupností nemusí být f omezená „všude“, jen na okolí.'] },

{ id: 'v22', no: 'Věta 22', name: 'Aritmetika limit funkcí', ch: 'fce',
  stmt: R`Nechť \(\lim_{x\to c}f=A\), \(\lim_{x\to c}g=B\) (\(A,B\in\mathbb R^*\)). Pak \(\lim(f\pm g)=A\pm B\), \(\lim fg=AB\), \(\lim\frac fg=\frac AB\), je-li pravá strana definována.`,
  plain: 'Stejná pravidla jako u posloupností, jen místo „od jistého indexu“ je „na malém okolí“.',
  method: ['ε odhad', 'Rozbor případů'],
  idea: 'Důkazy Vět 12 a 12′ přepíšu pro funkce. Místo „od indexu max{n₁, n₂}“ beru okolí s δ = min{δ₁, δ₂}, aby platily obě podmínky naráz. Ukážu podrobně součet, zbytek je stejný.',
  need: [{ t: 'Věta 12 a 12′ (posloupnosti)', ref: 'v12' }],
  goal: R`\forall\varepsilon>0\ \exists\delta>0\ \forall x\in P(c,\delta):\ f(x)+g(x)\in B(A+B,\varepsilon)`,
  steps: [
    { h: 'Obě podmínky na společném okolí', m: R`x\in P(c,\delta_1):\ f(x)\in B(A,\varepsilon_1),\qquad x\in P(c,\delta_2):\ g(x)\in B(B,\varepsilon_2),\qquad\delta=\min\{\delta_1,\delta_2\}`, why: 'Na menším okolí platí obě podmínky. ε₁ a ε₂ si zvolím podle případu.' },
    { g: 'Součet', h: 'A, B konečné: ε₁ = ε₂ = ε/2', m: R`|f(x)+g(x)-(A+B)|\le|f(x)-A|+|g(x)-B|\lt\tfrac\varepsilon2+\tfrac\varepsilon2=\varepsilon`, why: 'Trojúhelníková nerovnost |u + v| ≤ |u| + |v| pro u = f(x) − A a v = g(x) − B. Na P(c, δ) je každý z rozdílů menší než ε/2 (krok 1 s ε₁ = ε₂ = ε/2).' },
    { g: 'Součet', h: 'A = B = +∞', m: R`f(x)>\tfrac K2,\quad g(x)>\tfrac K2\ \Longrightarrow\ f(x)+g(x)>K`, why: 'K je libovolné, takže f + g → +∞.' },
    { g: 'Součet', h: 'A = +∞, B konečné', m: R`g(x)>B-1,\quad f(x)>K-B+1\ \Longrightarrow\ f(x)+g(x)>K`, why: 'g je na okolí zdola omezená (ε₂ = 1), f přeroste K − B + 1.' },
    { g: 'Součin a podíl', h: 'Stejné odhady jako u posloupností', p: R`V důkazech Vět 12 a 12′ nahradím „od jistého indexu“ slovy „na nějakém \(P(c,\delta)\)“ a místo maxima indexů vezmu minimum z \(\delta\). Například u součinu: \(|f g-AB|\le|f-A|\,|g|+|A|\,|g-B|\) a \(g\) je na okolí omezená (Věta 21).`, use: ['v12', 'v12p', 'v21'] }
  ],
  end: 'Aritmetika limit platí i pro funkce.',
  say: 'Postup je stejný jako u posloupností. Z definic limit dostanu δ₁ pro f a δ₂ pro g a vezmu menší z nich, aby platily obě podmínky. Pro konečné limity rozdělím ε napůl a použiju trojúhelníkovou nerovnost. Pro +∞ odhaduju zdola: f > K − L a g > L. Součin a podíl stejně jako ve Větách 12 a 12′, omezenost g na okolí dává Věta 21.',
  pit: ['Důsledek: součet, součin a podíl (pro g(c) ≠ 0) spojitých funkcí je spojitý. Proto jsou spojité polynomy a racionální funkce.'] },

{ id: 'v23', no: 'Věta 23', name: 'Dělení kladnou nulou (funkce)', ch: 'fce',
  stmt: R`Nechť \(g\to0\), \(f\to A>0\) (\(A\in\mathbb R^*\)) pro \(x\to c\) a \(g>0\) na nějakém \(P(c,\eta)\). Pak \(\frac fg\to+\infty\).`,
  plain: 'Kladné číslo děleno kladnou nulou je +∞, i u funkcí.',
  method: ['Definice nevlastní limity', 'Odhad'],
  idea: 'Stejně jako Věta 16: čitatel je na okolí větší než nějaké kladné číslo, jmenovatel je kladný a libovolně malý. Podíl je pak libovolně velký.',
  need: [{ t: 'Věta 16 (posloupnosti)', ref: 'v16' }],
  steps: [
    { h: 'Co chci ukázat', m: R`\forall K>0\ \exists\delta>0\ \forall x\in P(c,\delta):\ \frac{f(x)}{g(x)}>K`, why: 'Definice limity +∞: podíl přeroste každou mez K. Stačí to ověřit pro K > 0.' },
    { h: 'Čitatel je odražený od nuly', m: R`x\in P(c,\delta_1):\ f(x)>q,\qquad q=\begin{cases}A/2,&A\in\mathbb R\\1,&A=+\infty\end{cases}`, why: 'Pro A ∈ ℝ dá definice limity s ε = A/2 odhad f(x) > A − A/2 = A/2. Pro A = +∞ dá definice s mezí 1 odhad f(x) > 1. V obou případech je q > 0.' },
    { h: 'Jmenovatel je kladný a malý', m: R`x\in P(c,\delta_2):\ |g(x)|\lt\frac qK,\qquad x\in P(c,\eta):\ g(x)>0`, why: 'Definice g → 0 s ε = q/K.' },
    { h: 'Vynásobím odhady', m: R`\delta=\min\{\delta_1,\delta_2,\eta\}:\quad\frac{f(x)}{g(x)}>q\cdot\frac Kq=K`, why: 'Na nejmenším z okolí platí všechno najednou: f(x) > q a 0 < g(x) < q/K, tedy 1/g(x) > K/q. Násobím kladná čísla, takže nerovnosti se zachovají.' }
  ],
  end: 'f/g → +∞.',
  say: 'Čitatel je na nějakém okolí větší než q > 0 (q = A/2, nebo 1 pro A = ∞). Jmenovatel je na okolí kladný a menší než q/K, takže 1/g > K/q. Na průniku okolí je f/g > K.' },

{ id: 'v24', no: 'Věta 24', name: 'Limita a uspořádání funkcí, dva policajti', ch: 'fce',
  stmt: R`(i) \(\lim f>\lim g\Rightarrow f>g\) na nějakém \(P(c,\delta)\). (ii) \(f\le g\) na \(P(c,\delta)\Rightarrow\lim f\le\lim g\). (iii) \(f\le h\le g\), \(\lim f=\lim g=A\Rightarrow\lim h=A\).`,
  plain: 'Totéž co Věty 14 a 15, jen pro funkce.',
  method: ['ε odhad', 'Sporem (bod ii)'],
  idea: 'Mezi dvě různé limity vložím reálné číslo r. Na malém okolí je f nad r a g pod r. Z toho sporem plyne (ii). Policajti fungují jako u posloupností a pro A = +∞ stačí dolní.',
  need: [{ t: 'Věta 14', ref: 'v14' }, { t: 'Věta 15', ref: 'v15' }],
  steps: [
    { g: '(i) lim f > lim g', h: 'Vložím číslo r mezi limity', m: R`A=\lim f>\lim g=B\ \Longrightarrow\ \exists r\in\mathbb R:\ B\lt r\lt A`, why: 'Funguje i pro nekonečné A nebo B.' },
    { g: '(i) lim f > lim g', h: 'Na malém okolí je f nad r a g pod r', m: R`x\in P(c,\delta_1):\ f(x)>r,\qquad x\in P(c,\delta_2):\ g(x)\lt r`, why: 'r < A, takže nějaké okolí A leží celé nad r. Stejně pro B.' },
    { g: '(i) lim f > lim g', h: 'Na průniku okolí', m: R`\delta=\min\{\delta_1,\delta_2\}:\quad g(x)\lt r\lt f(x)`, why: 'Na menším z obou okolí platí oba odhady z kroku 2 zároveň, tedy g(x) < f(x). To je tvrzení (i).' },
    { g: '(ii) f ≤ g ⇒ lim f ≤ lim g', h: 'Sporem pomocí (i)', p: R`Kdyby \(\lim f>\lim g\), bylo by podle (i) \(f>g\) na nějakém \(P(c,\delta')\). To je spor s \(f\le g\) na \(P(c,\delta)\), protože obě okolí mají společné body.` },
    { g: '(iii) Dva policajti', h: 'A konečné: sevření', m: R`x\in P(c,\delta):\quad A-\varepsilon\lt f(x)\le h(x)\le g(x)\lt A+\varepsilon`, why: 'δ je minimum ze tří δ: pro f, pro g a z předpokladu f ≤ h ≤ g.' },
    { g: '(iii) Dva policajti', h: 'A = +∞: stačí dolní policajt', m: R`h(x)\ge f(x)>K`, why: 'Pro A = +∞ je f(x) > K na nějakém P(c, δ) z definice lim f = +∞. Horního policajta nepotřebuju: h ≥ f je ještě výš. Stejně jako Věta 15′ u posloupností.' }
  ],
  end: 'Všechny tři části platí.',
  say: '(i): mezi limity B < A vložím reálné r. Na malém okolí je f > r a g < r, tedy f > g. (ii) sporem: kdyby lim f > lim g, bylo by podle (i) f > g blízko c, a to odporuje f ≤ g. (iii): na průniku okolí je A − ε < f ≤ h ≤ g < A + ε. Pro A = +∞ stačí h ≥ f > K.',
  pit: ['f < g na okolí ⇒ lim f ≤ lim g, ale ne nutně ostře: x² < 2x² blízko 0, obě limity jsou 0.'] },

{ id: 'v25', no: 'Věta 25', name: 'Limita složené funkce', ch: 'fce', fig: 'composite',
  stmt: R`Nechť \(\lim_{x\to c}g=A\), \(\lim_{y\to A}f=B\) a platí (P) \(g(x)\neq A\) na nějakém \(P(c,\eta)\), nebo (S) \(f\) je spojitá v \(A\). Pak \(\lim_{x\to c}f(g(x))=B\).`,
  plain: 'Když vnitřní funkce jde k A a vnější v A k B, jde složení k B. Jen pozor na hodnotu f(A).',
  method: ['Řetízek okolí', 'Rozbor případů'],
  idea: 'Řetízek okolí: k ε najdu r (pro f), k r najdu δ (pro g). Podmínka (P) nebo (S) řeší jediný problém: co když g(x) = A přesně, a f(A) „dělá něco jiného“ než limita.',
  need: [{ t: 'definice limity přes okolí' }],
  steps: [
    { h: 'Vnější funkce: k ε najdu r', m: R`\exists r>0:\quad y\in P(A,r)\ \Longrightarrow\ f(y)\in B(B,\varepsilon)`, why: 'Definice lim<sub>y→A</sub> f = B.' },
    { h: 'Vnitřní funkce: k r najdu δ₁', m: R`\exists\delta_1>0:\quad x\in P(c,\delta_1)\ \Longrightarrow\ g(x)\in B(A,r)`, why: 'Definice lim<sub>x→c</sub> g = A, kde jako „epsilon“ použiju r.' },
    { h: 'Kde je problém', p: R`Krok 2 dává \(g(x)\in B(A,r)\), ale krok 1 potřebuje \(g(x)\in P(A,r)\), tedy navíc \(g(x)\neq A\). O hodnotě \(f(A)\) limita nic neříká.` },
    { g: 'Podmínka (P)', h: 'g(x) ≠ A, takže g(x) je v prstencovém okolí', m: R`\delta=\min\{\delta_1,\eta\}:\quad x\in P(c,\delta)\ \Longrightarrow\ g(x)\in P(A,r)\ \Longrightarrow\ f(g(x))\in B(B,\varepsilon)`, why: 'Pro x ∈ P(c, δ) je g(x) ∈ B(A, r) (krok 2) a g(x) ≠ A (podmínka (P)), tedy g(x) ∈ P(A, r). Pak krok 1 dá f(g(x)) ∈ B(B, ε).' },
    { g: 'Podmínka (S)', h: 'f je spojitá v A, takže f(A) = B', m: R`y\in B(A,r)\ \Longrightarrow\ f(y)\in B(B,\varepsilon)\quad(\text{i pro }y=A)`, why: 'Spojitost znamená lim<sub>y→A</sub> f = f(A), tedy B = f(A) ∈ B(B, ε). Pak stačí δ = δ₁.' }
  ],
  end: 'lim<sub>x→c</sub> f(g(x)) = B.',
  say: 'K ε najdu z limity f číslo r tak, že pro y ∈ P(A, r) je f(y) ∈ B(B, ε). K tomuto r najdu z limity g číslo δ, že pro x ∈ P(c, δ) je g(x) ∈ B(A, r). Problém je, že g(x) může být přesně A. Podmínka (P) to vylučuje, takže g(x) ∈ P(A, r). Při (S) je f(A) = B, takže implikace platí i pro y = A. V obou případech f(g(x)) ∈ B(B, ε).',
  pit: ['Protipříklad bez (P) i (S): g ≡ A, f(y) = B pro y ≠ A, ale f(A) ≠ B. Pak f(g(x)) = f(A) ≠ B.'],
  ask: [['K čemu je podmínka (P)?', 'Aby g(x) neleželo přímo v bodě A, kde f může mít jinou hodnotu než limitu.'], ['Kdy se typicky používá (S)?', 'Při výpočtu limit: vnější funkce bývá elementární a spojitá (sin, exp, √), takže limitu „přenesu dovnitř“.']] },

{ id: 'v26', no: 'Věta 26', name: 'Jednostranná limita složené funkce', ch: 'fce',
  stmt: R`\(\lim_{x\to c-}g=A\), \(\lim_{y\to A+}f=B\) a (P) \(g>A\) na \(P_-(c,\eta)\), nebo (S) \(f\) je v \(A\) spojitá zprava a \(g\ge A\). Pak \(\lim_{x\to c-}f(g(x))=B\).`,
  plain: 'Jako Věta 25, jen se musí hlídat, ze které strany g přichází k A.',
  method: ['Řetízek okolí', 'Rozbor případů'],
  idea: 'Stejný řetízek okolí jako ve Větě 25, jen s jednostrannými okolími. Podmínky zaručí, že g(x) padne do pravého okolí A, kde f umíme kontrolovat.',
  need: [{ t: 'Věta 25', ref: 'v25' }],
  steps: [
    { h: 'Vnější funkce zprava: k ε najdu r', m: R`y\in P_+(A,r)=(A,A+r)\ \Longrightarrow\ f(y)\in B(B,\varepsilon)`, why: 'Definice limity zprava lim<sub>y→A+</sub> f = B: místo celého prstencového okolí jen pravé (A, A + r).' },
    { h: 'Vnitřní funkce zleva: k r najdu δ₁', m: R`x\in P_-(c,\delta_1)=(c-\delta_1,c)\ \Longrightarrow\ g(x)\in B(A,r)`, why: 'Definice limity zleva lim<sub>x→c−</sub> g = A, kde jako „epsilon“ použiju r.' },
    { g: 'Podmínka (P)', h: 'g > A, takže g(x) je napravo od A', m: R`\delta=\min\{\delta_1,\eta\}:\ x\in P_-(c,\delta)\ \Longrightarrow\ g(x)\in(A,A+r)\ \Longrightarrow\ f(g(x))\in B(B,\varepsilon)`, why: 'Pro x ∈ P₋(c, δ) je g(x) ∈ B(A, r) (krok 2) a g(x) > A (podmínka (P)), tedy g(x) ∈ (A, A + r). Pak krok 1 dá f(g(x)) ∈ B(B, ε).' },
    { g: 'Podmínka (S)', h: 'g ≥ A a f(A) = B', m: R`g(x)\in\langle A,A+r)\ \Longrightarrow\ f(g(x))\in B(B,\varepsilon)`, why: 'Spojitost zprava v A znamená lim<sub>y→A+</sub> f = f(A), tedy B = f(A). Případ g(x) = A je proto taky v pořádku.' }
  ],
  end: 'Limita zleva složené funkce je B.',
  say: 'Stejně jako u Věty 25: k ε najdu r pro f zprava, k r najdu δ pro g zleva. Podmínka (P) g > A zaručí, že g(x) je v (A, A + r). Při (S) může být g(x) = A, ale tam je f(A) = B díky spojitosti zprava.' },

{ id: 'v27', no: 'Věta 27', name: 'Heineho věta (polovina)', ch: 'fce',
  stmt: R`Nechť \(\lim_{x\to c}f(x)=A\). Pokud \(x_n\in D_f\), \(x_n\neq c\) a \(x_n\to c\), pak \(f(x_n)\to A\).`,
  plain: 'Limitu funkce můžu počítat přes libovolnou posloupnost, která jde k c.',
  method: ['Řetízek okolí'],
  idea: 'K ε najdu δ z limity funkce. Pak δ použiju jako „epsilon“ pro posloupnost xₙ → c. Od jistého indexu je xₙ v P(c, δ), takže f(xₙ) je v B(A, ε).',
  steps: [
    { h: 'Co chci ukázat', m: R`\forall\varepsilon>0\ \exists n_0\ \forall n\ge n_0:\ f(x_n)\in B(A,\varepsilon)`, why: 'Píšu s okolím, ne s |·|, protože A může být ±∞.' },
    { h: 'Z limity funkce: k ε najdu δ', m: R`x\in P(c,\delta)\cap D_f\ \Longrightarrow\ f(x)\in B(A,\varepsilon)`, why: 'Definice lim<sub>x→c</sub> f = A pro zvolené ε.' },
    { h: 'Z limity posloupnosti: k δ najdu n₀', m: R`n\ge n_0:\ x_n\in B(c,\delta),\ \ x_n\neq c\ \Longrightarrow\ x_n\in P(c,\delta)`, why: 'Definice xₙ → c s „epsilonem“ δ. Podmínka xₙ ≠ c je tu proto, aby xₙ bylo v prstencovém okolí.' },
    { h: 'Spojím oba kroky', m: R`n\ge n_0:\quad f(x_n)\in B(A,\varepsilon)`, why: 'Pro n ≥ n₀ je xₙ ∈ P(c, δ) (krok 3) a xₙ ∈ D_f (předpoklad), takže krok 2 dá f(xₙ) ∈ B(A, ε). To je definice f(xₙ) → A.' }
  ],
  end: 'f(xₙ) → A.',
  say: 'K ε najdu z limity funkce δ takové, že pro x ∈ P(c, δ) je f(x) ∈ B(A, ε). Protože xₙ → c, je od jistého n₀ xₙ v B(c, δ), a protože xₙ ≠ c, je dokonce v P(c, δ). Pro n ≥ n₀ je tedy f(xₙ) ∈ B(A, ε).',
  pit: ['Je-li f spojitá v c, lze vypustit podmínku xₙ ≠ c.', 'Použití: neexistenci limity ukážeš dvěma posloupnostmi s různými limitami f(xₙ) (např. sin(1/x) v nule).'] },

{ id: 'v28', no: 'Věta 28', name: 'Limita monotónní funkce', ch: 'fce',
  stmt: R`Je-li \(f\) monotónní na \((a,b)\), existují \(\lim_{x\to a+}f\) a \(\lim_{x\to b-}f\). Pro neklesající \(f\) jsou rovny \(\inf f((a,b))\) a \(\sup f((a,b))\).`,
  plain: 'Monotónní funkce má na krajích intervalu vždy limitu.',
  method: ['Supremum', 'ε odhad'],
  idea: 'Kopie Věty 18: jakmile je jedna hodnota f(x₀) blízko suprema, všechny hodnoty napravo od x₀ jsou ještě blíž (monotonie), ale nad supremum nevyskočí.',
  need: [{ t: 'Věta 18', ref: 'v18' }],
  steps: [
    { g: 'Pravý konec, f neklesající', h: 'Supremum hodnot', m: R`S=\sup f\big((a,b)\big)\in\mathbb R\cup\{+\infty\}`, why: 'Chci ukázat lim<sub>x→b−</sub> f = S.' },
    { g: 'Pravý konec, f neklesající', h: 'S konečné: najdu x₀, kde je f blízko S', m: R`\exists x_0\in(a,b):\ f(x_0)>S-\varepsilon`, why: 'S − ε už horní závora není.' },
    { g: 'Pravý konec, f neklesající', h: 'Monotonie podrží všechno napravo od x₀', m: R`x\in(x_0,b):\quad S-\varepsilon\lt f(x_0)\le f(x)\le S`, why: 'To je levé okolí bodu b: δ = b − x₀ (pro b = +∞ okolí (x₀, +∞)).' },
    { g: 'Pravý konec, f neklesající', h: 'S = +∞: každou mez někde přeskočí', m: R`\exists x_0:\ f(x_0)>K\ \Longrightarrow\ f(x)\ge f(x_0)>K\quad\forall x\in(x_0,b)`, why: 'S = +∞ znamená, že žádné K není horní závora hodnot, takže existuje x₀ s f(x₀) > K. Napravo od x₀ je f(x) ≥ f(x₀), protože f neklesá. Tedy lim<sub>x→b−</sub> f = +∞.' },
    { h: 'Ostatní případy', p: R`Levý konec stejně s infimem a bodem \(x_0\) blízko \(a\). Pro nerostoucí \(f\) použiju \(-f\).` }
  ],
  end: 'Jednostranné limity v krajních bodech existují.',
  say: 'Ať f neklesá a S = sup hodnot. Pro konečné S není S − ε horní závora, takže f(x₀) > S − ε pro nějaké x₀. Pro x mezi x₀ a b je díky monotonii S − ε < f(x₀) ≤ f(x) ≤ S, tedy f(x) je blízko S na levém okolí b. Pro S = +∞ stejně s mezí K. Levý konec s infimem, nerostoucí přes −f.' },

{ id: 'v29', no: 'Věta 29', name: 'Bolzano – nabývání mezihodnot', ch: 'fce', fig: 'ivt',
  stmt: R`Nechť \(f\) je spojitá na \(\langle a,b\rangle\) a \(f(a)\lt f(b)\). Pro každé \(c\in(f(a),f(b))\) existuje \(\xi\in(a,b)\) s \(f(\xi)=c\).`,
  plain: 'Spojitá funkce nemůže „přeskočit“ žádnou hodnotu.',
  method: ['Supremum', 'Sporem (dvakrát)'],
  idea: 'ξ bude supremum bodů, kde je f ještě pod úrovní c. Ze spojitosti v ξ vyloučím obě možnosti f(ξ) > c a f(ξ) < c: v obou případech by ξ nebylo supremum. Zbývá f(ξ) = c.',
  need: [{ t: 'Tvrzení 3 (supremum)', ref: 't3' }, { t: 'spojitost v ξ: ∀ε ∃δ: |x − ξ| < δ ⇒ |f(x) − f(ξ)| < ε' }],
  steps: [
    { h: 'Množina bodů, kde je f pod úrovní c', m: R`M=\{x\in\langle a,b\rangle;\ f(x)\lt c\},\qquad\xi=\sup M\in\langle a,b\rangle`, why: 'a ∈ M, protože f(a) < c, a M je omezená číslem b. Supremum tedy existuje.', use: ['t3'] },
    { g: 'f(ξ) > c nejde', h: 'Ze spojitosti je f > c na celém okolí ξ', m: R`\varepsilon=f(\xi)-c>0:\quad\exists\delta>0\ \forall x\in(\xi-\delta,\xi\rangle\cap\langle a,b\rangle:\ f(x)>c`, why: 'Definice spojitosti v ξ s ε = f(ξ) − c > 0: na okolí ξ je f(x) > f(ξ) − ε = c. Stačí mi část vlevo od ξ, napravo od ξ body M stejně nejsou (ξ je horní závora).' },
    { g: 'f(ξ) > c nejde', h: 'Pak ξ − δ je menší horní závora M', p: R`Na \((\xi-\delta,\xi\rangle\) žádný bod \(M\) neleží a napravo od \(\xi\) taky ne (\(\xi\) je horní závora). Takže každé \(x\in M\) je \(\le\xi-\delta\).`, why: 'To je spor s tím, že ξ je nejmenší horní závora.' },
    { g: 'f(ξ) < c nejde', h: 'Pak ξ < b a f < c i kousek napravo', m: R`\varepsilon=c-f(\xi)>0:\quad\exists\delta>0\ \forall x\in\langle\xi,\xi+\delta)\cap\langle a,b\rangle:\ f(x)\lt c`, why: 'ξ ≠ b, protože f(b) > c.' },
    { g: 'f(ξ) < c nejde', h: 'Bod napravo od ξ patří do M', m: R`x\in(\xi,\min\{\xi+\delta,b\}):\quad x\in M,\ \ x>\xi=\sup M`, why: 'To je spor s tím, že ξ je horní závora M.' },
    { h: 'Zbývá jediná možnost', m: R`f(\xi)=c,\qquad\xi\neq a,\ \xi\neq b`, why: 'f(a) < c < f(b), takže ξ nemůže být krajní bod. Tedy ξ ∈ (a, b).' }
  ],
  end: 'Hodnota c se nabývá v bodě ξ ∈ (a, b).',
  say: 'Vezmu M = {x ∈ ⟨a, b⟩; f(x) < c} a ξ = sup M; M je neprázdná, protože obsahuje a. Kdyby f(ξ) > c, byla by ze spojitosti f > c na nějakém (ξ − δ, ξ⟩, takže ξ − δ by byla menší horní závora, spor. Kdyby f(ξ) < c, bylo by ξ < b a f < c i na kousku napravo, takže by v M byl bod větší než supremum, spor. Proto f(ξ) = c, a protože f(a) < c < f(b), leží ξ uvnitř.',
  pit: ['Bez spojitosti neplatí (skok).', 'Bez úplnosti ℝ taky ne: x² − 2 na ℚ ∩ ⟨0, 2⟩ nemá kořen.'] },

{ id: 'v30', no: 'Věta 30', name: 'Obraz intervalu spojitou funkcí', ch: 'fce',
  stmt: R`Je-li \(f\) spojitá na intervalu \(J\), pak \(f(J)\) je interval.`,
  plain: 'Spojitá funkce zobrazí interval zase na interval.',
  method: ['Přímý důkaz', 'Charakterizace intervalu'],
  idea: 'Ověřím podmínku z Lemmatu 4 („bez děr“): mezi dvěma hodnotami nesmí chybět žádné číslo. Každou případnou díru zaplní Bolzanova věta.',
  need: [{ t: 'Lemma 4', ref: 'l4' }, { t: 'Věta 29 (Bolzano)', ref: 'v29' }],
  steps: [
    { h: 'Co ověřuju (Lemma 4)', m: R`u,v\in f(J),\quad u\lt z\lt v\ \Longrightarrow\ z\in f(J)`, use: ['l4'], why: 'Podle Lemmatu 4 je množina interval, když s každými dvěma body obsahuje i všechno mezi nimi. Tohle ověřím pro f(J).' },
    { h: 'Hodnoty u, v mají vzory', m: R`u=f(s),\qquad v=f(t),\qquad s,t\in J,\ s\neq t`, why: 'u a v jsou hodnoty funkce f na J, takže mají vzory s, t ∈ J. Jsou různé, protože u ≠ v.' },
    { h: 'Bolzano na úseku mezi s a t', m: R`s\lt t:\quad f\ \text{spojitá na }\langle s,t\rangle\subset J,\ \ f(s)\lt z\lt f(t)\ \Longrightarrow\ \exists\xi:\ f(\xi)=z`, why: '⟨s, t⟩ ⊂ J, protože J je interval. Pro s > t použiju Bolzanovu větu na −f a hodnotu −z.', use: ['v29'] },
    { h: 'z je v obrazu', m: R`z=f(\xi)\in f(J)`, why: 'ξ leží mezi s a t, tedy v J, a proto z = f(ξ) ∈ f(J). Podle Lemmatu 4 je f(J) interval.' }
  ],
  end: 'f(J) splňuje podmínku Lemmatu 4, je to tedy interval.',
  say: 'Podle Lemmatu 4 stačí ukázat, že f(J) nemá díry. Vezmu dvě hodnoty u = f(s), v = f(t) a číslo z mezi nimi. Úsečka mezi s a t leží v J, protože J je interval, a f je na ní spojitá. Podle Bolzanovy věty existuje ξ s f(ξ) = z, takže z ∈ f(J).',
  pit: ['Krajní body obrazu nemusí být obrazy krajních bodů: sin(⟨0, 2π⟩) = ⟨−1, 1⟩, ale sin 0 = sin 2π = 0.', 'Typ intervalu se může změnit: x² zobrazí (−1, 1) na ⟨0, 1).'] },

{ id: 'heine-sp', no: 'Věta', name: 'Heineho věta pro spojitost', ch: 'fce',
  stmt: R`\(f\) je spojitá v \(c\) právě tehdy, když pro každou posloupnost \(x_n\in D_f\), \(x_n\to c\) platí \(f(x_n)\to f(c)\).`,
  plain: 'Spojitost = funkce „zachovává limity posloupností“.',
  method: ['Ekvivalence (dva směry)', 'Sporem (směr ⇐)'],
  idea: '⇒ jako Věta 27: k ε najdu δ a posloupnost je nakonec v B(c, δ). ⇐ sporem: když spojitost selže, pro δ = 1/n najdu „špatné“ body xₙ, které jdou k c, ale jejich hodnoty k f(c) nejdou.',
  need: [{ t: 'Věta 27', ref: 'v27' }],
  steps: [
    { g: '⇒', h: 'K ε najdu δ ze spojitosti', m: R`|x-c|\lt\delta,\ x\in D_f\ \Longrightarrow\ |f(x)-f(c)|\lt\varepsilon`, why: 'Definice spojitosti v c: ke každému ε > 0 existuje takové δ > 0.' },
    { g: '⇒', h: 'Posloupnost je nakonec v B(c, δ)', m: R`\exists n_0\ \forall n\ge n_0:\ |x_n-c|\lt\delta\ \Longrightarrow\ |f(x_n)-f(c)|\lt\varepsilon`, why: 'Podmínka xₙ ≠ c tu není potřeba: pro xₙ = c je f(xₙ) = f(c).' },
    { g: '⇐', h: 'Předpokládám, že f není spojitá v c', m: R`\exists\varepsilon_0>0\ \forall\delta>0\ \exists x\in D_f:\ |x-c|\lt\delta\ \wedge\ |f(x)-f(c)|\ge\varepsilon_0`, why: 'Negace definice spojitosti.' },
    { g: '⇐', h: 'Pro δ = 1/n vyberu „špatný“ bod xₙ', m: R`x_n\in D_f:\quad|x_n-c|\lt\tfrac1n,\qquad|f(x_n)-f(c)|\ge\varepsilon_0`, why: 'Krok 3 platí pro každé δ > 0, tedy i pro δ = 1/n. Pro každé n tak dostanu jeden takový bod a označím ho xₙ.' },
    { g: '⇐', h: 'Spor s předpokladem', p: R`Podle policajtů \(c-\frac1n\lt x_n\lt c+\frac1n\) je \(x_n\to c\), ale \(f(x_n)\) se od \(f(c)\) drží aspoň na \(\varepsilon_0\), takže \(f(x_n)\not\to f(c)\).` }
  ],
  end: 'Obě podmínky jsou ekvivalentní.',
  say: '⇒: k ε najdu ze spojitosti δ a od jistého indexu je |xₙ − c| < δ, takže |f(xₙ) − f(c)| < ε. ⇐ sporem: když f není spojitá, existuje ε₀ takové, že pro každé δ je nějaký bod blíž než δ s hodnotou daleko aspoň ε₀. Pro δ = 1/n tak dostanu xₙ → c, ale f(xₙ) ↛ f(c), spor.' },

{ id: 'v31', no: 'Věta 31', name: 'O nabývání extrémů', ch: 'fce', fig: 'extrema',
  stmt: R`Funkce spojitá na uzavřeném intervalu \(\langle a,b\rangle\) nabývá svého maxima i minima.`,
  plain: 'Na uzavřeném intervalu má spojitá funkce nejvyšší i nejnižší bod.',
  method: ['Konstrukce posloupnosti', 'Bolzano–Weierstrass'],
  idea: 'Supremum hodnot S je limitou nějakých hodnot f(xₙ). Z bodů xₙ vyberu konvergentní podposloupnost (B-W), její limita x leží v ⟨a, b⟩ a spojitost (Heine) dá f(x) = S. Tím je S konečné a nabývá se.',
  need: [{ t: 'Lemma 17', ref: 'l17' }, { t: 'Věta 19 (Bolzano–Weierstrass)', ref: 'v19' }, { t: 'Heineho věta', ref: 'heine-sp' }],
  steps: [
    { h: 'Supremum hodnot', m: R`S=\sup f\big(\langle a,b\rangle\big)\in\mathbb R\cup\{+\infty\}`, why: 'Zatím nevím, že je konečné. To vyjde až na konci.' },
    { h: 'Posloupnost hodnot jdoucí k S', m: R`\exists x_n\in\langle a,b\rangle:\ f(x_n)\to S`, why: 'Lemma 17 (pro S = +∞ volím f(xₙ) > n).', use: ['l17'] },
    { h: 'Z bodů xₙ vyberu konvergentní podposloupnost', m: R`x_{n_k}\to x,\qquad a\le x_{n_k}\le b\ \Longrightarrow\ a\le x\le b`, why: 'xₙ je omezená, takže stačí Bolzano–Weierstrass. Že x ∈ ⟨a, b⟩, plyne z Věty 14. Tady je potřeba UZAVŘENÝ interval.', use: ['v19', 'v14'] },
    { h: 'Spojitost v x (Heine)', m: R`f(x_{n_k})\to f(x)`, use: ['heine-sp'], why: 'f je spojitá v bodě x ∈ ⟨a, b⟩ a x_{nₖ} → x. Podle Heineho věty pro spojitost je f(x_{nₖ}) → f(x).' },
    { h: 'Táž podposloupnost hodnot jde k S', m: R`f(x_{n_k})\to S`, why: 'Vybraná posloupnost z f(xₙ) → S má stejnou limitu (Věta 11, platí i pro +∞).', use: ['v11'] },
    { h: 'Jednoznačnost limity', m: R`f(x)=S`, why: 'Limita je jen jedna (Věta 9). S je tedy konečné a nabývá se v bodě x: to je maximum.', use: ['v9'] },
    { h: 'Minimum', p: R`Použiju totéž na \(-f\): maximum \(-f\) je minimum \(f\).` }
  ],
  end: 'f nabývá maxima i minima.',
  say: 'Vezmu S = supremum hodnot. Podle Lemmatu 17 existují body xₙ s f(xₙ) → S. Body xₙ jsou v ⟨a, b⟩, tedy omezené, a podle Bolzanova–Weierstrassovy věty z nich vyberu podposloupnost konvergující k nějakému x; x leží v ⟨a, b⟩, protože interval je uzavřený. Ze spojitosti je f(x_{nₖ}) → f(x), ale zároveň f(x_{nₖ}) → S. Takže f(x) = S, maximum se nabývá. Minimum přes −f.',
  pit: ['Na (a, b⟩ nebo s nespojitostí věta neplatí (obrázek): x na (0, 1⟩ nemá minimum, 1/x na (0, 1⟩ není ani omezená.'] },

{ id: 'd32', no: 'Důsledek 32', name: 'Omezenost spojité funkce', ch: 'fce',
  stmt: R`Funkce spojitá na \(\langle a,b\rangle\) je na tomto intervalu omezená.`,
  plain: 'Spojitá funkce na uzavřeném intervalu nevyletí do nekonečna.',
  method: ['Přímý důsledek'],
  idea: 'Podle Věty 31 má f maximum a minimum, a všechny hodnoty jsou mezi nimi.',
  need: [{ t: 'Věta 31', ref: 'v31' }],
  steps: [
    { h: 'f nabývá maxima a minima', m: R`\exists x_1,x_2\in\langle a,b\rangle:\quad m=f(x_1)=\min f,\qquad M=f(x_2)=\max f`, use: ['v31'], why: 'Věta 31: spojitá funkce na uzavřeném intervalu nabývá maxima i minima.' },
    { h: 'Všechny hodnoty jsou mezi nimi', m: R`m\le f(x)\le M\qquad\forall x\in\langle a,b\rangle`, why: 'Definice minima a maxima: žádná hodnota není menší než m ani větší než M. To je omezenost.' }
  ],
  end: 'f je na ⟨a, b⟩ omezená.',
  say: 'Podle Věty 31 má f na ⟨a, b⟩ minimum m a maximum M, obě jsou reálná čísla. Pro každé x je m ≤ f(x) ≤ M, takže f je omezená.',
  pit: ['U zkoušky se tohle zadává jako „věta o omezenosti spojité funkce“. Pak je potřeba dokázat i Větu 31, nebo přímo: kdyby f nebyla omezená, existovaly by xₙ s |f(xₙ)| > n, z nich B-W vybere xₙₖ → x a spojitost dá f(xₙₖ) → f(x), spor.'] },

{ id: 'v33', no: 'Věta 33', name: 'Spojitost inverzní funkce', ch: 'fce', fig: 'inverse',
  stmt: R`Je-li \(f\) spojitá a rostoucí na intervalu \(J\), pak \(f^{-1}\) existuje na \(f(J)\) a je tam spojitá a rostoucí.`,
  plain: 'Inverze ke spojité monotónní funkci je zase spojitá.',
  method: ['Přímý důkaz', 'Konstrukce okolí'],
  idea: 'Kolem x₀ = f⁻¹(y₀) zvolím body s < x₀ < t ve vzdálenosti menší než ε. Jejich obrazy f(s) < y₀ < f(t) ohraničí okolí y₀, které se celé zobrazí zpátky do (s, t).',
  need: [{ t: 'Věta 30 (obraz intervalu)', ref: 'v30' }],
  steps: [
    { g: 'Inverze existuje a roste', h: 'f je prostá', p: R`Pro \(x\neq y\), třeba \(x\lt y\), je \(f(x)\lt f(y)\), tedy \(f(x)\neq f(y)\). Inverze \(f^{-1}:f(J)\to J\) proto existuje.` },
    { g: 'Inverze existuje a roste', h: 'f⁻¹ je rostoucí (sporem)', p: R`Nechť \(u\lt v\) v \(f(J)\) a \(f^{-1}(u)\ge f^{-1}(v)\). Protože \(f\) roste, je \(u=f(f^{-1}(u))\ge f(f^{-1}(v))=v\). Spor.` },
    { g: 'Spojitost v bodě y₀', h: 'Kolem x₀ = f⁻¹(y₀) zvolím body s, t', m: R`s,t\in J:\qquad x_0-\varepsilon\lt s\lt x_0\lt t\lt x_0+\varepsilon`, why: 'Takové body v J existují, protože J je interval a x₀ je jeho vnitřní bod. Tady se používá, že J je interval.' },
    { g: 'Spojitost v bodě y₀', h: 'Jejich obrazy obklopí y₀', m: R`f(s)\lt y_0\lt f(t),\qquad\delta=\min\{y_0-f(s),\ f(t)-y_0\}>0`, why: 'f roste.' },
    { g: 'Spojitost v bodě y₀', h: 'Celé okolí B(y₀, δ) se zobrazí do (s, t)', m: R`y\in B(y_0,\delta)\cap f(J):\quad f(s)\lt y\lt f(t)\ \Longrightarrow\ s\lt f^{-1}(y)\lt t`, why: 'f⁻¹ je rostoucí (krok 2). Tedy |f⁻¹(y) − x₀| < ε.' },
    { g: 'Spojitost v bodě y₀', h: 'Krajní body', p: R`Je-li \(x_0\) krajní bod \(J\), zvolím jen jeden z bodů \(s,t\) a dostanu jednostrannou spojitost, která v krajním bodě stačí.` }
  ],
  end: 'f⁻¹ je spojitá a rostoucí na f(J).',
  say: 'Rostoucí f je prostá, takže má inverzi, a ta je taky rostoucí, jinak by růst f dal spor. Spojitost v y₀: vezmu x₀ = f⁻¹(y₀) a ε. Protože J je interval, najdu v něm body s < x₀ < t blíž než ε. Jejich obrazy splňují f(s) < y₀ < f(t), a δ je menší ze vzdáleností. Pro y blíž k y₀ než δ je f(s) < y < f(t), a protože f⁻¹ roste, je s < f⁻¹(y) < t, tedy |f⁻¹(y) − x₀| < ε.',
  pit: ['Bez intervalu J věta neplatí: f(x) = x na ⟨0, 1), f(x) = x − 1 na ⟨2, 3⟩ je spojitá a rostoucí, ale inverze má v bodě 1 skok.', 'Použití: ⁿ√x je spojitá (inverze k xⁿ).'] },

{ id: 'v34', no: 'Věta 34', name: 'Zavedení logaritmu a jeho vlastnosti', ch: 'fce',
  stmt: R`Existuje jediná funkce \(\log\): (L1) \(D=(0,\infty)\); (L2) rostoucí; (L3) \(\log(xy)=\log x+\log y\); (L4) \(\lim_{x\to1}\frac{\log x}{x-1}=1\).`,
  plain: 'Logaritmus je zavedený čtyřmi vlastnostmi a všechno ostatní se z nich odvodí.',
  method: ['Z axiomů (L1)–(L4)', 'Heineho věta'],
  idea: 'Existenci bereme bez důkazu, ale VLASTNOSTI se dokazují jen z (L1)–(L4): algebraické vlastnosti z (L3), limity v krajích přes posloupnost 2ⁿ, spojitost z (L4) a obor hodnot z Věty 30.',
  need: [{ t: 'Heineho věta', ref: 'v27' }, { t: 'Věta 28 (monotónní funkce)', ref: 'v28' }, { t: 'Věta 30 (obraz intervalu)', ref: 'v30' }],
  steps: [
    { g: 'Algebraické vlastnosti', h: 'log 1 = 0', m: R`\log1=\log(1\cdot1)=\log1+\log1\ \Longrightarrow\ \log1=0`, why: '(L3) pro x = y = 1. Od obou stran odečtu log 1.' },
    { g: 'Algebraické vlastnosti', h: 'log(1/x) = −log x a log(x/y) = log x − log y', m: R`0=\log1=\log\Big(x\cdot\frac1x\Big)=\log x+\log\frac1x`, why: '(L3) pro y = 1/x a log 1 = 0 z kroku 1. Odtud log(1/x) = −log x a log(x/y) = log(x · 1/y) = log x − log y.' },
    { g: 'Algebraické vlastnosti', h: 'log xⁿ = n log x (indukcí)', m: R`\log x^{n+1}=\log(x^n\cdot x)=\log x^n+\log x=n\log x+\log x=(n+1)\log x`, why: 'Indukční krok: (L3) pro čísla xⁿ a x a indukční předpoklad log xⁿ = n log x. Základ n = 1 je zřejmý.' },
    { g: 'Limity a spojitost', h: 'Limita v +∞ přes posloupnost 2ⁿ', m: R`\log2^n=n\log2\to+\infty`, why: 'log 2 > log 1 = 0 (roste). log je rostoucí, takže lim<sub>x→∞</sub> log x existuje (Věta 28) a podle Heineho věty je rovna limitě po posloupnosti 2ⁿ.', use: ['v28', 'v27'] },
    { g: 'Limity a spojitost', h: 'Limita v 0+', m: R`\lim_{x\to0+}\log x=\lim_{x\to0+}\Big(-\log\frac1x\Big)=-\infty`, why: '1/x → +∞ a 1/x ≠ +∞, tedy limita složené funkce s podmínkou (P).' },
    { g: 'Limity a spojitost', h: 'Spojitost v bodě 1', m: R`\lim_{x\to1}\log x=\lim_{x\to1}\frac{\log x}{x-1}\cdot(x-1)=1\cdot0=0=\log1`, why: '(L4) a aritmetika limit.' },
    { g: 'Limity a spojitost', h: 'Spojitost v libovolném x₀ > 0', m: R`\log x=\log x_0+\log\frac x{x_0}\ \longrightarrow\ \log x_0+\log1=\log x_0`, why: 'x/x₀ → 1 a log je spojitý v 1, tedy limita složené funkce s podmínkou (S).', use: ['v25'] },
    { g: 'Obor hodnot a číslo e', h: 'Obor hodnot je ℝ', p: R`log je spojitý na intervalu \((0,\infty)\), takže jeho obor hodnot je interval (Věta 30). Ten je shora i zdola neomezený (limity \(\pm\infty\)), takže je to \(\mathbb R\).`, use: ['v30'] },
    { g: 'Obor hodnot a číslo e', h: 'Číslo e', p: R`\(1\in\mathbb R=H(\log)\), takže existuje \(e\) s \(\log e=1\). Je jediné, protože rostoucí log je prostý.` }
  ],
  end: 'Všechny vlastnosti logaritmu plynou z (L1)–(L4).',
  say: 'Z (L3) dostanu log 1 = 0, log(1/x) = −log x a indukcí log xⁿ = n log x. log roste, takže v +∞ má limitu, a po posloupnosti 2ⁿ je log 2ⁿ = n log 2 → ∞; v nule pak −∞ přes log(1/x). Spojitost v 1 plyne z (L4): log x = (log x/(x − 1)) · (x − 1) → 0. V obecném x₀ píšu log x = log x₀ + log(x/x₀). Spojitý obraz intervalu je interval, a s limitami ±∞ je to ℝ, takže existuje jediné e s log e = 1.',
  pit: ['exp je inverzní funkce k log. Její vlastnosti se dokazují převodem na logaritmus.'] },

{ id: 'v35', no: 'Věta 35', name: 'Zavedení sinu a čísla π', ch: 'fce', nop: true,
  stmt: R`Existuje jediné \(\pi>0\) a jediná funkce \(\sin\): (S1) \(D=\mathbb R\); (S2) rostoucí na \(\langle-\frac\pi2,\frac\pi2\rangle\); (S3) \(\sin0=0\); (S4) \(\sin(x+y)=\sin x\cos y+\cos x\sin y\); (S5) \(\lim_{x\to0}\frac{\sin x}x=1\).`,
  plain: 'Sinus je zavedený pěti vlastnostmi.',
  idea: 'Bez důkazu. Znát přesné znění (S1)–(S5) a definice cos, tg, cotg a cyklometrických funkcí (definiční obory a obory hodnot).',
  steps: [],
  pit: ['cos x = sin(x + π/2), tg = sin/cos, cotg = cos/sin. arcsin: ⟨−1, 1⟩ → ⟨−π/2, π/2⟩, arccos: ⟨−1, 1⟩ → ⟨0, π⟩, arctg: ℝ → (−π/2, π/2), arccotg: ℝ → (0, π).'] }
);

PROOFS.push(
{ id: 'v36', no: 'Věta 36', name: 'Vlastní derivace ⇒ spojitost', ch: 'der', fig: 'derivcont',
  stmt: R`Má-li \(f\) v \(a\) vlastní derivaci, je v \(a\) spojitá.`,
  plain: 'Kde má funkce (konečnou) derivaci, tam nemá skok.',
  method: ['Přímý důkaz', 'Aritmetika limit'],
  idea: 'Rozdíl f(a + h) − f(a) napíšu jako (rozdílový podíl) · h. To je (něco konečného) · (něco, co jde k nule), a to jde k nule.',
  need: [{ t: 'definice derivace: f′(a) = lim<sub>h→0</sub> (f(a + h) − f(a))/h' }, { t: 'aritmetika limit', ref: 'v22' }],
  goal: R`\lim_{h\to0}\big(f(a+h)-f(a)\big)=0`,
  steps: [
    { h: 'Rozšířím zlomkem h', m: R`f(a+h)-f(a)=\frac{f(a+h)-f(a)}h\cdot h\qquad(h\neq0)`, why: 'Limita v nule nezávisí na hodnotě v h = 0, takže h ≠ 0 smím předpokládat.' },
    { h: 'Aritmetika limit', m: R`\lim_{h\to0}\frac{f(a+h)-f(a)}h\cdot\lim_{h\to0}h=f'(a)\cdot0=0`, why: 'Smím, protože f′(a) je konečné číslo. Pro nevlastní derivaci by vyšel neurčitý výraz ∞ · 0.', use: ['v22'] }
  ],
  end: 'lim<sub>x→a</sub> f(x) = f(a), tedy f je spojitá v a.',
  say: 'Pro h ≠ 0 je f(a + h) − f(a) = (f(a + h) − f(a))/h · h. První činitel jde k f′(a), což je konečné číslo, druhý k nule. Podle aritmetiky limit jde součin k f′(a) · 0 = 0, tedy f(a + h) → f(a).',
  pit: ['Pro nevlastní derivaci to neplatí: sgn x má v 0 derivaci +∞ a spojitá není. ∛x má derivaci +∞ a spojitá je.', 'Obrácení neplatí: |x| je spojitá, ale v 0 derivaci nemá.'] },

{ id: 'v37', no: 'Věta 37', name: 'Aritmetika derivací', ch: 'der',
  stmt: R`Mají-li \(f,g\) vlastní derivace v \(a\): \((f+g)'=f'+g'\), \((\alpha f)'=\alpha f'\), \((fg)'=f'g+fg'\), \(\big(\frac fg\big)'=\frac{f'g-fg'}{g^2}\) (pro \(g(a)\neq0\)).`,
  plain: 'Pravidla, podle kterých se derivuje součet, součin a podíl.',
  method: ['Přičtení a odečtení členu', 'Aritmetika limit'],
  idea: 'Rozdílový podíl rozložím tak, aby v něm byly rozdílové podíly f a g zvlášť. U součinu a podílu k tomu přičtu a odečtu vhodný člen. Spojitost g (Věta 36) zajistí g(a + h) → g(a).',
  need: [{ t: 'Věta 36', ref: 'v36' }, { t: 'aritmetika limit', ref: 'v22' }],
  steps: [
    { g: 'Součet a násobek', h: 'Rozdílový podíl součtu je součet rozdílových podílů', m: R`\frac{(f+g)(a+h)-(f+g)(a)}h=\frac{f(a+h)-f(a)}h+\frac{g(a+h)-g(a)}h\ \to\ f'(a)+g'(a)`, why: 'Rozdílový podíl součtu se rozpadne na dva zlomky. Každý má limitu z definice derivace a podle aritmetiky limit je sečtu.' },
    { g: 'Součet a násobek', h: 'Konstantu vytknu', m: R`\frac{\alpha f(a+h)-\alpha f(a)}h=\alpha\cdot\frac{f(a+h)-f(a)}h\ \to\ \alpha f'(a)`, why: 'Konstantu α z rozdílového podílu vytknu. Limita α-násobku je α-násobek limity.' },
    { g: 'Součin', h: 'Přičtu a odečtu f(a)·g(a + h)', m: R`\frac{f(a+h)g(a+h)-f(a)g(a)}h=\frac{f(a+h)-f(a)}h\,g(a+h)+f(a)\,\frac{g(a+h)-g(a)}h`, why: 'Tak se v čitateli objeví rozdíly f(a + h) − f(a) a g(a + h) − g(a).' },
    { g: 'Součin', h: 'Limitní přechod', m: R`\to f'(a)\,g(a)+f(a)\,g'(a)`, why: 'g má v a vlastní derivaci, je tam tedy spojitá (Věta 36), takže g(a + h) → g(a).', use: ['v36'] },
    { g: 'Podíl', h: 'Jmenovatel je blízko a nenulový', p: R`\(g\) je spojitá v \(a\) a \(g(a)\neq0\), takže \(g(a+h)\neq0\) pro malá \(h\). Podíl je tam definovaný.` },
