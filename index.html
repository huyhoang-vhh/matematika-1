/* rozdělí kroky do částí podle pole g */
function proofParts(p) {
  const parts = []; let cur = null;
  p.steps.forEach((s, i) => { if (!cur || (s.g && s.g !== cur.g)) { cur = { g: s.g || '', steps: [] }; parts.push(cur); } cur.steps.push([s, i]); });
  return parts;
}

function viewProof(p) {
  const known = knownSet(), isK = !!known[p.id];
  const idx = PROOFS.indexOf(p), prev = PROOFS[idx - 1], next = PROOFS[idx + 1];
  const quiz = state.quiz && p.steps.length > 1;
  const parts = proofParts(p);
  const n = p.steps.length;
  const refChip = id => { const r = proofById(id); return r ? `<button class="needref" data-ref="${id}">${r.no} ${r.name} ›</button>` : ''; };

  const kostra = `<ol class="kostra">${parts.map(pt => `${pt.g ? `<li class="k-g">${pt.g}</li>` : ''}${pt.steps.map(([s, i]) => `<li><a href="#k${i + 1}" data-step="${i + 1}"><span class="k-n">${i + 1}</span>${s.h}</a></li>`).join('')}`).join('')}</ol>`;

  const steps = `<ol class="tl ${quiz ? 'is-quiz' : ''}">${parts.map(pt => `${pt.g ? `<li class="tl-g"><span>${pt.g}</span></li>` : ''}${pt.steps.map(([s, i]) => `<li class="tl-i ${quiz ? 'hide' : ''}" id="k${i + 1}"><span class="tl-n" aria-hidden="true">${i + 1}</span><div class="tl-b">
<h4>${s.h}</h4><div class="tl-body">${s.p ? `<p>${s.p}</p>` : ''}${s.m ? `<div class="tl-m">${D(brk(s.m))}</div>` : ''}${s.why ? `<p class="why"><span class="why-l">Proč</span>${s.why}</p>` : ''}${s.use ? `<div class="tl-use"><span class="muted small">Používám:</span>${s.use.map(refChip).join('')}</div>` : ''}</div>
${quiz ? '<button class="pill sm ghost reveal" data-act="reveal">Odkrýt krok</button>' : ''}</div></li>`).join('')}`).join('')}</ol>`;

  const rail = `<nav class="pp-rail" aria-label="Obsah důkazu"><span class="lbl">Obsah</span><ol>
<li><a href="#s-veta" data-sec="s-veta">Věta</a></li><li><a href="#s-kostra" data-sec="s-kostra">Kostra</a></li>
${n ? `<li><a href="#s-dukaz" data-sec="s-dukaz">Důkaz · ${n} ${plural(n, 'krok', 'kroky', 'kroků')}</a></li>` : ''}
${p.say ? '<li><a href="#s-say" data-sec="s-say">Nahlas u zkoušky</a></li>' : ''}${p.pit && p.pit.length ? '<li><a href="#s-pit" data-sec="s-pit">Pozor</a></li>' : ''}${p.ask && p.ask.length ? '<li><a href="#s-ask" data-sec="s-ask">Otázky</a></li>' : ''}${VID[p.id] ? '<li><a href="#s-vid" data-sec="s-vid">Přednáška</a></li>' : ''}</ol>
${n > 1 ? `<div class="seg" role="group" aria-label="Režim"><button data-act="pmode" data-q="0" aria-pressed="${!quiz}">Čtení</button><button data-act="pmode" data-q="1" aria-pressed="${quiz}">Zkoušení</button></div>` : ''}</nav>`;

  const sec = (id, lbl, body, cls = '') => `<section class="pp-sec ${cls}" id="${id}"><h2 class="pp-h">${lbl}</h2>${body}</section>`;
  let main = sec('s-veta', 'Věta', `<div class="stmt">${p.stmt}</div>${p.plain ? `<p class="plain"><b>Lidsky řečeno:</b> ${p.plain}</p>` : ''}`);
  main += sec('s-kostra', 'Kostra důkazu', `${p.method && p.method.length ? `<div class="mchips">${p.method.map(m => `<span class="mchip">${m}</span>`).join('')}</div>` : ''}
<div class="pv-idea"><span class="lbl">Klíčová myšlenka</span><p>${p.idea}</p></div>
${n ? kostra : ''}
${p.need && p.need.length ? `<div class="pp-need"><span class="lbl">Budeme potřebovat</span><ul class="need">${p.need.map(x => x.ref && proofById(x.ref) ? `<li><button class="needref" data-ref="${x.ref}">${x.t} ›</button></li>` : `<li>${x.t}</li>`).join('')}</ul></div>` : ''}`);
  if (p.fig) main += figHTML(p.fig);
  if (n) main += sec('s-dukaz', quiz ? 'Důkaz · zkus každý krok nejdřív sám' : 'Důkaz', `${p.goal ? `<div class="pp-goal"><span class="lbl">Co chceme ukázat</span><div class="goal">${D(brk(p.goal))}</div></div>` : ''}
${quiz ? `<div class="actions"><button class="pill sm" data-act="nextstep">Odkrýt další krok</button><button class="more" data-act="allsteps">Ukázat celý důkaz</button></div>` : ''}
${steps}${p.end ? `<p class="qed"><span aria-hidden="true">∎</span> ${p.end}</p>` : ''}`);
  if (p.say) main += sec('s-say', 'Jak to říct u zkoušky', quiz
    ? `<details class="qa"><summary>Nejdřív to zkus říct sám, pak odkryj</summary><blockquote class="say">${p.say}</blockquote></details>`
    : `<blockquote class="say">${p.say}</blockquote><p class="muted small">Tohle je důkaz v kostce. Řekni ho nahlas vlastními slovy a pak si ho napiš.</p>`, 'pp-say');
  if (p.pit && p.pit.length) main += sec('s-pit', 'Pozor u zkoušky', `<ul class="pit">${p.pit.map(t => `<li>${t}</li>`).join('')}</ul>`, 'pv-pit');
  if (p.ask && p.ask.length) main += sec('s-ask', 'Na co se může zkoušející zeptat', p.ask.map(([q, a]) => `<details class="qa"><summary>${q}</summary><p>${a}</p></details>`).join(''));
  if (VID[p.id] || RUK[p.id]) main += `<div id="s-vid" class="pp-sec">${vidSec(p)}${RUK[p.id] ? `<div>${rukBtn(p, 'pill sm ghost')}</div>` : ''}</div>`;
  main += `<div class="pp-done">${p.nop ? '' : `<button class="known big" data-known="${p.id}" aria-pressed="${isK}">${isK ? '✓ Umím' : 'Umím tuhle větu'}</button>`}</div>`;

  return `<div class="pbar"><div class="in"><button class="more back" data-go="dukazy">‹ Důkazy</button>
<span class="pbar-t"><b>${p.no}</b> ${p.name}</span>
<span class="pbar-nav"><button class="pbar-a" ${prev ? `data-ref="${prev.id}"` : 'disabled'} aria-label="Předchozí věta">‹</button><span class="muted small">${idx + 1} / ${PROOFS.length}</span><button class="pbar-a" ${next ? `data-ref="${next.id}"` : 'disabled'} aria-label="Další věta">›</button></span>
${p.nop ? '' : `<button class="known" data-known="${p.id}" aria-pressed="${isK}">${isK ? '✓ Umím' : 'Umím'}</button>`}</div></div>`
    + band('pp-head', R`<span class="eyebrow">${PROOF_CH[p.ch]}${p.skip22 ? ' · 2022 se nedokazovalo' : ''}</span>
<h1 class="h1"><span class="pno">${p.no}</span> ${p.name}</h1>
<p class="req-line req-${reqOf(p).toLowerCase()}">${REQ_LONG[reqOf(p)]}</p>
<div class="pf-alt">${vidBtn(p, 'pill sm ghost vid-open')}${rukBtn(p)}</div>
<nav class="pp-next" aria-label="Předchozí a další důkaz">${prev ? `<button class="pp-nb" data-ref="${prev.id}"><span class="pp-dir">‹ Předchozí</span><span class="pp-no">${prev.no}</span><b>${prev.name}</b></button>` : '<span></span>'}${next ? `<button class="pp-nb nx" data-ref="${next.id}"><span class="pp-dir">Další ›</span><span class="pp-no">${next.no}</span><b>${next.name}</b></button>` : ''}</nav>`, 'narrow')
    + `<section class="band alt pp-band"><div class="pp">${rail}<div class="pp-main">${main}</div></div></section>`;
}

function openProof(id) {
  const p = proofById(id); if (!p) return;
  go('dukaz-' + id);
}

/* po vykreslení stránky důkazu: obrázky, titulek, zvýraznění obsahu */
let ppObs = null;
function initProofPage(p) {
  store.set('lastProof', p.id);
  document.title = `${p.no} ${p.name} · Důkazy · MATEMATIKA I`;
  initFigs($view);
  if (ppObs) ppObs.disconnect();
  const links = [...document.querySelectorAll('.pp-rail [data-sec]')];
  if (!links.length || !('IntersectionObserver' in window)) return;
  ppObs = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.sec === e.target.id)); });
  }, { rootMargin: '-35% 0px -60% 0px' });
  links.forEach(a => { const s = document.getElementById(a.dataset.sec); if (s) ppObs.observe(s); });
}
function revealStep(li) { if (!li) return false; li.classList.remove('hide'); li.querySelector('.reveal')?.remove(); return true; }

/* ---------- Klíčové pojmy k ústní zkoušce ----------
   Seznam podle oficiálních požadavků (Bárta, mat1_pozadavky, listopad 2026). Definice v zápisu z poznámek k přednášce
   (B(c,ε), P(c,δ), ℝ*), vysvětlení, příklady a otázky vlastními slovy.
   Položka: { id, t (název), def (přesná definice), say (jak to říct), ex (příklad), non (protipříklad), neg (negace, nepovinné),
   ask [[otázka, odpověď]], pit (na co pozor), rel [id důkazů] } */
const KEYS = [
{ id: 'sup', t: 'Supremum a infimum množiny', short: 'nejmenší horní závora (a největší dolní)',
  def: R`<p>Nechť \(M\subset\mathbb R\). Číslo \(G\in\mathbb R\) je <b>supremum</b> množiny \(M\), značíme \(G=\sup M\), jestliže</p>
<p>(i) \(x\le G\) pro všechna \(x\in M\);<br>(ii) pro každé \(G'\lt G\) existuje \(x\in M\) takové, že \(x>G'\).</p>
<p>Číslo \(g\in\mathbb R\) je <b>infimum</b>, \(g=\inf M\), jestliže (i) \(x\ge g\) pro všechna \(x\in M\); (ii) pro každé \(g'>g\) existuje \(x\in M\) s \(x\lt g'\).</p>`,
  say: R`Supremum je <b>nejmenší horní závora</b>. Bod (i) říká, že \(G\) je horní závora: žádný prvek \(M\) ho nepřesáhne. Bod (ii) říká, že žádné menší číslo už horní závorou není, protože ho nějaký prvek \(M\) přeskočí. Infimum je totéž zrcadlově: největší dolní závora.`,
  ex: R`\(M=(0,1)\): \(\sup M=1\), \(\inf M=0\). Ani jedno do \(M\) nepatří. Pro \(G'\lt1\) stačí vzít \(x=\max\{\frac12,\frac{1+G'}2\}\in M\), a to je větší než \(G'\).`,
  non: R`\(\mathbb N\) nemá supremum v \(\mathbb R\) (není shora omezená), \(\emptyset\) také ne. A rozdíl oproti maximu: \((0,1)\) má supremum 1, ale <b>nemá maximum</b>. Maximum je supremum, které do množiny patří.`,
  neg: R`\(G\) není supremem \(M\): buď existuje \(x\in M\) s \(x>G\), nebo existuje \(G'\lt G\) takové, že \(x\le G'\) pro všechna \(x\in M\).`,
  ask: [['Má každá množina supremum?', 'Ne. Tvrzení 3: každá neprázdná shora omezená množina má právě jedno supremum v ℝ. Neomezená nebo prázdná supremum v ℝ nemá.'],
    ['Jak zapsat bod (ii) pomocí ε?', 'Pro každé ε > 0 existuje x ∈ M s x > G − ε. Stačí položit G′ = G − ε.'],
    ['Jaký je vztah supremum a posloupnosti?', 'Lemma 17: je-li G = sup M, existuje posloupnost prvků M, která má limitu G (bod (ii) pro G′ = G − 1/n).'],
    ['Může mít množina dvě suprema?', 'Ne. Kdyby G₁ < G₂ byla obě suprema, bod (ii) pro G₂ a G′ = G₁ dá x ∈ M s x > G₁, což je spor s bodem (i) pro G₁.']],
  pit: R`Supremum nemusí patřit do \(M\). Nepleť si ho s maximem. A nezapomeň na bod (i): „každé menší číslo je překročeno“ samo nestačí.`,
  rel: ['t3', 'l17', 'v18'] },

{ id: 'lim', t: 'Vlastní limita posloupnosti', short: 'od jistého indexu jsou všechny členy blízko A',
  def: R`<p>Číslo \(A\in\mathbb R\) je limitou posloupnosti \(\{a_n\}\), jestliže</p>
\[\forall\varepsilon>0\ \exists n_0\in\mathbb N\ \forall n\ge n_0:\ |a_n-A|\lt\varepsilon.\]
<p>Značíme \(\lim_{n\to\infty}a_n=A\) nebo \(a_n\to A\). Posloupnost je <b>konvergentní</b>, má-li limitu v \(\mathbb R\).</p>`,
  say: R`Ať kolem \(A\) zvolím jakkoli úzký pás \((A-\varepsilon,A+\varepsilon)\), od nějakého indexu \(n_0\) už v něm leží <b>všechny</b> další členy. Mimo pás zůstane jen konečně mnoho členů. Index \(n_0\) smí záviset na \(\varepsilon\): čím užší pás, tím později se do něj posloupnost „usadí“.`,
  ex: R`\(\frac{(-1)^n}{n}\to0\): \(\big|\frac{(-1)^n}{n}-0\big|=\frac1n\lt\varepsilon\) pro \(n>\frac1\varepsilon\), takže stačí \(n_0>\frac1\varepsilon\).`,
  non: R`\((-1)^n\) limitu nemá: pro \(\varepsilon=\frac12\) by pás šířky 1 musel obsahovat nakonec čísla \(1\) i \(-1\), jejichž vzdálenost je 2. Neplatí ani „omezená ⇒ konvergentní“.`,
  neg: R`\(a_n\not\to A\): \(\ \exists\varepsilon>0\ \forall n_0\in\mathbb N\ \exists n\ge n_0:\ |a_n-A|\ge\varepsilon\). Tedy nekonečně mnoho členů leží mimo nějaký pás.`,
  ask: [['Co se stane, když přehodím kvantifikátory na ∃n₀ ∀ε?', 'Pak by od n₀ platilo |aₙ − A| < ε pro každé ε, tedy aₙ = A. Definovali bychom posloupnosti, které jsou od jistého indexu konstantní.'],
    ['Může mít posloupnost dvě limity?', 'Ne, Věta 9. Pro ε = |A − B|/3 by od jistého indexu byly členy v obou disjunktních pásech naráz.'],
    ['Je konvergentní posloupnost omezená?', 'Ano, Věta 10. Od n₀ leží členy v (A − 1, A + 1), a před n₀ je jich jen konečně mnoho.'],
    ['Změní se limita, když změním prvních 100 členů?', 'Ne. Stačí vzít n₀ > 100, a definice se na prvních 100 členů vůbec nedívá.']],
  pit: R`Nerovnost je ostrá \(\lt\varepsilon\) (s \(\le\) by definice vyšla stejně, ale piš to jako přednášející). A \(n_0\) se volí <b>po</b> \(\varepsilon\), ne naopak.`,
  rel: ['v9', 'v10', 'v11', 'v12'] },

{ id: 'nlim', t: 'Nevlastní limita posloupnosti', short: 'každou hranici posloupnost natrvalo přeskočí',
  def: R`<p>Posloupnost má limitu \(+\infty\), jestliže \(\ \forall L\in\mathbb R\ \exists n_0\in\mathbb N\ \forall n\ge n_0:\ a_n>L.\)</p>
<p>Má limitu \(-\infty\), jestliže \(\ \forall K\in\mathbb R\ \exists n_0\in\mathbb N\ \forall n\ge n_0:\ a_n\lt K.\)</p>`,
  say: R`Ať zvolím jakkoli vysokou hranici \(L\), posloupnost ji od nějakého indexu <b>natrvalo</b> přeskočí. Nestačí, že je velká občas. Musí nad \(L\) zůstat navždy.`,
  ex: R`\(n^2\to+\infty\): pro dané \(L\) vezmu \(n_0>|L|\). Pak \(n^2\ge n>|L|\ge L\) pro \(n\ge n_0\).`,
  non: R`\((-1)^n\,n\) je neomezená, ale nemá ani limitu \(+\infty\) (liché členy jsou záporné), ani \(-\infty\). Stejně tak \(a_{2k}=2k,\ a_{2k-1}=0\). <b>Neomezená neznamená „jde do nekonečna“.</b>`,
  neg: R`\(a_n\not\to+\infty\): \(\ \exists L\in\mathbb R\ \forall n_0\ \exists n\ge n_0:\ a_n\le L\), tedy nekonečně mnoho členů zůstává pod nějakou hranicí.`,
  ask: [['Je posloupnost s limitou +∞ konvergentní?', 'Ne. Konvergentní znamená vlastní (konečnou) limitu. +∞ je limita v rozšířené ose ℝ*, posloupnost je divergentní.'],
    ['Jak souvisí nevlastní limita s převrácenou hodnotou?', 'Věta 16: je-li aₙ > 0 a aₙ → 0, je 1/aₙ → +∞. Naopak z aₙ → ±∞ plyne 1/aₙ → 0.'],
    ['Proč se nevlastní limita píše s L a ne s ε?', 'Okolí +∞ je interval (L, +∞). V jednotném zápisu přes okolí je to B(+∞, ε) = (1/ε, +∞), tedy L = 1/ε.']],
  pit: R`Aritmetika limit s \(\pm\infty\) má neurčité výrazy: \(\infty-\infty\), \(0\cdot\infty\), \(\frac\infty\infty\). Ty definice „nespočítá“ za tebe.`,
  rel: ['v12p', 'v16', 'v18'] },

{ id: 'okoli', t: 'Okolí bodu', short: 'body blízko c; prstencové je bez c',
  def: R`<p>Pro \(c\in\mathbb R\) a \(\varepsilon>0\) je <b>okolí</b> \(B(c,\varepsilon)=(c-\varepsilon,c+\varepsilon)\) a <b>prstencové okolí</b> \(P(c,\varepsilon)=B(c,\varepsilon)\setminus\{c\}\).</p>
<p>Okolí nekonečna: \(B(+\infty,\varepsilon)=P(+\infty,\varepsilon)=(\frac1\varepsilon,+\infty)\), \(B(-\infty,\varepsilon)=P(-\infty,\varepsilon)=(-\infty,-\frac1\varepsilon)\).</p>
<p>Jednostranná: \(B^+(c,\varepsilon)=\langle c,c+\varepsilon)\), \(B^-(c,\varepsilon)=(c-\varepsilon,c\rangle\), \(P^+(c,\varepsilon)=(c,c+\varepsilon)\), \(P^-(c,\varepsilon)=(c-\varepsilon,c)\).</p>`,
  say: R`Okolí jsou body, které jsou od \(c\) blíž než \(\varepsilon\). Prstencové okolí je totéž bez samotného bodu \(c\): u limity nás hodnota v \(c\) nezajímá. Okolí \(+\infty\) jsou „dost velká čísla“; čím menší \(\varepsilon\), tím je okolí \((\frac1\varepsilon,+\infty)\) menší. Díky tomu stačí <b>jedna definice limity</b> pro všechny případy v \(\mathbb R^*\).`,
  ex: R`\(B(2,\frac1{10})=(1{,}9;\,2{,}1)\), \(P(2,\frac1{10})=(1{,}9;\,2)\cup(2;\,2{,}1)\), \(B(+\infty,\frac1{100})=(100,+\infty)\).`,
  non: R`\(\langle c-\varepsilon,c+\varepsilon\rangle\) není okolí v tomto smyslu (okolí je otevřený interval). A \(P(c,\varepsilon)\) není interval: má díru v \(c\).`,
  ask: [['Proč je v definici limity prstencové okolí?', 'Protože f(c) nemusí být definované (sin x/x v 0) a i když je, limita na něm nemá záviset.'],
    ['Proč je okolí +∞ zrovna (1/ε, +∞)?', 'Aby menší ε dávalo menší okolí jako u reálných bodů. Pak definice ∀ε ∃δ funguje beze změny i pro c = ±∞ a A = ±∞.'],
    ['K čemu je, že dva různé body ℝ* mají disjunktní malá okolí?', 'Na tom stojí jednoznačnost limity: kdyby funkce měla dvě limity, musela by na malém okolí ležet v obou disjunktních okolích naráz.']],
  pit: R`V definici spojitosti je \(B(c,\delta)\) (s bodem \(c\)), v definici limity \(P(c,\delta)\) (bez něj). To je přesně rozdíl mezi oběma pojmy.`,
  rel: ['v20', 'v9'] },

{ id: 'limf', t: 'Limita funkce', short: 'blízko c (bez c) jsou hodnoty blízko A',
  def: R`<p>Nechť \(c,A\in\mathbb R^*\) a \(f\) je definována na nějakém prstencovém okolí \(P(c,\eta)\). Říkáme, že \(\lim_{x\to c}f(x)=A\), jestliže</p>
\[\forall\varepsilon>0\ \exists\delta>0\ \forall x\in P(c,\delta):\ f(x)\in B(A,\varepsilon).\]
<p>Pro \(c,A\in\mathbb R\) to znamená: \(0\lt|x-c|\lt\delta\ \Rightarrow\ |f(x)-A|\lt\varepsilon\). Pro \(A=\pm\infty\) jde o nevlastní limitu.</p>`,
  say: R`Ať kolem \(A\) zvolím jakkoli malé okolí, najdu kolem \(c\) tak malé <b>prstencové</b> okolí, že funkce celé zobrazí do toho okolí \(A\). Jinými slovy: když se \(x\) blíží k \(c\) (ale \(x\neq c\)), hodnoty \(f(x)\) se blíží k \(A\). Hodnota \(f(c)\) nehraje žádnou roli.`,
  ex: R`\(f(x)=1\) pro \(x\neq0\), \(f(0)=5\): \(\lim_{x\to0}f(x)=1\), hodnota 5 nevadí. \(\lim_{x\to0}\frac{\sin x}{x}=1\), přestože v nule funkce není definovaná.`,
  non: R`\(\mathrm{sgn}\,x\) nemá v 0 limitu (zprava 1, zleva −1). \(\sin\frac1x\) nemá v 0 limitu: podle Heineho věty dají posloupnosti \(\frac1{2k\pi}\) a \(\frac1{2k\pi+\pi/2}\) hodnoty 0 a 1. \(\sqrt x\) v 0 oboustrannou limitu nemá definovanou (není definovaná na \(P(0,\eta)\)), jen limitu zprava.`,
  neg: R`\(\lim_{x\to c}f(x)\neq A\): \(\ \exists\varepsilon>0\ \forall\delta>0\ \exists x\in P(c,\delta):\ f(x)\notin B(A,\varepsilon)\).`,
  ask: [['Má hodnota f(c) vliv na limitu?', 'Ne. V definici je prstencové okolí P(c, δ), bod c se vůbec nepoužije.'],
    ['Jak souvisí limita funkce s limitou posloupnosti?', 'Heineho věta (Věta 27): lim f(x) = A právě když pro každou posloupnost xₙ → c, xₙ ≠ c, je f(xₙ) → A. Na zkoušce stačí znění (polovina bez důkazu).'],
    ['Jak dokážeš, že limita neexistuje?', 'Najdu dvě posloupnosti xₙ, yₙ → c (různé od c), pro které f(xₙ) a f(yₙ) mají různé limity, nebo ukážu, že se liší jednostranné limity.'],
    ['Je limita jednoznačná?', 'Ano, Věta 20. Dvě různé hodnoty v ℝ* mají disjunktní malá okolí a funkce nemůže na malém prstencovém okolí ležet v obou.']],
  pit: R`Funkce musí být definovaná na nějakém prstencovém okolí. Kdo napíše \(\forall x\in B(c,\delta)\), definuje něco jiného (spojitost, a to ještě jen pro \(A=f(c)\)).`,
  rel: ['v20', 'v22', 'v25', 'v27'] },

{ id: 'limj', t: 'Limita funkce zprava a zleva', short: 'limita při blížení jen z jedné strany',
  def: R`<p>Je-li \(f\) definována na nějakém pravém prstencovém okolí \(P^+(c,\eta)\), \(c\in\mathbb R\), pak</p>
\[\lim_{x\to c^+}f(x)=A\ \iff\ \forall\varepsilon>0\ \exists\delta>0\ \forall x\in P^+(c,\delta):\ f(x)\in B(A,\varepsilon).\]
<p>Limitu zleva definujeme stejně s \(P^-(c,\delta)=(c-\delta,c)\). Pro \(c\in\mathbb R\) platí: \(\lim_{x\to c}f(x)=A\) právě když existují obě jednostranné limity a obě jsou rovny \(A\).</p>`,
  say: R`Je to limita, při které se k \(c\) blížím jen z jedné strany, tedy jen přes \(x>c\) (zprava) nebo \(x\lt c\) (zleva). Hodí se u funkcí, které se v bodě „lámou“ nebo mají různý předpis vlevo a vpravo, a u funkcí definovaných jen na jedné straně.`,
  ex: R`\(\lim_{x\to0^+}e^{1/x}=+\infty\), \(\lim_{x\to0^-}e^{1/x}=0\). \(\lim_{x\to0^+}\sqrt x=0\) (zleva není funkce definovaná).`,
  non: R`\(\lim_{x\to0^\pm}\mathrm{sgn}\,x=\pm1\): jednostranné limity existují, ale liší se, takže oboustranná limita v 0 <b>neexistuje</b>. \(\frac1x\) v 0: zprava \(+\infty\), zleva \(-\infty\).`,
  ask: [['Kdy existuje oboustranná limita?', 'Pro c ∈ ℝ a f definovanou na prstencovém okolí: právě když existují obě jednostranné a rovnají se.'],
    ['Co je limita zleva v +∞?', 'V nekonečnu se jednostranná limita ztotožňuje s limitou: lim v +∞ je „zleva“ už ze své podstaty, okolí je P(+∞, ε).'],
    ['Kde se jednostranné limity potřebují v příkladech?', 'Dělení nulou (znaménko jmenovatele), funkce s |x|, e^{1/x}, celá část, funkce zadané po částech a vyšetřování spojitosti a derivace v bodě, kde se mění předpis.']],
  pit: R`Z toho, že limita zprava existuje, neplyne nic o limitě zleva. A pozor na \(\frac{A}{0}\): rozhoduje znaménko jmenovatele, a to bývá zprava a zleva jiné.`,
  rel: ['v26', 'v23'] },

{ id: 'spoj', t: 'Spojitost funkce v bodě', short: 'limita v bodě se rovná hodnotě',
  def: R`<p>Funkce \(f\) je spojitá v bodě \(c\in D_f\), jestliže</p>
\[\forall\varepsilon>0\ \exists\delta>0\ \forall x\in B(c,\delta)\cap D_f:\ |f(x)-f(c)|\lt\varepsilon.\]
<p>Je-li \(f\) definována na celém okolí \(c\), je to totéž jako \(\lim_{x\to c}f(x)=f(c)\).</p>`,
  say: R`Malá změna \(x\) způsobí jen malou změnu \(f(x)\): hodnota v \(c\) souhlasí s tím, kam se funkce v okolí \(c\) blíží. Pro funkci definovanou na okolí bodu jsou to tři věci naráz: \(f(c)\) existuje, \(\lim_{x\to c}f(x)\) existuje a obě se rovnají.`,
  ex: R`Polynomy, \(e^x\), \(\sin x\), \(|x|\) jsou spojité v každém bodě. \(|x|\) je spojitá i v 0, přestože tam má „zlom“.`,
  non: R`\(f(x)=1\) pro \(x\neq0\), \(f(0)=0\): limita v 0 je 1, hodnota 0, funkce není v 0 spojitá. \(\mathrm{sgn}\,x\) v 0: limita neexistuje. Dirichletova funkce (1 na \(\mathbb Q\), 0 jinde) není spojitá nikde.`,
  neg: R`\(f\) není spojitá v \(c\): \(\ \exists\varepsilon>0\ \forall\delta>0\ \exists x\in B(c,\delta)\cap D_f:\ |f(x)-f(c)|\ge\varepsilon\).`,
  ask: [['Je funkce 1/x spojitá?', 'Ano, je spojitá v každém bodě svého definičního oboru ℝ∖{0}. V 0 o spojitosti nemá smysl mluvit, protože tam funkce není definovaná. Na ℝ∖{0} ale nejde použít věty o intervalu (to není interval).'],
    ['Jak spojitost souvisí s posloupnostmi?', 'f je spojitá v c (na okolí c) právě když pro každou xₙ → c je f(xₙ) → f(c). To je Heineho věta pro spojitost.'],
    ['Zachovává se spojitost při operacích?', 'Ano: součet, součin a podíl (pro g(c) ≠ 0) spojitých funkcí je spojitý (Důsledek věty 22). Složení spojitých funkcí je spojité (důsledek Věty 25).'],
    ['Plyne ze spojitosti derivace?', 'Ne. |x| je v 0 spojitá, ale derivaci nemá. Naopak vlastní derivace spojitost zaručuje (Věta 36).']],
  pit: R`Spojitost se definuje jen v bodech, kde je funkce definovaná. „\(\frac1x\) je v 0 nespojitá“ je u zkoušky chyták: v 0 není definovaná vůbec.`,
  rel: ['d22', 'd25', 'v36'] },

{ id: 'spojj', t: 'Spojitost funkce v bodě zprava a zleva', short: 'jednostranná limita se rovná hodnotě',
  def: R`<p>Funkce \(f\) je v bodě \(c\in D_f\) <b>spojitá zprava</b>, jestliže \(\lim_{x\to c^+}f(x)=f(c)\), a <b>spojitá zleva</b>, jestliže \(\lim_{x\to c^-}f(x)=f(c)\).</p>
<p>V řeči \(\varepsilon\)–\(\delta\): \(\forall\varepsilon>0\ \exists\delta>0\ \forall x\in B^+(c,\delta)\cap D_f:\ |f(x)-f(c)|\lt\varepsilon\) (zleva s \(B^-\)).</p>`,
  say: R`Funkce „navazuje“ na svou hodnotu v \(c\) aspoň z jedné strany. Je-li definovaná na okolí \(c\), je v \(c\) spojitá právě tehdy, když je spojitá zprava i zleva.`,
  ex: R`\(\lfloor x\rfloor\) v bodě \(k\in\mathbb Z\): na \(\langle k,k+1)\) je rovna \(k\), takže je v \(k\) spojitá <b>zprava</b>. Zleva je limita \(k-1\neq k\), takže zleva spojitá není. \(\sqrt x\) je v 0 spojitá zprava.`,
  non: R`\(\mathrm{sgn}\,x\) v 0: hodnota 0, limity \(\pm1\), není spojitá ani zprava, ani zleva.`,
  ask: [['K čemu se jednostranná spojitost potřebuje?', 'Ve spojitosti na intervalu: v levém krajním bodě se požaduje spojitost zprava, v pravém zleva.'],
    ['Stačí k jednostranné spojitosti, že existuje limita zprava?', 'Ne. Limita zprava se musí rovnat hodnotě f(c).']],
  pit: R`„Limita zprava existuje“ a „spojitá zprava“ není totéž. Rozhoduje rovnost s \(f(c)\).`,
  rel: ['v26', 'v30'] },

{ id: 'spoji', t: 'Spojitost funkce na intervalu', short: 'uvnitř spojitá, na krajích jednostranně',
  def: R`<p>Funkce \(f:J\to\mathbb R\) je <b>spojitá na intervalu</b> \(J\), je-li spojitá v každém vnitřním bodě \(J\), spojitá zprava v levém krajním bodě (pokud do \(J\) patří) a spojitá zleva v pravém krajním bodě (pokud do \(J\) patří).</p>`,
  say: R`Funkce je spojitá v každém bodě intervalu, jen na krajích se díváme pouze dovnitř intervalu, protože vně nás nic nezajímá. Graf se dá na \(J\) nakreslit „jedním tahem“.`,
  ex: R`\(\sqrt x\) je spojitá na \(\langle0,+\infty)\) (v 0 zprava). \(\frac1x\) je spojitá na \((0,1\rangle\). \(\lfloor x\rfloor\) je spojitá na \(\langle0,1)\).`,
  non: R`\(\lfloor x\rfloor\) není spojitá na \(\langle0,1\rangle\): v pravém krajním bodě 1 je limita zleva 0, ale \(\lfloor1\rfloor=1\).`,
  ask: [['Proč jsou věty 29–31 jen pro spojité funkce na intervalu?', 'Na nespojité funkci neplatí: sgn na ⟨−1, 1⟩ nenabývá hodnoty ½. Na neintervalu také ne: 1/x na ℝ∖{0} nabývá kladné i záporné hodnoty, ale nikdy nuly.'],
    ['Co dává spojitost na uzavřeném intervalu navíc?', 'Věta 31: funkce nabývá maxima i minima, a je tedy omezená (Důsledek 32). Na otevřeném intervalu to neplatí: x na (0, 1).'],
    ['Je obraz intervalu spojitou funkcí interval?', 'Ano, Věta 30. Typ intervalu se ale může změnit: x² zobrazí (−1, 1) na ⟨0, 1).']],
  pit: R`Na krajním bodě nestačí „spojitá“ v obvyklém smyslu, protože funkce vně intervalu definovaná být nemusí. Proto jednostranná spojitost.`,
  rel: ['v29', 'v30', 'v31', 'd32', 'v33'] },

{ id: 'extr', t: 'Extrém funkce', short: 'největší nebo nejmenší hodnota na M',
  def: R`<p>Nechť \(M\subset D_f\) a \(x\in M\). Funkce \(f\) nabývá v \(x\) <b>maxima na \(M\)</b>, jestliže \(f(y)\le f(x)\) pro všechna \(y\in M\); <b>minima</b>, platí-li \(f(y)\ge f(x)\) pro všechna \(y\in M\). Extrém je maximum nebo minimum.</p>
<p><b>Lokální maximum</b> vzhledem k \(M\): existuje \(\delta>0\) s \(f(y)\le f(x)\) pro všechna \(y\in B(x,\delta)\cap M\) (lokální minimum obdobně). <b>Ostré</b>: \(f(y)\lt f(x)\) pro \(y\in P(x,\delta)\cap M\).</p>`,
  say: R`Maximum na \(M\) je bod, kde má funkce největší hodnotu ze všech bodů \(M\). Lokální maximum je největší hodnota jen v nějakém malém okolí bodu. Každé maximum je lokální, opak neplatí.`,
  ex: R`\(x^2\) má na \(\mathbb R\) v 0 minimum (ostré), maximum nemá. \(\sin x\) má maximum v bodech \(\frac\pi2+2k\pi\). Konstantní funkce má v každém bodě maximum i minimum (neostré).`,
  non: R`\(f(x)=x\) na \((0,1)\) nemá maximum ani minimum: \(\sup=1\) se nenabývá. \(x^3\) má \(f'(0)=0\), ale v 0 extrém nemá.`,
  ask: [['Kdy má funkce jistě maximum i minimum?', 'Věta 31: je-li spojitá na uzavřeném omezeném intervalu ⟨a, b⟩.'],
    ['Jak souvisí lokální extrém s derivací?', 'Věta 40: má-li f ve vnitřním bodě lokální extrém a existuje f′(x), pak f′(x) = 0. Opak neplatí (x³ v 0) a extrém může být i tam, kde derivace není (|x| v 0).'],
    ['Je rozdíl mezi maximem funkce a supremem jejích hodnot?', 'Ano. Maximum se nabývá v nějakém bodě, supremum hodnot nemusí: x na (0, 1) má supremum hodnot 1, ale maximum nemá.']],
  pit: R`Extrém se vždy vztahuje k množině \(M\). A extrém „v bodě“ znamená bod \(x\), kde se nabývá, ne hodnotu \(f(x)\). U nutné podmínky (Věta 40) nezapomeň na <b>vnitřní</b> bod.`,
  rel: ['v31', 'd32', 'v40', 'v41'] },

{ id: 'der', t: 'Derivace funkce v bodě', short: 'limita směrnic sečen',
  def: R`<p>Nechť \(f\) je definována na nějakém okolí bodu \(a\in\mathbb R\). Její derivace v \(a\) je</p>
\[f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h},\]
<p>existuje-li tato limita v \(\mathbb R^*\). Derivace je <b>vlastní</b>, je-li konečná. Ekvivalentně \(f'(a)=\lim_{x\to a}\frac{f(x)-f(a)}{x-a}\).</p>`,
  say: R`Zlomek \(\frac{f(a+h)-f(a)}{h}\) je směrnice sečny grafu bodů \([a,f(a)]\) a \([a+h,f(a+h)]\). Derivace je limita těchto směrnic, tedy směrnice tečny: jak rychle se funkce v bodě \(a\) mění.`,
  ex: R`\((x^2)'(a)=\lim_{h\to0}\frac{(a+h)^2-a^2}{h}=\lim_{h\to0}(2a+h)=2a\).`,
  non: R`\(|x|\) v 0: \(\frac{|h|}{h}=\mathrm{sgn}\,h\), limita neexistuje, derivace v 0 není. \(\sqrt[3]x\) v 0: \(\frac{h^{1/3}}{h}=h^{-2/3}\to+\infty\), derivace je <b>nevlastní</b>.`,
  ask: [['Plyne z derivace spojitost?', 'Z vlastní ano (Věta 36): f(a + h) − f(a) = h · (f(a + h) − f(a))/h → 0 · f′(a) = 0. Z nevlastní ne: sgn má v 0 derivaci +∞, ale spojitá tam není.'],
    ['Plyne ze spojitosti derivace?', 'Ne, |x| v 0.'],
    ['Proč musí být f definovaná na okolí a?', 'Aby limita pro h → 0 měla smysl z obou stran. Je-li definovaná jen z jedné strany (√x v 0), mluvíme o jednostranné derivaci.']],
  pit: R`Derivace je <b>limita</b>. V bodě, kde se mění předpis funkce, ji nelze spočítat dosazením do zderivovaného vzorce. Tam se počítá z definice (jednostranně).`,
  rel: ['v36', 'v37', 'v38', 'v39'] },

{ id: 'derj', t: 'Derivace funkce v bodě zprava a zleva', short: 'směrnice sečen jen z jedné strany',
  def: R`<p>Derivace zprava a zleva:</p>
\[f'_+(a)=\lim_{h\to0^+}\frac{f(a+h)-f(a)}{h},\qquad f'_-(a)=\lim_{h\to0^-}\frac{f(a+h)-f(a)}{h},\]
<p>existují-li tyto limity v \(\mathbb R^*\). Stačí, aby \(f\) byla definovaná na příslušném jednostranném okolí <b>včetně</b> bodu \(a\). Derivace \(f'(a)\) existuje, právě když existují obě jednostranné a rovnají se.</p>`,
  say: R`Směrnice sečen beru jen s body vpravo (zprava) nebo vlevo (zleva) od \(a\). Používá se v bodech, kde se mění předpis funkce, a na krajích definičního oboru.`,
  ex: R`\(|x|\) v 0: \(f'_+(0)=1\), \(f'_-(0)=-1\), takže \(f'(0)\) neexistuje. \(\sqrt x\) v 0: \(f'_+(0)=+\infty\). Pro \(f(x)=x^2\) (\(x\le1\)), \(2x-1\) (\(x>1\)) vyjde \(f'_\pm(1)=2\), tedy \(f'(1)=2\).`,
  non: R`Jednostranná derivace není totéž co jednostranná limita derivace. \(f(x)=x^2\sin\frac1x\), \(f(0)=0\): \(f'(0)=0\), ale \(\lim_{x\to0}f'(x)\) neexistuje.`,
  ask: [['Jak se jednostranná derivace počítá v praxi?', 'Buď z definice, nebo podle Věty 44: je-li f spojitá zprava v a a existuje lim_{x→a+} f′(x), je f′₊(a) rovna této limitě.'],
    ['Co když je funkce v bodě nespojitá?', 'Pak tam nemá vlastní derivaci (Věta 36). Jednostranná derivace může vyjít nevlastní, nebo neexistovat.']],
  pit: R`Při výpočtu z definice dosazuj za \(f(a+h)\) předpis platný na <b>té straně</b>, ze které jdeš, a za \(f(a)\) skutečnou hodnotu v bodě \(a\).`,
  rel: ['v44', 'v36'] },

{ id: 'tecna', t: 'Tečna ke grafu funkce', short: 'přímka bodem grafu se směrnicí f′(a)',
  def: R`<p>Má-li \(f\) vlastní derivaci v bodě \(a\), je <b>tečna ke grafu</b> \(f\) v bodě \([a,f(a)]\) přímka</p>
\[T_a=\big\{[x,y]\in\mathbb R^2;\ y=f(a)+f'(a)(x-a)\big\}.\]`,
  say: R`Tečna je přímka, která prochází bodem grafu \([a,f(a)]\) a má směrnici \(f'(a)\). Je to limitní poloha sečen, když se druhý bod blíží k \(a\). Ze všech přímek bodem \([a,f(a)]\) nejlépe kopíruje graf v blízkosti \(a\).`,
  ex: R`\(f(x)=x^2\), \(a=1\): \(f(1)=1\), \(f'(1)=2\), tečna \(y=1+2(x-1)=2x-1\).`,
  non: R`\(|x|\) v 0 tečnu nemá (derivace neexistuje). \(\sqrt[3]x\) v 0 má nevlastní derivaci, takže podle definice tečnu nemá (geometricky by byla svislá).`,
  ask: [['Má tečna s grafem jen jeden společný bod?', 'Ne. Tečna k x³ v 0 je osa y = 0 a graf ji protíná (inflexní bod). Tečna k sin x v π/2 je y = 1 a graf se jí dotýká v nekonečně mnoha bodech.'],
    ['Jak tečna souvisí s konvexitou a inflexí?', 'Inflexní bod se definuje polohou grafu vůči tečně: graf přechází z jedné strany tečny na druhou.']],
  pit: R`Tečna je definovaná jen pro <b>vlastní</b> derivaci. Nepleť si směrnici \(f'(a)\) s hodnotou \(f(a)\) v rovnici přímky.`,
  rel: ['v36', 'v48', 'v49'] },

{ id: 'konv', t: 'Konvexní a konkávní funkce', short: 'sečna leží nad grafem',
  def: R`<p>Funkce \(f\) je na intervalu \(I\) <b>konvexní</b>, jestliže pro všechna \(x_1,x_2\in I\) a \(\lambda\in\langle0,1\rangle\) platí</p>
\[f\big(\lambda x_1+(1-\lambda)x_2\big)\le\lambda f(x_1)+(1-\lambda)f(x_2);\]
<p><b>konkávní</b>, platí-li opačná nerovnost. <b>Ryze</b> konvexní (konkávní), platí-li ostrá nerovnost pro \(x_1\neq x_2\) a \(\lambda\in(0,1)\).</p>`,
  say: R`Bod \(\lambda x_1+(1-\lambda)x_2\) leží mezi \(x_1\) a \(x_2\). Pravá strana je výška úsečky (sečny) spojující body grafu nad \(x_1\) a \(x_2\). Konvexní tedy znamená: <b>sečna leží nad grafem</b> (nebo na něm), graf je „prohnutý dolů“ jako \(\cup\). Konkávní je obráceně, \(\cap\).`,
  ex: R`\(x^2\) a \(e^x\) jsou ryze konvexní na \(\mathbb R\), \(\ln x\) je ryze konkávní na \((0,+\infty)\). Lineární funkce je konvexní i konkávní zároveň (ale ne ryze).`,
  non: R`\(x^3\) není na \(\mathbb R\) konvexní ani konkávní: na \((-\infty,0\rangle\) je konkávní, na \(\langle0,+\infty)\) konvexní, v 0 je inflexe. \(\frac1x\) je konvexní na \((0,+\infty)\), ale ne na \(\mathbb R\setminus\{0\}\) (to není interval).`,
  ask: [['Jak se konvexita pozná bez definice?', 'Lemma 46: f je konvexní na I, právě když směrnice sečen rostou: pro x₁ < x₂ < x₃ je (f(x₂) − f(x₁))/(x₂ − x₁) ≤ (f(x₃) − f(x₂))/(x₃ − x₂). Věta 47: je-li f″ ≥ 0 na I, je f konvexní (f″ > 0 dá ryze konvexní).'],
    ['Je |x| ryze konvexní?', 'Ne. Je konvexní, ale na ⟨0, 1⟩ je lineární a sečna splývá s grafem, takže ostrá nerovnost neplatí.'],
    ['Co je inflexní bod?', 'Bod, kde graf přechází z jedné strany tečny na druhou. Typicky se tam mění konvexita na konkávnost (x³ v 0).']],
  pit: R`Konvexita je vlastnost na <b>intervalu</b>, ne v bodě. A pozor na názvy: konvexní je „\(\cup\)“ (jako \(x^2\)), ne „vypouklý nahoru“.`,
  rel: ['l46', 'v47', 'v48', 'v49'] }
];


/* ---------- Definice k ústní zkoušce (45 definic z oficiálních požadavků, Bárta, listopad 2026) ----------
   Zápis podle poznámek k přednášce, vysvětlení a příklady vlastními slovy.
   Položka: { id, t, short (jedna věta do seznamu), def, say, ex, non, pit, rel [id důkazů] }
   Pořadí skupin i položek odpovídá ORAL[1..4] v content.js (kvůli převzetí starých zaškrtnutí). */
const DEF_GROUPS = [
['Množiny a reálná čísla', [
{ id: 'zdola-omezena', t: 'Zdola omezená množina', short: 'existuje číslo, pod které žádný prvek neklesne',
  def: R`<p>Množina \(M\subset\mathbb R\) je <b>omezená zdola</b>, existuje-li \(a\in\mathbb R\) takové, že \(x\ge a\) pro všechna \(x\in M\).</p>`,
  say: R`Celá množina leží nad nějakým číslem \(a\). Takové \(a\) je dolní závora.`,
  ex: R`\((0,+\infty)\), \(\mathbb N\) (závora 1), \(\{\frac1n;\ n\in\mathbb N\}\) (závora 0).`,
  non: R`\(\mathbb Z\), \((-\infty,0)\): pod každé číslo se dá najít prvek množiny.`,
  pit: R`Závora nemusí do \(M\) patřit a není jediná: s \(a\) je dolní závorou i každé menší číslo.`, rel: ['t3'] },
{ id: 'shora-omezena', t: 'Shora omezená množina', short: 'existuje číslo, které žádný prvek nepřesáhne',
  def: R`<p>Množina \(M\subset\mathbb R\) je <b>omezená shora</b>, existuje-li \(b\in\mathbb R\) takové, že \(x\le b\) pro všechna \(x\in M\).</p>`,
  say: R`Celá množina leží pod nějakým číslem \(b\). Takové \(b\) je horní závora.`,
  ex: R`\((-\infty,3)\), \(\{1-\frac1n;\ n\in\mathbb N\}\) (závora 1), každá konečná množina.`,
  non: R`\(\mathbb N\) shora omezená není: to je obsah Archimédovy vlastnosti (Věta 6).`,
  pit: R`Shora omezená neznamená, že má maximum: \((0,1)\) je shora omezená, ale maximum nemá. Má ale supremum (Tvrzení 3).`, rel: ['t3', 'v6'] },
{ id: 'dolni-zavora', t: 'Dolní závora', short: 'číslo, které je menší nebo rovno všem prvkům',
  def: R`<p>Číslo \(a\in\mathbb R\) je <b>dolní závora</b> množiny \(M\subset\mathbb R\), jestliže \(x\ge a\) pro všechna \(x\in M\).</p>`,
  say: R`Číslo, které leží „pod“ celou množinou (nebo se rovná jejímu nejmenšímu prvku).`,
  ex: R`Pro \(M=(0,1\rangle\) jsou dolní závory právě všechna \(a\le0\). Největší z nich je \(\inf M=0\).`,
  non: R`\(\frac12\) není dolní závora \((0,1\rangle\): prvek \(\frac14\) je menší.`,
  pit: R`Infimum je <b>největší</b> dolní závora. U prázdné množiny je dolní závorou každé reálné číslo.`, rel: ['t3'] },
{ id: 'horni-zavora', t: 'Horní závora', short: 'číslo, které je větší nebo rovno všem prvkům',
  def: R`<p>Číslo \(b\in\mathbb R\) je <b>horní závora</b> množiny \(M\subset\mathbb R\), jestliže \(x\le b\) pro všechna \(x\in M\).</p>`,
  say: R`Číslo, které leží „nad“ celou množinou (nebo se rovná jejímu největšímu prvku).`,
  ex: R`Pro \(M=\{1,2,3\}\) jsou horní závory čísla \(3\), \(\pi\), \(10\), tedy všechna \(b\ge3\).`,
  non: R`\(2\) není horní závora \(\{1,2,3\}\), protože \(3>2\).`,
  pit: R`Supremum je <b>nejmenší</b> horní závora. Závor je vždy nekonečně mnoho, pokud nějaká existuje.`, rel: ['t3', 'l17'] },
{ id: 'omezena-mnozina', t: 'Omezená množina', short: 'omezená zdola i shora',
  def: R`<p>Množina \(M\subset\mathbb R\) je <b>omezená</b>, je-li omezená zdola i shora. Ekvivalentně: existuje \(K\ge0\) s \(|x|\le K\) pro všechna \(x\in M\).</p>`,
  say: R`Celá množina se vejde do nějakého omezeného intervalu \(\langle a,b\rangle\).`,
  ex: R`\(\langle-2,5)\), \(\{\sin n;\ n\in\mathbb N\}\subset\langle-1,1\rangle\), \(\{\frac{(-1)^n}{n}\}\).`,
  non: R`\(\mathbb N\) (shora neomezená), \(\mathbb Q\), \((0,+\infty)\).`,
  pit: R`Omezenost neříká nic o tom, jestli množina obsahuje své krajní body. \((0,1)\) je omezená, ale nemá maximum ani minimum.`, rel: ['t3', 'v10'] },
{ id: 'maximum-mnoziny', t: 'Maximum množiny', short: 'největší prvek, který do množiny patří',
  def: R`<p>Číslo \(a\) je <b>maximum</b> množiny \(M\subset\mathbb R\), \(a=\max M\), jestliže \(a\in M\) a \(x\le a\) pro všechna \(x\in M\).</p>`,
  say: R`Horní závora, která sama patří do množiny. Je to největší prvek \(M\).`,
  ex: R`\(\max\langle0,1\rangle=1\), \(\max\{1,2,3\}=3\), \(\max\{1-\frac1n\}\) neexistuje.`,
  non: R`\((0,1)\) maximum nemá: supremum 1 do množiny nepatří.`,
  pit: R`Má-li množina maximum, rovná se jejímu supremu. Supremum ale existuje častěji (u každé neprázdné shora omezené množiny).`, rel: ['t3'] },
{ id: 'minimum-mnoziny', t: 'Minimum množiny', short: 'nejmenší prvek, který do množiny patří',
  def: R`<p>Číslo \(a\) je <b>minimum</b> množiny \(M\subset\mathbb R\), \(a=\min M\), jestliže \(a\in M\) a \(x\ge a\) pro všechna \(x\in M\).</p>`,
  say: R`Dolní závora, která sama patří do množiny. Je to nejmenší prvek \(M\).`,
  ex: R`\(\min\mathbb N=1\), \(\min\langle2,5)=2\).`,
  non: R`\((0,1\rangle\) ani \(\{\frac1n;\ n\in\mathbb N\}\) minimum nemají (infimum 0 do nich nepatří).`,
  pit: R`Pozor na \(\inf\) a \(\min\): \(\inf\{\frac1n\}=0\), ale minimum neexistuje.`, rel: ['t3'] },
{ id: 'cela-cast', t: 'Celá část čísla', short: 'největší celé číslo, které není větší než r',
  def: R`<p>Pro \(r\in\mathbb R\) je <b>celá část</b> \([r]\) jediné \(k\in\mathbb Z\) takové, že \(k\le r\lt k+1\). (Existenci a jednoznačnost zaručuje Věta 5.)</p>`,
  say: R`Zaokrouhlení <b>dolů</b> na celé číslo. Odtud užitečná nerovnost \(r-1\lt[r]\le r\).`,
  ex: R`\([2{,}7]=2\), \([3]=3\), \([-1{,}2]=-2\), \([\pi]=3\).`,
  non: R`U záporných čísel to <b>není</b> useknutí desetinné části: \([-1{,}2]=-2\), ne \(-1\).`,
  pit: R`V limitách s celou částí použij \(r-1\lt[r]\le r\) a dva policajty, např. \(\frac{[nx]}{n}\to x\).`, rel: ['v5', 'v15'] },
{ id: 'rozsirena-osa', t: 'Rozšířená reálná osa', short: 'ℝ s přidanými body −∞ a +∞',
  def: R`<p>\(\mathbb R^*=\mathbb R\cup\{-\infty,+\infty\}\) s uspořádáním \(-\infty\lt a\lt+\infty\) pro \(a\in\mathbb R\). Operace: \(a+(\pm\infty)=\pm\infty\); pro \(a\neq0\) má \(a\cdot(\pm\infty)\) znaménko součinu; \(\frac{a}{\pm\infty}=0\) pro \(a\in\mathbb R\). <b>Nedefinujeme</b> \(+\infty-\infty\), \(0\cdot(\pm\infty)\), \(\frac{\pm\infty}{\pm\infty}\) a dělení nulou.</p>`,
  say: R`Přidáme dva „body“ \(\pm\infty\), abychom mohli psát \(\lim a_n=+\infty\) a počítat s nevlastními limitami podle jednoduchých pravidel.`,
  ex: R`\(3+\infty=+\infty\), \((-2)\cdot(+\infty)=-\infty\), \(\frac{5}{-\infty}=0\), \((+\infty)\cdot(+\infty)=+\infty\).`,
  non: R`\(\infty-\infty\), \(0\cdot\infty\), \(\frac\infty\infty\), \(\frac10\) definované nejsou. To jsou neurčité výrazy, u kterých musíš upravovat.`,
  pit: R`\(\pm\infty\) nejsou reálná čísla. „Konvergentní“ znamená limitu v \(\mathbb R\), ne v \(\mathbb R^*\).`, rel: ['v12p'] }
]],
['Posloupnosti', [
{ id: 'shora-omezena-posl', t: 'Shora omezená posloupnost', short: 'všechny členy jsou pod nějakým číslem',
  def: R`<p>Posloupnost \(\{a_n\}\) je <b>shora omezená</b>, je-li shora omezená množina jejích členů, tj. existuje \(K\in\mathbb R\) s \(a_n\le K\) pro všechna \(n\in\mathbb N\).</p>`,
  say: R`Žádný člen nevyleze nad jistou hranici.`,
  ex: R`\((-1)^n\), \(-n\), \(1-\frac1n\).`,
  non: R`\(n\), \((-1)^n\,n\) (sudé členy rostou nade všechny meze).`,
  pit: R`Týká se <b>všech</b> členů. Konečně mnoho členů ale omezenost nikdy nezkazí, takže stačí odhad „od jistého indexu“.`, rel: ['v10'] },
{ id: 'zdola-omezena-posl', t: 'Zdola omezená posloupnost', short: 'všechny členy jsou nad nějakým číslem',
  def: R`<p>Posloupnost \(\{a_n\}\) je <b>zdola omezená</b>, existuje-li \(K\in\mathbb R\) s \(a_n\ge K\) pro všechna \(n\in\mathbb N\).</p>`,
  say: R`Žádný člen neklesne pod jistou hranici.`,
  ex: R`\(n^2\), \(\frac1n\), \(\sqrt n\).`,
  non: R`\(-n\), \(\ln\frac1n=-\ln n\).`,
  pit: R`Kladná posloupnost je zdola omezená nulou, ale to neznamená, že má kladnou limitu (\(\frac1n\to0\)).`, rel: ['v10'] },
{ id: 'omezena-posl', t: 'Omezená posloupnost', short: 'omezená shora i zdola',
  def: R`<p>Posloupnost je <b>omezená</b>, je-li omezená shora i zdola; ekvivalentně existuje \(K\ge0\) s \(|a_n|\le K\) pro všechna \(n\).</p>`,
  say: R`Všechny členy se vejdou do jednoho pásu \(\langle-K,K\rangle\).`,
  ex: R`\((-1)^n\), \(\sin n\), \(\frac1n\), \(\frac{n}{n+1}\).`,
  non: R`\(n\), \((-1)^n\,n\), \(\ln n\).`,
  pit: R`Konvergentní ⇒ omezená (Věta 10), ale ne naopak: \((-1)^n\) je omezená a nekonverguje. Z omezené ale vždy jde vybrat konvergentní (Bolzano–Weierstrass).`, rel: ['v10', 'v19', 'v13'] },
{ id: 'rostouci-posl', t: 'Rostoucí posloupnost', short: 'každý další člen je ostře větší',
  def: R`<p>Posloupnost \(\{a_n\}\) je <b>rostoucí</b>, je-li \(a_n\lt a_{n+1}\) pro každé \(n\in\mathbb N\).</p>`,
  say: R`Stačí porovnávat sousední členy; indukcí pak plyne \(a_n\lt a_m\) pro všechna \(n\lt m\).`,
  ex: R`\(n\), \(1-\frac1n\), \(2^n\). Ověření: \(a_{n+1}-a_n>0\), nebo pro kladné členy \(\frac{a_{n+1}}{a_n}>1\).`,
  non: R`Konstantní posloupnost (je neklesající, ne rostoucí), \((-1)^n\).`,
  pit: R`Rostoucí = <b>ostrá</b> nerovnost. S neostrou je to „neklesající“.`, rel: ['v18'] },
{ id: 'klesajici-posl', t: 'Klesající posloupnost', short: 'každý další člen je ostře menší',
  def: R`<p>Posloupnost \(\{a_n\}\) je <b>klesající</b>, je-li \(a_n>a_{n+1}\) pro každé \(n\in\mathbb N\).</p>`,
  say: R`Každý člen je ostře menší než předchozí.`,
  ex: R`\(\frac1n\), \(-n\), \(\frac{1}{2^n}\).`,
  non: R`\(\frac{(-1)^n}{n}\) (znaménko se střídá, nahoru a dolů).`,
  pit: R`Klesající a zdola omezená posloupnost konverguje k infimu svých členů (Věta 18).`, rel: ['v18'] },
{ id: 'nerostouci-posl', t: 'Nerostoucí posloupnost', short: 'každý další člen je menší nebo stejný',
  def: R`<p>Posloupnost \(\{a_n\}\) je <b>nerostoucí</b>, je-li \(a_n\ge a_{n+1}\) pro každé \(n\in\mathbb N\).</p>`,
  say: R`Posloupnost nikdy nevzroste, ale smí stát na místě.`,
  ex: R`Konstantní posloupnost, \(\frac1n\), \(\big[\frac{10}{n}\big]\) (10, 5, 3, 2, 2, 1, …).`,
  non: R`\(n\), \((-1)^n\).`,
  pit: R`Každá klesající posloupnost je nerostoucí, ne naopak.`, rel: ['v18'] },
{ id: 'neklesajici-posl', t: 'Neklesající posloupnost', short: 'každý další člen je větší nebo stejný',
  def: R`<p>Posloupnost \(\{a_n\}\) je <b>neklesající</b>, je-li \(a_n\le a_{n+1}\) pro každé \(n\in\mathbb N\).</p>`,
  say: R`Posloupnost nikdy neklesne, ale smí stát na místě.`,
  ex: R`\(\big[\frac n2\big]\) (0, 1, 1, 2, 2, …), konstantní posloupnost, \(n\).`,
  non: R`\((-1)^n\): <b>není klesající</b>, a přitom <b>není ani neklesající</b>.`,
  pit: R`„Není klesající“ není totéž jako „je neklesající“. První jen vylučuje jednu vlastnost, druhé požaduje nerovnost pro každou dvojici sousedních členů.`, rel: ['v18'] },
{ id: 'monotonni-posl', t: 'Monotónní posloupnost', short: 'neklesající nebo nerostoucí',
  def: R`<p>Posloupnost je <b>monotónní</b>, je-li neklesající nebo nerostoucí.</p>`,
  say: R`Jde pořád jedním směrem (nebo stojí). Nikdy se neotočí.`,
  ex: R`\(\frac1n\), \(n^2\), konstanta \(7\).`,
  non: R`\((-1)^n\), \(\frac{(-1)^n}{n}\), \(\sin n\).`,
  pit: R`Věta 18: monotónní posloupnost má <b>vždy</b> limitu v \(\mathbb R^*\); je-li navíc omezená, je konvergentní.`, rel: ['v18'] },
{ id: 'ryze-monotonni-posl', t: 'Ryze monotónní posloupnost', short: 'rostoucí nebo klesající',
  def: R`<p>Posloupnost je <b>ryze monotónní</b>, je-li rostoucí nebo klesající.</p>`,
  say: R`Monotónní s ostrými nerovnostmi: nikdy nestojí na místě.`,
  ex: R`\(n\), \(\frac1n\), \(-2^n\).`,
  non: R`Konstantní posloupnost je monotónní, ale ne ryze monotónní.`,
  pit: R`Ryze monotónní posloupnost je prostá (žádná hodnota se neopakuje).`, rel: ['v18'] },
{ id: 'konvergentni-posl', t: 'Konvergentní posloupnost', short: 'má vlastní (konečnou) limitu',
  def: R`<p>Posloupnost je <b>konvergentní</b>, má-li limitu v \(\mathbb R\), tj. existuje \(A\in\mathbb R\) s \(\forall\varepsilon>0\ \exists n_0\ \forall n\ge n_0:\ |a_n-A|\lt\varepsilon\).</p>`,
  say: R`Členy se ustálí u jednoho reálného čísla.`,
  ex: R`\(\frac1n\to0\), \(\big(1+\frac1n\big)^n\to e\), \(\sqrt[n]n\to1\).`,
  non: R`\(n\) (limita \(+\infty\), posloupnost je divergentní), \((-1)^n\) (limitu nemá).`,
  pit: R`Limita \(\pm\infty\) není konvergence. Konvergentní posloupnost je omezená (Věta 10) a každá vybraná má stejnou limitu (Věta 11).`, rel: ['v9', 'v10', 'v11'] },
{ id: 'vybrana-posl', t: 'Vybraná posloupnost', short: 'vynechám členy, pořadí nezměním',
  def: R`<p>Posloupnost \(\{b_k\}\) je <b>vybraná</b> z \(\{a_n\}\), existuje-li rostoucí posloupnost přirozených čísel \(\{n_k\}\) taková, že \(b_k=a_{n_k}\) pro každé \(k\in\mathbb N\).</p>`,
  say: R`Z posloupnosti nechám nekonečně mnoho členů ve stejném pořadí a ostatní vyškrtám.`,
  ex: R`Sudé členy \(a_{2k}\) (\(n_k=2k\)); z \((-1)^n\) vyberu \(a_{2k}=1\) a \(a_{2k-1}=-1\).`,
  non: R`\((a_1,a_1,a_2,\dots)\) vybraná není (člen nelze opakovat, \(n_k\) musí růst). Přeházené pořadí také ne.`,
  pit: R`Z \(n_k\) rostoucí plyne \(n_k\ge k\). Najdu-li dvě vybrané s různou limitou, původní posloupnost limitu nemá (Věta 11).`, rel: ['v11', 'v19'] }
]],
['Zobrazení a funkce', [
{ id: 'vzor-mnoziny', t: 'Vzor množiny při zobrazení', short: 'všechny body, které se zobrazí do W',
  def: R`<p>Nechť \(f:A\to B\) a \(W\subset B\). <b>Vzor</b> množiny \(W\) je \(f^{-1}(W)=\{x\in A;\ f(x)\in W\}\).</p>`,
  say: R`Posbírám všechny \(x\), jejichž hodnota padne do \(W\).`,
  ex: R`\(f(x)=x^2\): \(f^{-1}(\langle1,4\rangle)=\langle-2,-1\rangle\cup\langle1,2\rangle\), \(f^{-1}((-\infty,0))=\emptyset\).`,
  non: R`Zaměnit s obrazem: obraz \(f(M)=\{f(x);\ x\in M\}\) jde opačným směrem.`,
  pit: R`Zápis \(f^{-1}(W)\) <b>nevyžaduje</b> existenci inverzní funkce (\(x^2\) není prostá, a vzor má smysl). Vzor sjednocení (průniku) je sjednocení (průnik) vzorů.`, rel: [] },
{ id: 'zobrazeni-na', t: 'Zobrazení na (surjekce)', short: 'každé y z B má aspoň jeden vzor',
  def: R`<p>Zobrazení \(f:A\to B\) je <b>na</b> (surjekce), jestliže \(f(A)=B\), tj. pro každé \(y\in B\) existuje \(x\in A\) s \(f(x)=y\).</p>`,
  say: R`Obor hodnot vyplní celou cílovou množinu \(B\), nic v ní nezbude „nezasažené“.`,
  ex: R`\(x^3:\mathbb R\to\mathbb R\), \(\sin:\mathbb R\to\langle-1,1\rangle\), \(e^x:\mathbb R\to(0,+\infty)\).`,
  non: R`\(x^2:\mathbb R\to\mathbb R\) (záporná čísla se nenabývají); \(e^x:\mathbb R\to\mathbb R\).`,
  pit: R`Záleží na tom, co je \(B\): \(x^2:\mathbb R\to\langle0,+\infty)\) na je.`, rel: [] },
{ id: 'proste-zobrazeni', t: 'Prosté zobrazení (injekce)', short: 'různé body mají různé hodnoty',
  def: R`<p>Zobrazení \(f:A\to B\) je <b>prosté</b>, jestliže pro všechna \(x_1,x_2\in A\) platí \(x_1\neq x_2\Rightarrow f(x_1)\neq f(x_2)\).</p>`,
  say: R`Žádnou hodnotu funkce nenabude dvakrát. Ekvivalentně: z \(f(x_1)=f(x_2)\) plyne \(x_1=x_2\) (tak se to obvykle ověřuje).`,
  ex: R`\(2x+1\), \(e^x\), \(x^3\); každá ryze monotónní funkce je prostá.`,
  non: R`\(x^2\) na \(\mathbb R\) (\(f(-1)=f(1)\)), \(\sin\) na \(\mathbb R\).`,
  pit: R`Záleží na definičním oboru: \(x^2\) na \(\langle0,+\infty)\) prostá je. Prostá ještě neznamená monotónní: \(\frac1x\) na \(\mathbb R\setminus\{0\}\).`, rel: [] },
{ id: 'bijekce', t: 'Bijekce', short: 'prosté a zároveň na',
  def: R`<p>Zobrazení \(f:A\to B\) je <b>bijekce</b>, je-li prosté a na. Pak existuje inverzní zobrazení \(f^{-1}:B\to A\), které \(y\) přiřadí jediné \(x\) s \(f(x)=y\).</p>`,
  say: R`Každé \(y\in B\) má <b>přesně jeden</b> vzor. Prvky \(A\) a \(B\) jsou spárované jeden k jednomu.`,
  ex: R`\(x^3:\mathbb R\to\mathbb R\), \(e^x:\mathbb R\to(0,+\infty)\), \(\mathrm{tg}:(-\frac\pi2,\frac\pi2)\to\mathbb R\).`,
  non: R`\(e^x:\mathbb R\to\mathbb R\) (není na), \(x^2:\mathbb R\to\langle0,+\infty)\) (není prosté).`,
  pit: R`Inverzní funkce existuje jen k bijekci. Proto se cyklometrické funkce definují jako inverze k <b>zúženým</b> goniometrickým funkcím.`, rel: ['v33'] },
{ id: 'rostouci-funkce', t: 'Rostoucí funkce', short: 'větší x dává ostře větší hodnotu',
  def: R`<p>Funkce \(f\) je <b>rostoucí</b> na intervalu \(J\subset D_f\), jestliže pro všechna \(x_1,x_2\in J\) platí \(x_1\lt x_2\Rightarrow f(x_1)\lt f(x_2)\).</p>`,
  say: R`Čím dál doprava, tím výš, a to ostře.`,
  ex: R`\(e^x\), \(x^3\), \(\ln x\) na \((0,+\infty)\), \(\arcsin\).`,
  non: R`\(x^2\) na \(\mathbb R\) (roste jen na \(\langle0,+\infty)\)), konstanta.`,
  pit: R`Monotonie se říká <b>na intervalu</b>. Věta 43: je-li \(f'>0\) uvnitř intervalu (a \(f\) spojitá na něm), je \(f\) na něm rostoucí.`, rel: ['v43'] },
{ id: 'klesajici-funkce', t: 'Klesající funkce', short: 'větší x dává ostře menší hodnotu',
  def: R`<p>Funkce \(f\) je <b>klesající</b> na intervalu \(J\), jestliže pro všechna \(x_1,x_2\in J\) platí \(x_1\lt x_2\Rightarrow f(x_1)>f(x_2)\).</p>`,
  say: R`Čím dál doprava, tím níž, a to ostře.`,
  ex: R`\(e^{-x}\), \(\arccos\), \(\frac1x\) na \((0,+\infty)\).`,
  non: R`\(\frac1x\) na \(\mathbb R\setminus\{0\}\): \(-1\lt1\), ale \(f(-1)=-1\lt f(1)=1\).`,
  pit: R`„Klesá na \((-\infty,0)\) i na \((0,+\infty)\)“ neznamená „klesá na sjednocení“. Piš intervaly zvlášť.`, rel: ['v43'] },
{ id: 'nerostouci-funkce', t: 'Nerostoucí funkce', short: 'větší x dává menší nebo stejnou hodnotu',
  def: R`<p>Funkce \(f\) je <b>nerostoucí</b> na intervalu \(J\), jestliže pro všechna \(x_1,x_2\in J\) platí \(x_1\lt x_2\Rightarrow f(x_1)\ge f(x_2)\).</p>`,
  say: R`Nikdy nevzroste, ale smí být konstantní.`,
  ex: R`Konstanta, \(-[x]\), \(e^{-x}\).`,
  non: R`\(x\), \(\sin x\) na \(\mathbb R\).`,
  pit: R`Klesající ⇒ nerostoucí, ne naopak.`, rel: ['v28'] },
{ id: 'neklesajici-funkce', t: 'Neklesající funkce', short: 'větší x dává větší nebo stejnou hodnotu',
  def: R`<p>Funkce \(f\) je <b>neklesající</b> na intervalu \(J\), jestliže pro všechna \(x_1,x_2\in J\) platí \(x_1\lt x_2\Rightarrow f(x_1)\le f(x_2)\).</p>`,
  say: R`Nikdy neklesne, ale smí stát na místě.`,
  ex: R`Celá část \([x]\), konstanta, \(x\).`,
  non: R`\(-x\), \(x^2\) na \(\mathbb R\).`,
  pit: R`„Není klesající“ ≠ „neklesající“ (\(x^2\) na \(\mathbb R\) není ani jedno).`, rel: ['v28'] },
{ id: 'monotonni-funkce', t: 'Monotónní funkce', short: 'neklesající nebo nerostoucí; ryze: rostoucí nebo klesající',
  def: R`<p>Funkce je na intervalu \(J\) <b>monotónní</b>, je-li na něm neklesající nebo nerostoucí, a <b>ryze monotónní</b>, je-li rostoucí nebo klesající.</p>`,
  say: R`Na celém intervalu jde jedním směrem.`,
  ex: R`\([x]\) (monotónní, ne ryze), \(e^x\) (ryze).`,
  non: R`\(x^2\) a \(\sin x\) na \(\mathbb R\).`,
  pit: R`Monotónní funkce má v každém bodě jednostranné limity (Věta 28). Spojitá ryze monotónní funkce na intervalu má spojitou inverzi (Věta 33).`, rel: ['v28', 'v33'] },
{ id: 'omezena-funkce', t: 'Omezená funkce', short: 'hodnoty na M leží v jednom omezeném pásu',
  def: R`<p>Nechť \(M\subset D_f\). Funkce \(f\) je <b>omezená na \(M\)</b>, existuje-li \(K\ge0\) s \(|f(x)|\le K\) pro všechna \(x\in M\). (Shora omezená: \(f(x)\le K\); zdola omezená: \(f(x)\ge K\).)</p>`,
  say: R`Graf nad množinou \(M\) se vejde do vodorovného pásu \(-K\le y\le K\).`,
  ex: R`\(\sin\), \(\mathrm{arctg}\) na \(\mathbb R\); \(\frac1x\) na \(\langle1,+\infty)\).`,
  non: R`\(\frac1x\) na \((0,1)\), \(x\) na \(\mathbb R\), \(\mathrm{tg}\) na \((-\frac\pi2,\frac\pi2)\).`,
  pit: R`Spojitá funkce na <b>uzavřeném</b> intervalu je omezená (Důsledek 32). Na otevřeném nemusí být: \(\frac1x\) na \((0,1)\).`, rel: ['d32', 'v21'] },
{ id: 'suda-licha', t: 'Sudá a lichá funkce', short: 'souměrnost podle osy y / podle počátku',
  def: R`<p>Funkce \(f\) je <b>lichá</b>, jestliže pro každé \(x\in D_f\) platí \(-x\in D_f\) a \(f(-x)=-f(x)\); <b>sudá</b>, jestliže pro každé \(x\in D_f\) platí \(-x\in D_f\) a \(f(-x)=f(x)\).</p>`,
  say: R`Graf sudé funkce je souměrný podle osy \(y\), graf liché podle počátku.`,
  ex: R`Sudé: \(x^2\), \(\cos x\), \(|x|\). Liché: \(x^3\), \(\sin x\), \(\mathrm{tg}\,x\), \(\mathrm{arctg}\,x\).`,
  non: R`\(e^x\) není ani sudá, ani lichá. \(x^2\) na \(\langle-1,2\rangle\) sudá není (definiční obor není souměrný).`,
  pit: R`Nulová funkce je sudá i lichá. Je-li lichá funkce definovaná v 0, je \(f(0)=0\). U průběhu stačí vyšetřit \(x\ge0\) a graf dokreslit.`, rel: [] },
{ id: 'periodicka', t: 'Periodická funkce', short: 'hodnoty se opakují po posunu o a',
  def: R`<p>Funkce \(f\) je <b>periodická s periodou</b> \(a>0\), jestliže pro každé \(x\in D_f\) platí \(x\pm a\in D_f\) a \(f(x+a)=f(x-a)=f(x)\).</p>`,
  say: R`Graf se po posunu o \(a\) doprava nebo doleva kryje sám se sebou.`,
  ex: R`\(\sin\), \(\cos\) (perioda \(2\pi\)), \(\mathrm{tg}\) (\(\pi\)), \(x-[x]\) (1).`,
  non: R`\(x\sin x\), \(\sin(x^2)\), \(e^x\).`,
  pit: R`Perioda není jediná: s \(a\) je periodou i \(2a,3a,\dots\) Konstantní funkce má periodu každé \(a>0\) a nejmenší periodu nemá.`, rel: [] },
{ id: 'prstencove-okoli', t: 'Prstencové okolí bodu', short: 'okolí bodu bez bodu samotného',
  def: R`<p>Pro \(c\in\mathbb R\), \(\varepsilon>0\): \(P(c,\varepsilon)=B(c,\varepsilon)\setminus\{c\}=(c-\varepsilon,c)\cup(c,c+\varepsilon)\). Pro nekonečno \(P(+\infty,\varepsilon)=(\frac1\varepsilon,+\infty)\), \(P(-\infty,\varepsilon)=(-\infty,-\frac1\varepsilon)\). Jednostranná: \(P^+(c,\varepsilon)=(c,c+\varepsilon)\), \(P^-(c,\varepsilon)=(c-\varepsilon,c)\).</p>`,
  say: R`Body blízko \(c\), ale ne \(c\) samotné. Používá se v definici limity, protože hodnota v \(c\) nás tam nezajímá.`,
  ex: R`\(P(0,1)=(-1,0)\cup(0,1)\), \(P(2,\frac12)=(\frac32,2)\cup(2,\frac52)\).`,
  non: R`\((-1,1)\) není prstencové okolí 0 (obsahuje 0). \((0,1)\) je jen pravé prstencové okolí \(P^+(0,1)\).`,
  pit: R`Limita: \(P(c,\delta)\). Spojitost: \(B(c,\delta)\). V tom je celý rozdíl mezi oběma definicemi.`, rel: ['v20'] },
{ id: 'lokalni-maximum', t: 'Lokální maximum', short: 'největší hodnota v nějakém okolí bodu',
  def: R`<p>Nechť \(x\in M\subset D_f\). Funkce \(f\) má v \(x\) <b>lokální maximum vzhledem k \(M\)</b>, existuje-li \(\delta>0\) s \(f(y)\le f(x)\) pro všechna \(y\in B(x,\delta)\cap M\). <b>Ostré</b>: \(f(y)\lt f(x)\) pro všechna \(y\in P(x,\delta)\cap M\).</p>`,
  say: R`V nějakém (třeba malém) okolí bodu \(x\) nemá funkce větší hodnotu. Jinde ale větší být může.`,
  ex: R`\(\sin x\) v \(\frac\pi2\) (ostré); \(x^3-3x\) v \(-1\): lokální maximum 2, přitom \(f(3)=18\) je větší.`,
  non: R`\(x^3\) v 0: \(f'(0)=0\), ale extrém tam není.`,
  pit: R`Nutná podmínka \(f'(x)=0\) (Věta 40) platí jen ve <b>vnitřním</b> bodě a jen tam, kde derivace existuje. Na kraji intervalu může být lokální maximum vzhledem k \(M\) i s nenulovou derivací.`, rel: ['v40', 'v31'] },
{ id: 'lokalni-minimum', t: 'Lokální minimum', short: 'nejmenší hodnota v nějakém okolí bodu',
  def: R`<p>Funkce \(f\) má v \(x\in M\) <b>lokální minimum vzhledem k \(M\)</b>, existuje-li \(\delta>0\) s \(f(y)\ge f(x)\) pro všechna \(y\in B(x,\delta)\cap M\). <b>Ostré</b>: \(f(y)>f(x)\) pro \(y\in P(x,\delta)\cap M\).</p>`,
  say: R`V nějakém okolí bodu \(x\) nemá funkce menší hodnotu.`,
  ex: R`\(|x|\) v 0 (ostré, a derivace tam neexistuje), \(x^2\) v 0, \(\cos x\) v \(\pi\).`,
  non: R`\(x^3\) v 0 (není minimum ani maximum).`,
  pit: R`Konstantní funkce má v každém bodě lokální minimum i maximum (neostré). Extrém může být i v bodě bez derivace.`, rel: ['v40', 'v41'] }
]],
['Elementární funkce, derivace, průběh', [
{ id: 'obecna-mocnina', t: 'Obecná mocnina aᵇ', short: 'aᵇ = exp(b log a) pro a > 0',
  def: R`<p>Pro \(a>0\) a \(b\in\mathbb R\) je \(a^b=\exp(b\log a)\). Pro \(a,b>0\), \(a\neq1\) je \(\log_a b=\frac{\log b}{\log a}\).</p>`,
  say: R`Mocninu s libovolným reálným exponentem zavedeme přes exponenciálu. Proto musí být základ kladný.`,
  ex: R`\(2^{\sqrt2}=e^{\sqrt2\ln2}\), \(x^x=e^{x\ln x}\) pro \(x>0\). Pro \(b=\frac mn\) vyjde \(a^{m/n}=\sqrt[n]{a^m}\).`,
  non: R`\((-8)^{1/3}\) touto definicí definované není (odmocnina \(\sqrt[3]{-8}=-2\) je zvláštní definice pro lichou odmocninu).`,
  pit: R`Limity typu \(f(x)^{g(x)}\) počítej přes \(e^{g\ln f}\). Pravidla \(a^{b+c}=a^ba^c\), \((a^b)^c=a^{bc}\) plynou z vlastností exp a log.`, rel: ['exp', 'v34'] },
{ id: 'arcsin', t: 'Funkce arcsin', short: 'inverze k sinu zúženému na ⟨−π/2, π/2⟩',
  def: R`<p><b>Arkussinus</b> je inverzní funkce k \(\sin|_{\langle-\pi/2,\pi/2\rangle}\). \(D_{\arcsin}=\langle-1,1\rangle\), \(H_{\arcsin}=\langle-\frac\pi2,\frac\pi2\rangle\). Je spojitá a rostoucí.</p>`,
  say: R`\(\arcsin y\) je ten úhel z \(\langle-\frac\pi2,\frac\pi2\rangle\), jehož sinus je \(y\).`,
  ex: R`\(\arcsin\frac12=\frac\pi6\), \(\arcsin(-1)=-\frac\pi2\), \(\arcsin0=0\).`,
  non: R`\(\arcsin(\sin\pi)=0\neq\pi\); \(\arcsin2\) neexistuje.`,
  pit: R`\(\arcsin(\sin x)=x\) platí jen pro \(x\in\langle-\frac\pi2,\frac\pi2\rangle\). Zúžení je nutné, protože \(\sin\) na \(\mathbb R\) není prostý.`, rel: ['v33', 'v35'] },
{ id: 'arccos', t: 'Funkce arccos', short: 'inverze ke kosinu zúženému na ⟨0, π⟩',
  def: R`<p><b>Arkuskosinus</b> je inverzní funkce k \(\cos|_{\langle0,\pi\rangle}\). \(D_{\arccos}=\langle-1,1\rangle\), \(H_{\arccos}=\langle0,\pi\rangle\). Je spojitá a klesající.</p>`,
  say: R`\(\arccos y\) je úhel z \(\langle0,\pi\rangle\), jehož kosinus je \(y\).`,
  ex: R`\(\arccos0=\frac\pi2\), \(\arccos(-1)=\pi\), \(\arccos\frac12=\frac\pi3\).`,
  non: R`\(\arccos(\cos(-\frac\pi3))=\frac\pi3\), ne \(-\frac\pi3\).`,
  pit: R`Platí \(\arcsin y+\arccos y=\frac\pi2\). Obor hodnot je jiný než u arcsin.`, rel: ['v33'] },
{ id: 'arctg', t: 'Funkce arctg', short: 'inverze k tangentě zúžené na (−π/2, π/2)',
  def: R`<p><b>Arkustangens</b> je inverzní funkce k \(\mathrm{tg}|_{(-\pi/2,\pi/2)}\). \(D_{\mathrm{arctg}}=\mathbb R\), \(H_{\mathrm{arctg}}=(-\frac\pi2,\frac\pi2)\). Je spojitá, rostoucí a lichá.</p>`,
  say: R`\(\arctg y\) je úhel z \((-\frac\pi2,\frac\pi2)\) s tangentou \(y\). Pro \(x\to\pm\infty\) jde k \(\pm\frac\pi2\).`,
  ex: R`\(\mathrm{arctg}\,1=\frac\pi4\), \(\mathrm{arctg}\,0=0\), \(\lim_{x\to+\infty}\mathrm{arctg}\,x=\frac\pi2\).`,
  non: R`\(\mathrm{arctg}(\mathrm{tg}\,\pi)=0\neq\pi\).`,
  pit: R`arctg je omezená, což se hodí v limitách (omezená krát nulová). V průběhu dává vodorovné asymptoty \(y=\pm\frac\pi2\).`, rel: ['v33'] },
{ id: 'arccotg', t: 'Funkce arccotg', short: 'inverze ke kotangentě zúžené na (0, π)',
  def: R`<p><b>Arkuskotangens</b> je inverzní funkce k \(\mathrm{cotg}|_{(0,\pi)}\). \(D_{\mathrm{arccotg}}=\mathbb R\), \(H_{\mathrm{arccotg}}=(0,\pi)\). Je spojitá a klesající.</p>`,
  say: R`\(\mathrm{arccotg}\,y\) je úhel z \((0,\pi)\) s kotangentou \(y\).`,
  ex: R`\(\mathrm{arccotg}\,1=\frac\pi4\), \(\mathrm{arccotg}\,0=\frac\pi2\), \(\mathrm{arccotg}(-1)=\frac{3\pi}4\).`,
  non: R`Obor hodnot <b>není</b> \((-\frac\pi2,\frac\pi2)\) jako u arctg.`,
  pit: R`\(\mathrm{arccotg}\,x=\frac\pi2-\mathrm{arctg}\,x\). Limity: v \(+\infty\) je 0, v \(-\infty\) je \(\pi\).`, rel: ['v33'] },
{ id: 'ryze-konvexni', t: 'Ryze konvexní funkce', short: 'sečna leží ostře nad grafem',
  def: R`<p>Funkce \(f\) je na intervalu \(I\) <b>ryze konvexní</b>, jestliže pro všechna \(x_1\neq x_2\) z \(I\) a \(\lambda\in(0,1)\) platí \(f(\lambda x_1+(1-\lambda)x_2)\lt\lambda f(x_1)+(1-\lambda)f(x_2)\).</p>`,
  say: R`Sečna mezi dvěma různými body grafu leží uvnitř <b>ostře</b> nad grafem. Graf nemá žádný rovný úsek.`,
  ex: R`\(x^2\), \(e^x\), \(\frac1x\) na \((0,+\infty)\), \(x^4\).`,
  non: R`\(|x|\) (konvexní, ale na \(\langle0,1\rangle\) splývá se sečnou), lineární funkce.`,
  pit: R`\(f''>0\) na \(I\) ⇒ ryze konvexní (Věta 47), ale ne naopak: \(x^4\) je ryze konvexní, i když \(f''(0)=0\).`, rel: ['v47', 'l46'] },
{ id: 'ryze-konkavni', t: 'Ryze konkávní funkce', short: 'sečna leží ostře pod grafem',
  def: R`<p>Funkce \(f\) je na intervalu \(I\) <b>ryze konkávní</b>, jestliže pro všechna \(x_1\neq x_2\) z \(I\) a \(\lambda\in(0,1)\) platí \(f(\lambda x_1+(1-\lambda)x_2)>\lambda f(x_1)+(1-\lambda)f(x_2)\).</p>`,
  say: R`Sečna leží ostře pod grafem, graf je „prohnutý nahoru“ jako \(\cap\).`,
  ex: R`\(\ln x\), \(\sqrt x\), \(-x^2\).`,
  non: R`Lineární funkce, \(x^3\) na \(\mathbb R\).`,
  pit: R`\(f\) je ryze konkávní právě když \(-f\) je ryze konvexní.`, rel: ['v47'] },
{ id: 'n-ta-derivace', t: 'n-tá derivace funkce v bodě', short: 'derivace (n−1)-ní derivace',
  def: R`<p>Má-li \(f\) vlastní první derivaci na nějakém okolí \(a\), je \(f''(a)=\lim_{h\to0}\frac{f'(a+h)-f'(a)}{h}\), existuje-li limita. Obecně \(f^{(n+1)}(a)=\big(f^{(n)}\big)'(a)\), je-li \(f^{(n)}\) vlastní na nějakém okolí \(a\).</p>`,
  say: R`Zderivuju derivaci: \(f''\) říká, jak rychle se mění směrnice tečny.`,
  ex: R`\((x^3)''=6x\), \((e^x)^{(n)}=e^x\), \((\sin x)^{(4)}=\sin x\).`,
  non: R`\(f(x)=x|x|\): \(f'(x)=2|x|\), takže \(f''(0)\) neexistuje.`,
  pit: R`Na \(f^{(n)}(a)\) potřebuješ \(f^{(n-1)}\) na celém <b>okolí</b> \(a\), ne jen v bodě \(a\).`, rel: ['v47', 'v48'] },
{ id: 'inflexni-bod', t: 'Inflexní bod', short: 'graf přechází z jedné strany tečny na druhou',
  def: R`<p>Nechť \(f'(a)\in\mathbb R\) a \(f\) je definovaná na nějakém okolí \(a\). Bod \(a\) je <b>inflexní</b>, existuje-li \(\Delta>0\) takové, že na \((a-\Delta,a)\) leží graf pod tečnou \(T_a\) a na \((a,a+\Delta)\) nad ní, nebo naopak.</p>`,
  say: R`V bodě \(a\) graf „přeleze“ přes svou tečnu. Typicky se tam mění konvexita v konkávnost.`,
  ex: R`\(x^3\) v 0 (tečna \(y=0\)), \(\sin x\) v 0 (tečna \(y=x\)).`,
  non: R`\(x^4\) v 0: \(f''(0)=0\), ale graf je celý nad tečnou. \(\sqrt[3]x\) v 0: derivace je nevlastní, podle definice to inflexní bod není.`,
  pit: R`\(f''(a)=0\) je jen nutná podmínka (Věta 48), ne postačující (\(x^4\)). Postačující je změna znaménka \(f''\) (Věta 49).`, rel: ['v48', 'v49'] },
{ id: 'asymptota', t: 'Asymptota funkce', short: 'přímka, ke které se graf v ±∞ blíží',
  def: R`<p>Přímka \(y=kx+q\) (\(k,q\in\mathbb R\)) je <b>asymptota</b> funkce \(f\) v \(+\infty\), jestliže \(\lim_{x\to+\infty}\big(f(x)-kx-q\big)=0\). Obdobně v \(-\infty\).</p>`,
  say: R`Rozdíl mezi grafem a přímkou jde v nekonečnu k nule. Počítá se (Tvrzení 50): \(k=\lim\frac{f(x)}{x}\), \(q=\lim\big(f(x)-kx\big)\), obě konečné.`,
  ex: R`\(\frac{x^2+1}{x}=x+\frac1x\): asymptota \(y=x\) v \(\pm\infty\). \(e^x\): \(y=0\) v \(-\infty\). \(\mathrm{arctg}\): \(y=\frac\pi2\) v \(+\infty\), \(y=-\frac\pi2\) v \(-\infty\).`,
  non: R`\(x^2\) asymptotu nemá (\(\frac{f(x)}x\to\infty\)); \(\ln x\) v \(+\infty\) taky ne (\(k=0\), ale \(\ln x\to\infty\)).`,
  pit: R`Svislá přímka \(x=c\) podle této definice asymptota není. U průběhu ji zmiň zvlášť jako nevlastní limitu v bodě \(c\).`, rel: ['t50'] }
]]
];
const DEFS = [];
DEF_GROUPS.forEach(([g, items], gi) => items.forEach((it, ii) => DEFS.push(Object.assign(it, { g, leg: `${gi + 1}-${ii}` }))));

/* ---------- Ústní: klíčové pojmy a definice (přehled, detail se záložkami, kartičky) ----------
   Data: KEYS (pojmy.js) a DEFS / DEF_GROUPS (defs.js). Co uživatel umí: store 'kKnown' / 'dKnown',
   staré zaškrtnutí z checklistu 'oral2' se převezme (klíč "skupina-pořadí"). */
const KD = {
  pojmy: { list: KEYS, title: 'Klíčové pojmy', key: 'kKnown', legacy: it => '0-' + KEYS.indexOf(it) },
  definice: { list: DEFS, title: 'Definice', key: 'dKnown', legacy: it => it.leg }
};
const KD_RE = /^ustni-(pojmy|definice)(?:-([a-z0-9-]+))?$/;
const KC_RE = /^ustni-karticky-(pojmy|definice)$/;
function kdKnown(kind) {
  const st = store.get(KD[kind].key, {}), leg = store.get('oral2', {}), out = {};
  for (const it of KD[kind].list) { const v = it.id in st ? st[it.id] : leg[KD[kind].legacy(it)]; if (v) out[it.id] = true; }
  return out;
}
function kdSet(kind, id, val) { const st = store.get(KD[kind].key, {}); st[id] = val; store.set(KD[kind].key, st); }
const kdCount = kind => Object.keys(kdKnown(kind)).length;
const kdItem = (kind, id) => KD[kind].list.find(it => it.id === id);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

function kdCard(kind, it, i, known) {
  const k = !!known[it.id];
  return `<div class="kc${k ? ' is-known' : ''}" data-s="${esc((it.t + ' ' + it.short).toLowerCase())}">
<button class="kc-main" data-go="ustni-${kind}-${it.id}"><span class="kc-n">${i + 1}</span><span class="kc-txt"><b>${it.t}</b><span class="kc-s">${cap(it.short)}</span></span><span class="kc-go" aria-hidden="true">›</span></button>
<button class="kc-chk" data-kdknown="${kind}:${it.id}" aria-pressed="${k}" title="${k ? 'Umím (klikni pro zrušení)' : 'Označit, že umím'}" aria-label="${esc(it.t)}: umím"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>`;
}

function viewKDList(kind) {
  const K = KD[kind], known = kdKnown(kind), n = K.list.length, k = Object.keys(known).length;
  const other = kind === 'pojmy' ? ['definice', 'Definice'] : ['pojmy', 'Klíčové pojmy'];
  let body;
  if (kind === 'pojmy') body = `<div class="kgrid">${K.list.map((it, i) => kdCard(kind, it, i, known)).join('')}</div>`;
  else { let i = 0; body = DEF_GROUPS.map(([g, items]) => `<section class="kgroup"><header class="row-h"><h2 class="h3">${g}</h2><span class="muted small">${items.filter(it => known[it.id]).length} / ${items.length} umím</span></header><div class="kgrid">${items.map(it => kdCard(kind, it, i++, known)).join('')}</div></section>`).join(''); }
  const sub = kind === 'pojmy'
    ? 'Čtrnáct pojmů, bez kterých je u ústní automaticky F. Klikni na pojem: přesná definice, vysvětlení, příklady a otázky zkoušejícího.'
    : 'Všech 45 definic z oficiálních požadavků. U každé přesné znění, vysvětlení vlastními slovy, příklad a protipříklad.';
  return band('tight', R`<span class="eyebrow">Ústní zkouška · ${kind === 'pojmy' ? 'otázka 1' : 'otázka 2'}</span><h1 class="h1">${K.title}.</h1>
<p class="sub">${sub}</p>
<div class="kprog"><div class="meter"><i id="kdMeter" style="width:${100 * k / n}%"></i></div><span class="muted small" id="kdCount">Umíš ${k} z ${n}</span></div>
<div class="ctas"><button class="pill" data-go="ustni-karticky-${kind}">Procvičit kartičkami</button><button class="pill ghost" data-go="ustni-${other[0]}">${other[1]}</button></div>`, 'center')
    + band('alt', R`<div class="ktools"><input class="search" id="kq" type="search" placeholder="Hledat: ${kind === 'pojmy' ? 'spojitost, derivace…' : 'bijekce, arcsin, asymptota…'}" aria-label="Hledat"><span class="muted small">Zaškrtnutím ✓ si označ, co umíš.</span></div>
${body}<p class="muted small" id="kqNone" hidden>Nic nenalezeno.</p>
<p class="muted small kfoot">Definice podle poznámek k přednášce (T. Bárta). Vysvětlení, příklady a otázky jsou sepsané vlastními slovy jako příprava.</p>`, 'narrow');
}

function viewKDItem(kind, it) {
  const K = KD[kind], L = K.list, i = L.indexOf(it), prev = L[i - 1], next = L[i + 1], isK = !!kdKnown(kind)[it.id];
  const tabs = [['say', 'Vlastními slovy', `<p>${it.say}</p>`],
    ['ex', 'Příklad a protipříklad', `<div class="kex"><div><span class="lbl">Příklad</span><p>${it.ex}</p></div><div><span class="lbl">Protipříklad</span><p>${it.non}</p></div></div>`]];
  if (it.neg) tabs.push(['neg', 'Negace', `<p>${it.neg}</p>`]);
  if (it.ask) tabs.push(['ask', `Otázky zkoušejícího (${it.ask.length})`, it.ask.map(([q, a]) => `<details class="qa"><summary>${q}</summary><p>${a}</p></details>`).join('')]);
  const cur = tabs.some(t => t[0] === state.kdTab) ? state.kdTab : 'say';
  const rel = (it.rel || []).map(id => { const r = proofById(id); return r ? `<button class="needref" data-ref="${id}">${r.no} ${r.name} ›</button>` : ''; }).join('');
  const nb = (x, dir) => x ? `<button class="pp-nb${dir === 'n' ? ' nx' : ''}" data-go="ustni-${kind}-${x.id}"><span class="pp-dir">${dir === 'n' ? 'Další ›' : '‹ Předchozí'}</span><b>${x.t}</b></button>` : '<span></span>';
  return `<div class="pbar"><div class="in"><button class="more back" data-go="ustni-${kind}">‹ ${K.title}</button>
<span class="pbar-t"><b>${it.t}</b></span>
<span class="pbar-nav"><button class="pbar-a" ${prev ? `data-go="ustni-${kind}-${prev.id}"` : 'disabled'} aria-label="Předchozí">‹</button><span class="muted small">${i + 1} / ${L.length}</span><button class="pbar-a" ${next ? `data-go="ustni-${kind}-${next.id}"` : 'disabled'} aria-label="Další">›</button></span>
<button class="known" data-kdknown="${kind}:${it.id}" aria-pressed="${isK}">${isK ? '✓ Umím' : 'Umím'}</button></div></div>`
    + band('pp-head tight', R`<span class="eyebrow">${kind === 'pojmy' ? 'Klíčový pojem' : it.g}</span><h1 class="h1">${it.t}</h1><p class="sub">${cap(it.short)}.</p>`, 'narrow')
    + band('alt', R`<div class="kd">
<div class="kd-def"><span class="lbl">Definice · takhle ji napiš</span>${it.def}</div>
<p class="kd-pit"><b>Pozor:</b> ${it.pit}</p>
<div class="seg kd-tabs" role="tablist" aria-label="Vysvětlení">${tabs.map(t => `<button type="button" role="tab" data-kdtab="${t[0]}" aria-selected="${t[0] === cur}" aria-pressed="${t[0] === cur}">${t[1]}</button>`).join('')}</div>
${tabs.map(t => `<div class="kd-panel" role="tabpanel" data-panel="${t[0]}"${t[0] === cur ? '' : ' hidden'}>${t[2]}</div>`).join('')}
${rel ? `<div class="kd-rel"><span class="lbl">Souvisí s větami</span><div class="needs">${rel}</div></div>` : ''}
<nav class="pp-next kd-next" aria-label="Předchozí a další">${nb(prev, 'p')}${nb(next, 'n')}</nav>
</div>`, 'narrow');
}

/* kartičky: nejdřív to, co ještě neumíš */
function fcStart(kind, all) {
  const known = kdKnown(kind);
  let q = KD[kind].list.filter(it => all || !known[it.id]).map(it => it.id);
  if (!q.length) q = KD[kind].list.map(it => it.id);
  state.fc = { kind, q, total: q.length, flip: false };
}
function viewKDCards(kind) {
  const K = KD[kind];
  if (!state.fc || state.fc.kind !== kind) fcStart(kind);
  const fc = state.fc, done = fc.total - fc.q.length;
  const head = R`<span class="eyebrow">Kartičky · ${K.title}</span>
<div class="kprog"><div class="meter"><i style="width:${100 * done / fc.total}%"></i></div><span class="muted small">${fc.q.length ? `Zbývá ${fc.q.length} z ${fc.total}` : 'Hotovo'}</span></div>`;
  if (!fc.q.length) return band('', R`${head}<div class="fcard fdone"><h1 class="h2">Hotovo.</h1><p class="muted">Všechny kartičky v tomhle kole jsou označené jako „umím“.</p>
<div class="ctas"><button class="pill" data-act="fc-all">Projít znovu všechny</button><button class="more" data-go="ustni-${kind}">Zpět na ${K.title.toLowerCase()}</button></div></div>`, 'center narrow');
  const it = kdItem(kind, fc.q[0]);
  const back = fc.flip ? `<div class="kd-def">${it.def}</div><p class="fc-say">${it.say}</p>
<div class="ctas fc-btns"><button class="pill ghost" data-act="fc-no">Ještě ne <kbd>←</kbd></button><button class="pill" data-act="fc-yes">Umím ✓ <kbd>→</kbd></button></div>
<button class="more" data-go="ustni-${kind}-${it.id}">Celé vysvětlení s příklady</button>`
    : `<p class="muted">Řekni si definici nahlas, nebo ji napiš na papír. Pak kartu otoč.</p>
<div class="ctas"><button class="pill" data-act="fc-flip">Otočit kartu <kbd>mezerník</kbd></button></div>`;
  return band('', R`${head}
<div class="fcard${fc.flip ? ' flipped' : ''}"><span class="eyebrow">${kind === 'pojmy' ? 'Klíčový pojem' : it.g}</span><h1 class="h2">${it.t}</h1>${back}</div>
<button class="more" data-go="ustni-${kind}">Ukončit a zpět na seznam</button>`, 'center narrow');
}

/* přehled ústní zkoušky */
function oralTile(go, eyebrow, title, desc, k, n, unit) {

}
function oralTiles() {

${oralTile('ustni-pojmy', 'Otázka 1 · neznalost = F', 'Klíčové pojmy', '14 pojmů: definice, vysvětlení, příklady a doplňující otázky.', kdCount('pojmy'), KEYS.length, 'umíš')}

/* ---------- Tahák k tisku, Skutečné písemky, hledání přes celý web, „Co dál“ na úvodu ---------- */

/* ===== Tahák na písemnou zkoušku (literatura je u písemné části povolená) ===== */
function viewTahak() {
  const box = (t, html) => `<section class="tk-box"><h2 class="tk-h">${t}</h2>${html}</section>`;
  return band('tight no-print-bg', R`<span class="eyebrow">Písemná zkouška · literatura je povolená</span><h1 class="h1">Tahák.</h1>
<p class="sub">Všechno podstatné na pár stránkách: známé limity, věty, které se citují, derivace a postup na všechny čtyři příklady. Vytiskni si ho a vezmi na písemnou zkoušku.</p>
<div class="ctas no-print"><button class="pill" data-act="print">Vytisknout tahák</button><button class="pill ghost" data-go="pisemky-zk">Zkouškové písemky</button></div>`, 'center')
  + band('alt', R`<div class="tk">
${box('Známé limity (x → 0)', R`<p>\(\dfrac{\sin x}{x}\to1\), \(\dfrac{\mathrm{tg}\,x}{x}\to1\), \(\dfrac{1-\cos x}{x^2}\to\dfrac12\), \(\dfrac{\arcsin x}{x}\to1\), \(\dfrac{\mathrm{arctg}\,x}{x}\to1\)</p>
<p>\(\dfrac{e^x-1}{x}\to1\), \(\dfrac{\ln(1+x)}{x}\to1\), \(\dfrac{(1+x)^a-1}{x}\to a\), \((1+x)^{1/x}\to e\)</p>
<p class="tk-note">Místo \(x\) smí být libovolná vnitřní funkce \(u(x)\to0\), která je na \(P(c,\delta)\) nenulová (věta o limitě složené funkce, podmínka P).</p>`)}
${box('Posloupnosti', R`<p>\(\sqrt[n]{a}\to1\ (a>0)\), \(\sqrt[n]{n}\to1\), \(\left(1+\tfrac1n\right)^n\to e\), \(q^n\to0\ (|q|\lt1)\)</p>
<p><b>Růstová škála:</b> \(\ln n\ll n^a\ll q^n\ll n!\ll n^n\) \((a>0\), \(q>1)\). Zdůvodnění: podílové kritérium \(\lim\frac{a_{n+1}}{a_n}\lt1\Rightarrow a_n\to0\) pro \(a_n>0\).</p>
<p><b>Rozdíl odmocnin:</b> \(\sqrt a-\sqrt b=\frac{a-b}{\sqrt a+\sqrt b}\), \(\sqrt[3]a-\sqrt[3]b=\frac{a-b}{\sqrt[3]{a^2}+\sqrt[3]{ab}+\sqrt[3]{b^2}}\). <b>n-tá odmocnina:</b> dva policajti \(\max\le\sqrt[n]{\text{součet}}\le\sqrt[n]{k}\cdot\max\).</p>`)}
${box('Věty, které se citují při výpočtu', R`<ul class="plain">
<li><b>AL</b> (aritmetika limit): platí, je-li výsledek definovaný. Neurčité: \(\infty-\infty\), \(0\cdot\infty\), \(\frac00\), \(\frac\infty\infty\), \(1^\infty\), \(0^0\), \(\infty^0\).</li>
<li><b>Dělení nulou:</b> \(\frac{A}{0^+}=\pm\infty\) podle znaménka \(A\neq0\); zjisti znaménko jmenovatele zprava i zleva.</li>
<li><b>Limita složené funkce:</b> \(\lim f(g(x))=B\), je-li \(g\to A\), \(f\to B\) a (P) \(g\neq A\) na \(P(c,\delta)\), nebo (S) \(f\) je spojitá v \(A\).</li>
<li><b>Dva policajti, omezená × nulová, Heine</b> (neexistence: dvě posloupnosti s různou limitou).</li>
<li><b>\(f^g=e^{g\ln f}\):</b> spočítej limitu exponentu a napiš, že \(\exp\) je spojitá (podmínka S).</li>
<li><b>l'Hospital:</b> typ \(\frac00\) nebo \(\frac{\cdot}{\pm\infty}\), existuje \(\lim\frac{f'}{g'}\); pak \(\lim\frac fg=\lim\frac{f'}{g'}\).</li></ul>`)}
${box('Derivace', R`<p>\((x^a)'=ax^{a-1}\), \((e^x)'=e^x\), \((a^x)'=a^x\ln a\), \((\ln x)'=\frac1x\)</p>
<p>\((\sin x)'=\cos x\), \((\cos x)'=-\sin x\), \((\mathrm{tg}\,x)'=\frac1{\cos^2x}\), \((\mathrm{cotg}\,x)'=-\frac1{\sin^2x}\)</p>
<p>\((\arcsin x)'=\frac1{\sqrt{1-x^2}}\), \((\arccos x)'=-\frac1{\sqrt{1-x^2}}\), \((\mathrm{arctg}\,x)'=\frac1{1+x^2}\), \((\mathrm{arccotg}\,x)'=-\frac1{1+x^2}\)</p>
<p>\((fg)'=f'g+fg'\), \(\left(\frac fg\right)'=\frac{f'g-fg'}{g^2}\), \((f(g))'=f'(g)\,g'\), \((f^g)'=f^g\left(g'\ln f+g\frac{f'}{f}\right)\)</p>`)}
${box('Goniometrie', R`<p>\(\sin\frac\pi6=\frac12\), \(\sin\frac\pi4=\frac{\sqrt2}2\), \(\sin\frac\pi3=\frac{\sqrt3}2\); \(\mathrm{tg}\,\frac\pi4=1\); \(\mathrm{arctg}\,1=\frac\pi4\), \(\lim_{x\to\pm\infty}\mathrm{arctg}\,x=\pm\frac\pi2\)</p>
<p>\(\sin(u\pm v)=\sin u\cos v\pm\cos u\sin v\), \(\cos u-\cos v=-2\sin\frac{u+v}2\sin\frac{u-v}2\)</p>
<p>\(\mathrm{tg}\,u-\mathrm{tg}\,v=\frac{\sin(u-v)}{\cos u\cos v}\), \(\cos u=\sin\left(\frac\pi2-u\right)\), \(\mathrm{arctg}\,y=\frac\pi2-\mathrm{arctg}\,\frac1y\ (y>0)\)</p>`)}
${box('1. příklad · limita posloupnosti (10 b.)', R`<ol class="steps"><li>Najdi nejrychleji rostoucí člen v každé části a vytkni ho.</li><li>Rozdíl odmocnin rozšiř (vzorec výš), u n-té odmocniny použij dva policajty.</li><li>Každou dílčí limitu zdůvodni: AL, škála (podílové kritérium), \(\sqrt[n]{\cdot}\to1\).</li></ol>`)}
${box('2. příklad · limita funkce (15 b.)', R`<ol class="steps"><li>Urči typ výrazu. U \(1^\infty\), \(0^0\), \(\infty^0\) přepiš na \(e^{g\ln f}\).</li><li>Převeď na známé limity se stejnou vnitřní funkcí nahoře i dole; ověř podmínku P.</li><li>Rozdíl goniometrických funkcí převeď vzorcem na součin. U \(\infty\cdot0\) vytkni dominantní člen.</li><li>Na konci napiš, která věta dovoluje každý krok.</li></ol>`)}
${box('3. příklad · spojitost a derivace (10 b.)', R`<ol class="steps"><li>Mimo „podezřelé“ body: elementární funkce, spojitá, derivace podle vzorců.</li><li>V podezřelém bodě (změna předpisu, \(|\cdot|\), \(\mathrm{sgn}\), celá část): nejdřív spojitost, bez ní vlastní derivace není (Věta 36).</li><li>Jednostranné derivace z definice nebo Větou 44 (spojitost + limita derivace).</li></ol>`)}
${box('4. příklad · průběh funkce (15 b.)', R`<ol class="steps"><li>\(D_f\), sudost/lichost, znaménko, spojitost.</li><li>Limity v krajních bodech \(D_f\).</li><li>\(f'\): monotonie, lokální extrémy, jednostranné derivace v okrajích.</li><li>\(f''\): konvexita, konkávnost, inflexe.</li><li>Asymptoty zvlášť v \(+\infty\) a \(-\infty\): \(k=\lim\frac{f}{x}\), \(q=\lim(f-kx)\).</li><li>Obor hodnot a graf, který odpovídá výpočtům.</li></ol>`)}
</div>
<p class="muted small no-print">Sepsáno vlastními slovy podle přednášky. Ověř si u přednášejícího, co přesně smíš mít u zkoušky s sebou (podle podmínek libovolnou literaturu, ale žádnou elektroniku).</p>`, 'narrow');
}

/* ===== Skutečné písemky z minulosti ===== */
function viewArchiv() {

${row('1. příklad · limita posloupnosti (10 b.)', 'Součin nebo podíl dvou částí: polynom s odmocninou (binomický rozvoj, vytýkání) a podíl exponenciál s různými základy, nebo rozdíl odmocnin (i třetích) s exponenciálami pod odmocninou, nebo n-tá odmocnina z podílu exponenciálních výrazů. <b>Odpovídá cvičným</b> (typy E1–E7).')}

${row('4. příklad · průběh funkce (15 b.)', 'Lineární člen plus arkustangens zlomku (v bodě nespojitosti skok), odmocnina z kvadratického polynomu plus lineární člen (mezera v definičním oboru, jednostranné derivace na okrajích, různé asymptoty v ±∞), mocnina dělená třetí odmocninou, racionální funkce plus lineární člen. Skutečné jsou o kus pracnější než cvičné.')}

}

/* ===== Hledání přes celý web ===== */
const fold = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let SEARCH_IDX = null;
function searchIndex() {
  if (SEARCH_IDX) return SEARCH_IDX;
  const out = [], strip = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\\\(|\\\)|\\\[|\\\]/g, ' ').replace(/\s+/g, ' ').trim();
  PROOFS.forEach(p => out.push({ k: 'Důkaz', t: `${p.no} ${p.name}`, d: strip(p.plain), go: 'dukaz-' + p.id }));
  KEYS.forEach(it => out.push({ k: 'Klíčový pojem', t: it.t, d: it.short, go: 'ustni-pojmy-' + it.id }));

   ['pisemky-tahak', 'Tahák na písemnou zkoušku', 'známé limity, derivace, postupy'], ['pisemky-archiv', 'Skutečné písemky z minulosti', 'archivy a jak se liší'],
